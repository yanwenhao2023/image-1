width:0}.info b{display:block;font-size:15px;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.heart{border:0;background:transparent;font-size:21px;padding:7px;color:#aaa}.heart.on{color:var(--accent)}.badge{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:#f0ebe3;color:#756d64;margin-left:5px}.empty{text-align:center;color:var(--muted);padding:42px 20px;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{display:block;font-size:22px;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.listbox{background:var(--card);border-radius:20px;padding:5px 18px;box-shadow:var(--shadow)}.row.action{cursor:pointer}.row .chev{color:var(--muted)}

<script>
const SEED = [{"id":"001","number":1,"title":"关雎","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"关关雎鸠，在河之洲。窈窕淑女，君子好逑。\n参差荇菜，左右流之。窈窕淑女，寤寐求之。\n求之不得，寤寐思服。悠哉悠哉，辗转反侧。\n参差荇菜，左右采之。窈窕淑女，琴瑟友之。\n参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。","note":"《诗经·国风·周南》"},{"id":"002","number":2,"title":"葛覃","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"葛之覃兮，施于中谷，维叶萋萋。黄鸟于飞，集于灌木，其鸣喈喈。\n葛之覃兮，施于中谷，维叶莫莫。是刈是濩，为絺为绤，服之无斁。\n言告师氏，言告言归。薄污我私，薄浣我衣。害浣害否，归宁父母。","note":"《诗经·国风·周南》"},{"id":"003","number":3,"title":"卷耳","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"采采卷耳，不盈顷筐。嗟我怀人，置彼周行。\n陟彼崔嵬，我马虺隤。我姑酌彼金罍，维以不永怀。\n陟彼高冈，我马玄黄。我姑酌彼兕觥，维以不永伤。\n陟彼砠矣，我马瘏矣，我仆痡矣，云何吁矣。","note":"《诗经·国风·周南》"},{"id":"004","number":4,"title":"樛木","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"南有樛木，葛藟累之。乐只君子，福履绥之。\n南有樛木，葛藟荒之。乐只君子，福履将之。\n南有樛木，葛藟萦之。乐只君子，福履成之。","note":"《诗经·国风·周南》"},{"id":"005","number":5,"title":"螽斯","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"螽斯羽，诜诜兮。宜尔子孙，振振兮。\n螽斯羽，薨薨兮。宜尔子孙。绳绳兮。\n螽斯羽，揖揖兮。宜尔子孙，蛰蛰兮。","note":"《诗经·国风·周南》"},{"id":"006","number":6,"title":"桃夭","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"桃之夭夭，灼灼其华。之子于归，宜其室家。\n桃之夭夭，有蕡其实。之子于归，宜其家室。\n桃之夭夭，其叶蓁蓁。之子于归，宜其家人。","note":"《诗经·国风·周南》"},{"id":"007","number":7,"title":"兔罝","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"肃肃兔罝，椓之丁丁。赳赳武夫，公侯干城。\n肃肃兔罝，施于中逵。赳赳武夫，公侯好仇。\n肃肃免罝，施于中林。赳赳武夫，公侯腹心。","note":"《诗经·国风·周南》"},{"id":"008","number":8,"title":"芣苡","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"采采芣苡，薄言采之。采采芣苡，薄言有之。\n采采芣苡，薄言掇之。采采芣苡，薄言捋之。\n采采芣苡，薄言袺之。采采芣苡，薄言襭之。","note":"《诗经·国风·周南》"},{"id":"009","number":9,"title":"汉广","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"南有乔木，不可休息。汉有游女，不可求思。汉之广矣，不可泳思。江之永矣，不可方思。\n翘翘错薪，言刈其楚。之子于归，言秣其马。汉之广矣，不可泳思。江之永矣，不可方思。\n翘翘错薪，言刈其蒌。之子于归。言秣其驹。汉之广矣，不可泳思。江之永矣，不可方思。","note":"《诗经·国风·周南》"},{"id":"010","number":10,"title":"汝坟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"遵彼汝坟，伐其条枚。未见君子，惄如调饥。\n遵彼汝坟，伐其条肄。既见君子，不我遐弃。\n鲂鱼赪尾，王室如毁。虽则如毁，父母孔迩。","note":"《诗经·国风·周南》"},{"id":"011","number":11,"title":"麟之趾","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"麟之趾，振振公子，于嗟麟兮。\n麟之定，振振公姓，于嗟麟兮。\n麟之角，振振公族，于嗟麟兮。","note":"《诗经·国风·周南》"},{"id":"012","number":12,"title":"鹊巢","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"维鹊有巢，维鸠居之。之子于归，百两御之。\n维鹊有巢，维鸠方之。之子于归，百两将之。\n维鹊有巢，维鸠盈之。之子于归，百两成之。","note":"《诗经·国风·召南》"},{"id":"013","number":13,"title":"采蘩","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"于以采蘩？于沼于沚。于以用之？公侯之事。\n于以采蘩？于涧之中。于以用之？公侯之宫。\n被之僮僮，夙夜在公。被之祁祁，薄言还归。","note":"《诗经·国风·召南》"},{"id":"014","number":14,"title":"草虫","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"喓喓草虫，趯趯阜螽。未见君子，忧心忡忡。亦既见止，亦既觏止，我心则降。\n陟彼南山，言采其蕨。未见君子，忧心惙惙。亦既见止，亦既觏止，我心则说。\n陟彼南山，言采其薇。未见君子，我心伤悲。亦既见止，亦既觏止，我心则夷。","note":"《诗经·国风·召南》"},{"id":"015","number":15,"title":"采蘋","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"于以采蘋？南涧之滨。于以采藻？于彼行潦。\n于以盛之？维筐及筥。于以湘之？维锜及釜。\n于以奠之？宗室牖下。谁其尸之？有齐季女。","note":"《诗经·国风·召南》"},{"id":"016","number":16,"title":"甘棠","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蔽芾甘棠，勿翦勿伐，召伯所茇。\n蔽芾甘棠，勿翦勿败，召伯所憩。\n蔽芾甘棠，勿翦勿拜，召伯所说。","note":"《诗经·国风·召南》"},{"id":"017","number":17,"title":"行露","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"厌浥行露，岂不夙夜，谓行多露。\n谁谓雀无角？何以穿我屋？谁谓女无家？何以速我狱？虽速我狱，室家不足！\n谁谓鼠无牙？何以穿我墉？谁谓女无家？何以速我讼？虽速我讼，亦不女从！","note":"《诗经·国风·召南》"},{"id":"018","number":18,"title":"羔羊","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"羔羊之皮，素丝五紽。退食自公，委蛇委蛇。\n羔羊之革，素丝五緎。委蛇委蛇，自公退食。\n羔羊之缝，素丝五总。委蛇委蛇，退食自公。","note":"《诗经·国风·召南》"},{"id":"019","number":19,"title":"殷其雷","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"殷其雷，在南山之阳。何斯违斯，莫敢或遑？振振君子，归哉归哉！\n殷其雷，在南山之侧。何斯违斯，莫敢遑息？振振君子，归哉归哉！\n殷其雷，在南山之下。何斯违斯，莫或遑处？振振君子，归哉归哉！","note":"《诗经·国风·召南》"},{"id":"020","number":20,"title":"摽有梅","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"摽有梅，其实七兮。求我庶士，迨其吉兮。\n摽有梅，其实三兮。求我庶士，迨其今兮。\n摽有梅，顷筐塈之。求我庶士，迨其谓之。","note":"《诗经·国风·召南》"},{"id":"021","number":21,"title":"小星","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"嘒彼小星，三五在东。肃肃宵征，夙夜在公。寔命不同！\n嘒彼小星，维参与昴。肃肃宵征，抱衾与裯。寔命不犹！","note":"《诗经·国风·召南》"},{"id":"022","number":22,"title":"江有汜","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"江有汜，之子归，不我以。不我以，其后也悔。\n江有渚，之子归，不我与。不我与，其后也处。\n江有沱，之子归，不我过。不我过，其啸也歌。","note":"《诗经·国风·召南》"},{"id":"023","number":23,"title":"野有死麕","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"野有死麕，白茅包之。有女怀春，吉士诱之。\n林有朴樕，野有死鹿。白茅纯束，有女如玉。\n舒而脱脱兮，无感我帨兮，无使尨也吠。","note":"《诗经·国风·召南》"},{"id":"024","number":24,"title":"何彼襛矣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"何彼襛矣，唐棣之华？曷不肃雍？王姬之车。\n何彼襛矣，华如桃李？平王之孙，齐侯之子。\n其钓维何？维丝伊缗。齐侯之子，平王之孙。","note":"《诗经·国风·召南》"},{"id":"025","number":25,"title":"驺虞","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彼茁者葭，壹发五豝，于嗟乎驺虞！\n彼茁者蓬，壹发五豵，于嗟乎驺虞！","note":"《诗经·国风·召南》"},{"id":"026","number":26,"title":"柏舟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"泛彼柏舟，亦泛其流。耿耿不寐，如有隐忧。微我无酒，以敖以游。\n我心匪鉴，不可以茹。亦有兄弟，不可以据。薄言往诉，逢彼之怒。\n我心匪石，不可转也。我心匪席，不可卷也。威仪棣棣，不可选也。\n忧心悄悄，愠于群小。觏闵既多，受侮不少。静言思之，寤辟有摽。\n日居月诸，胡迭而微？心之忧矣，如匪浣衣。静言思之，不能奋飞。","note":"《诗经·国风·邶风》"},{"id":"027","number":27,"title":"绿衣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绿兮衣兮，绿衣黄裹。心之忧矣，曷维其已！\n绿兮衣兮，绿衣黄裳。心之忧矣，曷维其亡！\n绿兮丝兮，女所治兮。我思古人，俾无訧兮！\n絺兮绤兮，凄其以风。我思古人，实获我心！","note":"《诗经·国风·邶风》"},{"id":"028","number":28,"title":"燕燕","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"燕燕于飞，差池其羽。之子于归，远送于野。瞻望弗及，泣涕如雨。\n燕燕于飞，颉之颃之。之子于归，远于将之。瞻望弗及，伫立以泣。\n燕燕于飞，下上其音。之子于归，远送于南。瞻望弗及，实劳我心。\n仲氏任只，其心塞渊。终温且惠，淑慎其身。先君之思，以勖寡人。","note":"《诗经·国风·邶风》"},{"id":"029","number":29,"title":"日月","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"日居月诸，照临下土。乃如之人兮，逝不古处？胡能有定？宁不我顾。\n日居月诸，下土是冒。乃如之人兮，逝不相好。胡能有定？宁不我报。\n日居月诸，出自东方。乃如之人兮，德音无良。胡能有定？俾也可忘。\n日居月诸，东方自出。父兮母兮，畜我不卒。胡能有定？报我不述。","note":"《诗经·国风·邶风》"},{"id":"030","number":30,"title":"终风","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"终风且暴，顾我则笑，谑浪笑敖，中心是悼。\n终风且霾，惠然肯来，莫往莫来，悠悠我思。\n终风且曀，不日有曀，寤言不寐，愿言则嚏。\n曀曀其阴，虺虺其雷，寤言不寐，愿言则怀。","note":"《诗经·国风·邶风》"},{"id":"031","number":31,"title":"击鼓","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"击鼓其镗，踊跃用兵。土国城漕，我独南行。\n从孙子仲，平陈与宋。不我以归，忧心有忡。\n爰居爰处？爰丧其马？于以求之？于林之下。\n死生契阔，与子成说。执子之手，与子偕老。\n于嗟阔兮，不我活兮。于嗟洵兮，不我信兮。","note":"《诗经·国风·邶风》"},{"id":"032","number":32,"title":"凯风","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"凯风自南，吹彼棘心。棘心夭夭，母氏劬劳。\n凯风自南，吹彼棘薪。母氏圣善，我无令人。\n爰有寒痊？在浚之下。有子七人，母氏劳苦。\n睍睆黄鸟，载好其音。有子七人，莫慰母心。","note":"《诗经·国风·邶风》"},{"id":"033","number":33,"title":"雄雉","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"雄雉于飞，泄泄其羽。我之怀矣，自诒伊阻。\n雄雉于飞，下上其音。展矣君子，实劳我心。\n瞻彼日月，悠悠我思。道之云远，曷云能来？\n百尔君子，不知德行。不忮不求，何用不臧。","note":"《诗经·国风·邶风》"},{"id":"034","number":34,"title":"匏有苦叶","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"匏有苦叶，济有深涉。深则厉，浅则揭。\n有瀰济盈，有鷕雉鸣。济盈不濡轨，雉鸣求其牡。\n雍雍鸣雁，旭日始旦。士如归妻，迨冰未泮。\n招招舟子，人涉卬否。不涉卬否，卬须我友。","note":"《诗经·国风·邶风》"},{"id":"035","number":35,"title":"谷风","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"习习谷风，以阴以雨。黾勉同心，不宜有怒。采葑采菲，无以下体？德音莫违，及尔同死。\n行道迟迟，中心有违。不远伊迩，薄送我畿。谁谓荼苦，其甘如荠。宴尔新婚，如兄如弟。\n泾以渭浊，湜湜其沚。宴尔新婚，不我屑以。毋逝我梁，毋发我笱。我躬不阅，遑恤我后。\n就其深矣，方之舟之。就其浅矣，泳之游之。何有何亡，黾勉求之。凡民有丧，匍匐救之。\n不我能畜，反以我为仇。既阻我德，贾用不售。昔育恐育鞫，及尔颠覆。既生既育，比予于毒。\n我有旨蓄，亦以御冬。宴尔新婚，以我御穷。有洸有溃，既诒我肄。不念昔者，伊余来塈。","note":"《诗经·国风·邶风》"},{"id":"036","number":36,"title":"式微","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"式微，式微，胡不归？微君之故，胡为乎中露！\n式微，式微，胡不归？微君之躬，胡为乎泥中！","note":"《诗经·国风·邶风》"},{"id":"037","number":37,"title":"旄丘","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"旄丘之葛兮，何诞之节兮。叔兮伯兮，何多日也？\n何其处也？必有与也！何其久也？必有以也！\n狐裘蒙戎，匪车不东。叔兮伯兮，靡所与同。\n琐兮尾兮，流离之子。叔兮伯兮，褎如充耳。","note":"《诗经·国风·邶风》"},{"id":"038","number":38,"title":"简兮","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"简兮简兮，方将万舞。日之方中，在前上处。\n硕人俣俣，公庭万舞。有力如虎，执辔如组。\n左手执龠，右手秉翟。赫如渥赭，公言锡爵。\n山有榛，隰有苓。云谁之思？西方美人。彼美人兮，西方之人兮。","note":"《诗经·国风·邶风》"},{"id":"039","number":39,"title":"泉水","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"毖彼泉水，亦流于淇。有怀于卫，靡日不思。娈彼诸姬，聊与之谋。\n出宿于泲，饮饯于祢。女子有行，远父母兄弟，问我诸姑，遂及伯姊。\n出宿于干，饮饯于言。载脂载辖，还车言迈。遄臻于卫，不瑕有害？\n我思肥泉，兹之永叹。思须与漕，我心悠悠。驾言出游，以写我忧。","note":"《诗经·国风·邶风》"},{"id":"040","number":40,"title":"北门","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"出自北门，忧心殷殷。终窭且贫，莫知我艰。已焉哉！天实为之，谓之何哉！\n王事适我，政事一埤益我。我入自外，室人交遍谪我。已焉哉！天实为之，谓之何哉！\n王事敦我，政事一埤遗我。我入自外，室人交遍摧我。已焉哉！天实为之，谓之何哉！","note":"《诗经·国风·邶风》"},{"id":"041","number":41,"title":"北风","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"北风其凉，雨雪其雱。惠而好我，携手同行。其虚其邪？既亟只且！\n北风其喈，雨雪其霏。惠而好我，携手同归。其虚其邪？既亟只且！\n莫赤匪狐，莫黑匪乌。惠而好我，携手同车。其虚其邪？既亟只且！","note":"《诗经·国风·邶风》"},{"id":"042","number":42,"title":"静女","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"静女其姝，俟我于城隅。爱而不见，搔首踟蹰。\n静女其娈，贻我彤管。彤管有炜，说怿女美。\n自牧归荑，洵美且异。匪女之为美，美人之贻。","note":"《诗经·国风·邶风》"},{"id":"043","number":43,"title":"新台","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"新台有泚，河水瀰瀰。燕婉之求，蘧篨不鲜。\n新台有洒，河水浼浼。燕婉之求，蘧篨不殄。\n鱼网之设，鸿则离之。燕婉之求，得此戚施。","note":"《诗经·国风·邶风》"},{"id":"044","number":44,"title":"二子乘舟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"二子乘舟，泛泛其景。愿言思子，中心养养！\n二子乘舟，泛泛其逝。愿言思子，不瑕有害？","note":"《诗经·国风·邶风》"},{"id":"045","number":45,"title":"柏舟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"泛彼柏舟，在彼中河。髧彼两髦，实维我仪。之死矢靡它。母也天只，不谅人只！\n泛彼柏舟，在彼河侧。髧彼两髦，实维我特。之死矢靡慝。母也天只，不谅人只！","note":"《诗经·国风·鄘风》"},{"id":"046","number":46,"title":"墙有茨","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"墙有茨，不可扫也。中冓之言，不可道也。所可道也，言之丑也。\n墙有茨，不可襄也。中冓之言，不可详也。所可详也，言之长也。\n墙有茨，不可束也。中冓之言，不可读也。所可读也，言之辱也。","note":"《诗经·国风·鄘风》"},{"id":"047","number":47,"title":"君子偕老","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君子偕老，副笄六珈。委委佗佗，如山如河，象服是宜。子之不淑，云如之何？\n玼兮玼兮，其之翟也。鬒发如云，不屑髢也。玉之瑱也，象之揥也，扬且之晳也。胡然而天也！胡然而帝也。\n瑳兮瑳兮，其之展也。蒙彼绉絺，是绁袢也。子之清扬，扬且之颜也。展如之人兮，邦之媛也！","note":"《诗经·国风·鄘风》"},{"id":"048","number":48,"title":"桑中","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"爰采唐矣？沬之乡矣。云谁之思？美孟姜矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\n爰采麦矣？沬之北矣。云谁之思？美孟弋矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\n爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。","note":"《诗经·国风·鄘风》"},{"id":"049","number":49,"title":"鹑之奔奔","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鹑之奔奔，鹊之彊彊。人之无良，我以为兄！\n鹊之彊彊，鹑之奔奔。人之无良，我以为君！","note":"《诗经·国风·鄘风》"},{"id":"050","number":50,"title":"定之方中","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆，爰伐琴桑。\n升彼虚矣，以望楚矣。望楚与堂，景山与京。降观于桑，卜云其吉，终然允臧。\n灵雨既零，命彼倌人，星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千。","note":"《诗经·国风·鄘风》"},{"id":"051","number":51,"title":"蝃蝀","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蝃蝀在东，莫之敢指。女子有行，远父母兄弟。\n朝隮于西，崇朝其雨。女子有行，远兄弟父母。\n乃如之人也，怀婚姻也。大无信也，不知命也！","note":"《诗经·国风·鄘风》"},{"id":"052","number":52,"title":"相鼠","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"相鼠有皮，人而无仪！人而无仪，不死何为？\n相鼠有齿，人而无止！人而无止，不死何俟？\n相鼠有体，人而无礼，人而无礼！胡不遄死？","note":"《诗经·国风·鄘风》"},{"id":"053","number":53,"title":"干旄","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"孑孑干旄，在浚之郊。素丝纰之，良马四之。彼姝者子，何以畀之？\n孑孑干旟，在浚之都。素丝组之，良马五之。彼姝者子，何以予之？\n孑孑干旌，在浚之城。素丝祝之，良马六之。彼姝者子，何以告之？","note":"《诗经·国风·鄘风》"},{"id":"054","number":54,"title":"载驰","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"载驰载驱，归唁卫侯。驱马悠悠，言至于漕。大夫跋涉，我心则忧。\n既不我嘉，不能旋反。视尔不臧，我思不远。\n既不我嘉，不能旋济？视尔不臧，我思不閟。\n陟彼阿丘，言采其蝱。女子善怀，亦各有行。许人尤之，众稚且狂。\n我行其野，芃芃其麦。控于大邦，谁因谁极？大夫君子，无我有尤。百尔所思，不如我所之。","note":"《诗经·国风·鄘风》"},{"id":"055","number":55,"title":"淇奥","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"瞻彼淇奥，绿竹猗猗。有匪君子，如切如磋，如琢如磨，瑟兮僴兮，赫兮咺兮。有匪君子，终不可谖兮。\n瞻彼淇奥，绿竹青青。有匪君子，充耳秀莹，会弁如星。瑟兮僴兮。赫兮咺兮，有匪君子，终不可谖兮。\n瞻彼淇奥，绿竹如箦。有匪君子，如金如锡，如圭如璧。宽兮绰兮，猗重较兮。善戏谑兮，不为虐兮。","note":"《诗经·国风·卫风》"},{"id":"056","number":56,"title":"考槃","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"考槃在涧，硕人之宽。独寐寤言，永矢弗谖。\n考槃在阿，硕人之薖。独寐寤歌，永矢弗过。\n考槃在六，硕人之轴。独寐寤宿，永矢弗告。","note":"《诗经·国风·卫风》"},{"id":"057","number":57,"title":"硕人","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"硕人其颀，衣锦褧衣。齐侯之子，卫侯之妻。东宫之妹，邢侯之姨，谭公维私。\n手如柔荑，肤如凝脂，领如蝤蛴，齿如瓠犀，螓首蛾眉，巧笑倩兮，美目盼兮。\n硕人敖敖，说于农郊。四牡有骄，朱幩镳镳。翟茀以朝。大夫夙退，无使君劳。\n河水洋洋，北流活活。施罛濊濊，鳣鲔发发。葭菼揭揭，庶姜孽孽，庶士有朅。","note":"《诗经·国风·卫风》"},{"id":"058","number":58,"title":"氓","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"氓之蚩蚩，抱布贸丝。匪来贸丝，来即我谋。送子涉淇，至于顿丘。匪我愆期，子无良媒。将子无怒，秋以为期。\n乘彼垝垣，以望复关。不见复关，泣涕涟涟。既见复关，载笑载言。尔卜尔筮，体无咎言。以尔车来，以我贿迁。\n桑之未落，其叶沃若。于嗟鸠兮！无食桑葚。于嗟女兮！无与士耽。士之耽兮，犹可说也。女之耽兮，不可说也。\n桑之落矣，其黄而陨。自我徂尔，三岁食贫。淇水汤汤，渐车帷裳。女也不爽，士二其行。士也罔极，二三其德。\n三岁为妇，靡室劳矣。夙兴夜寐，靡有朝矣。言既遂矣，至于暴矣。兄弟不知，咥其笑矣。静言思之，躬自悼矣。\n及尔偕老，老使我怨。淇则有岸，隰则有泮。总角之宴，言笑晏晏，信誓旦旦，不思其反。反是不思，亦已焉哉！","note":"《诗经·国风·卫风》"},{"id":"059","number":59,"title":"竹竿","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"籊籊竹竿，以钓于淇。岂不尔思？远莫致之。\n泉源在左，淇水在右。女子有行，远兄弟父母。\n淇水在右，泉源在左。巧笑之瑳，佩玉之傩。\n淇水滺滺，桧楫松舟。驾言出游，以写我忧。","note":"《诗经·国风·卫风》"},{"id":"060","number":60,"title":"芄兰","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"芄兰之支，童子佩觿。虽则佩觿，能不我知。容兮遂兮，垂带悸兮。\n芄兰之叶，童子佩韘。虽则佩韘，能不我甲。容兮遂兮，垂带悸兮。","note":"《诗经·国风·卫风》"},{"id":"061","number":61,"title":"河广","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"谁谓河广？一苇杭之。谁谓宋远？跂予望之。\n谁谓河广？曾不容刀。谁谓宋远？曾不崇朝。","note":"《诗经·国风·卫风》"},{"id":"062","number":62,"title":"伯兮","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"伯兮朅兮，邦之桀兮。伯也执殳，为王前驱。\n自伯之东，首如飞蓬。岂无膏沐？谁适为容！\n其雨其雨，杲杲出日。愿言思伯，甘心首疾。\n焉得谖草？言树之背。愿言思伯。使我心痗。","note":"《诗经·国风·卫风》"},{"id":"063","number":63,"title":"有狐","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有狐绥绥，在彼淇梁。心之忧矣，之子无裳。\n有狐绥绥，在彼淇厉。心之忧矣，之子无带。\n有狐绥绥，在彼淇侧。心之忧矣，之子无服。","note":"《诗经·国风·卫风》"},{"id":"064","number":64,"title":"木瓜","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"投我以木瓜，报之以琼琚。匪报也，永以为好也！\n投我以木桃，报之以琼瑶。匪报也，永以为好也！\n投我以木李，报之以琼九。匪报也，永以为好也！","note":"《诗经·国风·卫风》"},{"id":"065","number":65,"title":"黍离","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彼黍离离，彼稷之苗。行迈靡靡，中心摇摇。知我者，谓我心忧；不知我者，谓我何求。悠悠苍天，此何人哉？\n彼黍离离，彼稷之穗。行迈靡靡，中心如醉。知我者，谓我心忧；不知我者，谓我何求。悠悠苍天，此何人哉？\n彼黍离离，彼稷之实。行迈靡靡，中心如噎。知我者，谓我心忧；不知我者，谓我何求。悠悠苍天，此何人哉？","note":"《诗经·国风·王风》"},{"id":"066","number":66,"title":"君子于役","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君子于役，不知其期。曷至哉？鸡栖于埘。日之夕矣，羊牛下来。君子于役，如之何勿思！\n君子于役，不日不月。曷其有佸？鸡栖于桀。日之夕矣，羊牛下括。君子于役，苟无饥渴？","note":"《诗经·国风·王风》"},{"id":"067","number":67,"title":"君子阳阳","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君子阳阳，左执簧，右招我由房，其乐只且！\n君子陶陶，左执翿，右招我由敖，其乐只且！","note":"《诗经·国风·王风》"},{"id":"068","number":68,"title":"扬之水","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"扬之水，不流束薪。彼其之子，不与我戍申。怀哉怀哉，曷月予还归哉？\n扬之水，不流束楚。彼其之子，不与我戍甫。怀哉怀哉，曷月予还归哉？\n扬之水，不流束蒲。彼其之子，不与我戍许。怀哉怀哉，曷月予还归哉？","note":"《诗经·国风·王风》"},{"id":"069","number":69,"title":"中谷有蓷","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"中谷有蓷，暵其干矣。有女仳离，慨其叹矣。慨其叹矣，遇人之艰难矣。\n中谷有蓷，暵其修矣。有女仳离，条其歗矣。条其歗矣，遇人之不淑矣。\n中谷有蓷，暵其湿矣。有女仳离，啜其泣矣。啜其泣矣，何嗟及矣。","note":"《诗经·国风·王风》"},{"id":"070","number":70,"title":"兔爰","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有兔爰爰，雉离于罗。我生之初，尚无为；我生之后，逢此百罹。尚寐无吪。\n有兔爰爰，雉离于罦。我生之初，尚无造；我生之后，逢此百忧。尚寐无觉。\n有兔爰爰，雉离于罿。我生之初，尚无庸；我生之后，逢此百凶。尚寐无聪。","note":"《诗经·国风·王风》"},{"id":"071","number":71,"title":"葛藟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾！\n绵绵葛爰，在河之藟。终远兄弟，谓他人母。谓他人母，亦莫我有！\n绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻！","note":"《诗经·国风·王风》"},{"id":"072","number":72,"title":"采葛","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彼采葛兮，一日不见，如三月兮！\n彼采萧兮，一日不见，如三秋兮！\n彼采艾兮！一日不见，如三岁兮！","note":"《诗经·国风·王风》"},{"id":"073","number":73,"title":"大车","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"大车槛槛，毳衣如菼。岂不尔思？畏子不敢。\n大车啍啍，毳衣如璊，岂不尔思？畏子不奔。\n谷则异室，死则同穴。谓予不信，有如皎日。","note":"《诗经·国风·王风》"},{"id":"074","number":74,"title":"丘中有麻","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"丘中有麻，彼留子嗟。彼留子嗟，将其来施施。\n丘中有麦，彼留子国。彼留子国，将其来食。\n丘中有李，彼留之子。彼留之子，贻我佩九。","note":"《诗经·国风·王风》"},{"id":"075","number":75,"title":"缁衣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"缁衣之宜兮，敝予又改为兮。适子之馆兮。还予授子之粲兮。\n缁衣之好兮，敝予又改造兮。适子之馆兮，还予授子之粲兮。\n缁衣之席兮，敝予又改作兮。适子之馆兮，还予授子之粲兮。","note":"《诗经·国风·郑风》"},{"id":"076","number":76,"title":"将仲子","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"将仲子兮，无逾我里，无折我树杞。岂敢爱之？畏我父母。仲可怀也，父母之言亦可畏也。\n将仲子兮，无逾我墙，无折我树桑。岂敢爱之？畏我诸兄。仲可怀也，诸兄之言亦可畏也。\n将仲子兮，无逾我园，无折我树檀。岂敢爱之？畏人之多言。仲可怀也，人之多言亦可畏也。","note":"《诗经·国风·郑风》"},{"id":"077","number":77,"title":"叔于田","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"叔于田，巷无居人。岂无居人？不如叔也。洵美且仁。\n叔于狩，巷无饮酒。岂无饮酒？不如叔也。洵美且好。\n叔适野，巷无服马。岂无服马？不如叔也。洵美且武。","note":"《诗经·国风·郑风》"},{"id":"078","number":78,"title":"大叔于田","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"叔于田，乘乘马。执辔如组，两骖如舞。叔在薮，火烈具举。襢裼暴虎，献于公所。将叔勿狃，戒其伤女。\n叔于田，乘乘黄。两服上襄，两骖雁行。叔在薮，火烈具扬。叔善射忌，又良御忌。抑罄控忌，抑纵送忌。\n叔于田，乘乘鸨。两服齐首，两骖如手。叔在薮，火烈具阜。叔马慢忌，叔发罕忌，抑释掤忌，抑鬯弓忌。","note":"《诗经·国风·郑风》"},{"id":"079","number":79,"title":"清人","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"清人在彭，驷介旁旁。二矛重英，河上乎翱翔。\n清人在消，驷介麃麃。二矛重乔，河上乎逍遥。\n清人在轴，驷介陶陶。左旋右抽，中军作好。","note":"《诗经·国风·郑风》"},{"id":"080","number":80,"title":"羔裘","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"羔裘如濡，洵直且侯。彼其之子，舍命不渝。\n羔裘豹饰，孔武有力。彼其之子，邦之司直。\n羔裘晏兮，三英粲兮。彼其之子，邦之彦兮。","note":"《诗经·国风·郑风》"},{"id":"081","number":81,"title":"遵大路","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"遵大路兮，掺执子之袪兮。无我恶兮，不蓵故也！\n遵大路兮，掺执子之手兮。无我魗兮，不蓵好也！","note":"《诗经·国风·郑风》"},{"id":"082","number":82,"title":"女曰鸡鸣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"女曰鸡鸣，士曰昧旦。子兴视夜，明星有烂。将翱将翔，弋凫与雁。\n弋言加之，与子宜之。宜言饮酒，与子偕老。琴瑟在御，莫不静好。\n知子之来之，杂佩以赠之。知子之顺之，杂佩以问之。知子之好之，杂佩以报之。","note":"《诗经·国风·郑风》"},{"id":"083","number":83,"title":"有女同车","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有女同车，颜如舜华。将翱将翔，佩玉琼琚。彼美孟姜，洵美且都。\n有女同行，颜如舜英。将翱将翔，佩玉将将。彼美孟姜，德音不忘。","note":"《诗经·国风·郑风》"},{"id":"084","number":84,"title":"山有扶苏","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山有扶苏，隰有荷华。不见子都，乃见狂且。\n山有乔松，隰有游龙，不见子充，乃见狡童。","note":"《诗经·国风·郑风》"},{"id":"085","number":85,"title":"萚兮","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。\n萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。","note":"《诗经·国风·郑风》"},{"id":"086","number":86,"title":"狡童","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。\n彼狡童兮，不与我食兮。维子之故，使我不能息兮。","note":"《诗经·国风·郑风》"},{"id":"087","number":87,"title":"褰裳","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"子惠思我，褰裳涉溱。子不我思，岂无他人？狂童之狂也且！\n子惠思我，褰裳涉洧。子不我思，岂无他士？狂童之狂也且！","note":"《诗经·国风·郑风》"},{"id":"088","number":88,"title":"丰","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"子之丰兮，俟我乎巷兮，悔予不送兮。\n子之昌兮，俟我乎堂兮，悔予不将兮。\n衣锦褧衣，裳锦褧裳。叔兮伯兮，驾予与行。\n裳锦褧裳，衣锦褧衣。叔兮伯兮，驾予与归。","note":"《诗经·国风·郑风》"},{"id":"089","number":89,"title":"东门之墠","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东门之墠，茹藘在阪。其室则迩，其人甚远。\n东门之栗，有践家室。岂不尔思？子不我即！","note":"《诗经·国风·郑风》"},{"id":"090","number":90,"title":"风雨","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"风雨凄凄，鸡鸣喈喈，既见君子。云胡不夷？\n风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？\n风雨如晦，鸡鸣不已。既见君子，云胡不喜？","note":"《诗经·国风·郑风》"},{"id":"091","number":91,"title":"子衿","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"青青子衿，悠悠我心。纵我不往，子宁不嗣音？\n青青子佩，悠悠我思。纵我不往，子宁不来？\n挑兮达兮，在城阙兮。一日不见，如三月兮。","note":"《诗经·国风·郑风》"},{"id":"092","number":92,"title":"扬之水","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"扬之水，不流束楚。终鲜兄弟，维予与女。无信人之言，人实诳女。\n扬之水，不流束薪。终鲜兄弟，维予二人。无信人之言，人实不信。","note":"《诗经·国风·郑风》"},{"id":"093","number":93,"title":"出其东门","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"出其东门，有女如云。虽则如云。匪我思存。缟衣綦巾，聊乐我员。\n出其闉阇，有女如荼。虽则如荼，匪我思且。缟衣茹藘，聊可与娱。","note":"《诗经·国风·郑风》"},{"id":"094","number":94,"title":"野有蔓草","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"野有蔓草，零露漙兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。\n野有蔓草，零露瀼瀼。有美一人，婉如清扬。邂逅相遇，与子偕臧。","note":"《诗经·国风·郑风》"},{"id":"095","number":95,"title":"溱洧","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰观乎？士曰既且。且往观乎？\n洧之外，洵訏且乐。维士与女，伊其相谑，赠之以勺药。\n溱与洧，浏其清矣。士与女，殷其盈矣。女曰观乎？士曰既且。且往观乎？\n洧之外，洵訏且乐。维士与女，伊其将谑，赠之以勺药。","note":"《诗经·国风·郑风》"},{"id":"096","number":96,"title":"鸡鸣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。\n东方明矣，朝既昌矣。匪东方则明，月出之光。\n虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。","note":"《诗经·国风·齐风》"},{"id":"097","number":97,"title":"还","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"子之还兮，遭我乎狃之间兮。并驱从两肩兮，揖我谓我儇兮。\n子之茂兮，遭我乎狃之道兮。并驱从两牡兮，揖我谓我好兮。\n子之昌兮，遭我乎狃之阳兮。并驱从两狼兮，揖我谓我臧兮。","note":"《诗经·国风·齐风》"},{"id":"098","number":98,"title":"着","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"俟我于着乎而，充耳以素乎而，尚之以琼华乎而。\n俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。\n俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。","note":"《诗经·国风·齐风》"},{"id":"099","number":99,"title":"东方之日","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。\n东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。","note":"《诗经·国风·齐风》"},{"id":"100","number":100,"title":"东方未明","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东方未明，颠倒衣裳。颠之倒之，自公召之。\n东方未晞，颠倒裳衣。倒之颠之，自公令之。\n折柳樊圃，狂夫瞿瞿。不能辰夜，不夙则莫。","note":"《诗经·国风·齐风》"},{"id":"101","number":101,"title":"南山","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？\n葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？\n蓺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？\n析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？","note":"《诗经·国风·齐风》"},{"id":"102","number":102,"title":"甫田","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"无田甫田，维莠骄骄。无思远人，劳心忉忉。\n无田甫田，维莠桀桀。无思远人，劳心怛怛。\n婉兮娈兮。总角丱兮。未几见兮，突而弁兮！","note":"《诗经·国风·齐风》"},{"id":"103","number":103,"title":"卢令","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"卢令令，其人美且仁。\n卢重环，其人美且鬈。\n卢重鋂，其人美且偲。","note":"《诗经·国风·齐风》"},{"id":"104","number":104,"title":"敝笱","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。\n敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。\n敝笱在梁，其鱼唯唯。齐子归止，其从如水。","note":"《诗经·国风·齐风》"},{"id":"105","number":105,"title":"载驱","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。\n四骊济济，垂辔沵沵。鲁道有荡，齐子岂弟。\n汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。\n汶水滔滔，行人儦儦。鲁道有荡，齐了游敖。","note":"《诗经·国风·齐风》"},{"id":"106","number":106,"title":"猗嗟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"猗嗟昌兮，颀而长兮。抑若扬兮，美目扬兮。巧趋跄兮，射则臧兮。\n猗嗟名兮，美目清兮。仪既成兮，终日射侯，不出正兮，展我甥兮。\n猗嗟娈兮，清扬婉兮。舞则选兮，射则贯兮，四矢反兮，以御乱兮。","note":"《诗经·国风·齐风》"},{"id":"107","number":107,"title":"葛屦","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"纠纠葛屦，可以履霜？掺掺女手，可以缝裳？要之襋之，好人服之。\n好人提提，宛然左辟，佩其象揥。维是褊心，是以为刺。","note":"《诗经·国风·魏风》"},{"id":"108","number":108,"title":"汾沮洳","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。\n彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。\n彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。","note":"《诗经·国风·魏风》"},{"id":"109","number":109,"title":"园有桃","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"园有桃，其实之肴。心之忧矣，我歌且谣。不知我者，谓我士也骄。\n彼人是哉，子曰何其？心之忧矣，其谁知之？其谁知之，盖亦勿思！\n园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。\n彼人是哉，子曰何其？心之忧矣，其谁知之？其谁知之，盖亦勿思！","note":"《诗经·国风·魏风》"},{"id":"110","number":110,"title":"陟岵","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"陟彼岵兮，瞻望父兮。父曰：嗟！予子行役，夙夜无已。上慎旃哉，犹来！无止！\n陟彼屺兮，瞻望母兮。母曰：嗟！予季行役，夙夜无寐。上慎旃哉，犹来！无弃！\n陟彼冈兮，瞻望兄兮。兄曰：嗟！予弟行役，夙夜必偕。上慎旃哉，犹来！无死！","note":"《诗经·国风·魏风》"},{"id":"111","number":111,"title":"十亩之间","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"十亩之间兮，桑者闲闲兮，行与子还兮。\n十亩之外兮，桑者泄泄兮，行与子逝兮。","note":"《诗经·国风·魏风》"},{"id":"112","number":112,"title":"伐檀","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"坎坎伐檀兮，置之河之干兮。河水清且涟猗。不稼不穑，胡取禾三百廛兮？\n不狩不猎，胡瞻尔庭有县貆兮？彼君子兮，不素餐兮！\n坎坎伐辐兮，置之河之侧兮。河水清且直猗。不稼不穑，胡取禾三百亿兮？\n不狩不猎，胡瞻尔庭有县特兮？彼君子兮，不素食兮！\n坎坎伐轮兮，置之河之漘兮。河水清且沦猗。不稼不穑，胡取禾三百囷兮？\n不狩不猎，胡瞻尔庭有县鹑兮？彼君子兮，不素飧兮！","note":"《诗经·国风·魏风》"},{"id":"113","number":113,"title":"硕鼠","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"硕鼠硕鼠，无食我黍！三岁贯女，莫我肯顾。逝将去女，适彼乐土。乐土乐土，爰得我所。\n硕鼠硕鼠，无食我麦！三岁贯女，莫我肯德。逝将去女，适彼乐国。乐国乐国，爰得我直。\n硕鼠硕鼠，无食我苗！三岁贯女，莫我肯劳。逝将去女，适彼乐郊。乐郊乐郊，谁之永号？","note":"《诗经·国风·魏风》"},{"id":"114","number":114,"title":"蟋蟀","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。\n蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。\n蟋蟀在堂，役车其休。今我不乐，日月其慆。无以大康。职思其忧。好乐无荒，良士休休。","note":"《诗经·国风·唐风》"},{"id":"115","number":115,"title":"山有枢","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。\n山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。\n山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。","note":"《诗经·国风·唐风》"},{"id":"116","number":116,"title":"扬之水","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"扬之水，白石凿凿。素衣朱襮，从子于沃。既见君子，云何不乐？\n扬之水，白石皓皓。素衣朱绣，从子于鹄。既见君子，云何其忧？\n扬之水，白石粼粼。我闻有命，不敢以告人。","note":"《诗经·国风·唐风》"},{"id":"117","number":117,"title":"椒聊","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"椒聊之实，蕃衍盈升。彼其之子，硕大无朋。椒聊且，远条且。\n椒聊之实，蕃衍盈匊。彼其之子，硕大且笃。椒聊且，远条且。","note":"《诗经·国风·唐风》"},{"id":"118","number":118,"title":"绸缪","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绸缪束薪，三星在天。今夕何夕，见此良人？子兮子兮，如此良人何？\n绸缪束刍，三星在隅。今夕何夕，见此邂逅？子兮子兮，如此邂逅何？\n绸缪束楚，三星在户。今夕何夕，见此粲者？子兮子兮，如此粲者何？","note":"《诗经·国风·唐风》"},{"id":"119","number":119,"title":"杕杜","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有杕之杜，其叶湑湑。独行踽踽。岂无他人？不如我同父。嗟行之人，胡不比焉？人无兄弟，胡不佽焉？\n有杕之杜，其叶箐箐。独行睘睘。岂无他人？不如我同姓。嗟行之人，胡不比焉？人无兄弟，胡不佽焉？","note":"《诗经·国风·唐风》"},{"id":"120","number":120,"title":"羔裘","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"羔裘豹祛，自我人居居。岂无他人？维子之故。\n羔裘豹褎，自我人究究。岂无他人？维子之好。","note":"《诗经·国风·唐风》"},{"id":"121","number":121,"title":"鸨羽","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"肃肃鸨羽，集于苞栩。王事靡盬，不能蓺稷黍。父母何怙？悠悠苍天，曷其有所？\n肃肃鸨翼，集于苞棘。王事靡盬，不能蓺黍稷。父母何食？悠悠苍天，曷其有极？\n肃肃鸨行，集于苞桑，王事靡盬，不能蓺稻梁。父母何尝？悠悠苍天，曷其有常？","note":"《诗经·国风·唐风》"},{"id":"122","number":122,"title":"无衣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"岂曰无衣七兮？不如子之衣，安且吉兮！\n岂曰无衣六兮？不如子之衣，安且燠兮！","note":"《诗经·国风·唐风》"},{"id":"123","number":123,"title":"有杕之杜","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有杕之杜，生于道左。彼君子兮，噬肯适我？中心好之，曷饮食之？\n有杕之杜，生于道周。彼君子兮，噬肯来游？中心好之，曷饮食之？","note":"《诗经·国风·唐风》"},{"id":"124","number":124,"title":"葛生","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"葛生蒙楚，蔹蔓于野。予美亡此，谁与？独处？\n葛生蒙棘，蔹蔓于域。予美亡此，谁与？独息？\n角枕粲兮，锦衾烂兮。予美亡此，谁与？独旦？\n夏之日，冬之夜。百岁之后，归于其居。\n冬之夜，夏之日。百岁之后，归于其室。","note":"《诗经·国风·唐风》"},{"id":"125","number":125,"title":"采苓","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"采苓采苓，首阳之巅。人之为言，苟亦无信。舍旃舍旃，苟亦无然。人之为言，胡得焉？\n采苦采苦，首阳之下。人之为言，苟亦无与。舍旃舍旃，苟亦无然。人之为言，胡得焉？\n采葑采葑，首阳之东。人之为言，苟亦无从。舍旃舍旃，苟亦无然。人之为言，胡得焉？","note":"《诗经·国风·唐风》"},{"id":"126","number":126,"title":"车邻","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有车邻邻，有马白颠。未见君子，寺人之令。\n阪有漆，隰有栗。既见君子，并坐鼓瑟。今者不乐，逝者其耋。\n阪有桑，隰有杨。既见君子，并坐鼓簧。今者不乐，逝者其亡。","note":"《诗经·国风·秦风》"},{"id":"127","number":127,"title":"驷驖","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"驷驖孔阜，六辔在手。公之媚子，从公于狩。\n奉时辰牡，辰牡孔硕。公曰左之，舍拔则获。\n游于北园，四马既闲。輶车鸾镳，载猃歇骄。","note":"《诗经·国风·秦风》"},{"id":"128","number":128,"title":"小戎","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"小戎俴收，五楘梁辀。游环胁驱，阴靷鋈续。文茵畅毂，驾我骐馵。\n言念君子，温其如玉。在其板屋，乱我心曲。\n四牡孔阜，六辔在手。骐骝是中，騧骊是骖。龙盾之合，鋈以觼軜。\n言念君子，温其在邑。方何为期？胡然我念之！\n俴驷孔群，厹矛鋈錞。蒙伐有苑，虎韔镂膺。交韔二弓，竹闭绲縢。\n言念君子，载寝载兴。厌厌良人，秩秩德音。","note":"《诗经·国风·秦风》"},{"id":"129","number":129,"title":"蒹葭","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。\n蒹葭萋萋，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。\n蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。","note":"《诗经·国风·秦风》"},{"id":"130","number":130,"title":"终南","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"终南何有？有条有梅。君子至止，锦衣狐裘。颜如渥丹，其君也哉！\n终南何有？有纪有堂。君子至止，黻衣绣裳。佩玉将将，寿考不忘！","note":"《诗经·国风·秦风》"},{"id":"131","number":131,"title":"黄鸟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。\n临其穴，惴惴其栗。彼苍者天，歼我良人！如可赎兮，人百其身！\n交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。\n临其穴，惴惴其栗。彼苍者天，歼我良人！如可赎兮，人百其身！\n交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。\n临其穴，惴惴其栗。彼苍者天，歼我良人！如可赎兮，人百其身！","note":"《诗经·国风·秦风》"},{"id":"132","number":132,"title":"晨风","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鴥彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何，忘我实多！\n山有苞栎，隰有六駮。未见君子，忧心靡乐。如何如何，忘我实多！\n山有苞棣，隰有树檖。未见君子，忧心如醉。如何如何，忘我实多！","note":"《诗经·国风·秦风》"},{"id":"133","number":133,"title":"无衣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"岂曰无衣？与子同袍。王于兴师，修我戈矛。与子同仇！\n岂曰无衣？与子同泽。王于兴师，修我矛戟。与子偕作！\n岂曰无衣？与子同裳。王于兴师，修我甲兵。与子偕行！","note":"《诗经·国风·秦风》"},{"id":"134","number":134,"title":"渭阳","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"我送舅氏，曰至渭阳。何以赠之？路车乘黄。\n我送舅氏，悠悠我思。何以赠之？琼瑰玉佩。","note":"《诗经·国风·秦风》"},{"id":"135","number":135,"title":"权舆","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"于我乎，夏屋渠渠，今也每食无余。于嗟乎，不承权舆！\n于我乎，每食四簋，今也每食不饱。于嗟乎，不承权舆！","note":"《诗经·国风·秦风》"},{"id":"136","number":136,"title":"宛丘","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"子之汤兮，宛丘之上兮。洵有情兮，而无望兮。\n坎其击鼓，宛丘之下。无冬无夏，值其鹭羽。\n坎其击缶，宛丘之道。无冬无夏，值其鹭翿。","note":"《诗经·国风·陈风》"},{"id":"137","number":137,"title":"东门之枌","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东门之枌，宛丘之栩。子仲之子，婆娑其下。\n穀旦于差，南方之原。不绩其麻，市也婆娑。\n穀旦于逝，越以鬷迈。视尔如荍，贻我握椒。","note":"《诗经·国风·陈风》"},{"id":"138","number":138,"title":"衡门","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"衡门之下，可以栖迟。泌之洋洋，可以乐饥。\n岂其食鱼，必河之鲂？岂其取妻，必齐之姜？\n岂其食鱼，必河之鲤？岂其取妻，必宋之子？","note":"《诗经·国风·陈风》"},{"id":"139","number":139,"title":"东门之池","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东门之池，可以沤麻。彼美淑姬，可与晤歌。\n东门之池，可以沤纻。彼美淑姬，可与晤语。\n东门之池，可以沤菅。彼美淑姬，可与晤言。","note":"《诗经·国风·陈风》"},{"id":"140","number":140,"title":"东门之杨","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东门之杨，其叶牂牂。昏以为期，明星煌煌。\n东门之杨，其叶肺肺。昏以为期，明星晢晢。","note":"《诗经·国风·陈风》"},{"id":"141","number":141,"title":"墓门","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"墓门有棘，斧以斯之。夫也不良，国人知之。知而不已，谁昔然矣。\n墓门有梅，有鸮萃止。夫也不良，歌以讯之。讯予不顾，颠倒思予。","note":"《诗经·国风·陈风》"},{"id":"142","number":142,"title":"防有鹊巢","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"防有鹊巢，邛有旨苕。谁侜予美？心焉忉忉。\n中唐有甓，邛有旨鷊。谁侜予美？心焉惕惕。","note":"《诗经·国风·陈风》"},{"id":"143","number":143,"title":"月出","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"月出皎兮。佼人僚兮。舒窈纠兮。劳心悄兮。\n月出皓兮。佼人懰兮。舒忧受兮。劳心慅兮。\n月出照兮。佼人燎兮。舒夭绍兮。劳心惨兮。","note":"《诗经·国风·陈风》"},{"id":"144","number":144,"title":"株林","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"胡为乎株林？从夏南！匪适株林，从夏南！\n驾我乘马，说于株野。乘我乘驹，朝食于株！","note":"《诗经·国风·陈风》"},{"id":"145","number":145,"title":"泽陂","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彼泽之陂，有蒲与荷。有美一人，伤如之何？寤寐无为，涕泗滂沱。\n彼泽之陂，有蒲与蕳。有美一人，硕大且卷。寤寐无为，中心悁悁。\n彼泽之陂，有蒲菡萏。有美一人，硕大且俨。寤寐无为，辗转伏枕。","note":"《诗经·国风·陈风》"},{"id":"146","number":146,"title":"羔裘","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"羔裘逍遥，狐裘以朝。岂不尔思？劳心忉忉。\n羔裘翱翔，狐裘在堂。岂不尔思？我心忧伤。\n羔裘如膏，日出有曜。岂不尔思？中心是悼。","note":"《诗经·国风·桧风》"},{"id":"147","number":147,"title":"素冠","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"庶见素冠兮，棘人栾栾兮。劳心慱慱兮。\n庶见素衣兮，我心伤悲兮。聊与子同归兮。\n庶见素韠兮，我心蕴结兮。聊与子如一兮。","note":"《诗经·国风·桧风》"},{"id":"148","number":148,"title":"隰有苌楚","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"隰有苌楚，猗傩其枝，夭之沃沃，乐子之无知。\n隰有苌楚，猗傩其华，夭之沃沃。乐子之无家。\n隰有苌楚，猗傩其实，夭之沃沃。乐子之无室。","note":"《诗经·国风·桧风》"},{"id":"149","number":149,"title":"匪风","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"匪风发兮，匪车偈兮。顾瞻周道，中心怛兮。\n匪风飘兮，匪车嘌兮。顾瞻周道，中心吊兮。\n谁能亨鱼？溉之釜鬵。谁将西归？怀之好音。","note":"《诗经·国风·桧风》"},{"id":"150","number":150,"title":"蜉蝣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蜉蝣之羽，衣裳楚楚。心之忧矣，于我归处。\n蜉蝣之翼，采采衣服。心之忧矣，于我归息。\n蜉蝣掘阅，麻衣如雪。心之忧矣，于我归说。","note":"《诗经·国风·曹风》"},{"id":"151","number":151,"title":"候人","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彼候人兮，何戈与祋。彼其之子，三百赤芾。\n维鹈在梁，不濡其翼。彼其之子，不称其服。\n维鹈在梁，不濡其咮。彼其之子，不遂其媾。\n荟兮蔚兮，南山朝隮。婉兮娈兮，季女斯饥。","note":"《诗经·国风·曹风》"},{"id":"152","number":152,"title":"鳲鸠","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鳲鸠在桑，其子七兮。淑人君子，其仪一兮。其仪一兮，心如结兮。\n鳲鸠在桑，其子在梅。淑人君子，其带伊丝。其带伊丝，其弁伊骐。\n鳲鸠在桑，其子在棘。淑人君子，其仪不忒。其仪不忒，正是四国。\n鳲鸠在桑，其子在榛。淑人君子，正是国人，正是国人。胡不万年？","note":"《诗经·国风·曹风》"},{"id":"153","number":153,"title":"下泉","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"冽彼下泉，浸彼苞稂。忾我寤叹，念彼周京。\n冽彼下泉，浸彼苞萧。忾我寤叹，念彼京周。\n冽彼下泉，浸彼苞蓍。忾我寤叹，念彼京师。\n芃芃黍苗，阴雨膏之。四国有王，郇伯劳之。","note":"《诗经·国风·曹风》"},{"id":"154","number":154,"title":"七月","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"七月流火，九月授衣。一之日觱发，二之日栗烈。无衣无褐，何以卒岁？\n三之日于耜，四之日举趾。同我妇子，馌彼南亩。田畯至喜。\n七月流火，九月授衣。春日载阳，有鸣仓庚。女执懿筐，遵彼微行，爰求柔桑。\n春日迟迟，采蘩祁祁。女心伤悲，殆及公子同归。\n七月流火，八月萑苇。蚕月条桑，取彼斧斨。以伐远扬，猗彼女桑。\n七月鸣鵙，八月载绩。载玄载黄，我朱孔阳，为公子裳。\n四月秀葽，五月鸣蜩。八月其获，十月陨萚。一之日于貉，取彼狐狸，为公子裘。\n二之日其同，载缵武功。言私其豵，献豜于公。\n五月斯螽动股，六月莎鸡振羽。七月在野，八月在宇，九月在户，十月蟋蟀，入我床下。\n穹窒熏鼠，塞向墐户。嗟我妇子，曰为改岁，入此室处。\n六月食郁及薁，七月亨葵及菽。八月剥枣，十月获稻。为此春酒，以介眉寿。\n七月食瓜，八月断壶，九月叔苴，采荼薪樗。食我农夫。\n九月筑场圃，十月纳禾稼。黍稷重穋，禾麻菽麦。嗟我农夫，我稼既同，上入执宫功。\n昼尔于茅，宵尔索綯，亟其乘屋，其始播百谷。\n二之日凿冰冲冲，三之日纳于凌阴。四之日其蚤，献羔祭韭。九月肃霜，十月涤场。\n朋酒斯飨，曰杀羔羊，跻彼公堂。称彼兕觥：万寿无疆！","note":"《诗经·国风·豳风》"},{"id":"155","number":155,"title":"鸱鸮","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鸱鸮鸱鸮，既取我子，无毁我室。恩斯勤斯，鬻子之闵斯。\n迨天之未阴雨，彻彼桑土，绸缪牖户。今女下民，或敢侮予？\n予手拮据，予所捋荼。予所蓄租，予口卒瘏，曰予未有室家。\n予羽谯谯，予尾翛翛，予室翘翘。风雨所漂摇，予维音哓哓！","note":"《诗经·国风·豳风》"},{"id":"156","number":156,"title":"东山","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"我徂东山，慆慆不归。我来自东，零雨其濛。我东曰归，我心西悲。\n制彼裳衣，勿士行枚。蜎蜎者蠋，烝在桑野。敦彼独宿，亦在车下。\n我徂东山，慆慆不归。我来自东，零雨其濛。果臝之实，亦施于宇。\n伊威在室，蠨蛸在户。町畽鹿场，熠耀宵行。不可畏也，伊可怀也。\n我徂东山，慆慆不归。我来自东，零雨其濛。鹳鸣于垤，妇叹于室。\n洒扫穹窒，我征聿至。有敦瓜苦，烝在栗薪。自我不见，于今三年。\n我徂东山，慆慆不归。我来自东，零雨其濛。仓庚于飞，熠耀其羽。\n之子于归，皇驳其马。亲结其缡，九十其仪。其新孔嘉，其旧如之何？","note":"《诗经·国风·豳风》"},{"id":"157","number":157,"title":"破斧","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"既破我斧，又缺我斨。周公东征，四国是皇。哀我人斯，亦孔之将。\n既破我斧，又缺我锜。周公东征，四国是遒。哀我人斯，亦孔之嘉。\n既破我斧，又缺我銶。周公东征，四国是遒。哀我人斯，亦孔之休。","note":"《诗经·国风·豳风》"},{"id":"158","number":158,"title":"伐柯","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"伐柯如何？匪斧不克。取妻如何？匪媒不得。\n伐柯伐柯，其则不远。我觏之子，笾豆有践。","note":"《诗经·国风·豳风》"},{"id":"159","number":159,"title":"九罭","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"九罭之鱼，鳟鲂。我觏之子，衮衣绣裳。\n鸿飞遵渚，公归无所，于女信处。鸿飞遵六，公归不复，于女信宿。\n是以有衮衣兮，无以我公归兮，无使我心悲兮。","note":"《诗经·国风·豳风》"},{"id":"160","number":160,"title":"狼跋","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"狼跋其胡，载疐其尾。公孙硕肤，赤舄几几。\n狼疐其尾，载跋其胡。公孙硕肤，德音不瑕？","note":"《诗经·国风·豳风》"},{"id":"161","number":161,"title":"鹿鸣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。吹笙鼓簧，承筐是将。人之好我，示我周行。\n呦呦鹿鸣，食野之蒿。我有嘉宾，德音孔昭。视民不恌，君子是则是效。我有旨酒，嘉宾式燕以敖。\n呦呦鹿鸣，食野之芩。我有嘉宾，鼓瑟鼓琴。鼓瑟鼓琴，和乐且湛。我有旨酒，以燕乐嘉宾之心。","note":"《诗经·小雅·鹿鸣之什》"},{"id":"162","number":162,"title":"四牡","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"四牡騑騑，周道倭迟。岂不怀归？王事靡盬，我心伤悲。\n四牡騑騑，啴啴骆马。岂不怀归？王事靡盬，不遑启处。\n翩翩者鵻，载飞载下，集于苞栩。王事靡盬，不遑将父。\n翩翩者鵻，载飞载止，集于苞杞。王事靡盬，不遑将母。\n驾彼四骆，载骤骎骎。岂不怀归？是用作歌，将母来谂。","note":"《诗经·小雅·鹿鸣之什》"},{"id":"163","number":163,"title":"皇皇者华","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"皇皇者华，于彼原隰。駪駪征夫，每怀靡及。\n我马维驹，六辔如濡。载驰载驱，周爰咨诹。\n我马维骐，六辔如丝。载驰载驱，周爰咨谋。\n我马维骆，六辔沃若。载驰载驱，周爰咨度。\n我马维骃，六辔既均。载驰载驱，周爰咨询。","note":"《诗经·小雅·鹿鸣之什》"},{"id":"164","number":164,"title":"棠棣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"棠棣之华，鄂不韡韡。凡今之人，莫如兄弟。\n死丧之威，兄弟孔怀。原隰裒矣，兄弟求矣。\n脊令在原，兄弟急难。每有良朋，况也永叹。\n兄弟阋于墙，外御其务。每有良朋，烝也无戎。\n丧乱既平，既安且宁。虽有兄弟，不如友生？\n傧尔笾豆，饮酒之饫。兄弟既具，和乐且孺。\n妻子好合，如鼓瑟琴。兄弟既翕，和乐且湛。\n宜尔室家，乐尔妻帑。是究是图，亶其然乎？","note":"《诗经·小雅·鹿鸣之什》"},{"id":"165","number":165,"title":"伐木","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"伐木丁丁，鸟鸣嘤嘤。出自幽谷，迁于乔木。嘤其鸣矣，求其友声。\n相彼鸟矣，犹求友声。矧伊人矣，不求友生？神之听之，终和且平。\n伐木许许，酾酒有藇！既有肥羜，以速诸父。宁适不来，微我弗顾。\n于粲洒扫，陈馈八簋。既有肥牡，以速诸舅。宁适不来，微我有咎。\n伐木于阪，酾酒有衍。笾豆有践，兄弟无远。民之失德，乾餱以愆。\n有酒湑我，无酒酤我。坎坎鼓我，蹲蹲舞我。迨我暇矣，饮此湑矣。","note":"《诗经·小雅·鹿鸣之什》"},{"id":"166","number":166,"title":"天保","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"天保定尔，亦孔之固。俾尔单厚，何福不除？俾尔多益，以莫不庶。\n天保定尔，俾尔戬穀。罄无不宜，受天百禄。降尔遐福，维日不足。\n天保定尔，以莫不兴。如山如阜，如冈如陵，如川之方至，以莫不增。\n吉蠲为饎，是用孝享。禴祠烝尝，于公先王。君曰：卜尔，万寿无疆。\n神之吊矣，诒尔多福。民之质矣，日用饮食。群黎百姓，遍为尔德。\n如月之恒，如日之升。如南山之寿，不骞不崩。如松柏之茂，无不尔或承。","note":"《诗经·小雅·鹿鸣之什》"},{"id":"167","number":167,"title":"采薇","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"采薇采薇，薇亦作止。曰归曰归，岁亦莫止。靡室靡家，玁狁之故。不遑启居，玁狁之故。\n采薇采薇，薇亦柔止。曰归曰归，心亦忧止。忧心烈烈，载饥载渴。我戍未定，靡使归聘。\n采薇采薇，薇亦刚止。曰归曰归，岁亦阳止。王事靡盬，不遑启处。忧心孔疚，我行不来！\n彼尔维何？维常之华。彼路斯何？君子之车。戎车既驾，四牡业业。岂敢定居？一月三捷。\n驾彼四牡，四牡骙骙。君子所依，小人所腓。四牡翼翼，象弭鱼服。岂不日戒？玁狁孔棘！\n昔我往矣，杨柳依依。今我来思，雨雪霏霏。行道迟迟，载渴载饥。我心伤悲，莫知我哀！","note":"《诗经·小雅·鹿鸣之什》"},{"id":"168","number":168,"title":"出车","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"我出我车，于彼牧矣。自天子所，谓我来矣。召彼仆夫，谓之载矣。王事多难，维其棘矣。\n我出我车，于彼郊矣。设此旐矣，建彼旄矣。彼旟旐斯，胡不旆旆？忧心悄悄，仆夫况瘁。\n王命南仲，往城于方。出车彭彭，旂旐央央。天子命我，城彼朔方。赫赫南仲，玁狁于襄。\n昔我往矣，黍稷方华。今我来思，雨雪载途。王事多难，不遑启居。岂不怀归？畏此简书。\n喓喓草虫，趯趯阜螽。未见君子，忧心忡忡。既见君子，我心则降。赫赫南仲，薄伐西戎。\n春日迟迟，卉木萋萋。仓庚喈喈，采蘩祁祁。执讯获丑，薄言还归。赫赫南仲，玁狁于夷。","note":"《诗经·小雅·鹿鸣之什》"},{"id":"169","number":169,"title":"杕杜","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有杕之杜，有睆其实。王事靡盬，继嗣我日。日月阳止，女心伤止，征夫遑止。\n有杕之杜，其叶萋萋。王事靡盬，我心伤悲。卉木萋止，女心悲止，征夫归止！\n陟彼北山，言采其杞。王事靡盬，忧我父母。檀车幝幝，四牡痯痯，征夫不远！\n匪载匪来，忧心孔疚。斯逝不至，而多为恤。卜筮偕止，会言近止，征夫迩止！","note":"《诗经·小雅·鹿鸣之什》"},{"id":"170","number":170,"title":"鱼丽","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鱼丽于罶，鲿鲨。君子有酒，旨且多。\n鱼丽于罶，鲂鳢。君子有酒，多且旨。\n鱼丽于罶，鰋鲤。君子有酒，旨且有。物其多矣，\n维其嘉矣！物其旨矣，维其偕矣！物其有矣，维其时矣！","note":"《诗经·小雅·鹿鸣之什》"},{"id":"171","number":171,"title":"南有嘉鱼","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"南有嘉鱼，烝然罩罩。君子有酒，嘉宾式燕以乐。\n南有嘉鱼，烝然汕汕。君子有酒，嘉宾式燕以衎。\n南有樛木，甘瓠累之。君子有酒，嘉宾式燕绥之。\n翩翩者鵻，烝然来思。君子有酒，嘉宾式燕又思。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"172","number":172,"title":"南山有台","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"南山有台，北山有莱。乐只君子，邦家之基。乐只君子，万寿无期。\n南山有桑，北山有杨。乐只君子，邦家之光。乐只君子，万寿无疆。\n南山有杞，北山有李。乐只君子，民之父母。乐只君子，德音不已。\n南山有栲，北山有杻。乐只君子，遐不眉寿。乐只君子，德音是茂。\n南山有枸，北山有楰。乐只君子，遐不黄耇。乐只君子，保艾尔后。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"173","number":173,"title":"蓼萧","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蓼彼萧斯，零露湑兮。既见君子，我心写兮。燕笑语兮，是以有誉处兮。\n蓼彼萧斯，零露瀼瀼。既见君子，为龙为光。其德不爽，寿考不忘。\n蓼彼萧斯，零露泥泥。既见君子，孔燕岂弟。宜兄宜弟，令德寿岂。\n蓼彼萧斯，零露浓浓。既见君子，鞗革忡忡。和鸾雍雍，万福攸同。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"174","number":174,"title":"湛露","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"湛湛露斯，匪阳不晞。厌厌夜饮，不醉无归。\n湛湛露斯，在彼丰草。厌厌夜饮，在宗载考。\n湛湛露斯，在彼杞棘。显允君子，莫不令德。\n其桐其椅，其实离离。岂弟君子，莫不令仪。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"175","number":175,"title":"彤弓","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彤弓弨兮，受言藏之。我有嘉宾，中心贶之。钟鼓既设，一朝飨之。\n彤弓弨兮，受言载之。我有嘉宾，中心喜之。钟鼓既设，一朝右之。\n彤弓弨兮，受言櫜之。我有嘉宾，中心好之。钟鼓既设，一朝酬之。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"176","number":176,"title":"菁菁者莪","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"菁菁者莪，在彼中阿。既见君子，乐且有仪。\n菁菁者莪，在彼中沚。既见君子，我心则喜。\n菁菁者莪，在彼中陵。既见君子，锡我百朋。\n泛泛杨舟，载沉载浮。既见君子，我心则休。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"177","number":177,"title":"六月","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"六月栖栖，戎车既饬。四牡骙骙，载是常服。玁狁孔炽，我是用急。王于出征，以匡王国。\n比物四骊，闲之维则。维此六月，既成我服。我服既成，于三十里。王于出征，以佐天子。\n四牡修广，其大有颙。薄伐玁狁，以奏肤公。有严有翼，共武之服。共武之服，以定王国。\n玁狁匪茹，整居焦获。侵镐及方，至于泾阳。织文鸟章，白旆央央。元戎十乘，以先启行。\n戎车既安，如轾如轩。四牡既佶，既佶且闲。薄伐玁狁，至于大原。文武吉甫，万邦为宪。\n吉甫燕喜，既多受祉。来归自镐，我行永久。饮御诸友，炰鳖脍鲤。侯谁在矣？张仲孝友。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"178","number":178,"title":"采芑","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"薄言采芑，于彼新田，呈此菑亩。方叔涖止，其车三千。师干之试，方叔率止。\n乘其四骐，四骐翼翼。路车有奭，簟茀鱼服，钩膺鞗革。\n薄言采芑，于彼新田，于此中乡。方叔涖止，其车三千。旂旐央央，方叔率止。\n约軧错衡，八鸾玱玱。服其命服，朱芾斯皇，有玱葱珩。\n鴥彼飞隼，其飞戾天，亦集爰止。方叔涖止，其车三千。师干之试，方叔率止。\n钲人伐鼓，陈师鞠旅。显允方叔，伐鼓渊渊，振旅阗阗。\n蠢尔蛮荆，大邦为仇。方叔元老，克壮其犹。方叔率止，执讯获丑。戎车啴啴，\n啴啴焞焞，如霆如雷。显允方叔，征伐玁狁，蛮荆来威。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"179","number":179,"title":"车攻","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"我车既攻，我马既同。四牡庞庞，驾言徂东。\n田车既好，田牡孔阜。东有甫草，驾言行狩。\n之子于苗，选徒嚣嚣。建旐设旄，搏兽于敖。\n驾彼四牡，四牡奕奕。赤芾金舄，会同有绎。\n决拾既佽，弓矢既调。射夫既同，助我举柴。\n四黄既驾，两骖不猗。不失其驰，舍矢如破。\n萧萧马鸣，悠悠旆旌。徒御不惊，大庖不盈。\n之子于征，有闻无声。允矣君子，展也大成。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"180","number":180,"title":"吉日","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"吉日维戊，既伯既祷。田车既好，四牡孔阜。升彼大阜，从其群丑。\n吉日庚午，既差我马。兽之所同，麀鹿麌麌。漆沮之从，天子之所。\n瞻彼中原，其祁孔有。儦儦俟俟，或群或友。悉率左右，以燕天子。\n既张我弓，既挟我矢。发彼小豝，殪此大兕。以御宾客，且以酌醴。","note":"《诗经·小雅·南有嘉鱼之什》"},{"id":"181","number":181,"title":"鸿雁","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鸿雁于飞，肃肃其羽。之子于征，劬劳于野。爰及矜人，哀此鳏寡。\n鸿雁于飞，集于中泽。之子于垣，百堵皆作。虽则劬劳，其究安宅？\n鸿雁于飞，哀鸣嗷嗷。维此哲人，谓我劬劳。维彼愚人，谓我宣骄。","note":"《诗经·小雅·鸿雁之什》"},{"id":"182","number":182,"title":"庭燎","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"夜如何其？夜未央，庭燎之光。君子至止，鸾声将将。\n夜如何其？夜未艾，庭燎晣晣。君子至止，鸾声哕哕。\n夜如何其？夜乡晨，庭燎有辉。君子至止，言观其旂。","note":"《诗经·小雅·鸿雁之什》"},{"id":"183","number":183,"title":"沔水","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"沔彼流水，朝宗于海。鴥彼飞隼，载飞载止。嗟我兄弟，邦人诸友。莫肯念乱，谁无父母？\n沔彼流水，其流汤汤。鴥彼飞隼，载飞载扬。念彼不迹，载起载行。心之忧矣，不可弭忘。\n鴥彼飞隼，率彼中陵。民之讹言，宁莫之惩？我友敬矣，谗言其兴。","note":"《诗经·小雅·鸿雁之什》"},{"id":"184","number":184,"title":"鹤鸣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鹤鸣于九皋，声闻于野。鱼潜在渊，或在于渚。乐彼之园，爰有树檀，其下维萚。他山之石，可以为错。\n鹤鸣于九皋，声闻于天。鱼在于渚，或潜在渊。乐彼之园，爰有树檀，其下维谷。他山之石，可以攻玉。","note":"《诗经·小雅·鸿雁之什》"},{"id":"185","number":185,"title":"祈父","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"祈父，予王之爪牙。胡转予于恤，靡所止居？\n祈父，予王之爪士。胡转予于恤，靡所厎止？\n祈父，亶不聪。胡转予于恤？有母之尸饔。","note":"《诗经·小雅·鸿雁之什》"},{"id":"186","number":186,"title":"白驹","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"皎皎白驹，食我场苗。絷之维之，以永今朝。所谓伊人，于焉逍遥？\n皎皎白驹，食我场藿。絷之维之，以永今夕。所谓伊人，于焉嘉客？\n皎皎白驹，贲然来思。尔公尔侯，逸豫无期？慎尔优游，勉尔遁思。\n皎皎白驹，在彼空谷。生刍一束，其人如玉。毋金玉尔音，而有遐心。","note":"《诗经·小雅·鸿雁之什》"},{"id":"187","number":187,"title":"黄鸟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"黄鸟黄鸟，无集于穀，无啄我粟。此邦之人，不我肯穀。言旋言归，复我邦族。\n黄鸟黄鸟，无集于桑，无啄我粱。此邦之人，不可与明。言旋言归，复我诸兄。\n黄鸟黄鸟，无集于栩，无啄我黍。此邦之人，不可与处。言旋言归，复我诸父。","note":"《诗经·小雅·鸿雁之什》"},{"id":"188","number":188,"title":"我行其野","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"我行其野，蔽芾其樗。婚姻之故，言就尔居。尔不我畜，复我邦家。\n我行其野，言采其蓫。婚姻之故，言就尔宿。尔不我畜，言归斯复。\n我行其野，言采其葍。不思旧姻，求尔新特。成不以富，亦祗以异。","note":"《诗经·小雅·鸿雁之什》"},{"id":"189","number":189,"title":"斯干","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"秩秩斯干，幽幽南山。如竹苞矣，如松茂矣。兄及弟矣，式相好矣，无相犹矣。\n似续妣祖，筑室百堵，西南其户。爰居爰处，爰笑爰语。\n约之阁阁，椓之橐橐。风雨攸除，鸟鼠攸去，君子攸芋。\n如跂斯翼，如矢斯棘，如鸟斯革，如翚斯飞，君子攸跻。\n殖殖其庭，有觉其楹。哙哙其正，哕哕其冥。君子攸宁。\n下莞上簟，乃安斯寝。乃寝乃兴，乃占我梦。吉梦维何？维熊维罴，维虺维蛇。\n大人占之：维熊维罴，男子之祥；维虺维蛇，女子之祥。\n乃生男子，载寝之床。载衣之裳，载弄之璋。其泣喤喤，朱芾斯皇，室家君王。\n乃生女子，载寝之地。载衣之裼，载弄之瓦。无非无仪，唯酒食是议，无父母诒罹。","note":"《诗经·小雅·鸿雁之什》"},{"id":"190","number":190,"title":"无羊","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"谁谓尔无羊？三百维群。谁谓尔无牛？九十其犉。尔羊来思，其角濈濈。尔牛来思，其耳湿湿。\n或降于阿，或饮于池，或寝或讹。尔牧来思，何蓑何笠，或负其餱。三十维物，尔牲则具。\n尔牧来思，以薪以蒸，以雌以雄。尔羊来思，矜矜兢兢，不骞不崩。麾之以肱，毕来既升。\n牧人乃梦，众维鱼矣，旐维旟矣，大人占之；众维鱼矣，实维丰年；旐维旟矣，室家溱溱。","note":"《诗经·小雅·鸿雁之什》"},{"id":"191","number":191,"title":"节南山","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"节彼南山，维石岩岩。赫赫师尹，民具尔瞻。忧心如惔，不敢戏谈。国既卒斩，何用不监！\n节彼南山，有实其猗。赫赫师尹，不平谓何。天方荐瘥，丧乱弘多。民言无嘉，惨莫惩嗟。\n尹氏大师，维周之氐；秉国之钧，四方是维。天子是毗，俾民不迷。不吊昊天，不宜空我师。\n弗躬弗亲，庶民弗信。弗问弗仕，勿罔君子。式夷式已，无小人殆。琐琐姻亚，则无膴仕。\n昊天不佣，降此鞠訩。昊天不惠，降此大戾。君子如届，俾民心阕。君子如夷，恶怒是违。\n不吊昊天，乱靡有定。式月斯生，俾民不宁。忧心如酲，谁秉国成？不自为政，卒劳百姓。\n驾彼四牡，四牡项领。我瞻四方，蹙蹙靡所骋。\n方茂尔恶，相尔矛矣。既夷既怿，如相酬矣。\n昊天不平，我王不宁。不惩其心，覆怨其正。\n家父作诵，以究王訩。式讹尔心，以畜万邦。","note":"《诗经·小雅·节南山之什》"},{"id":"192","number":192,"title":"正月","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"正月繁霜，我心忧伤。民之讹言，亦孔之将。念我独兮，忧心京京。哀我小心，癙忧以痒。\n父母生我，胡俾我瘉？不自我先，不自我后。好言自口，莠言自口。忧心愈愈，是以有侮。\n忧心惸惸，念我无禄。民之无辜，并其臣仆。哀我人斯，于何从禄？瞻乌爰止？于谁之屋？\n瞻彼中林，侯薪侯蒸。民今方殆，视天梦梦。既克有定，靡人弗胜。有皇上帝，伊谁云憎？\n谓山盖卑，为冈为陵。民之讹言，宁莫之惩。召彼故老，讯之占梦。具曰予圣，谁知乌之雌雄！\n谓天盖高，不敢不局。谓地盖厚，不敢不蹐。维号斯言，有伦有脊。哀今之人，胡为虺蜴？\n瞻彼阪田，有菀其特。天之杌我，如不我克。彼求我则，如不我得。执我仇仇，亦不我力。\n心之忧矣，如或结之。今兹之正，胡然厉矣？燎之方扬，宁或灭之？赫赫宗周，褒姒灭之！\n终其永怀，又窘阴雨。其车既载，乃弃尔辅。载输尔载，将伯助予！\n无弃尔辅，员于尔辐。屡顾尔仆，不输尔载。终逾绝险，曾是不意。\n鱼在于沼，亦匪克乐。潜虽伏矣，亦孔之炤。忧心惨惨，念国之为虐！\n彼有旨酒，又有嘉肴。洽比其邻，婚姻孔云。念我独兮，忧心殷殷。\n佌佌彼有屋，蔌蔌方有谷。民今之无禄，天夭是椓。哿矣富人，哀此惸独。","note":"《诗经·小雅·节南山之什》"},{"id":"193","number":193,"title":"十月之交","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"十月之交，朔月辛卯。日有食之，亦孔之丑。彼月而微，此日而微；今此下民，亦孔之哀。\n日月告凶，不用其行。四国无政，不用其良。彼月而食，则维其常；此日而食，于何不臧。\n烨烨震电，不宁不令。百川沸腾，山冢崒崩。高岸为谷，深谷为陵。哀今之人，胡惨莫惩？\n皇父卿士，番维司徒，家伯维宰，仲允膳夫，棸子内史，蹶维趣马，楀维师氏。醘妻煽方处。\n抑此皇父，岂曰不时？胡为我作，不即我谋？彻我墙屋，田卒污莱。曰予不戕，礼则然矣。\n皇父孔圣，作都于向。择三有事，亶侯多藏。不慭遗一老，俾守我王。择有车马，以居徂向。\n黾勉从事，不敢告劳。无罪无辜，谗口嚣嚣。下民之孽，匪降自天。噂沓背憎，职竞由人。\n悠悠我里，亦孔之痗。四方有羡，我独居忧。民莫不逸，我独不敢休。天命不彻，我不敢效我友自逸。","note":"《诗经·小雅·节南山之什》"},{"id":"194","number":194,"title":"雨无正","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"浩浩昊天，不骏其德。降丧饥馑，斩伐四国。旻天疾威，弗虑弗图。舍彼有罪，既伏其辜。若此无罪，沦胥以铺。\n周宗既灭，靡所止戾。正大夫离居，莫知我勚。三事大夫，莫肯夙夜。邦君诸侯，莫肯朝夕。庶曰式臧，覆出为恶。\n如何昊天，辟言不信。如彼行迈，则靡所臻。凡百君子，各敬尔身。胡不相畏，不畏于天？\n戎成不退，饥成不遂。曾我暬御，惨惨日瘁。凡百君子，莫肯用讯。听言则答，谮言则退。\n哀哉不能言，匪舌是出，维躬是瘁。哿矣能言，巧言如流，俾躬处休！\n维曰予仕，孔棘且殆。云不何使，得罪于天子；亦云可使，怨及朋友。\n谓尔迁于王都。曰予未有室家。鼠思泣血，无言不疾。昔尔出居，谁从作尔室？","note":"《诗经·小雅·节南山之什》"},{"id":"195","number":195,"title":"小旻","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"旻天疾威，敷于下土。谋犹回遹，何日斯沮？谋臧不从，不臧覆用。我视谋犹，亦孔之邛。\n潝潝訿訿，亦孔之哀。谋之其臧，则具是违。谋之不臧，则具是依。我视谋犹，伊于胡厎。\n我龟既厌，不我告犹。谋夫孔多，是用不集。发言盈庭，谁敢执其咎？如匪行迈谋，是用不得于道。\n哀哉为犹，匪先民是程，匪大犹是经。维迩言是听，维迩言是争。如彼筑室于道谋，是用不溃于成。\n国虽靡止，或圣或否。民虽靡膴，或哲或谋，或肃或艾。如彼泉流，无沦胥以败。\n不敢暴虎，不敢冯河。人知其一，莫知其他。战战兢兢，如临深渊，如履薄冰。","note":"《诗经·小雅·节南山之什》"},{"id":"196","number":196,"title":"小宛","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"宛彼鸣鸠，翰飞戾天。我心忧伤，念昔先人。明发不寐，有怀二人。\n人之齐圣，饮酒温克。彼昏不知，一醉日富。各敬尔仪，天命不又。\n中原有菽，庶民采之。螟蛉有子，蜾蠃负之。教诲尔子，式穀似之。\n题彼脊令，载飞载鸣。我日斯迈，而月斯征。夙兴夜寐，毋忝尔所生。\n交交桑扈，率场啄粟。哀我填寡，宜岸宜狱。握粟出卜，自何能穀？\n温温恭人，如集于木。惴惴小心，如临于谷。战战兢兢，如履薄冰。","note":"《诗经·小雅·节南山之什》"},{"id":"197","number":197,"title":"小弁","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"弁彼鸴斯，归飞提提。民莫不穀，我独于罹。何辜于天？我罪伊何？心之忧矣，云如之何？\n踧踧周道，鞫为茂草。我心忧伤，惄焉如捣。假寐永叹，维忧用老。心之忧矣，疢如疾首。\n维桑与梓，必恭敬止。靡瞻匪父，靡依匪母。不属于毛？不罹于里？天之生我，我辰安在？\n菀彼柳斯，鸣蜩嘒嘒，有漼者渊，萑苇淠淠。譬彼舟流，不知所届，心之忧矣，不遑假寐。\n鹿斯之奔，维足伎伎。雉之朝雊，尚求其雌。譬彼坏木，疾用无枝。心之忧矣，宁莫之知？\n相彼投兔，尚或先之。行有死人，尚或墐之。君子秉心，维其忍之。心之忧矣，涕既陨之。\n君子信谗，如或酬之。君子不惠，不舒究之。伐木掎矣，析薪扡矣。舍彼有罪，予之佗矣。\n莫高匪山，莫浚匪泉。君子无易由言，耳属于垣。无逝我梁，无发我笱。我躬不阅，遑恤我后。","note":"《诗经·小雅·节南山之什》"},{"id":"198","number":198,"title":"巧言","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"悠悠昊天，曰父母且。无罪无辜，乱如此幠。昊天已威，予慎无罪。昊天大幠，予慎无辜。\n乱之初生，僭始既涵。乱之又生，君子信谗。君子如怒，乱庶遄沮。君子如祉，乱庶遄已。\n君子屡盟，乱是用长。君子信盗，乱是用暴。盗言孔甘，乱是用餤。匪其止共，维王之邛。\n奕奕寝庙，君子作之。秩秩大猷，圣人莫之。他人有心，予忖度之。跃跃毚兔，遇犬获之。\n荏染柔木，君子树之。往来行言，心焉数之。蛇蛇硕言，出自口矣。巧言如簧，颜之厚矣。\n彼何人斯？居河之麋。无拳无勇，职为乱阶。既微且尰，尔勇伊何？为犹将多，尔居徒几何？","note":"《诗经·小雅·节南山之什》"},{"id":"199","number":199,"title":"何人斯","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彼何人斯？其心孔艰。胡逝我梁，不入我门？伊谁云从？维暴之云。\n二人从行，谁为此祸？胡逝我梁，不入唁我？始者不如今，云不我可\n彼何人斯？胡逝我陈？我闻其声，不见其身。不愧于人？不畏于天？\n彼何人斯？其为飘风。胡不自北？胡不自南？胡逝我梁？絺搅我心。\n尔之安行，亦不遑舍。尔之亟行，遑脂尔车。一者之来，云何其盱。\n尔还而入，我心易也。还而不入，否难知也。一者之来，俾我絺也。\n伯氏吹埙，仲氏吹篪。及尔如贯，谅不我郑出此三物，以诅尔斯。\n为鬼为蜮，则不可得。有靦面目，视人罔极。作此好歌，以极反侧。","note":"《诗经·小雅·节南山之什》"},{"id":"200","number":200,"title":"巷伯","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"萋兮斐兮，成是贝锦。彼谮人者，亦已大甚！\n哆兮侈兮，成是南箕。彼谮人者，谁适与谋。\n缉缉翩翩，谋欲谮人。慎尔言也，谓尔不信。\n捷捷幡幡，谋欲谮言。岂不尔受？既其女迁。\n骄人好好，劳人草草。苍天苍天，视彼骄人，矜此劳人。\n彼谮人者，谁适与谋？取彼谮人，投畀豺虎。豺虎不食，投畀有北。有北不受，投畀有昊！\n杨园之道，猗于亩丘。寺人孟子，作为此诗。凡百君子，敬而听之。","note":"《诗经·小雅·节南山之什》"},{"id":"201","number":201,"title":"谷风","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"习习谷风，维风及雨。将恐将惧，维予与女。将安将乐，女转弃予。\n习习谷风，维风及颓。将恐将惧，置予于怀。将安将乐，弃予如遗。\n习习谷风，维山崔嵬。无草不死，无木不萎。忘我大德，思我小怨。","note":"《诗经·小雅·谷风之什》"},{"id":"202","number":202,"title":"蓼莪","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蓼蓼者莪，匪莪伊蒿。哀哀父母，生我劬劳。\n蓼蓼者莪，匪莪伊蔚。哀哀父母，生我劳瘁。\n瓶之罄矣，维罍之耻。鲜民之生，不如死之久矣。无父何怙？无母何恃？出则衔恤，入则靡至。\n父兮生我，母兮鞠我。抚我畜我，长我育我，顾我复我，出入腹我。欲报之德。昊天罔极！\n南山烈烈，飘风发发。民莫不穀，我独何害！南山律律，飘风弗弗。民莫不穀，我独不卒！","note":"《诗经·小雅·谷风之什》"},{"id":"203","number":203,"title":"大东","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有饛簋飧，有捄棘匕。周道如砥，其直如矢。君子所履，小人所视。眷言顾之，潸焉出涕。\n小东大东，杼柚其空。纠纠葛屦，可以履霜。佻佻公子，行彼周行。既往既来，使我心疚。\n有冽氿泉，无浸获薪。契契寤叹，哀我惮人。薪是获薪，尚可载也。哀我惮人，亦可息也。\n东人之子，职劳不来。西人之子，粲粲衣服。舟人之子，熊罴是裘。私人之子，百僚是试。\n或以其酒，不以其浆。鞙鞙佩璲，不以其长。维天有汉，监亦有光。跂彼织女，终日七襄。\n虽则七襄，不成报章。睆彼牵牛，不以服箱。东有启明，西有长庚。有捄天毕，载施之行。\n维南有箕，不可以簸扬。维北有斗，不可以挹酒浆。维南有箕，载翕其舌。维北有斗，西柄之揭。","note":"《诗经·小雅·谷风之什》"},{"id":"204","number":204,"title":"四月","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"四月维夏，六月徂署。先祖匪人，胡宁忍予？\n秋日凄凄，百卉具腓。乱离瘼矣，爰其适归？\n冬日烈烈，飘风发发。民莫不穀，我独何害？\n山有嘉卉，侯栗侯梅。废为残贼，莫知其尤！\n相彼泉水，载清载浊。我日构祸，曷云能穀？\n滔滔江汉，南国之纪。尽瘁以仕，宁莫我有？\n匪鹑匪鸢，翰飞戾天。匪鳣匪鲔，潜逃于渊。\n山有蕨薇，隰有杞桋。君子作歌，维以告哀。","note":"《诗经·小雅·谷风之什》"},{"id":"205","number":205,"title":"北山","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"陟彼北山，言采其杞。偕偕士子，朝夕从事。王事靡盬，忧我父母。\n溥天之下，莫非王土；率土之滨，莫非王臣。大夫不均，我从事独贤。\n四牡彭彭，王事傍傍。嘉我未老，鲜我方将。旅力方刚，经营四方。\n或燕燕居息，或尽瘁事国；或息偃在床，或不已于行。\n或不知叫号，或惨惨劬劳；或栖迟偃仰，或王事鞅掌。\n或湛乐饮酒，或惨惨畏咎；或出入风议，或靡事不为。","note":"《诗经·小雅·谷风之什》"},{"id":"206","number":206,"title":"无将大车","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"无将大车，祇自尘兮。无思百忧，祇自疧兮。\n无将大车，维尘冥冥。无思百忧，不出于颎。\n无将大车，维尘雍兮。无思百忧，祇自重兮。","note":"《诗经·小雅·谷风之什》"},{"id":"207","number":207,"title":"小明","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"明明上天，照临下土。我征徂西，至于艽野。二月初吉，载离寒暑。\n心之忧矣，其毒大苦。念彼共人，涕零如雨。岂不怀归？畏此罪罟！\n昔我往矣，日月方除。曷云其还？岁聿云莫。念我独兮，我事孔庶。\n心之忧矣，惮我不暇。念彼共人，眷眷怀顾！岂不怀归？畏此谴怒。\n昔我往矣，日月方奥。曷云其还？政事愈蹙。岁聿云莫，采萧获菽。\n心之忧矣，自诒伊戚。念彼共人，兴言出宿。岂不怀归？畏此反覆。\n嗟尔君子，无恒安处。靖共尔位，正直是与。神之听之，式穀以女。\n嗟尔君子，无恒安息。靖共尔位，好是正直。神之听之，介尔景福。","note":"《诗经·小雅·谷风之什》"},{"id":"208","number":208,"title":"鼓钟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鼓钟将将，淮水汤汤，忧心且伤。淑人君子，怀允不忘。\n鼓钟喈喈，淮水湝湝，忧心且悲。淑人君子，其德不回。\n鼓钟伐鼛，淮有三洲，忧心且妯。淑人君子，其德不犹。\n鼓钟钦钦，鼓瑟鼓琴，笙磬同音。以雅以南，以龠不僭。","note":"《诗经·小雅·谷风之什》"},{"id":"209","number":209,"title":"楚茨","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"楚楚者茨，言抽其棘，自昔何为？我蓺黍稷。我黍与与，我稷翼翼。\n我仓既盈，我庾维亿。以为酒食，以享以祀，以妥以侑，以介景福。\n济济跄跄，絜尔牛羊，以往烝尝。或剥或亨，或四或将。祝祭于祊，\n祀事孔明。先祖是皇，神保是飨。孝孙有庆，报以介福，万寿无疆！\n执爨踖踖，为俎孔硕，或燔或炙。君妇莫莫，为豆孔庶。为宾为客，\n献酬交错。礼仪卒度，笑语卒获。神保是格，报以介福，万寿攸酢！\n我孔戁矣，式礼莫愆。工祝致告，徂赉孝孙。苾芬孝祀，神嗜饮食。\n卜尔百福，如几如式。既齐既稷，既匡既敕。永锡尔极，时万时亿！\n礼仪既备，钟鼓既戒，孝孙徂位，工祝致告，神具醉止，皇尸载起。\n鼓钟送尸，神保聿归。诸宰君妇，废彻不迟。诸父兄弟，备言燕私。\n乐具入奏，以绥后禄。尔肴既将，莫怨具庆。既醉既饱，小大稽首。\n神嗜饮食，使君寿考。孔惠孔时，维其尽之。子子孙孙，勿替引之！","note":"《诗经·小雅·谷风之什》"},{"id":"210","number":210,"title":"信南山","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"信彼南山，维禹甸之。畇畇原隰，曾孙田之。我疆我理，南东其亩。\n上天同云。雨雪雰雰，益之以霡霂。既优既渥，既沾既足。生我百谷。\n疆埸翼翼，黍稷彧彧。曾孙之穑，以为酒食。畀我尸宾，寿考万年。\n中田有庐，疆埸有瓜。是剥是菹，献之皇祖。曾孙寿考，受天之祜。\n祭以清酒，从以骍牡，享于祖考。执其鸾刀，以启其毛，取其血膋。\n是烝是享，苾苾芬芬。祀事孔明，先祖是皇。报以介福。万寿无疆。","note":"《诗经·小雅·谷风之什》"},{"id":"211","number":211,"title":"甫田","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"倬彼甫田，岁取十千。我取其陈，食我农人。自古有年。\n今适南亩，或耘或耔。黍稷薿薿，攸介攸止，烝我髦士。\n以我齐明，与我牺羊，以社以方。我田既臧，农夫之庆。\n琴瑟击鼓，以御田祖。以祈甘雨，以介我稷黍，以穀我士女。\n曾孙来止，以其妇子。馌彼南亩，田畯至喜。攘其左右，\n尝其旨否。禾易长亩，终善且有。曾孙不怒，农夫克敏。\n曾孙之稼，如茨如梁。曾孙之庾，如坻如京。乃求千斯仓，\n乃求万斯箱。黍稷稻粱，农夫之庆。报以介福，万寿无疆。","note":"《诗经·小雅·甫田之什》"},{"id":"212","number":212,"title":"大田","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"大田多稼，既种既戒，既备乃事。以我覃耜，俶载南亩。\n播厥百谷，既庭且硕，曾孙是若。\n既方既皂，既坚既好，不稂不莠。去其螟螣，及其蟊贼，\n无害我田稚。田祖有神，秉畀炎火。\n有渰萋萋，兴雨祈祈。雨我公田，遂及我私。彼有不获稚，\n此有不敛穧，彼有遗秉，此有滞穗，伊寡妇之利。\n曾孙来止，以其妇子。馌彼南亩，田畯至喜。来方禋祀，\n以其骍黑，与其黍稷。以享以祀，以介景福。","note":"《诗经·小雅·甫田之什》"},{"id":"213","number":213,"title":"瞻彼洛矣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"瞻彼洛矣，维水泱泱。君子至止，福禄如茨。韎韐有奭，以作六师。\n瞻彼洛矣，维水泱泱。君子至止，鞸琫有珌。君子万年，保其家室。\n瞻彼洛矣，维水泱泱。君子至止，福禄既同。君子万年，保其家邦。","note":"《诗经·小雅·甫田之什》"},{"id":"214","number":214,"title":"裳裳者华","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"裳裳者华，其叶湑兮。我觏之子，我心写兮。我心写兮，是以有誉处兮。\n裳裳者华，芸其黄矣。我觏之子，维其有章矣。维其有章矣，是以有庆矣。\n裳裳者华，或黄或白。我觏之子，乘其四骆。乘其四骆，六辔沃若。\n左之左之，君子宜之。右之右之，君子有之。维其有之，是以似之。","note":"《诗经·小雅·甫田之什》"},{"id":"215","number":215,"title":"桑扈","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"交交桑扈，有莺其羽。君子乐胥，受天之祜。\n交交桑扈，有莺其领。君子乐胥，万邦之屏。\n之屏之翰，百辟为宪。不戢不难，受福不那。\n兕觥其觩，旨酒思柔。彼交匪敖，万福来求。","note":"《诗经·小雅·甫田之什》"},{"id":"216","number":216,"title":"鸳鸯","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鸳鸯于飞，毕之罗之。君子万年，福禄宜之。\n鸳鸯在梁，戢其左翼。君子万年，\n宜其遐福。乘马在厩，摧之秣之。君子万年，福禄艾之。\n乘马在厩，秣之摧之。君子万年，福禄绥之。","note":"《诗经·小雅·甫田之什》"},{"id":"217","number":217,"title":"頍弁","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有頍者弁，实维伊何？尔酒既旨，尔肴既嘉。岂伊异人？兄弟匪他。\n茑与女萝，施于松柏。未见君子，忧心奕奕；既见君子，庶几说怿。\n有頍者弁，实维何期？尔酒既旨，尔肴既时。岂伊异人？兄弟具来。\n茑与女萝，施于松上。未见君子，忧心怲怲；既见君子，庶几有臧。\n有頍者弁，实维在首。尔酒既旨，尔肴既阜。岂伊异人？兄弟甥舅。\n如彼雨雪，先集维霰。死丧无日，无几相见。乐酒今夕，君子维宴。","note":"《诗经·小雅·甫田之什》"},{"id":"218","number":218,"title":"车舝","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"间关车之舝兮，思娈季女逝兮。匪饥匪渴，德音来括。虽无好友？式燕且喜。\n依彼平林，有集维鷮。辰彼硕女，令德来教。式燕且誉，好尔无射。\n虽无旨酒？式饮庶几。虽无嘉肴？式食庶几。虽无德与女？式歌且舞？\n陟彼高冈，析其柞薪。析其柞薪，其叶湑兮。鲜我觏尔，我心写兮。\n高山仰止，景行行止。四牡騑騑，六辔如琴。觏尔新婚，以慰我心。","note":"《诗经·小雅·甫田之什》"},{"id":"219","number":219,"title":"青蝇","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"营营青蝇，止于樊。岂弟君子，无信谗言。\n营营青蝇，止于棘。谗人罔极，交乱四国。\n营营青蝇，止于榛。谗人罔极，构我二人。","note":"《诗经·小雅·甫田之什》"},{"id":"220","number":220,"title":"宾之初筵","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"宾之初筵，左右秩秩。笾豆有楚，殽核维旅。酒既和旨，饮酒孔偕。\n钟鼓既设，举酬逸逸。大侯既抗，弓矢斯张。射夫既同，献尔发功。\n发彼有的，以祈尔爵。\n籥舞笙鼓，乐既和奏。烝衎烈祖，以洽百礼。百礼既至，有壬有林。\n锡尔纯嘏，子孙其湛。其湛曰乐，各奏尔能。宾载手仇，室人入又。\n酌彼康爵，以奏尔时。\n宾之初筵，温温其恭。其未醉止，威仪反反。曰既醉止，威仪幡幡。\n舍其坐迁，屡舞仙仙。其未醉止，威仪抑抑。曰既醉止，威仪抑抑。\n是曰既醉，不知其秩。\n宾既醉止，载号载呶。乱我笾豆，屡舞僛僛。是曰既醉，不知其邮。\n侧弁之俄，屡舞傞傞。既醉而出，并受其福。醉而不出，是谓伐德。\n饮酒孔嘉，维其令仪。\n凡此饮酒，或醉或否。既立之监，或佐之史。彼醉不臧，不醉反耻。\n式勿从谓，无俾大怠。匪言勿言，匪由勿语。由醉之言，俾出童羖。\n三爵不识，矧敢多又。","note":"《诗经·小雅·甫田之什》"},{"id":"221","number":221,"title":"鱼藻","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鱼在在藻，有颁其首。王在在镐，岂乐饮酒。\n鱼在在藻，有莘其尾。王在在镐，饮酒乐岂。\n鱼在在藻，依于其蒲。王在在镐，有那其居。","note":"《诗经·小雅·鱼藻之什》"},{"id":"222","number":222,"title":"采菽","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"采菽采菽，筐之莒之。君子来朝，何锡予之？虽无予之？路车乘马。又何予之？玄衮及黼。\n觱沸槛泉，言采其芹。君子来朝，言观其旂。其旂淠淠，鸾声嘒嘒。载骖载驷，君子所届。\n赤芾在股，邪幅在下。彼交匪纾，天子所予。乐只君子，天子命之。乐只君子，福禄申之。\n维柞之枝，其叶蓬蓬。乐只君子，殿天子之邦。乐只君子，万福攸同。平平左右，亦是率从。\n汎汎杨舟，绋纚维之。乐只君子，天子葵之。乐只君子，福禄膍之。优哉游哉，亦是戾矣。","note":"《诗经·小雅·鱼藻之什》"},{"id":"223","number":223,"title":"角弓","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"骍骍角弓，翩其反矣。兄弟婚姻，无胥远矣。\n尔之远矣，民胥然矣。尔之教矣，民胥效矣。\n此令兄弟，绰绰有裕。不令兄弟，交相为愈。\n民之无良，相怨一方。受爵不让，至于已斯亡。\n老马反为驹，不顾其后。如食宜饇，如酌孔取。\n毋教猱升木，如涂涂附。君子有徽猷，小人与属。\n雨雪瀌瀌，见晛曰消。莫肯下遗，式居娄骄。\n雨雪浮浮，见晛曰流。如蛮如髦，我是用忧。","note":"《诗经·小雅·鱼藻之什》"},{"id":"224","number":224,"title":"菀柳","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有菀者柳，不尚息焉。上帝甚蹈，无自暱焉。俾予靖之，后予极焉。\n有菀者柳，不尚愒焉。上帝甚蹈，无自瘵焉。俾予靖之，后予迈焉。\n有鸟高飞，亦傅于天。彼人之心，于何其臻。曷予靖之，居以凶矜。","note":"《诗经·小雅·鱼藻之什》"},{"id":"225","number":225,"title":"都人士","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彼都人士，狐裘黄黄。其容不改，出言有章。行归于周，万民所望。\n彼都人士，台笠缁撮。彼君子女，绸直如发。我不见兮，我心不说。\n彼都人士，充耳琇实。彼君子女，谓之尹吉。我不见兮，我心苑结。\n彼都人士，垂带而厉。彼君子女，卷发如虿。我不见兮，言从之迈。\n匪伊垂之，带则有余。匪伊卷之，发则有旟。我不见兮，云何盱矣。","note":"《诗经·小雅·鱼藻之什》"},{"id":"226","number":226,"title":"采绿","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"终朝采绿，不盈一匊。予发曲局，薄言归沐。\n终朝采蓝，不盈一襜。五日为期，六日不詹。\n之子于狩，言韔其弓。之子于钓，言纶之绳。\n其钓维何？维鲂及鱮。维鲂及鱮，薄言观者。","note":"《诗经·小雅·鱼藻之什》"},{"id":"227","number":227,"title":"黍苗","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"芃芃黍苗，阴雨膏之。悠悠南行，召伯劳之。\n我任我辇，我车我牛。我行既集，盖云归哉。\n我徒我御，我师我旅。我行既集，盖云归处。\n肃肃谢功，召伯营之。烈烈征师，召伯成之。\n原隰既平，泉流既清。召伯有成，王心则宁。","note":"《诗经·小雅·鱼藻之什》"},{"id":"228","number":228,"title":"隰桑","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"隰桑有阿，其叶有难。既见君子，其乐如何。\n隰桑有阿，其叶有沃。既见君子，云何不乐。\n隰桑有阿，其叶有幽。既见君子，德音孔胶。\n心乎爱矣，遐不谓矣？中心藏之，何日忘之！","note":"《诗经·小雅·鱼藻之什》"},{"id":"229","number":229,"title":"白华","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"白华菅兮，白茅束兮。之子之远，俾我独兮。\n英英白云，露彼菅茅。天步艰难，之子不犹。\n滮池北流，浸彼稻田。啸歌伤怀，念彼硕人。\n樵彼桑薪，卬烘于煁。维彼硕人，实劳我心。\n鼓钟于宫，声闻于外。念子懆懆，视我迈迈。\n有鹙在梁，有鹤在林。维彼硕人，实劳我心。\n鸳鸯在梁，戢其左翼。之子无良，二三其德。\n有扁斯石，履之卑兮。之子之远，俾我疧兮。","note":"《诗经·小雅·鱼藻之什》"},{"id":"230","number":230,"title":"绵蛮","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绵蛮黄鸟，止于丘阿。道之云远，我劳如何。饮之食之，教之诲之。命彼后车，谓之载之。\n绵蛮黄鸟，止于丘隅。岂敢惮行，畏不能趋。饮之食之。教之诲之。命彼后车，谓之载之。\n绵蛮黄鸟，止于丘侧。岂敢惮行，畏不能极。饮之食之，教之诲之。命彼后车，谓之载之。","note":"《诗经·小雅·鱼藻之什》"},{"id":"231","number":231,"title":"瓠叶","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"幡幡瓠叶，采之亨之。君子有酒，酌言尝之。\n有兔斯首，炮之燔之。君子有酒，酌言献之。\n有兔斯首，燔之炙之。君子有酒，酌言酢之。\n有兔斯首，燔之炮之。君子有酒，酌言酬之。","note":"《诗经·小雅·鱼藻之什》"},{"id":"232","number":232,"title":"渐渐之石","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"渐渐之石，维其高矣。山川悠远，维其劳矣。武人东征，不遑朝矣。\n渐渐之石，维其卒矣。山川悠远，曷其没矣？武人东征，不遑出矣。\n有豕白蹢，烝涉波矣。月离于毕，俾滂沱矣。武人东征，不皇他矣。","note":"《诗经·小雅·鱼藻之什》"},{"id":"233","number":233,"title":"苕之华","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"苕之华，芸其黄矣。心之忧矣，维其伤矣！\n苕之华，其叶青青。知我如此，不如无生！\n牂羊坟首，三星在罶。人可以食，鲜可以饱！","note":"《诗经·小雅·鱼藻之什》"},{"id":"234","number":234,"title":"何草不黄","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"何草不黄？何日不行？何人不将？经营四方。\n何草不玄？何人不矜？哀我征夫，独为匪民。\n匪兕匪虎，率彼旷野。哀我征夫，朝夕不暇。\n有芃者狐，率彼幽草。有栈之车，行彼周道。","note":"《诗经·小雅·鱼藻之什》"},{"id":"235","number":235,"title":"文王","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"文王在上，于昭于天。周虽旧邦，其命维新。有周不显，帝命不时。文王陟降，在帝左右。\n亹亹文王，令闻不已。陈锡哉周，侯文王孙子。文王孙子，本支百世，凡周之士，不显亦世。\n世之不显，厥犹翼翼。思皇多士，生此王国。王国克生，维周之桢；济济多士，文王以宁。\n穆穆文王，于缉熙敬止。假哉天命。有商孙子。商之孙子，其丽不亿。上帝既命，侯于周服。\n侯服于周，天命靡常。殷士肤敏。裸将于京。厥作裸将，常服黼冔。王之荩臣。无念尔祖。\n无念尔祖，聿修厥德。永言配命，自求多福。殷之未丧师，克配上帝。宜鉴于殷，骏命不易！\n命之不易，无遏尔躬。宣昭义问，有虞殷自天。上天之载，无声无臭。仪刑文王，万邦作孚。","note":"《诗经·大雅·文王之什》"},{"id":"236","number":236,"title":"大明","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"明明在下，赫赫在上。天难忱斯，不易维王。天位殷适，使不挟四方。\n挚仲氏任，自彼殷商，来嫁于周，曰嫔于京。乃及王季，维德之行。\n大任有身，生此文王。维此文王，小心翼翼。昭事上帝，聿怀多福。厥德不回，以受方国。\n天监在下，有命既集。文王初载，天作之合。在洽之阳，在渭之涘。\n文王嘉止，大邦有子。大邦有子，伣天之妹。文定厥祥，亲迎于渭。造舟为梁，不显其光。\n有命自天，命此文王。于周于京，缵女维莘。长子维行，笃生武王。保右命尔，燮伐大商。\n殷商之旅，其会如林。矢于牧野，维予侯兴。上帝临女，无二尔心。\n牧野洋洋，檀车煌煌，驷騵彭彭。维师尚父，时维鹰扬。凉彼武王，四伐大商，会朝清明。","note":"《诗经·大雅·文王之什》"},{"id":"237","number":237,"title":"绵","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绵绵瓜瓞。民之初生，自土沮漆。古公亶父，陶复陶冗，未有家室。\n古公亶父，来朝走马。率西水浒，至于岐下。爰及姜女，聿来胥宇。\n周原膴膴，堇荼如饴。爰始爰谋，爰契我龟，曰止曰时，筑室于兹。\n乃慰乃止，乃左乃右，乃疆乃理，乃宣乃亩。自西徂东，周爰执事。\n乃召司空，乃召司徒，俾立室家。其绳则直，缩版以载，作庙翼翼。\n捄之陾陾，度之薨薨，筑之登登，削屡冯冯。百堵皆兴，鼛鼓弗胜。\n乃立皋门，皋门有伉。乃立应门，应门将将。乃立冢土，戎丑攸行。\n四不殄厥愠，亦不陨厥问。柞棫拔矣，行道兑矣。混夷駾矣，维其喙矣！\n虞芮质厥成，文王蹶厥生。予曰有疏附，予曰有先后。予曰有奔奏，予曰有御侮！","note":"《诗经·大雅·文王之什》"},{"id":"238","number":238,"title":"棫朴","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"芃芃棫朴，薪之槱之。济济辟王，左右趣之。\n济济辟王，左右奉璋。奉璋峨峨，髦士攸宜。\n淠彼泾舟，烝徒楫之。周王于迈，六师及之。\n倬彼云汉，为章于天。周王寿考，遐不作人？\n追琢其章，金玉其相。勉勉我王，纲纪四方。","note":"《诗经·大雅·文王之什》"},{"id":"239","number":239,"title":"旱麓","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"瞻彼旱麓，榛楛济济。岂弟君子，干禄岂弟。\n瑟彼玉瓒，黄流在中。岂弟君子，福禄攸降。\n鸢飞戾天，鱼跃于渊。岂弟君子，遐不作人？\n清酒既载，骍牡既备。以享以祀，以介景福。\n瑟彼柞棫，民所燎矣。岂弟君子，神所劳矣。\n莫莫葛藟，施于条枚。岂弟君子，求福不回。","note":"《诗经·大雅·文王之什》"},{"id":"240","number":240,"title":"思齐","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"思齐大任，文王之母，思媚周姜，京室之妇。大姒嗣徽音，则百斯男。\n惠于宗公，神罔时怨，神罔时恫。刑于寡妻，至于兄弟，以御于家邦。\n雍雍在宫，肃肃在庙。不显亦临，无射亦保。\n四戎疾不殄，烈假不瑕。不闻亦式，不谏亦入。四成人有德，小子有造。古之人无斁，誉髦斯士。","note":"《诗经·大雅·文王之什》"},{"id":"241","number":241,"title":"皇矣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"皇矣上帝，临下有赫。监观四方，求民之莫。维此二国，其政不获。\n维彼四国，爰究爰度。上帝耆之，憎其式廓。乃眷西顾，此维与宅。\n作之屏之，其菑其翳。修之平之，其灌其栵。启之辟之，其柽其椐。\n攘之剔之，其檿其柘。帝迁明德，串夷载路。天立厥配，受命既固。\n帝省其山，柞棫斯拔，松柏斯兑。帝作邦作对，自大伯王季。维此王季，\n因心则友。则友其兄，则笃其庆，载锡之光。受禄无丧，奄有四方。\n维此王季，帝度其心。貊其德音，其德克明。克明克类，克长克君。\n王此大邦，克顺克比。比于文王，其德靡悔。既受帝祉，施于孙子。\n帝谓文王：无然畔援，无然歆羡，诞先登于岸。密人不恭，敢距大邦，\n侵阮徂共。王赫斯怒，爰整其旅，以按徂旅。以笃于周祜，以对于天下。\n依其在京，侵自阮疆。陟我高冈，无矢我陵。我陵我阿，无饮我泉，\n我泉我池。度其鲜原，居岐之阳，在渭之将。万邦之方，下民之王。\n帝谓文王：予怀明德，不大声以色，不长夏以革。不识不知，顺帝之则。\n帝谓文王：訽尔仇方，同尔弟兄。以尔钩援，与尔临冲，以伐崇墉。\n临冲闲闲，崇墉言言。执讯连连，攸馘安安。是类是禡，是致是附，\n四方以无侮。临冲茀茀，崇墉仡仡。是伐是四，是绝是忽。四方以无拂。","note":"《诗经·大雅·文王之什》"},{"id":"242","number":242,"title":"灵台","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"经始灵台，经之营之。庶民攻之，不日成之。经始勿亟，庶民子来。\n王在灵囿，麀鹿攸伏。麀鹿濯濯，白鸟翯翯。王在灵沼，于牣鱼跃。\n虡业维枞，贲鼓维镛。于论鼓钟，于乐辟雍。\n于论鼓钟，于乐辟雍。鼍鼓逢逢。矇瞍奏公。","note":"《诗经·大雅·文王之什》"},{"id":"243","number":243,"title":"下武","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"下武维周，世有哲王。三后在天，王配于京。\n王配于京，世德作求。永言配命，成王之孚。\n成王之孚，下土之式。永言孝思，孝思维则。\n媚兹一人，应侯顺德。永言孝思，昭哉嗣服。\n昭兹来许，绳其祖武。于万斯年，受天之祜。\n受天之祜，四方来贺。于万斯年，不遐有佐。","note":"《诗经·大雅·文王之什》"},{"id":"244","number":244,"title":"文王有声","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"文王有声，遹骏有声。遹求厥宁，遹观厥成。文王烝哉！\n文王受命，有此武功。既伐于崇，作邑于丰。文王烝哉！\n筑城伊淢，作丰伊匹。匪棘其欲，遹追来孝。王后烝哉！\n王公伊濯，维丰之垣。四方攸同，王后维翰。王后烝哉！\n丰水东注，维禹之绩。四方攸同，皇王维辟。皇王烝哉！\n镐京辟雍，自西自东，自南自北，无思不服。皇王烝哉！\n考卜维王，宅是镐京。维龟正之，武王成之。武王烝哉！\n丰水有芑，武王岂不仕？诒厥孙谋，以燕翼子。武王烝哉！","note":"《诗经·大雅·文王之什》"},{"id":"245","number":245,"title":"生民","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"厥初生民，时维姜嫄。生民如何？克禋克祀，以弗无子。\n履帝武敏歆，攸介攸止，载震载夙。载生载育，时维后稷。\n诞弥厥月，先生如达。不拆不副，无菑无害。以赫厥灵。\n上帝不宁，不康禋祀，居然生子。\n诞寘之隘巷，牛羊腓字之。诞寘之平林，会伐平林。\n诞寘之寒冰，鸟覆翼之。鸟乃去矣，后稷呱矣。\n实覃实訏，厥声载路。诞实匍匐，克岐克嶷。以就口食。\n蓺之荏菽，荏菽旆旆。禾役穟穟，麻麦幪幪，瓜瓞唪唪。\n诞后稷之穑，有相之道。茀厥丰草，种之黄茂。实方实苞，实种实褎。\n实发实秀，实坚实好。实颖实栗，即有邰家室。\n诞降嘉种，维秬维秠，维穈维芑。恒之秬秠，是获是亩。\n恒之穈芑，是任是负。以归肇祀。\n诞我祀如何？或舂或揄，或簸或蹂。释之叟叟，烝之浮浮。\n载谋载惟。取萧祭脂，取羝以軷，载燔载烈，以兴嗣岁。\n卬盛于豆，于豆于登。其香始升，上帝居歆。胡臭亶时。\n后稷肇祀。庶无罪悔，以迄于今。","note":"《诗经·大雅·生民之什》"},{"id":"246","number":246,"title":"行苇","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"敦彼行苇，牛羊勿践履。方苞方体，维叶泥泥。\n戚戚兄弟，莫远具尔。或四之筵，或授之几。\n四筵设席，授几有缉御。或献或酢，洗爵奠斝。\n醓醢以荐，或燔或炙。嘉肴脾臄，或歌或咢。\n敦弓既坚，四鍭既均，舍矢既均，序宾以贤。\n敦弓既句，既挟四鍭。四鍭如树，序宾以不侮。\n曾孙维主，酒醴维醽，酌以大斗，以祈黄耇。\n黄耇台背，以引以翼。寿考维祺，以介景福。","note":"《诗经·大雅·生民之什》"},{"id":"247","number":247,"title":"既醉","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"既醉以酒，既饱以德。君子万年，介尔景福。\n既醉以酒，尔肴既将。君子万年，介尔昭明。\n昭明有融，高朗令终，令终有俶。公尸嘉告。\n其告维何？笾豆静嘉。朋友攸摄，摄以威仪。\n威仪孔时，君子有孝子。孝子不匮，永锡尔类。\n其类维何？室家之壶。君子万年，永锡祚胤。\n其胤维何？天被尔禄。君子万年，景命有仆。\n其仆维何？厘尔女士。厘尔女士，从以孙子。","note":"《诗经·大雅·生民之什》"},{"id":"248","number":248,"title":"凫鹥","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"凫鹥在泾，公尸在燕来宁。尔酒既清，尔肴既馨。公尸燕饮，福禄来成。\n凫鹥在沙，公尸来燕来宜。尔酒既多，尔肴既嘉。公尸燕饮，福禄来为。\n凫鹥在渚，公尸来燕来处。尔酒既湑，尔肴伊脯。公尸燕饮，福禄来下。\n凫鹥在潀，公尸来燕来宗，既燕于宗，福禄攸降。公尸燕饮，福禄来崇。\n凫鹥在亹，公尸来止熏熏。旨酒欣欣，燔炙芬芬。公尸燕饮，无有后艰。","note":"《诗经·大雅·生民之什》"},{"id":"249","number":249,"title":"假乐","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"假乐君子，显显令德，宜民宜人。受禄于天，保右命之，自天申之。\n千禄百福，子孙千亿。穆穆皇皇，宜君宜王。不愆不忘，率由旧章。\n威仪抑抑，德音秩秩。无怨无恶，率由群匹。受福无疆，四方之纲。\n之纲之纪，燕及朋友。百辟卿士，媚于天子。不解于位，民之攸塈。","note":"《诗经·大雅·生民之什》"},{"id":"250","number":250,"title":"公刘","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"笃公刘，匪居匪康。乃埸乃疆，乃积乃仓；乃裹餱粮，于橐于囊。\n思辑用光，弓矢斯张；干戈戚扬，爰方启行。\n笃公刘，于胥斯原。既庶既繁，既顺乃宣，而无永叹。陟则在巘，\n复降在原。何以舟之？维玉及瑶，鞞琫容刀。\n笃公刘，逝彼百泉。瞻彼溥原，乃陟南冈。乃觏于京，京师之野。\n于时处处，于时庐旅，于时言言，于时语语。\n笃公刘，于京斯依。跄跄济济，俾筵俾几。既登乃依，乃造其曹。\n执豕于牢，酌之用匏。食之饮之，君之宗之。\n笃公刘，既溥既长。既景乃冈，相其阴阳，观其流泉。其军三单，\n度其隰原。彻田为粮，度其夕阳。豳居允荒。\n笃公刘，于豳斯馆。涉渭为乱，取厉取锻，止基乃理。爰众爰有，\n夹其皇涧。溯其过涧。止旅乃密，芮鞫之即。","note":"《诗经·大雅·生民之什》"},{"id":"251","number":251,"title":"泂酌","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"泂酌彼行潦，挹彼注兹，可以餴饎。岂弟君子，民之父母。\n泂酌彼行潦，挹彼注兹，可以濯罍。岂弟君子，民之攸归。\n泂酌彼行潦，挹彼注兹，可以濯溉。岂弟君子，民之攸墍。","note":"《诗经·大雅·生民之什》"},{"id":"252","number":252,"title":"卷阿","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有卷者阿，飘风自南。岂弟君子，来游来歌，以矢其音。\n伴奂尔游矣，优游尔休矣。岂弟君子，俾尔弥尔性，似先公酋矣。\n尔土宇昄章，亦孔之厚矣。岂弟君子，俾尔弥尔性，百神尔主矣。\n尔受命长矣，茀禄尔康矣。岂弟君子，俾尔弥尔性，纯嘏尔常矣。\n有冯有翼，有孝有德，以引以翼。岂弟君子，四方为则。\n颙颙卬卬，如圭如璋，令闻令望。岂弟君子，四方为纲。\n凤凰于飞，翙翙其羽，亦集爰止。蔼蔼王多吉士，维君子使，媚于天子。\n凤凰于飞，翙翙其羽，亦傅于天。蔼蔼王多吉人，维君子命，媚于庶人。\n凤凰鸣矣，于彼高冈。梧桐生矣，于彼朝阳。菶菶萋萋，雍雍喈喈。\n君子之车，既庶且多。君子之马，既闲且驰。矢诗不多，维以遂歌。","note":"《诗经·大雅·生民之什》"},{"id":"253","number":253,"title":"民劳","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"民亦劳止，汔可小康。惠此中国，以绥四方。无纵诡随，以谨无良。\n式遏寇虐，憯不畏明。柔远能迩，以定我王。\n民亦劳止，汔可小休。惠此中国，以为民逑。无纵诡随，以谨惛怓。\n式遏寇虐，无俾民忧。无弃尔劳，以为王休。\n民亦劳止，汔可小息。惠此京师，以绥四国。无纵诡随，以谨罔极。\n式遏寇虐，无俾作慝。敬慎威仪，以近有德。\n民亦劳止，汔可小愒。惠此中国，俾民忧泄。无纵诡随，以谨丑厉。\n式遏寇虐，无俾正败。戎虽小子，而式弘大。\n民亦劳止，汔可小安。惠此中国，国无有残。无纵诡随，以谨缱绻。\n式遏寇虐，无俾正反。王欲玉女，是用大谏。","note":"《诗经·大雅·生民之什》"},{"id":"254","number":254,"title":"板","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"上帝板板，下民卒瘅。出话不然，为犹不远。\n靡圣管管。不实于亶。犹之未远，是用大谏。\n天之方难，无然宪宪。天之方蹶，无然泄泄。\n辞之辑矣，民之洽矣。辞之怿矣，民之莫矣。\n我虽异事，及尔同僚。我即尔谋，听我嚣嚣。\n我言维服，勿以为笑。先民有言，询于刍荛。\n天之方虐，无然谑谑。老夫灌灌，小子蹻蹻。\n匪我言耄，尔用忧谑。多将熇熇，不可救药。\n天之方懠。无为夸毗。威仪卒迷，善人载尸。\n民之方殿屎，则莫我敢葵？丧乱蔑资，曾莫惠我师？\n天之牖民，如埙如篪，如璋如圭，如取如携。\n携无曰益，牖民孔易。民之多辟，无自立辟。\n价人维藩，大师维垣，大邦维屏，大宗维翰，\n怀德维宁，宗子维城。无俾城坏，无独斯畏。\n敬天之怒，无敢戏豫。敬天之渝，无敢驰驱。\n昊天曰明，及尔出王。昊天曰旦，及尔游衍。","note":"《诗经·大雅·生民之什》"},{"id":"255","number":255,"title":"荡","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"荡荡上帝，下民之辟。疾威上帝，其命多辟。\n天生烝民，其命匪谌。靡不有初，鲜克有终。\n文王曰咨，咨汝殷商。曾是彊御？曾是掊克？\n曾是在位？曾是在服？天降滔德，女兴是力。\n文王曰咨，咨女殷商。而秉义类，彊御多怼。\n流言以对。寇攘式内。侯作侯祝，靡届靡究。\n文王曰咨，咨女殷商。女炰烋于中国。敛怨以为德。\n不明尔德，时无背无侧。尔德不明，以无陪无卿。\n文王曰咨，咨女殷商。天不湎尔以酒，不义从式。\n既衍尔止。靡明靡晦。式号式呼。俾昼作夜。\n文王曰咨，咨女殷商。如蜩如螗，如沸如羹。\n小大近丧，人尚乎由行。内奰于中国，覃及鬼方。\n文王曰咨，咨女殷商。匪上帝不时，殷不用旧。\n虽无老成人，尚有典刑。曾是莫听，大命以倾。\n文王曰咨，咨女殷商。人亦有言：颠沛之揭，\n枝叶未有害，本实先拨。殷鉴不远，在夏后之世。","note":"《诗经·大雅·荡之什》"},{"id":"256","number":256,"title":"抑","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"抑抑威仪，维德之隅。人亦有言：靡哲不愚，庶人之愚，亦职维疾。\n哲人之愚，亦维斯戾。无竞维人，四方其训之。有觉德行，四国顺之。\n訏谟定命，远犹辰告。敬慎威仪，维民之则。其在于今，兴迷乱于政。\n颠覆厥德，荒湛于酒。女虽湛乐从，弗念厥绍。罔敷求先王，克共明刑。\n四皇天弗尚，如彼泉流，无沦胥以亡。夙兴夜寐，洒扫庭内，维民之章。\n修尔车马，弓矢戎兵，用戒戎作，用逷蛮方。质尔人民，谨尔侯度，用戒不虞。\n慎尔出话，敬尔威仪，无不柔嘉。白圭之玷，尚可磨也；斯言之玷，不可为也！\n无易由言，无曰苟矣，莫扪朕舌，言不可逝矣。无言不仇，无德不报。\n惠于朋友，庶民小子。子孙绳绳，万民靡不承。视尔友君子，辑柔尔颜，不遐有愆。\n相在尔室，尚不愧于屋漏。无曰不显，莫予云觏。神之格思，不可度思，矧可射思！\n辟尔为德，俾臧俾嘉。淑慎尔止，不愆于仪。不僭不贼，鲜不为则。投我以桃，报之以李。\n彼童而角，实虹小子。荏染柔木，言缗之丝。温温恭人，维德之基。\n其维哲人，告之话言，顺德之行。其维愚人，覆谓我僭。民各有心。\n于乎小子，未知臧否。匪手携之，言示之事。匪面命之，言提其耳。\n借曰未知，亦既抱子。民之靡盈，谁夙知而莫成？昊天孔昭，我生靡乐。\n视尔梦梦，我心惨惨。诲尔谆谆，听我藐藐。匪用为教，覆用为虐。\n借曰未知，亦聿既耄。于乎，小子，告尔旧止。听用我谋，庶无大悔。\n天方艰难，曰丧厥国。取譬不远，昊天不忒。回遹其德，俾民大棘。","note":"《诗经·大雅·荡之什》"},{"id":"257","number":257,"title":"桑柔","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"菀彼桑柔，其下侯旬，捋采其刘，瘼此下民。不殄心忧，仓兄填兮。倬彼昊天，宁不我矜？\n四牡骙骙，旟旐有翩。乱生不夷，靡国不泯。民靡有黎，具祸以烬。于乎有哀，国步斯频。\n国步灭资，天不我将。靡所止疑，云徂何往？君子实维，秉心无竞。谁生厉阶，至今为梗？\n忧心殷殷，念我土宇。我生不辰，逢天僤怒。自西徂东，靡所定处。多我觏痻，孔棘我圉。\n为谋为毖，乱况斯削。告尔忧恤，诲尔序爵。谁能执热，逝不以濯？其何能淑，载胥及溺。\n如彼溯风，亦孔之僾。民有肃心，荓云不逮。好是稼穑，力民代食。稼穑维宝，代食维好？\n天降丧乱，灭我立王。降此蟊贼，稼穑卒痒。哀恫中国，具赘卒荒。靡有旅力，以念穹苍。\n维此惠君，民人所瞻。秉心宣犹，考慎其相。维彼不顺，自独俾臧。自有肺肠，俾民卒狂。\n瞻彼中林，甡甡其鹿。朋友已谮，不胥以穀。人亦有言：进退维谷。\n维此圣人，瞻言百里。维彼愚人，覆狂以喜。匪言不能，胡斯畏忌？\n维此良人，弗求弗迪。维彼忍心，是顾是复。民之贪乱，宁为荼毒。\n大风有隧，有空大谷。维此良人，作为式穀。维彼不顺，征以中垢。\n大风有隧，贪人败类。听言则对，诵言如醉。匪用其良，复俾我悖。\n嗟尔朋友，予岂不知而作。如彼飞虫，时亦弋获。既之阴女，反予来赫。\n民之罔极，职凉善背。为民不利，如云不克。民之回遹，职竞用力。\n民之未戾，职盗为寇。凉曰不可，覆背善詈。虽曰匪予，既作尔歌！","note":"《诗经·大雅·荡之什》"},{"id":"258","number":258,"title":"云汉","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"倬彼云汉，昭回于天。王曰：于乎！何辜今之人？天降丧乱，饥馑荐臻。\n靡神不举，靡爱斯牲。圭壁既卒，宁莫我听？\n旱既大甚，蕴隆虫虫。不殄禋祀，自郊徂宫。上下奠瘗，靡神不宗。\n后稷不克，上帝不临。耗斁下土，宁丁我梗\n旱既大甚，则不可推。兢兢业业，如霆如雷。周余黎民，靡有孑遗。\n昊天上帝，则不我遗。胡不相畏？先祖于摧。\n旱既大甚，则不可沮。赫赫炎炎，云我无所。大命近止，靡瞻靡顾。\n群公先正，则不我助。父母先祖，胡宁忍予？\n旱既大甚，涤涤山川。旱魃为虐，如惔如焚。我心惮暑，忧心如熏。\n群公先正，则不我闻。昊天上帝，宁俾我遁？\n旱既大甚，黾勉畏去。胡宁瘨我以旱？憯不知其故。祈年孔夙，方社不莫。\n昊天上帝，则不我虞。\n敬恭明神，宜无悔怒。旱既大甚，散无友纪。鞫哉庶正，疚哉冢宰。\n趣马师氏，膳夫左右。靡人不周。无不能止，瞻卬昊天，云如何里！\n瞻卬昊天，有嘒其星。大夫君子，昭假无赢。大命近止，无弃尔成。\n何求为我。以戾庶正。瞻卬昊天，曷惠其宁？","note":"《诗经·大雅·荡之什》"},{"id":"259","number":259,"title":"崧高","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"崧高维岳，骏极于天。维岳降神，生甫及申。维申及甫，维周之翰。四国于蕃。四方于宣。\n亹亹申伯，王缵之事。于邑于谢，南国是式。王命召伯，定申伯之宅。登是南邦，世执其功。\n王命申伯，式是南邦。因是谢人，以作尔庸。王命召伯，彻申伯土田。王命傅御，迁其私人。\n申伯之功，召伯是营。有俶其城，寝庙既成。既成藐藐，王锡申伯。四牡蹻蹻，钩膺濯濯。\n王遣申伯，路车乘马。我图尔居，莫如南土。锡尔介圭，以作尔宝。往近王舅，南土是保。\n申伯信迈，王饯于郿。申伯还南，谢于诚归。王命召伯，彻申伯土疆。以峙其粻，式遄其行。\n申伯番番，既入于谢。徒御啴啴。周邦咸喜，戎有良翰。不显申伯，王之元舅，文武是宪。\n申伯之德，柔惠且直。揉此万邦，闻于四国。吉甫作诵，其诗孔硕。其风四好，以赠申伯。","note":"《诗经·大雅·荡之什》"},{"id":"260","number":260,"title":"烝民","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"天生烝民，有物有则。民之秉彝，好是懿德。天监有周，昭假于下。保兹天子，生仲山甫。\n仲山甫之德，柔嘉维则。令仪令色。小心翼翼。古训是式。威仪是力。天子是若，明命使赋。\n王命仲山甫，式是百辟，缵戎祖考，王躬是保。出纳王命，王之喉舌。赋政于外，四方爰发。\n肃肃王命，仲山甫将之。邦国若否，仲山甫明之。既明且哲，以保其身。夙夜匪解，以事一人。\n人亦有言，柔则茹之，刚则吐之。维仲山甫，柔亦不茹，刚亦不吐。不侮矜寡，不畏强御。\n人亦有言，德輶如毛，民鲜克举之。我仪图之，维仲山甫举之。爱莫助之。衮职有阙，维仲山甫补之。\n仲山甫出祖。四牡业业。征夫捷捷，每怀靡及。四牡彭彭，八鸾锵锵。王命仲山甫，城彼东方。\n四牡骙骙，八鸾喈喈。仲山甫徂齐，式遄其归。吉甫作诵，穆如清风。仲山甫永怀，以慰其心。","note":"《诗经·大雅·荡之什》"},{"id":"261","number":261,"title":"韩奕","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"奕奕梁山，维禹甸之，有倬其道。\n韩侯受命，王亲命之：缵戎祖考，无废朕命。\n夙夜匪解，虔共尔位，朕命不易。\n粲不庭方，以佐戎辟。四牡奕奕，孔修且张。\n韩侯入觐，以其介圭，入觐于王。\n王锡韩侯，淑旂绥章，簟茀错衡。\n玄衮赤舄，钩膺镂锡，鞹鞃浅幭，鞗革金厄。\n韩侯出祖，出宿于屠。显父饯之，清酒百壶。\n其殽维何？炰鳖鲜鱼。其蔌维何？维笋及蒲。\n其赠维何？乘马路车。笾豆有且。侯氏燕胥。\n韩侯取妻，汾王之甥，蹶父之子。\n韩侯迎止，于蹶之里。\n百两彭彭，八鸾锵锵，不显其光。\n诸娣从之，祁祁如云。韩侯顾之，烂其盈门。\n蹶父孔武，靡国不到。为韩姞相攸，莫如韩乐。\n孔乐韩土，川泽訏訏，鲂鱮甫甫，麀鹿噳噳。\n有熊有罴，有猫有虎。庆既令居，韩姞燕誉。\n溥彼韩城，燕师所完。以先祖受命，因时百蛮。\n王锡韩侯，其追其貊。奄受北国，因以其伯。\n实墉实壑，实亩实藉。献其貔皮，赤豹黄罴。","note":"《诗经·大雅·荡之什》"},{"id":"262","number":262,"title":"江汉","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"江汉浮浮，武夫滔滔。匪安匪游，淮夷来求。既出我车，既设我旟。匪安匪舒，淮夷来铺。\n江汉汤汤，武夫洸洸。经营四方，告成于王。四方既平，王国庶定。时靡有争，王心载宁。\n江汉之浒，王命召虎：式辟四方，彻我疆土。匪疚匪棘，王国来极。于疆于理，至于南海。\n王命召虎：来旬来宣。文武受命，召公维翰。无曰予小子，召公是似。肇敏戎公，用锡尔祉。\n厘尔圭瓒，秬鬯一卣。告于文人，锡山土田。于周受命，自召祖命，虎拜稽首：天子万年！\n虎拜稽首，对扬王休。作召公考：天子万寿！明明天子，令闻不已，矢其文德，洽此四国。","note":"《诗经·大雅·荡之什》"},{"id":"263","number":263,"title":"常武","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"赫赫明明。王命卿士，南仲大祖，大师皇父。整我六师，以修我戎。既敬既戒，惠此南国。\n王谓尹氏，命程伯休父，左右陈行。戒我师旅，率彼淮浦，省此徐土。不留不处，三事就绪。\n赫赫业业，有严天子。王舒保作，匪绍匪游。徐方绎骚，震惊徐方。如雷如霆，徐方震惊。\n王奋厥武，如震如怒。进厥虎臣，阚如虓虎。铺敦淮濆，仍执丑虏。截彼淮浦，王师之所。\n王旅啴啴，如飞如翰。如江如汉，如山之苞。如川之流，绵绵翼翼。不测不克，濯征徐国。\n王犹允塞，徐方既来。徐方既同，天子之功。四方既平，徐方来庭。徐方不回，王曰还归。","note":"《诗经·大雅·荡之什》"},{"id":"264","number":264,"title":"瞻卬","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"瞻卬昊天，则不我惠。孔填不宁，降此大厉。邦靡有定，士民其瘵。\n蟊贼蟊疾，靡有夷届。罪罟不收，靡有夷瘳。\n人有土田，女反有之。人有民人，女覆夺之。此宜无罪，女反收之。\n彼宜有罪，女覆说之。\n哲夫成城，哲妇倾城。懿厥哲妇，为枭为鸱。妇有长舌，维厉之阶。\n乱匪降自天，生自妇人。匪教匪诲，时维妇寺。\n鞫人忮忒。谮始竞背。岂曰不极？伊胡为慝？如贾三倍，君子是识。\n妇无公事，休其蚕织。\n天何以剌？何神不富？舍尔介狄，维予胥忌。不吊不祥，威仪不类。\n人之云亡，邦国殄瘁。\n天之降罔，维其优矣。人之云亡，心之忧矣。天之降罔，维其几矣。\n人之云亡，心之悲矣。\n觱沸槛泉，维其深矣。心之忧矣，宁自今矣？不自我先，不自我后。\n藐藐昊天，无不克巩。无忝皇祖，式救尔后。","note":"《诗经·大雅·荡之什》"},{"id":"265","number":265,"title":"召旻","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"旻天疾威，天笃降丧。瘨我饥馑，民卒流亡。我居圉卒荒。\n天降罪罟，蟊贼内讧。昏椓靡共，溃溃回遹，实靖夷我邦。\n皋皋訿訿，曾不知其玷。兢兢业业，孔填不宁，我位孔贬。\n如彼岁旱，草不溃茂，如彼栖苴。我相此邦，无不溃止。\n维昔之富不如时，维今之疚不如兹。彼疏斯粺，胡不自替？职兄斯引。\n池之竭矣，不云自频。泉之竭矣，不云自中。溥斯害矣，职兄斯弘，不灾我躬。\n昔先王受命，有如召公，日辟国百里，今也日蹙国百里。于乎哀哉！维今之人，不尚有旧！","note":"《诗经·大雅·荡之什》"},{"id":"266","number":266,"title":"清庙","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"于穆清庙，肃雍显相。济济多士，秉文之德。对越在天，骏奔走在庙。不显不承，无射于人斯。","note":"《诗经·周颂·清庙之什》"},{"id":"267","number":267,"title":"维天之命","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"维天之命，于穆不已。于乎不显，文王之德之纯。假以溢我，我其收之。骏惠我文王，曾孙笃之。","note":"《诗经·周颂·清庙之什》"},{"id":"268","number":268,"title":"维清","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"维清缉熙，文王之典。肇禋，迄用有成，维周之祯。","note":"《诗经·周颂·清庙之什》"},{"id":"269","number":269,"title":"烈文","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"烈文辟公，锡兹祉福。惠我无疆，子孙保之。无封靡于尔邦，维王其崇之。\n念兹戎功，继序其皇之。无竞维人，四方其训之。不显维德，百辟其刑之。于乎，前王不忘！","note":"《诗经·周颂·清庙之什》"},{"id":"270","number":270,"title":"天作","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"天作高山，大王荒之。彼作矣，文王康之。彼徂矣，岐有夷之行。子孙保之。","note":"《诗经·周颂·清庙之什》"},{"id":"271","number":271,"title":"昊天有成命","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昊天有成命，二后受之。成王不敢康，夙夜基命宥密。于缉熙！单厥心，四其靖之。","note":"《诗经·周颂·清庙之什》"},{"id":"272","number":272,"title":"我将","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"我将我享，维羊维牛，维天其右之。仪式刑文王之典，日靖四方。\n伊嘏文王，既右飨之。我其夙夜，畏天之威，于时保之。","note":"《诗经·周颂·清庙之什》"},{"id":"273","number":273,"title":"时迈","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"时迈其邦，昊天其子之，实右序有周。薄言震之，莫不震叠。怀柔百神，及河乔岳，允王维后。\n明昭有周，式序在位。载戢干戈，载橐弓矢。我求懿德，四于时夏，允王保之。","note":"《诗经·周颂·清庙之什》"},{"id":"274","number":274,"title":"执竞","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"执竞武王，无竞维烈。不显成康，上帝是皇。自彼成康，奄有四方，斤斤其明。\n钟鼓喤喤，磬莞将将，降福穰穰。降福简简，威仪反反。既醉既饱，福禄来反。","note":"《诗经·周颂·清庙之什》"},{"id":"275","number":275,"title":"思文","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"思文后稷，克配彼天。立我烝民，莫菲尔极。贻我来牟，帝命率育，无此疆尔界。陈常于时夏。","note":"《诗经·周颂·清庙之什》"},{"id":"276","number":276,"title":"臣工","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"嗟嗟臣工，敬尔在公。王厘尔成，来咨来茹。嗟嗟保介，维莫之春，亦又何求？如何新畲？\n于皇来牟，将受厥明。明昭上帝，迄用康年。命我众人：庤乃钱镈，奄观铚艾。","note":"《诗经·周颂·臣工之什》"},{"id":"277","number":277,"title":"噫嘻","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"噫嘻成王，既昭假尔。率时农夫，播厥百谷。骏发尔私，终三十里。亦服尔耕，十千维耦。","note":"《诗经·周颂·臣工之什》"},{"id":"278","number":278,"title":"振鹭","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"振鹭于飞，于彼西雍。我客戾止，亦有斯容。在彼无恶，在此无斁。庶几夙夜，以永终誉。","note":"《诗经·周颂·臣工之什》"},{"id":"279","number":279,"title":"丰年","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"丰年多黍多稌，亦有高廪，万亿及秭。为酒为醴，烝畀祖妣。以洽百礼，降福孔皆。","note":"《诗经·周颂·臣工之什》"},{"id":"280","number":280,"title":"有瞽","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有瞽有瞽，在周之庭。设业设虡，崇牙树羽。应田县鼓，鞉磬柷圉。既备\n乃奏，箫管备举。喤喤厥声，肃雍和鸣，先祖是听。我客戾止，永观厥成。","note":"《诗经·周颂·臣工之什》"},{"id":"281","number":281,"title":"潜","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"猗与漆沮，潜有多鱼。有鳣有鲔，鲦鲿鰋鲤。以享以祀，以介景福。","note":"《诗经·周颂·臣工之什》"},{"id":"282","number":282,"title":"雝","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有来雝雝，至止肃肃。相维辟公，天子穆穆。于荐广牡，相予四祀。假哉皇考！绥予孝子。\n宣哲维人，文武维后。燕及皇天，克昌厥后。绥我眉寿，介以繁祉，既右烈考，亦右文母。","note":"《诗经·周颂·臣工之什》"},{"id":"283","number":283,"title":"载见","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"载见辟王，曰求厥章。龙旂阳阳，和铃央央。鞗革有鸧，休有烈光。率见昭考，以孝以享。\n以介眉寿，永言保之，思皇多祜。烈文辟公，绥以多福，俾缉熙于纯嘏。","note":"《诗经·周颂·臣工之什》"},{"id":"284","number":284,"title":"有客","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有客有客，亦白其马。有萋有且，敦琢其旅。有客宿宿，有客信信。\n言授之絷，以絷其马。薄言追之，左右绥之。既有淫威，降福孔夷。","note":"《诗经·周颂·臣工之什》"},{"id":"285","number":285,"title":"武","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"于皇武王！无竞维烈。允文文王，克开厥后。嗣武受之，胜殷遏刘，耆
