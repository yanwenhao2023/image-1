残毡拥雪，故人心眼。\n谁怜旅愁荏苒。\n谩长门夜悄，锦筝弹怨。\n想伴侣、犹宿芦花，也曾念春前，去程应转。\n暮雨相呼，怕蓦地、玉关重见。\n未羞他、双燕归来，画帘半卷。","note":"选自《宋词三百首》"},{"id":"933","number":933,"title":"月下笛·万里孤云","author":"张炎","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"万里孤云，清游渐远，故人何处。\n寒窗梦里，犹记经行旧时路。\n连昌约略无多柳，第一是、难听夜雨。\n谩惊回凄悄，相看烛影，拥衾谁语。\n张绪。\n归何暮。\n半零落，依依断桥鸥鹭。\n天涯倦旅。\n此时心事良苦。\n只愁重洒西州泪，问杜曲、人家在否。\n恐翠袖、正天寒，犹倚梅花那树。","note":"选自《宋词三百首》"},{"id":"934","number":934,"title":"点绛唇·新月娟娟","author":"苏过","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"新月娟娟，夜寒江静山衔斗。\n起来搔首。\n梅影横窗瘦。\n好个霜天，闲却传杯手。\n君知否。\n乱鸦啼後。\n归兴浓如酒。","note":"选自《宋词三百首》"},{"id":"935","number":935,"title":"贺新郎·睡起啼莺语","author":"叶梦得","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"睡起啼莺语。\n掩青苔、房栊向晚，乱红无数。\n吹尽残花无人见，惟有垂杨自舞。\n渐暖霭、初回轻暑。\n宝扇重寻明月影，暗尘侵、尚有乘鸾女。\n惊旧恨，遽如许。\n江南梦断横江渚。\n浪黏天、葡萄涨绿，半空烟雨。\n无限楼前沧波意，谁采苹花寄取。\n但怅望、兰舟容与。\n万里云帆何时到，送孤鸿、目断千山阻。\n谁为我，唱金缕。","note":"选自《宋词三百首》"},{"id":"936","number":936,"title":"虞美人·落花已作风前舞","author":"叶梦得","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"落花已作风前舞。\n又送黄昏雨。\n晓来庭院半残红。\n惟有游丝千丈、晴空。\n殷勤花下同携手。\n更尽杯中酒。\n美人不用敛蛾眉。\n我亦多情、无奈酒阑时。","note":"选自《宋词三百首》"},{"id":"937","number":937,"title":"喜迁莺·晓光催角","author":"刘一止","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"晓光催角。\n听宿鸟未惊，邻鸡先觉。\n迤逦烟村，马嘶人起，残月尚穿林薄。\n泪痕带霜微凝，酒力冲寒犹弱。\n叹倦客、悄不禁，重染风尘京洛。\n追念，人别後，心事万重，难觅孤鸿托。\n翠幌娇深，曲屏香暖，争念岁寒飘泊。\n怨月恨花烦恼，不是不曾经著。\n这情味，望一成消减，新来还恶。","note":"选自《宋词三百首》"},{"id":"938","number":938,"title":"点绛唇·新月娟娟","author":"汪藻","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"新月娟娟，夜寒江静山衔斗。\n起来搔首。\n梅影横窗瘦。\n好个霜天，闲却传杯手。\n君知否。\n乱鸦啼後。\n归兴浓於酒。","note":"选自《宋词三百首》"},{"id":"939","number":939,"title":"蓦山溪·洗妆真态","author":"曹组","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"洗妆真态，不作铅华御。\n竹外一枝斜，想佳人、天寒日暮。\n黄昏小院，无处著清香，风细细，雪垂垂，何况江头路。\n月边疏影，梦到消魂处。\n结子欲黄时，又须著、廉纤细雨。\n孤芳一世，供断有情愁，销瘦却，东阳也，试问花知否。","note":"选自《宋词三百首》"},{"id":"940","number":940,"title":"三台·见梨花初带夜月","author":"万俟咏","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"见梨花初带夜月，海棠半含朝雨。\n内苑春、不禁过青门，御沟涨、潜通南浦。\n东风静、细柳垂金缕。\n望凤阙、非烟非雾。\n好时代、朝野多欢，遍九陌、太平箫鼓。\n乍莺儿百啭断续，燕子飞来飞去。\n近绿水、台榭映秋千，斗草聚、双双游女。\n饧香更、酒冷踏青路。\n会暗识、夭桃朱户。\n向晚骤、宝马雕鞍，醉襟惹、乱花飞絮。\n正轻寒轻暖漏永，半阴半晴云暮。\n禁火天、已是试新妆，岁华到、三分佳处。\n清明看、汉宫传蜡炬。\n散翠烟、飞入槐府。\n敛兵卫、阊阖门开，住传宣、又还休务。","note":"选自《宋词三百首》"},{"id":"941","number":941,"title":"江神子慢・江城子慢·玉台挂秋月","author":"田为","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"玉台挂秋月。\n铅素浅，梅花傅香雪。\n冰姿洁。\n金莲衬、小小凌波罗袜。\n雨初歇。\n楼外孤鸿声渐远，远山外、行人音信绝。\n此恨对语犹难，那堪更寄书说。\n教人红销翠减，觉衣宽金缕，都为轻别。\n太情切。\n消魂处、画角黄昏时节。\n声呜咽。\n落尽庭花春去也，银蟾迥、无情圆又缺。\n恨伊不似馀香，惹鸳鸯结。","note":"选自《宋词三百首》"},{"id":"942","number":942,"title":"菩萨蛮·赤阑桥尽香街直","author":"陈克","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"赤阑桥尽香街直。\n笼街细柳娇无力。\n金碧上青空。\n花晴帘影红。\n黄衫飞白马。\n日日青楼下。\n醉眼不逢人。\n午香吹暗尘。","note":"选自《宋词三百首》"},{"id":"943","number":943,"title":"菩萨蛮·绿芜墙绕青苔院","author":"陈克","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绿芜墙绕青苔院。\n中庭日淡芭蕉卷。\n蝴蝶上阶飞。\n烘帘自在垂。\n玉钩双语燕。\n宝甃杨花转。\n几处簸钱声。\n绿窗春睡轻。","note":"选自《宋词三百首》"},{"id":"944","number":944,"title":"鹧鸪天·一点残红欲尽时","author":"周紫芝","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一点残红欲尽时。\n乍凉秋气满屏帏。\n梧桐叶上三更雨，叶叶声声是别离。\n调宝瑟，拨金猊。\n那时同唱鹧鸪词。\n如今风雨西楼夜，不听清歌也泪垂。","note":"选自《宋词三百首》"},{"id":"945","number":945,"title":"踏莎行·情似游丝","author":"周紫芝","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"情似游丝，人如飞絮。\n泪珠阁定空相觑。\n一溪烟柳万丝垂，无因系得兰舟住。\n雁过斜阳，草迷烟渚。\n如今已是愁无数。\n明朝且做莫思量，如何过得今宵去。","note":"选自《宋词三百首》"},{"id":"946","number":946,"title":"青玉案·年年社日停针线","author":"无名氏","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"年年社日停针线。\n怎忍见、双飞燕。\n今日江城春已半。\n一身犹在，乱山深处，寂寞溪桥畔。\n春衫著破谁针线。\n点点行行泪痕满。\n落日解鞍芳草岸。\n花无人戴，酒无人劝，醉也无人管。","note":"选自《宋词三百首》"},{"id":"947","number":947,"title":"秦楼月・忆秦娥·楼阴缺","author":"范成大","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"楼阴缺。\n阑干影卧东厢月。\n东厢月。\n一天风露，杏花如雪。\n隔烟催漏金虬咽。\n罗帏暗淡灯花结。\n灯花结。\n片时春梦，江南天阔。","note":"选自《宋词三百首》"},{"id":"948","number":948,"title":"霜天晓角·晚晴风歇","author":"范成大","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"晚晴风歇。\n一夜春折威。\n脉脉花疏天淡，云来去、数枝雪。\n胜绝。\n愁亦绝。\n此情谁共说。\n惟有两行低雁，知人倚、画楼月。","note":"选自《宋词三百首》"},{"id":"949","number":949,"title":"眼儿媚·酣酣日脚紫烟浮","author":"范成大","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"酣酣日脚紫烟浮。\n妍暖破轻裘。\n困人天色，醉人花气，午梦扶头。\n春慵恰似春塘水，一片縠纹愁。\n溶溶泄泄，东风无力，欲皱还休。","note":"选自《宋词三百首》"},{"id":"950","number":950,"title":"六州歌头·长怀望断","author":"张孝祥","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"长怀望断，关塞莽然平。\n征尘暗，霜风劲，悄边声。\n黯销凝。\n追想当年事，殆天数，非人力，洙泗上，弦歌地，亦膻腥。\n隔水毡乡，落日牛羊下，区脱纵横。\n看名王宵猎，骑火一川明。\n笳鼓悲鸣。\n遣人惊。\n念腰间箭，匣中剑，空埃蠹，竟何成。\n时易失，心徒壮，岁将零。\n渺神京。\n干羽方怀远，静烽燧，且休兵。\n冠盖使，纷驰骛，若为情。\n闻道中原遗老，常南望，羽葆霓旌。\n使行人到此，忠愤气填膺。\n有泪如倾。","note":"选自《宋词三百首》"},{"id":"951","number":951,"title":"念奴娇·洞庭青草","author":"张孝祥","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"洞庭青草，近中秋、更无一点风色。\n玉鉴琼田三万顷，著我扁舟一叶。\n素月分辉，明河共影，表里俱澄澈。\n悠然心会，妙处难与君说。\n应念岭海经年，孤光自照，肝肺皆冰雪。\n短发萧骚襟袖冷，稳泛沧浪空阔。\n尽吸西江，细斟北斗，万象为宾客。\n扣舷独笑，不知今夕何夕。","note":"选自《宋词三百首》"},{"id":"952","number":952,"title":"春江花月夜","author":"张若虚","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"春江潮水连海平，海上明月共潮生。\n滟滟随波千万里，何处春江无月明。\n江流宛转绕芳甸，月照花林皆似霰。\n空里流霜不觉飞，汀上白沙看不见。\n江天一色无纤尘，皎皎空中孤月轮。\n江畔何人初见月？江月何年初照人？\n人生代代无穷已，江月年年望相似。\n不知江月待何人，但见长江送流水。\n白云一片去悠悠，青枫浦上不胜愁。\n谁家今夜扁舟子？何处相思明月楼？\n可怜楼上月裴回，应照离人妆镜台。\n玉户帘中卷不去，捣衣砧上拂还来。\n此时相望不相闻，愿逐月华流照君。\n鸿雁长飞光不度，鱼龙潜跃水成文。\n昨夜闲潭梦落花，可怜春半不还家。\n江水流春去欲尽，江潭落月复西斜。\n斜月沉沉藏海雾，碣石潇湘无限路。\n不知乘月几人归，落月摇情满江树。","note":"经典名篇补遗"},{"id":"953","number":953,"title":"长恨歌","author":"白居易","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"汉皇重色思倾国，御宇多年求不得。\n杨家有女初长成，养在深闺人未识。\n天生丽质难自弃，一朝选在君王侧。\n回眸一笑百媚生，六宫粉黛无颜色。\n春寒赐浴华清池，温泉水滑洗凝脂。\n侍儿扶起娇无力，始是新承恩泽时。\n云鬓花颜金步摇，芙蓉帐暖度春宵。\n春宵苦短日高起，从此君王不早朝。\n承欢侍宴无闲暇，春从春游夜专夜。\n后宫佳丽三千人，三千宠爱在一身。\n金屋妆成娇侍夜，玉楼宴罢醉和春。\n姊妹弟兄皆列土，可怜光彩生门户。\n遂令天下父母心，不重生男重生女。\n骊宫高处入青云，仙乐风飘处处闻。\n缓歌慢舞凝丝竹，尽日君王看不足。\n渔阳鼙鼓动地来，惊破霓裳羽衣曲。\n九重城阙烟尘生，千乘万骑西南行。\n翠华摇摇行复止，西出都门百余里。\n六军不发无奈何，宛转蛾眉马前死。\n花钿委地无人收，翠翘金雀玉搔头。\n君王掩面救不得，回看血泪相和流。\n黄埃散漫风萧索，云栈萦纡登剑阁。\n峨嵋山下少人行，旌旗无光日色薄。\n蜀江水碧蜀山青，圣主朝朝暮暮情。\n行宫见月伤心色，夜雨闻铃肠断声。\n天旋地转回龙驭，到此踌躇不能去。\n马嵬坡下泥土中，不见玉颜空死处。\n君臣相顾尽沾衣，东望都门信马归。\n归来池苑皆依旧，太液芙蓉未央柳。\n芙蓉如面柳如眉，对此如何不泪垂。\n春风桃李花开日，秋雨梧桐叶落时。\n西宫南内多秋草，落叶满阶红不扫。\n梨园弟子白发新，椒房阿监青娥老。\n夕殿萤飞思悄然，孤灯挑尽未成眠。\n迟迟钟鼓初长夜，耿耿星河欲曙天。\n鸳鸯瓦冷霜华重，翡翠衾寒谁与共。\n悠悠生死别经年，魂魄不曾来入梦。\n临邛道士鸿都客，能以精诚致魂魄。\n为感君王辗转思，遂教方士殷勤觅。\n排空驭气奔如电，升天入地求之遍。\n上穷碧落下黄泉，两处茫茫皆不见。\n忽闻海上有仙山，山在虚无缥缈间。\n楼阁玲珑五云起，其中绰约多仙子。\n中有一人字太真，雪肤花貌参差是。\n金阙西厢叩玉扃，转教小玉报双成。\n闻道汉家天子使，九华帐里梦魂惊。\n揽衣推枕起徘徊，珠箔银屏迤逦开。\n云鬓半偏新睡觉，花冠不整下堂来。\n风吹仙袂飘飘举，犹似霓裳羽衣舞。\n玉容寂寞泪阑干，梨花一枝春带雨。\n含情凝睇谢君王，一别音容两渺茫。\n昭阳殿里恩爱绝，蓬莱宫中日月长。\n回头下望人寰处，不见长安见尘雾。\n惟将旧物表深情，钿合金钗寄将去。\n钗留一股合一扇，钗擘黄金合分钿。\n但教心似金钿坚，天上人间会相见。\n临别殷勤重寄词，词中有誓两心知。\n七月七日长生殿，夜半无人私语时。\n在天愿作比翼鸟，在地愿为连理枝。\n天长地久有时尽，此恨绵绵无绝期。","note":"经典名篇补遗"},{"id":"954","number":954,"title":"琵琶行","author":"白居易","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"浔阳江头夜送客，枫叶荻花秋瑟瑟。\n主人下马客在船，举酒欲饮无管弦。\n醉不成欢惨将别，别时茫茫江浸月。\n忽闻水上琵琶声，主人忘归客不发。\n寻声暗问弹者谁？琵琶声停欲语迟。\n移船相近邀相见，添酒回灯重开宴。\n千呼万唤始出来，犹抱琵琶半遮面。\n转轴拨弦三两声，未成曲调先有情。\n弦弦掩抑声声思，似诉平生不得志。\n低眉信手续续弹，说尽心中无限事。\n轻拢慢捻抹复挑，初为霓裳后六幺。\n大弦嘈嘈如急雨，小弦切切如私语。\n嘈嘈切切错杂弹，大珠小珠落玉盘。\n间关莺语花底滑，幽咽泉流冰下难。\n冰泉冷涩弦凝绝，凝绝不通声暂歇。\n别有幽愁暗恨生，此时无声胜有声。\n银瓶乍破水浆迸，铁骑突出刀枪鸣。\n曲终收拨当心画，四弦一声如裂帛。\n东船西舫悄无言，唯见江心秋月白。\n沉吟放拨插弦中，整顿衣裳起敛容。\n自言本是京城女，家在虾蟆陵下住。\n十三学得琵琶成，名属教坊第一部。\n曲罢曾教善才服，妆成每被秋娘妒。\n五陵年少争缠头，一曲红绡不知数。\n钿头银篦击节碎，血色罗裙翻酒污。\n今年欢笑复明年，秋月春风等闲度。\n弟走从军阿姨死，暮去朝来颜色故。\n门前冷落鞍马稀，老大嫁作商人妇。\n商人重利轻别离，前月浮梁买茶去。\n去来江口守空船，绕船月明江水寒。\n夜深忽梦少年事，梦啼妆泪红阑干。\n我闻琵琶已叹息，又闻此语重唧唧。\n同是天涯沦落人，相逢何必曾相识。\n我从去年辞帝京，谪居卧病浔阳城。\n浔阳地僻无音乐，终岁不闻丝竹声。\n住近湓江地低湿，黄芦苦竹绕宅生。\n其间旦暮闻何物？杜鹃啼血猿哀鸣。\n春江花朝秋月夜，往往取酒还独倾。\n岂无山歌与村笛，呕哑嘲哳难为听。\n今夜闻君琵琶语，如听仙乐耳暂明。\n莫辞更坐弹一曲，为君翻作琵琶行。\n感我此言良久立，却坐促弦弦转急。\n凄凄不似向前声，满座重闻皆掩泣。\n座中泣下谁最多？江州司马青衫湿。","note":"经典名篇补遗"},{"id":"955","number":955,"title":"兵车行","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"车辚辚，马萧萧，行人弓箭各在腰。\n爷娘妻子走相送，尘埃不见咸阳桥。\n牵衣顿足拦道哭，哭声直上干云霄。\n道傍过者问行人，行人但云点行频。\n或从十五北防河，便至四十西营田。\n去时里正与裹头，归来头白还戍边。\n边庭流血成海水，武皇开边意未已。\n君不闻汉家山东二百州，千村万落生荆杞。\n纵有健妇把锄犁，禾生陇亩无东西。\n况复秦兵耐苦战，被驱不异犬与鸡。\n长者虽有问，役夫敢申恨？\n且如今年冬，未休关西卒。\n县官急索租，租税从何出？\n信知生男恶，反是生女好。\n生女犹得嫁比邻，生男埋没随百草。\n君不见青海头，古来白骨无人收。\n新鬼烦冤旧鬼哭，天阴雨湿声啾啾。","note":"经典名篇补遗"},{"id":"956","number":956,"title":"雁门太守行","author":"李贺","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"黑云压城城欲摧，甲光向日金鳞开。\n角声满天秋色里，塞上燕脂凝夜紫。\n半卷红旗临易水，霜重鼓寒声不起。\n报君黄金台上意，提携玉龙为君死。","note":"经典名篇补遗"},{"id":"957","number":957,"title":"清平调·其一","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"云想衣裳花想容，春风拂槛露华浓。\n若非群玉山头见，会向瑶台月下逢。","note":"经典名篇补遗"},{"id":"958","number":958,"title":"清平调·其三","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"名花倾国两相欢，长得君王带笑看。\n解释春风无限恨，沉香亭北倚阑干。","note":"经典名篇补遗"},{"id":"959","number":959,"title":"竹枝词·其一","author":"刘禹锡","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"杨柳青青江水平，闻郎江上唱歌声。\n东边日出西边雨，道是无晴却有晴。","note":"经典名篇补遗"},{"id":"960","number":960,"title":"独坐敬亭山","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"众鸟高飞尽，孤云独去闲。\n相看两不厌，只有敬亭山。","note":"经典名篇补遗"},{"id":"961","number":961,"title":"悯农·其二","author":"李绅","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"锄禾日当午，汗滴禾下土。\n谁知盘中餐，粒粒皆辛苦。","note":"经典名篇补遗"},{"id":"962","number":962,"title":"短歌行","author":"曹操","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"对酒当歌，人生几何！譬如朝露，去日苦多。\n慨当以慷，忧思难忘。何以解忧？唯有杜康。\n青青子衿，悠悠我心。但为君故，沉吟至今。\n呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。\n明明如月，何时可掇？忧从中来，不可断绝。\n越陌度阡，枉用相存。契阔谈讌，心念旧恩。\n月明星稀，乌鹊南飞。绕树三匝，何枝可依？\n山不厌高，海不厌深。周公吐哺，天下归心。","note":"经典名篇补遗"},{"id":"963","number":963,"title":"观沧海","author":"曹操","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中；\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。","note":"经典名篇补遗"},{"id":"964","number":964,"title":"龟虽寿","author":"曹操","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"神龟虽寿，犹有竟时。\n腾蛇乘雾，终为土灰。\n老骥伏枥，志在千里。\n烈士暮年，壮心不已。\n盈缩之期，不但在天；\n养怡之福，可得永年。\n幸甚至哉，歌以咏志。","note":"经典名篇补遗"},{"id":"965","number":965,"title":"七步诗","author":"曹植","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"煮豆持作羹，漉菽以为汁。\n萁在釜下燃，豆在釜中泣。\n本自同根生，相煎何太急？","note":"经典名篇补遗"},{"id":"966","number":966,"title":"行行重行行","author":"佚名","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"行行重行行，与君生别离。\n相去万余里，各在天一涯。\n道路阻且长，会面安可知？\n胡马依北风，越鸟巢南枝。\n相去日已远，衣带日已缓。\n浮云蔽白日，游子不顾反。\n思君令人老，岁月忽已晚。\n弃捐勿复道，努力加餐饭。","note":"经典名篇补遗"},{"id":"967","number":967,"title":"迢迢牵牛星","author":"佚名","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"迢迢牵牛星，皎皎河汉女。\n纤纤擢素手，札札弄机杼。\n终日不成章，泣涕零如雨。\n河汉清且浅，相去复几许。\n盈盈一水间，脉脉不得语。","note":"经典名篇补遗"},{"id":"968","number":968,"title":"涉江采芙蓉","author":"佚名","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"涉江采芙蓉，兰泽多芳草。\n采之欲遗谁？所思在远道。\n还顾望旧乡，长路漫浩浩。\n同心而离居，忧伤以终老。","note":"经典名篇补遗"},{"id":"969","number":969,"title":"上邪","author":"佚名","tags":["乐府"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"上邪！我欲与君相知，长命无绝衰。\n山无陵，江水为竭，冬雷震震，夏雨雪，天地合，乃敢与君绝。","note":"经典名篇补遗"},{"id":"970","number":970,"title":"江南","author":"佚名","tags":["乐府"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"江南可采莲，莲叶何田田。\n鱼戏莲叶间。\n鱼戏莲叶东，鱼戏莲叶西，鱼戏莲叶南，鱼戏莲叶北。","note":"经典名篇补遗"},{"id":"971","number":971,"title":"长歌行","author":"佚名","tags":["乐府"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲。","note":"经典名篇补遗"},{"id":"972","number":972,"title":"木兰诗","author":"佚名","tags":["乐府"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。\n问女何所思，问女何所忆。女亦无所思，女亦无所忆。\n昨夜见军帖，可汗大点兵。军书十二卷，卷卷有爷名。\n阿爷无大儿，木兰无长兄。愿为市鞍马，从此替爷征。\n东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。\n旦辞爷娘去，暮宿黄河边。不闻爷娘唤女声，但闻黄河流水鸣溅溅。\n旦辞黄河去，暮至黑山头。不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。\n将军百战死，壮士十年归。\n归来见天子，天子坐明堂。策勋十二转，赏赐百千强。\n可汗问所欲，木兰不用尚书郎。愿驰千里足，送儿还故乡。\n爷娘闻女来，出郭相扶将。阿姊闻妹来，当户理红妆。\n小弟闻姊来，磨刀霍霍向猪羊。\n开我东阁门，坐我西阁床。脱我战时袍，著我旧时裳。\n当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙。\n同行十二年，不知木兰是女郎。\n雄兔脚扑朔，雌兔眼迷离。双兔傍地走，安能辨我是雄雌？","note":"经典名篇补遗"},{"id":"973","number":973,"title":"敕勒歌","author":"佚名","tags":["乐府"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，风吹草低见牛羊。","note":"经典名篇补遗"},{"id":"974","number":974,"title":"饮酒·其五","author":"陶渊明","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。","note":"经典名篇补遗"},{"id":"975","number":975,"title":"归园田居·其一","author":"陶渊明","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"少无适俗韵，性本爱丘山。\n误落尘网中，一去三十年。\n羁鸟恋旧林，池鱼思故渊。\n开荒南野际，守拙归园田。\n方宅十余亩，草屋八九间。\n榆柳荫后檐，桃李罗堂前。\n暧暧远人村，依依墟里烟。\n狗吠深巷中，鸡鸣桑树颠。\n户庭无尘杂，虚室有余闲。\n久在樊笼里，复得返自然。","note":"经典名篇补遗"},{"id":"976","number":976,"title":"归园田居·其三","author":"陶渊明","tags":["汉魏"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"种豆南山下，草盛豆苗稀。\n晨兴理荒秽，带月荷锄归。\n道狭草木长，夕露沾我衣。\n衣沾不足惜，但使愿无违。","note":"经典名篇补遗"},{"id":"977","number":977,"title":"天净沙·秋思","author":"马致远","tags":["元曲"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。\n夕阳西下，断肠人在天涯。","note":"经典名篇补遗"},{"id":"978","number":978,"title":"山坡羊·潼关怀古","author":"张养浩","tags":["元曲"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"峰峦如聚，波涛如怒，山河表里潼关路。\n望西都，意踌躇。\n伤心秦汉经行处，宫阙万间都做了土。\n兴，百姓苦；亡，百姓苦。","note":"经典名篇补遗"},{"id":"979","number":979,"title":"天净沙·秋","author":"白朴","tags":["元曲"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"孤村落日残霞，轻烟老树寒鸦，一点飞鸿影下。\n青山绿水，白草红叶黄花。","note":"经典名篇补遗"},{"id":"980","number":980,"title":"正宫·端正好","author":"王实甫","tags":["元曲"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"碧云天，黄花地，西风紧，北雁南飞。\n晓来谁染霜林醉？总是离人泪。","note":"经典名篇补遗"},{"id":"981","number":981,"title":"示儿","author":"陆游","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"死去元知万事空，但悲不见九州同。\n王师北定中原日，家祭无忘告乃翁。","note":"经典名篇补遗"},{"id":"982","number":982,"title":"书愤","author":"陆游","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"早岁那知世事艰，中原北望气如山。\n楼船夜雪瓜洲渡，铁马秋风大散关。\n塞上长城空自许，镜中衰鬓已先斑。\n出师一表真名世，千载谁堪伯仲间。","note":"经典名篇补遗"},{"id":"983","number":983,"title":"游山西村","author":"陆游","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"莫笑农家腊酒浑，丰年留客足鸡豚。\n山重水复疑无路，柳暗花明又一村。\n箫鼓追随春社近，衣冠简朴古风存。\n从今若许闲乘月，拄杖无时夜叩门。","note":"经典名篇补遗"},{"id":"984","number":984,"title":"十一月四日风雨大作·其二","author":"陆游","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"僵卧孤村不自哀，尚思为国戍轮台。\n夜阑卧听风吹雨，铁马冰河入梦来。","note":"经典名篇补遗"},{"id":"985","number":985,"title":"题西林壁","author":"苏轼","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"横看成岭侧成峰，远近高低各不同。\n不识庐山真面目，只缘身在此山中。","note":"经典名篇补遗"},{"id":"986","number":986,"title":"饮湖上初晴后雨·其二","author":"苏轼","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"水光潋滟晴方好，山色空蒙雨亦奇。\n欲把西湖比西子，淡妆浓抹总相宜。","note":"经典名篇补遗"},{"id":"987","number":987,"title":"惠崇春江晚景·其一","author":"苏轼","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"竹外桃花三两枝，春江水暖鸭先知。\n蒌蒿满地芦芽短，正是河豚欲上时。","note":"经典名篇补遗"},{"id":"988","number":988,"title":"泊船瓜洲","author":"王安石","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"京口瓜洲一水间，钟山只隔数重山。\n春风又绿江南岸，明月何时照我还。","note":"经典名篇补遗"},{"id":"989","number":989,"title":"元日","author":"王安石","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"爆竹声中一岁除，春风送暖入屠苏。\n千门万户曈曈日，总把新桃换旧符。","note":"经典名篇补遗"},{"id":"990","number":990,"title":"梅花","author":"王安石","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"墙角数枝梅，凌寒独自开。\n遥知不是雪，为有暗香来。","note":"经典名篇补遗"},{"id":"991","number":991,"title":"小池","author":"杨万里","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"泉眼无声惜细流，树阴照水爱晴柔。\n小荷才露尖尖角，早有蜻蜓立上头。","note":"经典名篇补遗"},{"id":"992","number":992,"title":"晓出净慈寺送林子方","author":"杨万里","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"毕竟西湖六月中，风光不与四时同。\n接天莲叶无穷碧，映日荷花别样红。","note":"经典名篇补遗"},{"id":"993","number":993,"title":"过零丁洋","author":"文天祥","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"辛苦遭逢起一经，干戈寥落四周星。\n山河破碎风飘絮，身世浮沉雨打萍。\n惶恐滩头说惶恐，零丁洋里叹零丁。\n人生自古谁无死？留取丹心照汗青。","note":"经典名篇补遗"},{"id":"994","number":994,"title":"满江红·怒发冲冠","author":"岳飞","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"怒发冲冠，凭栏处、潇潇雨歇。\n抬望眼、仰天长啸，壮怀激烈。\n三十功名尘与土，八千里路云和月。\n莫等闲、白了少年头，空悲切。\n靖康耻，犹未雪。臣子恨，何时灭。\n驾长车，踏破贺兰山缺。\n壮志饥餐胡虏肉，笑谈渴饮匈奴血。\n待从头、收拾旧山河，朝天阙。","note":"经典名篇补遗"},{"id":"995","number":995,"title":"春日","author":"朱熹","tags":["宋诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"胜日寻芳泗水滨，无边光景一时新。\n等闲识得东风面，万紫千红总是春。","note":"经典名篇补遗"},{"id":"996","number":996,"title":"石灰吟","author":"于谦","tags":["明清"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"千锤万凿出深山，烈火焚烧若等闲。\n粉骨碎身浑不怕，要留清白在人间。","note":"经典名篇补遗"},{"id":"997","number":997,"title":"竹石","author":"郑燮","tags":["明清"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"咬定青山不放松，立根原在破岩中。\n千磨万击还坚劲，任尔东西南北风。","note":"经典名篇补遗"},{"id":"998","number":998,"title":"己亥杂诗·其五","author":"龚自珍","tags":["明清"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"浩荡离愁白日斜，吟鞭东指即天涯。\n落红不是无情物，化作春泥更护花。","note":"经典名篇补遗"},{"id":"999","number":999,"title":"己亥杂诗·其二百二十","author":"龚自珍","tags":["明清"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"九州生气恃风雷，万马齐喑究可哀。\n我劝天公重抖擞，不拘一格降人才。","note":"经典名篇补遗"},{"id":"1000","number":1000,"title":"长相思·山一程","author":"纳兰性德","tags":["明清"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山一程，水一程，身向榆关那畔行，夜深千帐灯。\n风一更，雪一更，聒碎乡心梦不成，故园无此声。","note":"经典名篇补遗"}];
let songs=[],db=null,favs=new Set(),history=[],notes={},settings={fontSize:19,lineHeight:2.15,dark:false},playlists=[];
let filter='全部', query='', readerId=null;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.add('on');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('on'),1700)}
function openDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open('shijing-local',2);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
const tx=(store,mode='readonly')=>db.transaction(store,mode).objectStore(store);
function get(store,key){return new Promise((res,rej)=>{const r=tx(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function getAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function put(store,v,key){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(v,key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(store,key){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function init(){
 try{db=await openDB();const stored=await getAll('songs');if(!stored.length){for(const s of SEED) await put('songs',s)}songs=await getAll('songs');const state=await get('state','main')||{};favs=new Set(state.favs||[]);history=state.history||[];notes=state.notes||{};settings={...settings,...(state.settings||{})};playlists=state.playlists||[];applyTheme();renderHome();}
 catch(e){songs=SEED;renderHome();toast('本地存储不可用，当前以只读模式运行')}
}
async function saveState(){if(!db)return;await put('state',{favs:[...favs],history,notes,settings,playlists},'main')}
async function saveSong(s){songs=songs.filter(x=>x.id!==s.id);songs.push(s);songs.sort((a,b)=>(a.number||0)-(b.number||0)||String(a.id).localeCompare(String(b.id)));if(db)await put('songs',s)}
function card(s){const user=s.source==='user';return `<div class="song" onclick="openSong('${esc(s.id)}')"><div class="num">${esc(s.id)}</div><div class="info"><b>${esc(s.title)}${user?'<span class="badge">我的</span>':''}</b><small>${esc((s.tags||[]).join(' · '))}${s.author?' · '+esc(s.author):''}${s.lyrics?' · 有歌词':''}</small></div><button class="heart ${favs.has(s.id)?'on':''}" onclick="event.stopPropagation();fav('${esc(s.id)}')">${favs.has(s.id)?'♥':'♡'}</button></div>`}
function renderHome(){const recent=history.map(id=>songs.find(s=>s.id===id)).filter(Boolean).slice(0,3);$('home').innerHTML=`<div class="top"><div><div class="eyebrow">本地优先 · 离线可读</div><div class="brand">诗经集</div></div><button class="btn circle" onclick="show('library')">⌕</button></div><div class="hero"><div class="eyebrow">随身的诗歌库</div><h1>愿这首诗歌，陪你安静一会儿。</h1><p>目录、收藏、历史、笔记和你添加的诗歌都保存在设备本地。没有网络也可以阅读。</p><button class="darkbtn" onclick="openSong('${esc((recent[0]||songs[0]||{}).id||'001')}')">开始阅读 →</button></div><div class="section"><div class="sectionhead"><h2>最近阅读</h2><button class="btn" onclick="show('library')">全部</button></div>${recent.length?recent.map(card).join(''):'<div class="empty">还没有阅读记录<br>去诗歌库看看吧。</div>'}</div><div class="section"><div class="sectionhead"><h2>本地统计</h2></div><div class="stats"><div class="stat"><span class="eyebrow">诗歌</span><b>${songs.length}</b></div><div class="stat"><span class="eyebrow">收藏</span><b>${favs.size}</b></div><div class="stat"><span class="eyebrow">有歌词</span><b>${songs.filter(s=>s.lyrics).length}</b></div></div></div>`}
function renderLibrary(){ $('library').innerHTML=`<div class="top"><div><div class="eyebrow">本地数据库</div><div class="brand">诗歌库</div></div><button class="btn circle" onclick="show('addpage')">＋</button></div><div class="search"><span>⌕</span><input id="q" value="${esc(query)}" placeholder="搜索编号、标题、歌词、主题" oninput="query=this.value;results()"><button class="btn" style="padding:6px 9px" onclick="query='';renderLibrary()">清除</button></div><div class="chips">${['全部','诗经','唐诗','宋词','宋诗','乐府','汉魏','元曲','明清'].map(t=>`<button class="chip ${filter===t?'active':''}" onclick="filter='${t}';renderLibrary()">${t}</button>`).join('')}</div><div id="results"></div>`;results()}
function results(){const q=(query||'').trim().toLowerCase();const arr=songs.filter(s=>(filter==='全部'||(s.tags||[]).includes(filter))&&(!q||[s.id,s.number,s.title,s.author,s.lyrics,(s.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)));const box=$('results');if(!box)return;box.innerHTML=`<div class="sectionhead" style="margin-top:22px"><h2>${arr.length} 首</h2><span style="color:var(--muted)">${filter}</span></div>${arr.slice(0,200).map(card).join('')||'<div class="empty">没有找到诗歌。</div>'}${arr.length>200?'<div class="empty">结果较多，仅显示前 200 首，请继续缩小搜索范围。</div>':''}`}
function renderFav(){const arr=songs.filter(s=>favs.has(s.id));$('fav').innerHTML=`<div class="top"><div><div class="eyebrow">我的收藏</div><div class="brand">收藏</div></div></div>${arr.map(card).join('')||'<div class="empty">还没有收藏。<br>在诗歌列表中点 ♡。</div>'}`}
function renderMine(){$('mine').innerHTML=`<div class="top"><div><div class="eyebrow">数据完全保存在本机</div><div class="brand">我的</div></div></div><div class="listbox"><div class="row"><span>诗歌总数</span><b>${songs.length}</b></div><div class="row"><span>收藏</span><b>${favs.size}</b></div><div class="row"><span>最近阅读</span><b>${history.length}</b></div><div class="row"><span>我的诗歌</span><b>${songs.filter(s=>s.source==='user').length}</b></div></div><div class="section"><div class="sectionhead"><h2>内容管理</h2></div><div class="listbox"><div class="row action" onclick="show('addpage')"><span>＋ 添加 / 编辑诗歌</span><span class="chev">›</span></div><div class="row action" onclick="importFile()"><span>📥 批量导入 JSON / TXT</span><span class="chev">›</span></div><div class="row action" onclick="exportAll()"><span>📤 备份全部本地数据</span><span class="chev">›</span></div><div class="row action" onclick="importBackup()"><span>♻️ 恢复备份</span><span class="chev">›</span></div><div class="row action" onclick="openSettings()"><span>⚙️ 阅读设置</span><span class="chev">›</span></div></div></div><div class="section"><div class="sectionhead"><h2>数据说明</h2></div><p class="small">已内置 1000 首经典诗词：诗经、唐诗三百首、宋词三百首及历代名篇，均为公有领域古籍原文，可离线阅读。你自己的诗歌会永久保存到 IndexedDB。</p></div>`}
function renderAdd(editId=''){const s=editId?songs.find(x=>x.id===editId):null;$('addpage').innerHTML=`<div class="top"><button class="btn circle" onclick="show('${s?'library':'library'}')">‹</button><div class="brand" style="font-size:20px">${s?'编辑诗歌':'添加诗歌'}</div><div style="width:42px"></div></div><div class="form"><label>编号</label><input id="sid" class="field" value="${esc(s?.id||'')}" placeholder="例如 1001" ${s?'readonly':''}><label>标题</label><input id="stitle" class="field" value="${esc(s?.title||'')}" placeholder="诗歌标题"><label>作者 / 译者</label><input id="sauthor" class="field" value="${esc(s?.author||'')}"><label>主题</label><input id="stags" class="field" value="${esc((s?.tags||[]).join(', '))}" placeholder="恩典, 安慰, 盼望"><label>歌词</label><textarea id="lyrics" class="field" placeholder="粘贴你有权使用的诗歌文本">${esc(s?.lyrics||'')}</textarea><label>备注</label><textarea id="snote" class="field" style="min-height:100px" placeholder="来源、版权状态、个人备注">${esc(s?.note||'')}</textarea><button class="primary" onclick="saveForm('${esc(editId)}')">保存到本地诗歌库</button>${s?`<button class="danger" style="width:100%;margin-top:10px" onclick="deleteSong('${esc(s.id)}')">删除这首诗歌</button>`:''}<p class="small">保存后即写入本机 IndexedDB，刷新页面不会丢失。</p></div>`}
async function saveForm(editId){let id=$('sid').value.trim(),title=$('stitle').value.trim();if(!id||!title){toast('请填写编号和标题');return}if(!editId&&songs.some(s=>s.id===id)){toast('编号已存在');return}const old=editId?songs.find(s=>s.id===editId):null;const s={id,number:Number(id)||0,title,author:$('sauthor').value.trim(),tags:$('stags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),lyrics:$('lyrics').value,note:$('snote').value,source:'user',copyrightStatus:old?.copyrightStatus||'用户自行确认'};await saveSong(s);toast('已保存');show('library')}
async function deleteSong(id){if(!confirm('确定删除这首用户诗歌？'))return;await del('songs',id);songs=songs.filter(s=>s.id!==id);favs.delete(id);history=history.filter(x=>x!==id);delete notes[id];await saveState();toast('已删除');show('library')}
async function fav(id){favs.has(id)?favs.delete(id):favs.add(id);await saveState();renderHome();renderLibrary();renderFav();renderMine();if(readerId===id)renderReader();toast(favs.has(id)?'已收藏':'已取消收藏')}
function openSong(id){const s=songs.find(x=>x.id===id);if(!s)return;readerId=id;history=[id,...history.filter(x=>x!==id)].slice(0,30);saveState();renderReader();$('nav').style.display='none';document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('reader').classList.add('show')}
function renderReader(){const s=songs.find(x=>x.id===readerId);if(!s)return;const lyric=s.lyrics?`<div class="lyrics">${esc(s.lyrics)}</div>`:`<div class="placeholder">这首诗歌暂缺正文。<br>你可以在「我的 → 添加 / 编辑诗歌」中补充你有权使用的文本。</div>`;$('reader').innerHTML=`<div class="readerbar"><button class="btn circle" onclick="closeReader()">‹</button><button class="btn circle" onclick="fav('${esc(s.id)}')">${favs.has(s.id)?'♥':'♡'}</button></div><div class="readerbody"><div class="rnum">${esc(s.id)}</div><h1>${esc(s.title)}</h1><div class="meta">${esc(s.author||'')}${s.tags?.length?' · '+esc(s.tags.join(' · ')):''}</div>${lyric}<div class="actions"><button class="round" onclick="speakCurrent()">🔊</button><button class="round" onclick="shareCurrent()">↗</button><button class="round" onclick="editSong('${esc(s.id)}')">✎</button><button class="round" onclick="openNote('${esc(s.id)}')">📝</button></div>${notes[s.id]?`<div class="section" style="text-align:left"><div class="sectionhead"><h2>我的笔记</h2><button class="btn" onclick="openNote('${esc(s.id)}')">编辑</button></div><div class="listbox" style="padding:15px;line-height:1.8;white-space:pre-wrap">${esc(notes[s.id])}</div></div>`:''}</div>`}
function closeReader(){$('reader').classList.remove('show');$('nav').style.display='flex';show('library')}
function editSong(id){renderAdd(id);show('addpage')}
function shareCurrent(){const s=songs.find(x=>x.id===readerId);if(!s)return;const text=`《${s.title}》\n${s.lyrics||''}`;if(navigator.share)navigator.share({title:s.title,text}).catch(()=>{});else navigator.clipboard?.writeText(text).then(()=>toast('已复制'))}
function speakCurrent(){const s=songs.find(x=>x.id===readerId);if(!s?.lyrics){toast('这首诗歌暂无歌词');return}if(!('speechSynthesis'in window)){toast('当前浏览器不支持朗读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.lyrics);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}
function openNote(id){$('sheet').innerHTML=`<h3>我的笔记</h3><textarea id="noteText" class="field" placeholder="写下这首诗歌带给你的感受、祷告或重点">${esc(notes[id]||'')}</textarea><div class="sheet-actions"><button class="btn" onclick="closeModal()">取消</button><button class="primary" onclick="saveNote('${esc(id)}')">保存</button></div>`;$('modal').classList.add('show')}
async function saveNote(id){notes[id]=$('noteText').value.trim();if(!notes[id])delete notes[id];await saveState();closeModal();renderReader();toast('笔记已保存')}
function openSettings(){$('sheet').innerHTML=`<h3>阅读设置</h3><div class="row"><span>字体大小</span><span><input id="fontSize" class="range" type="range" min="15" max="28" value="${settings.fontSize}"></span></div><div class="row"><span>行距</span><span><input id="lineHeight" class="range" type="range" min="1.5" max="2.8" step=".05" value="${settings.lineHeight}"></span></div><div class="row switch"><span>深色阅读</span><input id="dark" type="checkbox" ${settings.dark?'checked':''}></div><div class="sheet-actions"><button class="btn" onclick="closeModal()">取消</button><button class="primary" onclick="saveSettings()">保存</button></div>`;$('modal').classList.add('show')}
async function saveSettings(){settings.fontSize=Number($('fontSize').value);settings.lineHeight=Number($('lineHeight').value);settings.dark=$('dark').checked;applyTheme();await saveState();closeModal();if(readerId)renderReader();toast('设置已保存')}
function applyTheme(){document.documentElement.style.setProperty('--bg',settings.dark?'#171614':'#f7f4ee');document.documentElement.style.setProperty('--card',settings.dark?'#23211e':'#fffdf9');document.documentElement.style.setProperty('--ink',settings.dark?'#f4f0e8':'#292721');document.documentElement.style.setProperty('--muted',settings.dark?'#aaa39a':'#8b877f');document.documentElement.style.setProperty('--line',settings.dark?'#3a3732':'#e9e3d9');document.documentElement.style.setProperty('--soft',settings.dark?'#3a3026':'#ead8c2')}
function closeModal(){$('modal').classList.remove('show')}
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()}
function exportAll(){const payload={version:2,exportedAt:new Date().toISOString(),songs,favs:[...favs],history,notes,settings,playlists};download('诗经集-完整备份.json',JSON.stringify(payload,null,2),'application/json');toast('备份已导出')}
function importFile(){const i=document.createElement('input');i.type='file';i.accept='.json,.txt,.csv';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>handleImport(String(r.result),f.name);r.readAsText(f)};i.click()}
async function handleImport(text,name){try{let arr=[];if(name.toLowerCase().endsWith('.json')){const d=JSON.parse(text);arr=Array.isArray(d)?d:(d.songs||[]);if(d.favs){favs=new Set(d.favs)}if(d.history)history=d.history;if(d.notes)notes=d.notes;if(d.settings)settings={...settings,...d.settings};if(d.playlists)playlists=d.playlists}else{const blocks=text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);arr=blocks.map((b,i)=>{const lines=b.split(/\r?\n/);return{id:String(lines[0]?.match(/\d+/)?.[0]||Date.now()+i),number:Number(lines[0]?.match(/\d+/)?.[0]||0),title:lines[0].replace(/^\s*\d+[.、\s-]*/,'').trim()||`导入诗歌 ${i+1}`,author:'',tags:['未分类'],lyrics:lines.slice(1).join('\n'),source:'user',copyrightStatus:'用户自行确认'}})}let n=0;for(const raw of arr){if(!raw?.id||!raw?.title)continue;const s={id:String(raw.id),number:Number(raw.number)||Number(String(raw.id).replace(/\D/g,''))||0,title:String(raw.title),author:String(raw.author||''),tags:Array.isArray(raw.tags)?raw.tags:String(raw.tags||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean),lyrics:String(raw.lyrics||''),note:String(raw.note||''),source:'user',copyrightStatus:String(raw.copyrightStatus||'用户自行确认')};if(songs.some(x=>x.id===s.id)){const old=songs.find(x=>x.id===s.id);if(old.source!=='user'&&s.source==='user'){} else if(old.source==='user'){} else {continue}}await saveSong(s);n++}await saveState();applyTheme();toast(`已导入 ${n} 首`);renderMine();renderLibrary()}catch(e){console.error(e);toast('导入失败，请检查文件格式')}}
function importBackup(){importFile()}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('reader').classList.remove('show');$(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===id));const fn={home:renderHome,library:renderLibrary,fav:renderFav,mine:renderMine,addpage:()=>renderAdd()}[id];if(fn)fn()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.page));$('add').onclick=()=>show('addpage');init();
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script></body></html>
