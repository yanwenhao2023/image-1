5,"title":"听蜀僧濬弹琴","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蜀僧抱绿绮，西下峨眉峰。\n为我一挥手，如听万壑松。\n客心洗流水，余响入霜钟。\n不觉碧山暮，秋云暗几重。","note":"选自《唐诗三百首》"},{"id":"636","number":636,"title":"怨情","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"美人卷珠帘，深坐颦蛾眉。\n但见泪痕湿，不知心恨谁。","note":"选自《唐诗三百首》"},{"id":"637","number":637,"title":"淮上喜会梁川故人","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"江汉曾为客，相逢每醉还。\n浮云一别后，流水十年间。\n欢笑情如旧，萧疎鬓已斑。\n何因北归去，淮上对秋山。","note":"选自《唐诗三百首》"},{"id":"638","number":638,"title":"郡斋雨中与诸文士燕集","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"兵卫森画戟，宴寝凝清香。\n海上风雨至，逍遥池阁凉。\n烦疴近消散，嘉宾复满堂。\n自慙居处崇，未覩斯民康。\n理会是非遣，性达形迹忘。\n鲜肥属时禁，蔬果幸见尝。\n俯饮一杯酒，仰聆金玉章。\n神欢体自轻，意欲凌风翔。\n吴中盛文史，群彦今汪洋。\n方知大藩地，岂曰财赋疆。","note":"选自《唐诗三百首》"},{"id":"639","number":639,"title":"初发扬子寄元大校书","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"凄凄去亲爱，泛泛入烟雾。\n归棹洛阳人，残钟广陵树。\n今朝此为别，何处还相遇。\n世事波上舟，沿洄安得住。","note":"选自《唐诗三百首》"},{"id":"640","number":640,"title":"相和歌辞 江南曲","author":"李益","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"嫁得瞿塘贾，朝朝误妾期。\n早知潮有信，嫁与弄潮儿。","note":"选自《唐诗三百首》"},{"id":"641","number":641,"title":"相和歌辞 燕歌行","author":"高适","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"汉家烟尘在东北，汉将辞家破残贼。\n男儿本自重横行，天子非常赐颜色。\n𪭢金伐鼓下榆关，旌旗逶迤碣石间。\n校尉羽书飞瀚海，单于猎火照狼山。\n山川萧条极边土，胡骑凭凌杂风雨。\n战士军前半死生，美人帐下犹歌舞。\n大漠穷秋塞草衰，孤城落日鬬兵稀。\n身当恩遇常轻敌，力尽关山未解围。\n铁衣远戍辛勤久，玉箸应啼别离后。\n少妇城南欲断肠，征人蓟北空回首。\n边风飘飘那可度，绝域苍茫更何有。\n杀气三日作阵云，寒声一夜传刁斗。\n相看白刃血纷纷，死节从来岂顾勋。\n君不见沙场征战苦，至今犹忆李将军。","note":"选自《唐诗三百首》"},{"id":"642","number":642,"title":"相和歌辞 从军行","author":"李颀","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"白日登山望烽火，昏黄饮马傍交河。\n行人刁斗风砂暗，公主琵琶幽怨多。\n野营万里无城郭，雨雪纷纷连大漠。\n胡雁哀鸣夜夜飞，胡儿眼泪双双落。\n闻道玉门犹被遮，应将性命逐轻车。\n年年战骨埋荒外，空见蒲萄入汉家。","note":"选自《唐诗三百首》"},{"id":"643","number":643,"title":"相和歌辞 蜀道难","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"噫吁嚱！危乎高哉！蜀道之难难于上青天！蚕丛及鱼凫，开国何茫然。\n尔来四万八千岁，乃与秦塞通人烟。\n西当太白有鸟道，可以横绝峨眉巅。\n地崩山摧壮士死，然后天梯石栈方钩连。\n上有六龙回日之高标，下有冲波逆折之回川。\n黄鹤之飞尚不得，猨猱欲度愁攀缘。\n青泥何盘盘，百步九折萦岩峦。\n扪参历井仰胁息，以手抚膺坐长叹。\n问君西游何时还？畏途巉岩不可攀。\n但见悲鸟号枯木，雄飞呼雌绕林间。\n又闻子规啼夜月，愁空山，蜀道之难难于上青天！使人听此雕朱颜。\n连峰去天不盈尺，枯松倒挂倚绝壁。\n飞湍瀑流相喧豗，砅崖转石万壑雷。\n其崄也若此，嗟尔远道之人胡为乎来哉？劒阁峥嵘而崔嵬，一夫当关，万夫莫开。\n所守或匪亲，化为狼与豺。\n朝避猛虎，夕避长蛇。\n磨牙吮血，杀人如麻。\n锦城虽云乐，不如早还家。\n蜀道之难难于上青天，侧身西望长咨嗟。","note":"选自《唐诗三百首》"},{"id":"644","number":644,"title":"相和歌辞 长信怨 二","author":"王昌龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"奉帚平明金殿开，暂将团扇共裴回。\n玉颜不及寒鵶色，犹带昭阳日影来。","note":"选自《唐诗三百首》"},{"id":"645","number":645,"title":"相和歌辞 玉阶怨","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"玉阶生白露，夜久侵罗袜。\n却下水精帘，玲珑望秋月。","note":"选自《唐诗三百首》"},{"id":"646","number":646,"title":"相和歌辞 子夜四时歌四首 春歌","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"秦地罗敷女，采桑绿水边。\n素手青条上，红妆白日鲜。\n蚕饥妾欲去，五马莫留连。","note":"选自《唐诗三百首》"},{"id":"647","number":647,"title":"相和歌辞 子夜四时歌四首 夏歌","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"镜湖三百里，菡萏发荷花。\n五月西施采，人看隘若邪。\n回舟不待月，归去越王家。","note":"选自《唐诗三百首》"},{"id":"648","number":648,"title":"相和歌辞 子夜四时歌四首 秋歌","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"长安一片月，万户捣衣声。\n秋风吹不尽，总是玉关情。\n何日平胡虏？良人罢远征。","note":"选自《唐诗三百首》"},{"id":"649","number":649,"title":"相和歌辞 子夜四时歌四首 冬歌","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"明朝驿使发，一夜絮征袍。\n素手抽针冷，那堪把剪刀。\n裁缝寄远道，几日到临洮。","note":"选自《唐诗三百首》"},{"id":"650","number":650,"title":"琴曲歌辞 列女操","author":"孟郊","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"梧桐相待老，鸳鸯会双死。\n贞妇贵徇夫，舍生亦如此。\n波澜誓不起，妾心井中水。","note":"选自《唐诗三百首》"},{"id":"651","number":651,"title":"杂曲歌辞 游子吟","author":"孟郊","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"慈母手中线，游子身上衣。\n临行密密缝，意恐迟迟归。\n谁言寸草心，报得三春晖。","note":"选自《唐诗三百首》"},{"id":"652","number":652,"title":"杂曲歌辞 丽人行","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"三月三日天气新，长安水边多丽人。\n态浓意远淑且真，肌理细腻骨肉匀。\n绣罗衣裳照暮春，蹙金孔雀银麒麟。\n头上何所有？翠微㔩叶垂鬓唇。\n背后何所见？珠压腰衱稳称身。\n就中云幕椒房亲，赐名大国虢与秦。\n紫𫘞之峰出翠釜，水晶之盘行素鳞。\n犀筯厌饫久未下，鸾刀缕切空纷纶。\n黄门飞鞚不动尘，御厨丝络送八珍。\n箫鼓哀吟感鬼神，宾从杂遝实要津。\n后来鞍马何逡巡，当轩下马入锦茵。\n杨花雪落覆白苹，青鸟飞去衔红巾。\n炙手可热势绝伦，慎莫近前丞相嗔。","note":"选自《唐诗三百首》"},{"id":"653","number":653,"title":"杂曲歌辞 长相思三首 一","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"长相思，在长安，络纬秋啼金井栏。\n微霜凄凄簟色寒，孤灯不明思欲绝。\n卷帷望月空长叹，美人如花隔云端。\n上有青冥之长天，下有绿水之波澜。\n天长路远魂飞苦，梦魂不到关山难。\n长相思，摧心肝。","note":"选自《唐诗三百首》"},{"id":"654","number":654,"title":"杂曲歌辞 长相思三首 二","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"日色已尽花含烟，月明欲素愁不眠。\n赵瑟初停凤凰柱，蜀琴欲奏鸳鸯弦。\n此曲有意无人传，愿随春风寄燕然，忆君迢迢隔青天。\n昔日横波目，今成流泪泉。\n不信妾肠断，归来看取明镜前。","note":"选自《唐诗三百首》"},{"id":"655","number":655,"title":"杂曲歌辞 行路难三首 一","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"金尊清酒斗十千，玉盘珍羞直万钱。\n停杯投筯不能食，拔劒四顾心茫然。\n欲渡黄河冰塞川，将登太行雪暗天。\n闲来垂钓坐溪上，忽复乘舟梦日边。\n行路难，行路难，多岐路，今安在？长风破浪会有时，直挂云帆济沧海。","note":"选自《唐诗三百首》"},{"id":"656","number":656,"title":"杂曲歌辞 行路难三首 二","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"大道如青天，我独不得出。\n羞逐长安社中儿，赤鸡白狗赌梨栗。\n弹劒作歌奏苦声，曳裾王门不称情。\n淮阴市井笑韩信，汉朝公卿忌贾生。\n君不见昔时燕家重郭隗，拥篲折腰无嫌猜。\n剧辛乐毅感恩分，输肝剖胆效英才。\n昭王白骨萦蔓草，谁人更扫黄金台。\n行路难，归去来。","note":"选自《唐诗三百首》"},{"id":"657","number":657,"title":"杂曲歌辞 行路难三首 三","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有耳莫洗颍川水，有口莫食首阳蕨。\n含光混世贵无名，何用孤高比云月。\n吾观自古贤达人，功成不退皆殒身。\n子胥既弃吴江上，屈原终投湘水滨。\n陆机才多岂自保，李斯税驾苦不早。\n华亭鹤唳讵可闻，上蔡苍鹰何足道？君不见吴中张翰称达士，秋风忽忆江东行。\n且乐生前一杯酒，何须身后千载名。","note":"选自《唐诗三百首》"},{"id":"658","number":658,"title":"杂曲歌辞 长干曲四首 一","author":"崔颢","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君家定何处？妾住在横塘。\n停舟暂借问，或恐是同乡。","note":"选自《唐诗三百首》"},{"id":"659","number":659,"title":"杂曲歌辞 长干曲四首 二","author":"崔颢","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"家临九江水，去来九江侧。\n同是长干人，生小不相识。","note":"选自《唐诗三百首》"},{"id":"660","number":660,"title":"杂曲歌辞 长干行二首 一","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"妾发初覆额，折花门前剧。\n郎骑竹马来，遶床弄青梅。\n同居长干里，两小无嫌猜。\n十四为君妇，羞颜尚不开。\n低头向暗壁，千唤不一回。\n十五始展眉，愿同尘与灰。\n常存抱柱信，岂上望夫台。\n十六君远行，瞿塘滟预堆。\n五月不可触，猨鸣天上哀。\n门前迟行迹，一一生绿苔。\n苔深不能扫，落叶秋风早。\n八月蝴蝶来，双飞西园草。\n感此伤妾心，坐愁红颜老。\n早晚下三巴，预将书报家。\n相迎不道远，直至长风沙。","note":"选自《唐诗三百首》"},{"id":"661","number":661,"title":"杂曲歌辞 独不见","author":"沈佺期","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"卢家小妇郁金堂，海燕双栖玳瑁梁。\n九月寒砧催下叶，十年征戍忆辽阳。\n白狼河北音书断，丹凤城南秋夜长。\n谁知含愁独不见，使妾明月照流黄。","note":"选自《唐诗三百首》"},{"id":"662","number":662,"title":"杂曲歌辞 秋夜曲","author":"王涯","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"桂魄初生秋露微，轻罗已薄未更衣。\n银筝夜久殷勤弄，心怯空房不忍归。","note":"选自《唐诗三百首》"},{"id":"663","number":663,"title":"春思","author":"皇甫冉","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"莺啼燕语报新年，马邑龙堆路几千。\n家住秦城邻汉苑，心随明月到胡天。\n机中锦字论长恨，楼上花枝笑独眠。\n为问元戎窦车骑，何时反斾勒燕然。","note":"选自《唐诗三百首》"},{"id":"664","number":664,"title":"夜月","author":"刘方平","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"更深月色半人家，北斗阑干南斗斜。\n今夜偏知春气暖，虫声新透绿窗纱。","note":"选自《唐诗三百首》"},{"id":"665","number":665,"title":"春怨","author":"刘方平","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"纱窗日落渐黄昏，金屋无人见泪痕。\n寂寞空庭春欲晚，梨花满地不开门。","note":"选自《唐诗三百首》"},{"id":"666","number":666,"title":"登鹳雀楼","author":"王之涣","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"白日依山尽，黄河入海流。\n欲穷千里目，更上一层楼。","note":"选自《唐诗三百首》"},{"id":"667","number":667,"title":"凉州词二首 一","author":"王之涣","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"黄河远上白云间，一片孤城万仞山。\n羌笛何须怨杨柳，春光不度玉门关。","note":"选自《唐诗三百首》"},{"id":"668","number":668,"title":"阙题","author":"刘眘虚","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"道由白云尽，春与青溪长。\n时有落花至，远随流水香。\n闲门向山路，深柳读书堂。\n幽映每白日，清辉照衣裳。","note":"选自《唐诗三百首》"},{"id":"669","number":669,"title":"征怨","author":"柳中庸","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"岁岁金河复玉关，朝朝马策与刀环。\n三春白雪归青冢，万里黄河遶黑山。","note":"选自《唐诗三百首》"},{"id":"670","number":670,"title":"送李端","author":"严维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"故关衰草遍，离别正堪悲。\n路出寒云外，人归暮雪时。\n少孤为客早，多难识君迟。\n揜泣空相向，风尘何所期。","note":"选自《唐诗三百首》"},{"id":"671","number":671,"title":"宫词五首 二","author":"顾况","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"玉楼天半起笙歌，风送宫嫔笑语和。\n月殿影开闻夜漏，水精帘卷近银河。","note":"选自《唐诗三百首》"},{"id":"672","number":672,"title":"湘春夜月·近清明","author":"黄孝迈","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"近清明。\n翠禽枝上消魂。\n可惜一片清歌，都付与黄昏。\n欲共柳花低诉，怕柳花轻薄，不解伤春。\n念楚乡旅宿，柔情别绪，谁与温存。\n空樽夜泣，青山不语，残月当门。\n翠玉楼前，惟是有、一波湘水，摇荡湘云。\n天长梦短，问甚时、重见桃根。\n这次第，算人间没个并刀，翦断心上愁痕。","note":"选自《宋词三百首》"},{"id":"673","number":673,"title":"瑞鹤仙·湿云黏雁影","author":"陆叡","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"湿云黏雁影。\n望征路愁迷，离绪难整。\n千金买光景。\n但疏钟催晓，乱鸦啼暝。\n花暗省。\n许多情、相逢梦境。\n便行云、都不归来，也合寄将音信。\n孤迥。\n盟鸾心在，跨鹤程高，後期无准。\n情丝待翦。\n翻惹得，旧时恨。\n怕天教何处，参差双燕，还染残朱剩粉。\n对菱花、与说相思，看谁瘦损。","note":"选自《宋词三百首》"},{"id":"674","number":674,"title":"渡江云三犯・渡江云·羞红颦浅恨","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"羞红颦浅恨，晚风为落，片绣点重茵。\n旧堤分燕尾，桂棹轻鸥，宝勒倚残云。\n千丝怨碧，渐路入、仙坞迷津。\n肠漫回，隔花时见，背面楚腰身。\n逡巡。\n题门惆怅，堕履牵萦，数幽期难准。\n还始觉、留情缘眼，宽带因春。\n明朝事与孤烟冷，做满湖、风雨愁人。\n山黛暝，尘波澹绿无痕。","note":"选自《宋词三百首》"},{"id":"675","number":675,"title":"霜叶飞·断烟离绪","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"断烟离绪。\n关心事，斜阳红隐霜树。\n半壶秋水荐黄花，香西风雨。\n纵玉勒、轻飞迅羽。\n凄凉谁吊荒台古。\n记醉蹋南屏，彩扇咽、寒蝉倦梦，不知蛮素。\n聊对旧节传杯，尘笺蠹管，断阕经岁慵赋。\n小蟾斜影转东篱，夜冷残蛩语。\n早白发、缘愁万缕。\n惊飙从卷乌纱去。\n漫细将、茱萸看，但约明年，翠微高处。","note":"选自《宋词三百首》"},{"id":"676","number":676,"title":"瑞鹤仙·晴丝牵绪乱","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"晴丝牵绪乱。\n对沧江斜日，花飞人远。\n垂杨暗吴苑。\n正旗亭烟冷，河桥风暖。\n兰情蕙盼。\n惹相思、春根酒畔。\n又争知、吟骨萦销，渐把旧衫重翦。\n凄断。\n流红千浪，缺月孤楼，总难留燕。\n歌尘凝扇。\n待凭信，拌分钿。\n试挑灯欲写，还依不忍，笺幅偷和泪卷。\n寄残云、剩雨蓬莱，也应梦见。","note":"选自《宋词三百首》"},{"id":"677","number":677,"title":"宴清都·绣幄鸳鸯柱","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绣幄鸳鸯柱。\n红情密，腻云低护秦树。\n芳根兼倚，花梢钿合，锦屏人妒。\n东风睡足交枝，正梦花、瑶钗燕股。\n障滟蜡、满照欢丛，嫠蟾冷落羞度。\n人间万感幽单，华清惯浴，春盎风露。\n连鬟并暖，同心共结，向承恩处。\n凭谁为歌长恨，暗殿锁、秋灯夜语。\n叙旧期、不负春盟，红朝翠暮。","note":"选自《宋词三百首》"},{"id":"678","number":678,"title":"齐天乐·烟波桃叶西陵路","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"烟波桃叶西陵路，十年断魂潮尾。\n古柳重攀，轻鸥聚别，陈迹危亭独倚。\n凉颸乍起。\n渺烟碛飞帆，暮山横翠。\n但有江花，共临秋镜照憔悴。\n华堂烛暗送客，眼波回盼处，芳艳流水。\n素骨凝冰，柔葱蘸雪，犹忆分瓜深意。\n清尊未洗。\n梦不湿行云，漫沾残泪。\n可惜秋宵，乱蛩疏雨里。","note":"选自《宋词三百首》"},{"id":"679","number":679,"title":"风入松·听风听雨过清明","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"听风听雨过清明。\n愁草瘗花铭。\n楼前绿暗分携路，一丝柳、一寸柔情。\n料峭春寒中酒，交加晓梦啼莺。\n西园日日扫林亭。\n依旧赏新晴。\n黄蜂频扑秋千索，有当时、纤手香凝。\n惆怅双鸳不到，幽阶一夜苔生。","note":"选自《宋词三百首》"},{"id":"680","number":680,"title":"莺啼序·残寒正欺病酒","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"残寒正欺病酒，掩沈香绣户。\n燕来晚、飞入西城，似说春事迟暮。\n画船载、清明过却，晴烟冉冉吴宫树。\n念羁情游荡，随风化为轻絮。\n十载西湖，傍柳系马，趁娇尘软雾。\n溯红渐、招入仙溪，锦儿偷寄幽素。\n倚银屏、春宽梦窄，断红湿、歌纨金缕。\n暝堤空，轻把斜阳，总还鸥鹭。\n幽兰旋老，杜若还生，水乡尚寄旅。\n别後访、六桥无信，事往花委，瘗玉埋香，几番风雨。\n长波妒盼，遥山羞黛，渔灯分影春江宿，记当时、短楫桃根渡。\n青楼彷佛，临分败壁题诗，泪墨惨澹尘土。\n危亭望极，草色天涯，吹鬓侵半苎。\n暗点检、离痕欢唾，尚染鲛绡，凤迷归，破鸾慵舞。\n殷勤待写，书中长恨，蓝霞辽海沈过雁，漫相思、弹入哀筝柱。\n伤心千里江南，怨曲重招，断魂在否。","note":"选自《宋词三百首》"},{"id":"681","number":681,"title":"惜黄花慢·送客吴皋","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"送客吴皋。\n正试霜夜冷，枫落长桥。\n望天不尽，背城渐杳，离亭黯黯，恨水迢迢。\n翠香零落红衣老，暮愁锁、残柳眉梢。\n念瘦腰。\n沈郎旧日，曾系兰桡。\n仙人凤咽琼箫。\n怅断魂送远，九辨难招。\n醉鬟留盼，小窗翦烛，歌云载恨，飞上银霄。\n素秋不解随船去，败红趁、一叶寒涛。\n梦翠翘。\n怨鸿料过南谯。","note":"选自《宋词三百首》"},{"id":"682","number":682,"title":"瑞鹤仙·郊原初过雨","author":"袁去华","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"郊原初过雨。\n见败叶零乱，风定犹舞。\n斜阳挂深树。\n映浓愁浅黛，遥山眉妩。\n来时旧路。\n尚岩花、娇黄半吐。\n到而今，唯有溪边流水，见人如故。\n无语。\n邮亭深静，下马还寻，旧曾题处。\n无聊倦旅。\n伤离恨，最愁苦。\n纵收香藏镜，他年重到，人面桃花在否。\n念沈沈、小阁幽窗，有时梦去。","note":"选自《宋词三百首》"},{"id":"683","number":683,"title":"剑器近·夜来雨","author":"袁去华","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"夜来雨。\n赖倩得、东风吹住。\n海棠正妖饶处。\n且留取。\n悄庭户。\n试细听、莺啼燕语。\n分明共人愁绪。\n怕春去。\n佳树。\n翠阴初转午。\n重帘未卷，乍睡起、寂寞看风絮。\n偷弹清泪寄烟波，见江头故人，为言憔悴如许。\n彩笺无数。\n去却寒暄，到了浑无定据。\n断肠落日千山暮。","note":"选自《宋词三百首》"},{"id":"684","number":684,"title":"安公子·弱柳丝千缕","author":"袁去华","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"弱柳丝千缕。\n嫩黄匀遍鸦啼处。\n寒入罗衣春尚浅，过一番风雨。\n问燕子来时，绿水桥边路。\n曾画楼、见个人人否。\n料静掩云窗，尘满哀弦危柱。\n庾信愁如许。\n为谁都著眉端聚。\n独立东风弹泪眼，寄烟波东去。\n念永昼春闲，人倦如何度。\n闲傍枕、百啭黄鹂语。\n唤觉来厌厌，残照依然花坞。","note":"选自《宋词三百首》"},{"id":"685","number":685,"title":"卜算子·驿外断桥边","author":"陆游","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"驿外断桥边，寂寞开无主。\n已是黄昏独自愁，更著风和雨。\n无意苦争春，一任群芳妒。\n零落成泥碾作尘，只有香如故。","note":"选自《宋词三百首》"},{"id":"686","number":686,"title":"凤箫吟・芳草·锁离愁","author":"韩缜","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"锁离愁，连绵无际，来时陌上初熏。\n绣帏人念远，暗垂珠泪，泣送征轮。\n长亭长在眼，更重重、远水孤云。\n但望极楼高，尽日目断王孙。\n消魂。\n池塘别後，曾行处、绿妒轻裙。\n恁时携素手，乱花飞絮里，缓步香。\n朱颜空自改，向年年、芳意长新。\n遍绿野，嬉游醉眠，莫负青春。","note":"选自《宋词三百首》"},{"id":"687","number":687,"title":"桂枝香·登临送目","author":"王安石","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"登临送目。\n正故国晚秋，天气初肃。\n千里澄江似练，翠峰如簇。\n归帆去棹残阳里，背西风、酒旗斜矗。\n彩舟云淡，星河鹭起，画图难足。\n念往昔、繁华竞逐。\n叹门外楼头，悲恨相续。\n千古凭高，对此漫嗟荣辱。\n六朝旧事随流水，但寒烟、芳草凝绿。\n至今商女，时时犹唱，後庭遗曲。","note":"选自《宋词三百首》"},{"id":"688","number":688,"title":"清平乐·留春不住","author":"王安石","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"留春不住。\n费尽莺儿语。\n满地残红宫锦污。\n昨夜南园风雨。\n小怜初上琵琶。\n晓来思绕天涯。\n不肯画堂朱户，春风自在杨花。","note":"选自《宋词三百首》"},{"id":"689","number":689,"title":"千秋岁引·别馆寒砧","author":"王安石","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"别馆寒砧，孤城画角。\n一派秋声入寥廓。\n东归燕从海上去，南来雁向沙头落。\n楚台风，庾楼月，宛如昨。\n无奈被些名利缚。\n无奈被他情担阁。\n可惜风流总闲却。\n当初漫留华表语，而今误我秦楼约。\n梦阑时，酒醒後，思量著。","note":"选自《宋词三百首》"},{"id":"690","number":690,"title":"清平乐·留春不住","author":"王安国","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"留春不住。\n费尽莺儿语。\n满地残红宫锦污。\n昨夜南园风雨。\n小怜初上琵琶。\n晓来思绕天涯。\n不肯画堂朱户，春风自在梨花。","note":"选自《宋词三百首》"},{"id":"691","number":691,"title":"临江仙·梦後楼台高锁","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"梦後楼台高锁，酒醒帘幕低垂。\n去年春恨却来时。\n落花人独立，微雨燕双飞。\n记得小苹初见，两重心字罗衣。\n琵琶弦上说相思。\n当时明月在，曾照彩云归。","note":"选自《宋词三百首》"},{"id":"692","number":692,"title":"蝶恋花·卷絮风头寒欲尽","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"卷絮风头寒欲尽。\n坠粉飘红，日日香成阵。\n新酒又添残酒困。\n今春不减前春恨。\n蝶去莺飞无处问。\n隔水高楼，望断双鱼信。\n恼乱层波横一寸。\n斜阳只与黄昏近。","note":"选自《宋词三百首》"},{"id":"693","number":693,"title":"蝶恋花·醉别西楼醒不记","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"醉别西楼醒不记。\n春梦秋云，聚散真容易。\n斜月半窗还少睡。\n画屏闲展吴山翠。\n衣上酒痕诗里字。\n点点行行，总是凄凉意。\n红烛自怜无好计。\n夜寒空替人垂泪。","note":"选自《宋词三百首》"},{"id":"694","number":694,"title":"蝶恋花·梦入江南烟水路","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"梦入江南烟水路。\n行尽江南，不与离人遇。\n睡里消魂无说处。\n觉来惆怅消魂误。\n欲尽此情书尺素。\n浮雁沈鱼，终了无凭据。\n却倚缓弦歌别绪。\n断肠移破秦筝柱。","note":"选自《宋词三百首》"},{"id":"695","number":695,"title":"鹧鸪天·彩袖殷勤捧玉锺","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"彩袖殷勤捧玉锺。\n当年拼却醉颜红。\n舞低杨柳楼心月，歌尽桃花扇影风。\n从别後，忆相逢。\n几回魂梦与君同。\n今宵剩把银釭照，犹恐相逢是梦中。","note":"选自《宋词三百首》"},{"id":"696","number":696,"title":"生查子·关山魂梦长","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"关山魂梦长，鱼雁音尘少。\n两鬓可怜青，只为相思老。\n归梦碧纱窗，说与人人道。\n真个别离难，不似相逢好。","note":"选自《宋词三百首》"},{"id":"697","number":697,"title":"清平乐·留人不住","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"留人不住。\n醉解兰舟去。\n一棹碧涛春水路。\n过尽晓莺啼处。\n渡头杨柳青青。\n枝枝叶叶离情。\n此後锦书休寄，画楼云雨无凭。","note":"选自《宋词三百首》"},{"id":"698","number":698,"title":"木兰花・玉楼春·秋千院落重帘暮","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"秋千院落重帘暮。\n彩笔闲来题绣户。\n墙头丹杏雨馀花，门外绿杨风後絮。\n朝云信断知何处。\n应作襄王春梦去。\n紫骝认得旧游踪，嘶过画桥东畔路。","note":"选自《宋词三百首》"},{"id":"699","number":699,"title":"菩萨蛮·哀筝一弄湘江曲","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"哀筝一弄湘江曲。\n声声写尽湘波绿。\n纤指十三弦。\n细将幽恨传。\n当筵秋水慢。\n玉柱斜飞雁。\n弹到断肠时。\n春山眉黛低。","note":"选自《宋词三百首》"},{"id":"700","number":700,"title":"玉楼春·东风又作无情计","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东风又作无情计。\n艳粉娇红吹满地。\n碧楼帘影不遮愁，还似去年今日意。\n谁知错管春残事。\n到处登临曾费泪。\n此时金盏直须深，看尽落花能几醉。","note":"选自《宋词三百首》"},{"id":"701","number":701,"title":"阮郎归·旧香残粉似当初","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"旧香残粉似当初。\n人情恨不如。\n一春犹有数行书。\n秋来书更疏。\n衾凤冷，枕鸳孤。\n愁肠待酒舒。\n梦魂纵有也成虚。\n那堪和梦无。","note":"选自《宋词三百首》"},{"id":"702","number":702,"title":"阮郎归·天边金掌露成霜","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"天边金掌露成霜。\n云随雁字长。\n绿杯红袖称重阳。\n人情似故乡。\n兰佩紫，菊簪黄。\n殷勤理旧狂。\n欲将沈醉换悲凉。\n清歌莫断肠。","note":"选自《宋词三百首》"},{"id":"703","number":703,"title":"六么令·绿阴春尽","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绿阴春尽，飞絮绕香阁。\n晚来翠眉宫样，巧把远山学。\n一寸狂心未说，已向横波觉。\n画帘遮币。\n新翻曲妙，暗许闲人带偷掏。\n前度书多隐语，意浅愁难答。\n昨夜诗有回纹，韵险还慵押。\n都待笙歌散了，记取留时霎。\n不消红蜡。\n闲云归後，月在庭花旧阑角。","note":"选自《宋词三百首》"},{"id":"704","number":704,"title":"御街行·街南绿树春饶絮","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"街南绿树春饶絮。\n雪满游春路。\n树头花艳杂娇云，树底人家朱户。\n北楼闲上，疏帘高卷，直见街南树。\n阑干倚尽犹慵去。\n几度黄昏雨。\n晚春盘马踏青苔，曾傍绿阴深驻。\n落花犹在，香屏空掩，人面知何处。","note":"选自《宋词三百首》"},{"id":"705","number":705,"title":"虞美人·曲阑干外天如水","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"曲阑干外天如水。\n昨夜还曾倚。\n初将明月比佳期。\n长向月圆时候、望人归。\n罗衣著破前香在。\n旧意谁教改。\n一春离恨懒调弦。\n犹有两行闲泪、宝筝前。","note":"选自《宋词三百首》"},{"id":"706","number":706,"title":"留春令·画屏天畔","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"画屏天畔，梦回依约，十洲云水。\n手拈红笺寄人书，写无限、伤春事。\n别浦高楼曾漫倚。\n对江南千里。\n楼下分流水声中，有当日、凭高泪。","note":"选自《宋词三百首》"},{"id":"707","number":707,"title":"思远人·红叶黄花秋意晚","author":"晏几道","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"红叶黄花秋意晚，千里念行客。\n飞云过尽，归鸿无信，何处寄书得。\n泪弹不尽临窗滴。\n就砚旋研墨。\n渐写到别来，此情深处，红笺为无色。","note":"选自《宋词三百首》"},{"id":"708","number":708,"title":"生查子·关山魂梦长","author":"王观","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"关山魂梦长，塞雁音书少。\n两鬓可怜青，一夜相思老。\n归傍碧纱窗，说与人人道。\n真个别离难，不似相逢好。","note":"选自《宋词三百首》"},{"id":"709","number":709,"title":"水龙吟·似花还似非花","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"似花还似非花，也无人惜从教坠。\n抛家傍路，思量却是，无情有思。\n萦损柔肠，困酣娇眼，欲开还闭。\n梦随风万里，寻郎去处，又还被、莺呼起。\n不恨此花飞尽，恨西园、落红难缀。\n晓来雨过，遗踪何在，一池萍碎。\n春色三分，二分尘土，一分流水。\n细看来，不是杨花点点，是离人泪。","note":"选自《宋词三百首》"},{"id":"710","number":710,"title":"水调歌头·明月几时有","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"明月几时有，把酒问青天。\n不知天上宫阙，今夕是何年。\n我欲乘风归去，又恐琼楼玉宇，高处不胜寒。\n起舞弄清影，何似在人间。\n转朱阁，低绮户，照无眠。\n不应有恨，何事长向别时圆。\n人有悲欢离合，月有阴晴圆缺，此事古难全。\n但愿人长久，千里共婵娟。","note":"选自《宋词三百首》"},{"id":"711","number":711,"title":"临江仙·夜饮东坡醒复醉","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"夜饮东坡醒复醉，归来仿佛三更。\n家童鼻息已雷鸣。\n敲门都不应，倚杖听江声。\n长恨此身非我有，何时忘却营营。\n夜阑风静縠纹平。\n小舟从此逝，江海寄馀生。","note":"选自《宋词三百首》"},{"id":"712","number":712,"title":"定风波·莫听穿林打叶声","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"莫听穿林打叶声。\n何妨吟啸且徐行。\n竹杖芒鞋轻胜马。\n谁怕。\n一蓑烟雨任平生。\n料峭春风吹酒醒。\n微冷。\n山头斜照却相迎。\n回首向来萧瑟处。\n归去。\n也无风雨也无晴。","note":"选自《宋词三百首》"},{"id":"713","number":713,"title":"卜算子·缺月挂疏桐","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"缺月挂疏桐，漏断人初静。\n时见幽人独往来，缥缈孤鸿影。\n惊起却回头，有恨无人省。\n拣尽寒枝不肯栖，枫落吴江冷。","note":"选自《宋词三百首》"},{"id":"714","number":714,"title":"贺新郎·乳燕飞华屋","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"乳燕飞华屋。\n悄无人、桐阴转午，晚凉新浴。\n手弄生绡白团扇，扇手一时似玉。\n渐困倚、孤眠清熟。\n帘外谁来推绣户，枉教人、梦断瑶台曲。\n又却是，风敲竹。\n石榴半吐红巾蹙。\n待浮花、浪蕊都尽，伴君幽独。\n艳一枝细看取，芳心千重似束。\n又恐被、秋风惊绿。\n若待得君来向此，花前对酒不忍触。\n共粉泪，两蔌蔌。","note":"选自《宋词三百首》"},{"id":"715","number":715,"title":"洞仙歌·冰肌玉骨","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"冰肌玉骨，自清凉无汗。\n水殿风来暗香满。\n绣帘开、一点明月窥人，人未寝、枕钗横鬓乱。\n起来携素手，庭户无声，时见疏星渡河汉。\n试问夜如何，夜已三更，金波淡、玉绳低转。\n但屈指、西风几时来，又不道、流年暗中偷换。","note":"选自《宋词三百首》"},{"id":"716","number":716,"title":"江神子・江城子·十年生死两茫茫","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"十年生死两茫茫。\n不思量。\n自难忘。\n千里孤坟，无处话凄凉。\n纵使相逢应不识，尘满面，鬓如霜。\n夜来幽梦忽还乡。\n小轩窗。\n正梳妆。\n相顾无言，惟有泪千行。\n料得年年断肠处，明月夜，短松冈。","note":"选自《宋词三百首》"},{"id":"717","number":717,"title":"永遇乐·明月如霜","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"明月如霜，好风如水，清景无限。\n曲港跳鱼，圆荷泻露，寂寞无人见。\n如三鼓，铿然一叶，黯黯梦云惊断。\n夜茫茫，重寻无处，觉来小园行遍。\n天涯倦客，山中归路，望断故园心眼。\n燕子楼空，佳人何在，空锁楼中燕。\n古今如梦，何曾梦觉，但有旧欢新怨。\n异时对，黄楼夜景，为余浩叹。","note":"选自《宋词三百首》"},{"id":"718","number":718,"title":"青玉案·三年枕上吴中路","author":"苏轼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"三年枕上吴中路。\n遣黄耳、随君去。\n若到松江呼小渡。\n莫惊鸥鹭，四桥尽是，老子经行处。\n辋川图上看春暮。\n常记高人右丞句。\n作个归期天已许。\n春衫犹是，小蛮针线，曾湿西湖雨。","note":"选自《宋词三百首》"},{"id":"719","number":719,"title":"谢池春·残寒销尽","author":"李之仪","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"残寒销尽，疏雨过、清明後。\n花径敛馀红，风沼萦新皱。\n乳燕穿庭户，飞絮沾襟袖。\n正佳时，仍晚昼。\n著人滋味，真个浓如酒。\n频移带眼，空只恁、厌厌瘦。\n不见又思量，见了还依旧。\n为问频相见，何似长相守。\n天不老，人未偶。\n且将此恨，分付庭前柳。","note":"选自《宋词三百首》"},{"id":"720","number":720,"title":"卜算子·我住长江头","author":"李之仪","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"我住长江头，君住长江尾。\n日日思君不见君，共饮长江水。\n此水几时休，此恨何时已。\n只愿君心似我心，定不负相思意。","note":"选自《宋词三百首》"},{"id":"721","number":721,"title":"虞美人·芙蓉落尽天涵水","author":"舒亶","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"芙蓉落尽天涵水。\n日暮沧波起。\n背飞双燕帖云寒。\n独向小楼东畔、倚阑看。\n浮生只合尊前老。\n雪满长安道。\n故人早晚上高台。\n赠我江南春色、一枝梅。","note":"选自《宋词三百首》"},{"id":"722","number":722,"title":"高阳台·频听银签","author":"韩","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"频听银签，重燃绛蜡，年华衮衮惊心。\n饯旧迎新，能消几刻光阴。\n老来可惯通宵饮，待不眠、还怕寒侵。\n掩清尊。\n多谢梅花，伴我微吟。\n邻娃已试春妆了，更蜂腰簇翠，燕股横金。\n勾引东风，也知芳思难禁。\n朱颜那有年年好，逞艳游、赢取如今。\n恣登临。\n残雪楼台，迟日园林。","note":"选自《宋词三百首》"},{"id":"723","number":723,"title":"玉楼春·春风只在园西畔","author":"严仁","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"春风只在园西畔。\n荠菜花繁胡蝶乱。\n冰池晴绿照还空，香径落红吹已断。\n意长翻恨游丝短。\n尽日相思罗带缓。\n宝奁明月不欺人，明日归来君试看。","note":"选自《宋词三百首》"},{"id":"724","number":724,"title":"生查子·繁灯夺霁华","author":"刘克庄","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"繁灯夺霁华。\n戏鼓侵明发。\n物色旧时同，情味中年别。\n浅画镜中眉，深拜楼西月。\n人散市声收，渐入愁时节。","note":"选自《宋词三百首》"},{"id":"725","number":725,"title":"高阳台·接叶巢莺","author":"张炎","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"接叶巢莺，平波卷絮，断桥斜日归船。\n能几番游，看花又是明年。\n东风且伴蔷薇住，到蔷薇、春已堪怜。\n更凄然。\n万绿西泠，一抹荒烟。\n当年燕子知何处，但苔深韦曲，草暗斜川。\n见说新愁，如今也到鸥边。\n无心再续笙歌梦，掩重门、浅醉闲眠。\n莫开帘。\n怕见飞花，怕听啼鹃。","note":"选自《宋词三百首》"},{"id":"726","number":726,"title":"贺新郎·深院榴花吐","author":"刘克庄","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"深院榴花吐。\n画帘开、衣纨扇，午风清暑。\n儿女纷纷夸结束，新样钗符艾虎。\n早已有、游人观渡。\n老大逢场慵作戏，任陌头、年少争旗鼓。\n溪雨急，浪花舞。\n灵均标致高如许。\n忆生平、既纫兰佩，更怀椒糈。\n谁信骚魂千载後，波底垂涎角黍。\n又说是、蛟馋龙怒。\n把似而今醒到了，料当年、醉死差无苦。\n聊一笑，吊千古。","note":"选自《宋词三百首》"},{"id":"727","number":727,"title":"贺新郎·湛湛长空黑","author":"刘克庄","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"湛湛长空黑。\n更那堪、斜风细雨，乱愁如织。\n老眼平生空四海，赖有高楼百尺。\n看浩荡、千崖秋色。\n白发书生神州泪，尽凄凉、不向牛山滴。\n追往事，去无迹。\n少年自负凌云笔。\n到而今、春华落尽，满怀萧瑟。\n常恨世人新意少，爱说南朝狂客。\n把破帽、年年拈出。\n若对黄花孤负酒，怕黄花、也笑人岑寂。\n鸿北去，日西匿。","note":"选自《宋词三百首》"},{"id":"728","number":728,"title":"玉楼春·年年跃马长安市","author":"刘克庄","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"年年跃马长安市。\n客舍似家家似寄。\n青钱换酒日无何，红烛呼庐宵不寐。\n易挑锦妇机中字。\n难得玉人心下事。\n男儿西北有神州，莫滴水西桥畔泪。","note":"选自《宋词三百首》"},{"id":"729","number":729,"title":"好事近·凝碧旧池头","author":"韩元吉","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"凝碧旧池头，一听管弦凄切。\n多少梨园声在，总不堪华发。\n杏花无处避春愁，也傍野烟发。\n惟有御沟声断，似知人呜咽。","note":"选自《宋词三百首》"},{"id":"730","number":730,"title":"六州歌头·东风著意","author":"韩元吉","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东风著意。\n先上小桃枝。\n红粉腻。\n娇如醉。\n倚朱扉。\n记年时。\n隐映新妆，面临水岸。\n春将半。\n云日暖。\n斜桥转。\n夹城西。\n草软莎平跋马，垂杨渡、玉勒争嘶。\n认蛾眉凝笑，脸薄拂燕支。\n绣户曾窥。\n恨依依。\n共携手处。\n香如雾。\n红随步。\n怨春迟。\n消瘦损。\n凭谁问。\n只花知。\n泪空垂。\n旧日堂前燕，和烟雨，又双飞。\n人自老。\n春长好。\n梦佳期。\n前度刘郎，几许风流地，花也应悲。\n但茫茫暮霭，目断武陵溪。\n往事难追。","note":"选自《宋词三百首》"},{"id":"731","number":731,"title":"烛影摇红·双阙中天","author":"张抡","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"双阙中天，凤楼十二春寒浅。\n去年元夜奉宸游，曾侍瑶池宴。\n玉殿珠帘尽卷。\n拥群仙、蓬壶阆苑。\n五云深处，万烛光中，揭天丝管。\n驰隙流年，恍如一瞬星霜换。\n今宵谁念泣孤臣，回首长安远。\n可是尘缘未断。\n谩惆怅、华胥梦短。\n满怀幽恨，数点寒灯，几声归雁。","note":"选自《宋词三百首》"},{"id":"732","number":732,"title":"永遇乐·千古江山","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"千古江山，英雄无觅，孙仲谋处。\n舞榭歌台，风流总被，雨打风吹去。\n斜阳草树，寻常巷陌，人道寄奴曾住。\n想当年，金戈铁马，气吞万里如虎。\n元嘉草草，封狼居胥，赢得仓皇北顾。\n四十三年，望中犹记，烽火扬州路。\n可堪回首，佛狸祠下，一片神鸦社鼓。\n凭谁问，廉颇老矣，尚能饭否。","note":"选自《宋词三百首》"},{"id":"733","number":733,"title":"绿意・疏影·碧圆自洁","author":"张炎","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"碧圆自洁。\n向浅洲远渚，亭亭清绝。\n犹有遗簪，不展秋心，能卷几多炎热。\n鸳鸯密语同倾盖，且莫与、浣纱人说。\n恐怨歌、忽断花风，碎却翠云千叠。\n回首当年汉舞，怕飞去、谩皱留仙裙摺。\n恋恋青衫，犹染枯香，还叹鬓丝飘雪。\n盘心清露如铅水，又一夜、西风吹折。\n喜静看、匹练秋光，倒泻半湖明月。","note":"选自《宋词三百首》"},{"id":"734","number":734,"title":"绿头鸭・多丽·晚云收","author":"晁端礼","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"晚云收，淡天一片琉璃。\n烂银盘、来从海底，皓色千里澄辉。\n莹无尘、素娥淡伫，静可数、丹桂参差。\n玉露初零，金风未凛，一年无似此佳时。\n露坐久，疏莹时度，乌鹊正南飞。\n瑶台冷，栏干凭暖，玉下迟迟。\n念佳人，音尘别後，对此应解相思。\n最关情、漏声正永，暗断肠、花影偷移。\n料得来宵，清光未减，阴晴天气又争知。\n共凝恋、如今别後，还是隔年期。\n人强健，清尊素影，长愿相随。","note":"选自《宋词三百首》"},{"id":"735","number":735,"title":"洞仙歌·雪云散尽","author":"李元膺","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"雪云散尽，放晓晴池院。\n杨柳于人便青眼。\n更风流多处，一点梅心、相映远。\n约略轻笑浅。\n一年春好处，不在浓芳，小艳疏香最娇软。\n到清明时候，百紫千红花正乱。\n已失春风一半。\n蚤占取韶光，共追游，但莫管春寒，醉红自暖。","note":"选自《宋词三百首》"},{"id":"736","number":736,"title":"渔家傲·小雨廉纤风细细","author":"朱服","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"小雨廉纤风细细。\n万家杨柳轻烟里。\n恋树湿花飞不起。\n愁无比。\n和春付与西流水。\n九十光阴能有几。\n金龟解尽留无计。\n寄语东城沽酒市。\n拼一醉。\n而今乐事他年泪。","note":"选自《宋词三百首》"},{"id":"737","number":737,"title":"青门饮·胡马嘶风","author":"时彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"胡马嘶风，汉旗翻雪，彤云又吐，一竿残照。\n古木连空，乱山无数，行尽暮沙衰草。\n星斗横幽馆，夜无眠、灯花空老。\n雾浓香鸭，冰凝泪烛，霜天难晓。\n长记晓妆才了，一杯未尽，离怀多少。\n醉里秋波，梦中朝雨，都是醒时烦恼。\n料有牵情处，忍思量、耳边曾道。\n甚时跃马归来，认得迎门轻笑。","note":"选自《宋词三百首》"},{"id":"738","number":738,"title":"望海潮·梅英疏淡","author":"秦观","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"梅英疏淡，冰澌溶泄，东风暗换年华。\n金谷俊游，铜驼巷陌，新晴细履平沙。\n长记误随车。\n正絮翻蝶舞，芳思交加。\n柳下桃蹊，乱分春色到人家。\n西园夜饮鸣笳。\n有华灯碍月，飞盖妨花。\n兰苑未空，行人渐老，重来是事堪嗟。\n烟暝酒旗斜。\n但倚楼极目，时见栖鸦。\n无奈归心。\n暗随流水到天涯。","note":"选自《宋词三百首》"},{"id":"739","number":739,"title":"满庭芳·山抹微云","author":"秦观","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山抹微云，天连衰草，画角声断谯门。\n暂停征棹，聊共引离尊。\n多少蓬莱旧事，空回首、烟霭纷纷。\n斜阳外，寒鸦万点，流水绕孤村。\n销魂。\n当此际，香囊暗解，罗带轻分。\n谩赢得、青楼薄名存。\n此去何时见也，襟袖上、空惹啼痕。\n伤情处，高城望断，灯火已黄昏。","note":"选自《宋词三百首》"},{"id":"740","number":740,"title":"浣溪沙·漠漠轻寒上小楼","author":"秦观","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"漠漠轻寒上小楼。\n晓阴无赖似穷秋。\n淡烟流水画屏幽。\n自在飞花轻似梦，无边丝雨细如愁。\n宝帘闲挂小银钩。","note":"选自《宋词三百首》"},{"id":"741","number":741,"title":"阮郎归·湘天风雨破寒初","author":"秦观","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"湘天风雨破寒初。\n深沈庭院虚。\n丽谯吹罢《小单于》。\n迢迢清夜徂。\n乡梦断，旅魂孤。\n峥嵘岁又除。\n衡阳犹有雁传书。\n郴阳和雁无。","note":"选自《宋词三百首》"},{"id":"742","number":742,"title":"满庭芳·晓色云开","author":"秦观","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"晓色云开，春随人意，骤雨才过还晴。\n古台芳榭，飞燕蹴红英。\n舞困榆钱自落，秋千外、绿水桥平。\n东风里，朱门映柳，低底按小秦筝。\n多情。\n行乐处，珠钿翠盖，玉辔红缨。\n渐酒空金，花困蓬瀛。\n豆蔻梢头旧恨，十年梦，屈指堪惊。\n凭阑久，疏烟淡日，寂寞下芜城。","note":"选自《宋词三百首》"},{"id":"743","number":743,"title":"帝台春·芳草碧色","author":"李甲","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"芳草碧色，萋萋遍南陌。\n暖絮乱红，也知人、春愁无力。\n忆得盈盈拾翠侣，共携赏、凤城寒食。\n到今来，海角逢春，天涯为客。\n愁旋释。\n还似织。\n泪暗拭。\n又偷滴。\n谩伫立、遍倚危阑，尽黄昏，也只是、暮云凝碧。\n拼则而已今拼了，忘则怎生便忘得。\n又还问鳞鸿，试重寻消息。","note":"选自《宋词三百首》"},{"id":"744","number":744,"title":"蝶恋花·欲减罗衣寒未去","author":"赵令","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"欲减罗衣寒未去。\n不卷珠帘，人在深深处。\n红杏枝头花几许。\n啼痕止恨清明雨。\n尽日沈烟香一缕。\n宿酒醒迟，恼破春情绪。\n飞燕又将归信误。\n小屏风上西江路。","note":"选自《宋词三百首》"},{"id":"745","number":745,"title":"醉中真・浣溪沙·不信芳春厌老人","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"不信芳春厌老人。\n老人几度送春归。\n惜春行乐莫辞频。\n巧笑艳歌皆我意，恼花颠酒拼君嗔。\n物情惟有醉中真。","note":"选自《宋词三百首》"},{"id":"746","number":746,"title":"人南渡・感皇恩·兰芷满芳洲","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"兰芷满芳洲，游思横路。\n罗袜尘生步。\n迎顾。\n整鬟颦黛，脉脉两情难语。\n细风吹柳絮。\n人南渡。\n回首旧游，山无重数。\n花底深朱户。\n何处。\n半黄梅子，向晚一帘疏雨。\n断魂分付与。\n春将去。","note":"选自《宋词三百首》"},{"id":"747","number":747,"title":"薄幸·艳真多态","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"艳真多态。\n更的的，频回眄睐。\n便认得、琴心相许，与写宜男双带。\n记画堂、斜月朦胧，轻颦微笑娇无奈。\n便翡翠屏开，芙蓉帐掩，与把香罗偷解。\n自过了收灯後，都不见、踏青挑菜。\n几回凭双燕，丁宁深意，往来翻恨重帘碍。\n约何时再。\n正春浓酒暖，人闲昼永无聊赖。\n厌厌睡起，犹有花梢日在。","note":"选自《宋词三百首》"},{"id":"748","number":748,"title":"伴云来・天香·烟络横林","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"烟络横林，山沈远照，逦迤黄昏钟鼓。\n烛映帘栊，蛩催机杼，共苦清秋风露。\n不眠思妇，齐应和、几声砧杵。\n惊动天涯倦宦，岁华行暮。\n当年酒狂自负。\n谓东君、已春相付。\n流浪征骖北道，客墙南浦。\n幽恨无人晤语。\n赖明月曾知旧游处。\n好伴云来，还将梦去。","note":"选自《宋词三百首》"},{"id":"749","number":749,"title":"青玉案·一年春事都来几","author":"无名氏","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一年春事都来几。\n早过了、三之二。\n绿暗红嫣浑可事。\n绿杨庭院，暖风帘幕，有个人憔悴。\n买花载酒长安市。\n又争似家山见桃李。\n不枉东风吹客泪，相思难表，梦魂无据，惟有归来是。","note":"选自《宋词三百首》"},{"id":"750","number":750,"title":"高阳台·修竹凝妆","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"修竹凝妆，垂杨驻马，凭阑浅画成图。\n山色谁题，楼前有雁斜书。\n东风紧送斜阳下，弄旧寒、晚酒醒馀。\n自销凝，能几花前，顿老相如。\n伤春不在高楼上，在灯前攲枕，雨外熏炉。\n怕舣游船，临流可奈清臞。\n飞红若到西湖底，搅翠澜、总是愁鱼。\n莫重来，吹尽香绵，泪满平芜。","note":"选自《宋词三百首》"},{"id":"751","number":751,"title":"高阳台·宫粉雕痕","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"宫粉雕痕，仙云堕影，无人野水荒湾。\n古石埋香，金沙锁骨连环。\n南楼不恨吹横笛，恨晓风、千里关山。\n半飘零，庭上黄昏，月冷阑干。\n寿阳空理愁鸾。\n问谁调玉髓，暗补香瘢。\n细雨归鸿，孤山无限春寒。\n离魂难倩招清些，梦缟衣、解佩溪边。\n最愁人，啼鸟晴明，叶底青圆。","note":"选自《宋词三百首》"},{"id":"752","number":752,"title":"三姝媚·湖山经醉惯","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"湖山经醉惯。\n溃春衫、啼痕酒痕无限。\n又客长安，叹断襟零袂，尘谁浣。\n紫曲门荒，沿败井、风摇青蔓。\n对语东邻，犹是曾巢，谢堂双燕。\n春梦人间须断。\n但怪得、当年梦缘能短。\n绣屋秦筝，傍海棠偏爱，夜深开宴。\n舞歇歌沈，花未减、红颜先变。\n伫久河桥欲去，斜阳泪满。","note":"选自《宋词三百首》"},{"id":"753","number":753,"title":"八声甘州·渺空烟四远","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"渺空烟四远，是何年、青天坠长星。\n幻苍崖云树，名娃金屋，残霸宫城。\n箭径酸风射眼，腻水染花腥。\n时靸双鸳响，廊叶秋声。\n宫里吴王沈醉，倩五湖倦客，独钓醒醒。\n问苍波无语，华发奈山青。\n水涵空、阑干高处，送乱鸦、斜日落渔汀。\n连呼酒，上琴台去，秋与云平。","note":"选自《宋词三百首》"},{"id":"754","number":754,"title":"夜合花·柳暝河桥","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"柳暝河桥，莺晴台苑，短策频惹春香。\n当时夜泊，温柔便入深乡。\n词韵窄，酒杯长。\n翦蜡花、壶箭催忙。\n共追游处，凌波翠陌，连棹横塘。\n十年一梦凄凉。\n似西湖燕去，吴馆巢荒。\n重来万感，依前唤酒银罂。\n溪雨急，岸花狂。\n趁残鸦、飞过苍茫。\n故人楼上，凭谁指与，芳草斜阳。","note":"选自《宋词三百首》"},{"id":"755","number":755,"title":"蹋莎行・踏莎行·润玉笼绡","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"润玉笼绡，檀樱倚扇。\n绣圈犹带脂香浅。\n榴心空叠舞裙红，艾枝应压愁鬟乱。\n午梦千山，窗阴一箭。\n香瘢新褪红丝腕。\n隔江人在雨声中，晚风菰叶生秋怨。","note":"选自《宋词三百首》"},{"id":"756","number":756,"title":"夜游宫·人去西楼雁杳","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"人去西楼雁杳。\n叙别梦、扬州一觉。\n云澹星疏楚山晓。\n听啼乌，立河桥，话未了。\n雨外蛩声早。\n细织就、霜丝多少。\n说与萧娘未知道。\n向长安，对秋灯，几人老。","note":"选自《宋词三百首》"},{"id":"757","number":757,"title":"鹧鸪天·池上红衣伴倚阑","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"池上红衣伴倚阑。\n栖鸦常带夕阳还。\n殷云度雨疏桐落，明月生凉宝扇闲。\n乡梦窄，水天宽。\n小窗愁黛澹秋山。\n吴鸿好为传归信，杨柳阊门屋数间。","note":"选自《宋词三百首》"},{"id":"758","number":758,"title":"唐多令·何处合成愁","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"何处合成愁。\n离人心上秋。\n纵芭蕉、不雨也飕飕。\n都道晚凉天气好，有明月、怕登楼。\n年事梦中休。\n花空烟水流。\n燕辞归、客尚淹留。\n垂柳不萦裙带住，漫长是、系行舟。","note":"选自《宋词三百首》"},{"id":"759","number":759,"title":"金缕歌・贺新郎·乔木生云气","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"乔木生云气。\n访中兴、英雄陈迹，暗追前事。\n战舰东风悭借便，梦断神州故里。\n旋小筑、吴宫闲地。\n华表月明归夜鹤，叹当时、花竹今如此。\n枝上露，溅清泪。\n遨头小簇行春队。\n步苍苔、寻幽别坞，问梅开未。\n重唱梅边吸度曲，催发寒梢冻蕊。\n此心与、东君同意。\n後不如今非昔，两无言、相对沧浪水。\n怀此恨，寄残醉。","note":"选自《宋词三百首》"},{"id":"760","number":760,"title":"大有·戏马台前","author":"潘希白","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"戏马台前，采花篱下，问岁华、还是重九。\n恰归来、南山翠色依旧。\n帘栊昨夜听风雨，都不似、登归时候。\n一片宋玉情怀，十分卫郎清瘦。\n红萸佩、空对酒。\n砧杆动微寒，暗欺罗袖。\n秋已无多，早是败荷衰柳。\n强整帽檐侧，曾经向、天涯搔首。\n几回忆、故国莼鲈，霜前雁後。","note":"选自《宋词三百首》"},{"id":"761","number":761,"title":"兰陵王·送春去","author":"刘辰翁","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"送春去。\n春去人间无路。\n秋千外、芳草连天，谁遣风沙暗南浦。\n依依甚意绪。\n漫忆海门飞絮。\n乱鸦过，斗转城荒，不见来时试灯处。\n春去。\n最谁苦。\n但箭雁沉边，梁燕无主。\n杜鹃声里长门暮。\n想玉树凋土，泪盘如露。\n咸阳送客屡回顾。\n斜日未能度。\n春去。\n尚来否。\n正江令恨别，庾信愁赋。\n苏堤尽日风和雨。\n叹神游故国，花记前度。\n人生流落，顾孺子，共夜雨。","note":"选自《宋词三百首》"},{"id":"762","number":762,"title":"宝鼎现·红妆春骑","author":"刘辰翁","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"红妆春骑。\n踏月影、竿旗穿市。\n望不尽、楼台歌舞，习习香尘莲步底。\n箫声断、约彩鸾归去，未怕金吾呵醉。\n甚辇路、喧阗且止。\n听得念奴歌起。\n父老犹记宣和事。\n抱铜仙、清泪如水。\n还转盼、沙河多丽。\n漾明光连邸第。\n帘影冻、散红光成绮。\n月浸葡萄十里。\n看往来、神仙才子。\n肯把菱花扑碎。\n肠断竹马儿童，空见说、三千乐指。\n等多时春不归来，到春时欲睡。\n又说向、灯前拥髻。\n暗滴鲛珠坠。\n便当日、亲见霓裳，天上人间梦里。","note":"选自《宋词三百首》"},{"id":"763","number":763,"title":"永遇乐·璧月初晴","author":"刘辰翁","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"璧月初晴，黛云远澹，春事谁主。\n禁苑娇寒，湖堤倦暖，前度遽如许。\n香尘暗陌，华灯明昼，长是懒携手去。\n谁知道，断烟禁夜，满城似愁风雨。\n宣和旧日，临安南渡，芳景犹自如故。\n缃帙流离，风鬟三五，能赋词最苦。\n江南无路，州今夜，此苦又谁知否。\n空相对，残无寐，满村社鼓。","note":"选自《宋词三百首》"},{"id":"764","number":764,"title":"摸鱼儿·怎知他","author":"刘辰翁","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"怎知他、春归何处，相逢且尽尊酒。\n少年袅袅天涯恨，长结西湖烟柳。\n休回首。\n但细雨断桥，憔悴人归後。\n东风似旧。\n问前度桃花，刘郎能记，花复认郎否。\n君且住，草草留君翦韭。\n前宵更恁时候。\n深杯欲共歌声滑，翻湿春衫半袖。\n空眉皱。\n看白发尊前，已似人人有。\n临分把手。\n叹一笑论文，清狂顾曲，此会几时又。","note":"选自《宋词三百首》"},{"id":"765","number":765,"title":"绣鸾凤花犯・花犯·楚江湄","author":"周密","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"楚江湄，湘娥乍见，无言洒清泪。\n淡然春意。\n空独倚东风，芳思谁寄。\n凌波路冷秋无际。\n香云随步起。\n谩记得，汉宫仙掌，亭亭明月底。\n冰弦写怨更多情，骚人恨，枉赋芳兰幽芷。\n春思远，谁叹赏、国香风味。\n相将共、岁寒伴侣。\n小窗净、沈烟熏翠袂。\n幽梦觉，涓涓清露，一枝灯影里。","note":"选自《宋词三百首》"},{"id":"766","number":766,"title":"瑶花慢·朱钿宝","author":"周密","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"朱钿宝。\n天上飞琼，比人间春别。\n江南江北，曾未见，谩拟梨云梅雪。\n淮山春晚，问谁识、芳心高洁。\n消几番、花落花开，老了玉关豪杰。\n金壶翦送琼枝，看一骑红尘，香度瑶阙。\n韶华正好，应自喜、初识长安蜂蝶。\n杜郎老矣，想旧事、花须能说。\n记少年，一梦扬州，二十四桥明月。","note":"选自《宋词三百首》"},{"id":"767","number":767,"title":"玉京秋·烟水阔","author":"周密","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"烟水阔。\n高林弄残照，晚蜩凄切。\n碧砧度韵，银床飘叶。\n衣湿桐阴露冷，采凉花、时赋秋雪。\n叹轻别。\n一襟幽事，砌蛩能说。\n客思吟商还怯。\n怨歌长、琼壶暗缺。\n翠扇恩疏，红衣香褪，翻成消歇。\n玉骨西风，恨最恨、闲却新凉时节。\n楚箫咽。\n谁倚西楼淡月。","note":"选自《宋词三百首》"},{"id":"768","number":768,"title":"曲游春·楚苑东风外","author":"周密","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"楚苑东风外，暖丝情絮，春思如织。\n燕约莺期，恼芳情偏在，翠深红隙。\n漠漠香尘隔。\n沸十里、乱弦丛笛。\n看画船，尽入西泠，闲却半湖春色。\n柳陌。\n新烟凝碧。\n映帘底宫眉，堤上游勒。\n轻暝笼寒，怕梨云梦冷，杏香愁幂。\n歌管酬寒食。\n奈蝶怨、良宵岑寂。\n正满湖、碎月摇花，怎生去得。","note":"选自《宋词三百首》"},{"id":"769","number":769,"title":"高阳台·照野旌旗","author":"周密","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"照野旌旗，朝天车马，平沙万里天低。\n宝带金章，尊前茸帽风。\n秦关汴水经行地，想登临、都付新诗。\n纵英游，叠鼓清笳，骏马名姬。\n酒酣应对燕山雪，正冰河月冻，晓陇云飞。\n投老残年，江南谁念方回。\n东风渐绿西湖柳，雁已还、人未南归。\n最关情，折尽梅花，难寄相思。","note":"选自《宋词三百首》"},{"id":"770","number":770,"title":"摸鱼儿·对西风","author":"朱嗣发","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"对西风、鬓摇烟碧，参差前事流水。\n紫丝罗带鸳鸯结，的的镜盟钗誓。\n浑不记、漫手织回文，几度欲心碎。\n安花著蒂。\n奈雨覆云翻，情宽分窄，石上玉簪脆。\n朱楼外。\n愁压空云欲坠。\n月痕犹照无寐。\n阴晴也只随天意。\n枉了玉消香碎。\n君且醉。\n君不见、长门青草春风泪。\n一时左计。\n悔不早荆钗，暮天修竹，头白倚寒翠。","note":"选自《宋词三百首》"},{"id":"771","number":771,"title":"解佩环・疏影·江空不渡","author":"彭元逊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"江空不渡，恨蘼芜杜若，零落无数。\n远道荒寒，婉娩流年，望望美人迟暮。\n风烟雨雪阴晴晚，更何须，春风千树。\n尽孤城、落木萧萧，日夜江声流去。\n日晏山深闻笛，恐他年流落，与子同赋。\n事阔心违，交淡媒劳，蔓草沾衣多露。\n汀洲窈窕馀醒寐，遗浮沈沣浦。\n有白鸥淡月，微波寄语，逍遥容与。","note":"选自《宋词三百首》"},{"id":"772","number":772,"title":"六丑·似东风老大","author":"彭元逊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"似东风老大，那复有、当时风气。\n有情不收，江山身是寄。\n浩荡何世。\n但忆临官道，暂来不住，便出门千里。\n痴心指望回风坠。\n扇底相逢，钗头微缀。\n他家万条千缕，解遮亭障驿，不隔江水。\n瓜洲曾舣，等行人岁岁。\n日下长秋，城乌夜起。\n帐庐好在春睡。\n共飞归湖上，草青无地。\n雨、春心如腻。\n欲待化、丰乐楼前，青门都废。\n何人念、流落无几。\n点点抟作，雪绵松润，为君泪。","note":"选自《宋词三百首》"},{"id":"773","number":773,"title":"瑞鹤仙·脸霞红印枕","author":"陆淞","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"脸霞红印枕。\n睡觉来、冠儿还是不整。\n屏间麝煤冷。\n但眉峰压翠，泪珠弹粉。\n堂深昼永。\n燕交飞、风帘露井。\n恨无人，与说相思，近日带围宽尽。\n重省。\n残灯朱幌，淡月纱窗，那时风景。\n阳台路迥。\n云雨梦，便无准。\n待归来，先指花梢教看，却把心期细问。\n问因循、过了青春，怎生意稳。","note":"选自《宋词三百首》"},{"id":"774","number":774,"title":"减字浣溪沙・浣溪沙·楼角初销一缕霞","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"楼角初销一缕霞。\n淡黄杨柳暗栖鸦。\n玉人和月摘梅花。\n笑拈粉香归洞户，更垂帘幕护窗纱。\n东风寒似夜来些。","note":"选自《宋词三百首》"},{"id":"775","number":775,"title":"天门谣·牛渚天门险","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"牛渚天门险。\n限南北、七雄豪占。\n清雾敛。\n与闲人登览。\n待月上潮平波滟滟。\n塞管轻吹新《阿滥》。\n风满槛。\n历历数、西州更点。","note":"选自《宋词三百首》"},{"id":"776","number":776,"title":"石州引・石州慢·薄雨初寒","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"薄雨初寒，斜照弄晴，春意空阔。\n长亭柳色缠黄，远客一枝先折。\n烟横水际，映带几点归鸦，东风销尽龙沙雪。\n还记初关来，恰而今时节。\n将发。\n画楼芳酒，红泪清歌，顿成清别。\n已是经年，杳杳音尘多绝。\n欲知方寸，共有几许清愁，芭蕉不展丁香结。\n枉望断天涯，两厌厌风月。","note":"选自《宋词三百首》"},{"id":"777","number":777,"title":"望湘人·厌莺声到枕","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"厌莺声到枕，花气动帘，醉魂愁梦相半。\n被惜馀薰，带惊剩眼。\n几许伤春春晚。\n泪竹痕鲜，佩兰香老，湘天浓暖。\n记小江、风月佳时，屡约非烟游伴。\n须信鸾弦易断。\n奈云和再鼓，曲终人远。\n认罗袜无踪，旧处弄波清浅。\n青翰棹舣，白苹洲畔。\n尽木临皋飞观。\n不解寄、一字相思，幸有归来双燕。","note":"选自《宋词三百首》"},{"id":"778","number":778,"title":"蝶恋花·几许伤春春复暮","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"几许伤春春复暮。\n杨柳清阴，偏碍游丝度。\n天际小山桃叶步。\n白苹花满湔裙处。\n竟日微吟长短句。\n帘影灯昏，心寄胡琴语。\n数点雨声风约住。\n朦胧淡月云来去。","note":"选自《宋词三百首》"},{"id":"779","number":779,"title":"夏云峰·天阔云高","author":"仲殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"天阔云高，溪横水远。\n晚日寒生轻晕。\n闲阶静、杨花渐少，朱门掩、莺声犹嫩。\n悔匆匆、过却清明，旋占得馀芳，已成幽恨。\n都几日阴沈，连宵慵困。\n起来韶华都尽。\n怨入双眉闲斗损。\n乍品得情怀，看承全近。\n深深态、无非自许。\n厌厌意、终羞人间。\n争知道、梦里蓬莱，待忘了馀香，时传音信。\n纵留得莺花，东风不住，也则眼前愁闷。","note":"选自《宋词三百首》"},{"id":"780","number":780,"title":"汉宫春·潇洒江梅","author":"李邴","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"潇洒江梅，向竹梢疏处，横两三枝。\n东君也不爱惜，雪压霜欺。\n无情燕子，怕春寒、轻失花期。\n却是有，年年塞雁，归来曾见开时。\n清浅小溪如练，问玉堂何似，茅舍疏篱。\n伤心故人去後，冷落新诗。\n微云淡月，对江天、分付他谁。\n空自忆，清香未减，风流不在人知。","note":"选自《宋词三百首》"},{"id":"781","number":781,"title":"贺新郎·篆缕销香鼎","author":"潘汾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"篆缕销香鼎。\n翠沈沈、庭阴转午，画堂人静。\n芳草王孙知何处，惟有杨花糁径。\n正玉枕、瞢腾初醒。\n门外残红春已去，镇无聊、酒厌厌病。\n云髻，未整。\n江南旧事休重省。\n但天涯、寻消问息，断鸿难倩。\n月满西楼凭阑久，依旧归期未定。\n便只恐、瓶沈金井。\n嘶骑不来银烛暗，枉教人、立尽梧桐影。\n谁伴我，对鸾镜。","note":"选自《宋词三百首》"},{"id":"782","number":782,"title":"忆王孙·萋萋芳草忆王孙","author":"李重元","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"萋萋芳草忆王孙。\n柳外楼高空断魂。\n杜宇声声不忍闻。\n欲黄昏。\n雨打梨花深闭门。","note":"选自《宋词三百首》"},{"id":"783","number":783,"title":"贺新郎·篆缕销金鼎","author":"李玉","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"篆缕销金鼎。\n醉沈沈、庭阴转午，画堂人静。\n芳草王孙知何处，惟有杨花糁径。\n渐玉枕、腾腾春醒。\n帘外残红春已透，镇无聊、酒厌厌病。\n云鬓乱，未整。\n江南旧事休重省。\n遍天涯、寻消问息，断鸿难倩。\n月满西楼凭栏久，依旧归期未定。\n又只恐、瓶沈金井。\n嘶骑不来银烛暗，枉教人、立尽梧桐影。\n谁伴我，对鸾镜。","note":"选自《宋词三百首》"},{"id":"784","number":784,"title":"临江仙·高咏楚词酬午日","author":"陈与义","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"高咏楚词酬午日，天涯节序匆匆。\n榴花不似舞裙红。\n无人知此意，歌罢满帘风。\n万事一身伤老矣，戌葵凝笑墙东。\n酒杯深浅去年同。\n试浇桥下水，今夕到湘中。","note":"选自《宋词三百首》"},{"id":"785","number":785,"title":"临江仙·忆昔午桥桥上饮","author":"陈与义","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"忆昔午桥桥上饮，坐中多是豪英。\n长沟流月去无声。\n杏花疏影里，吹笛到天明。\n二十馀年如一梦，此身虽在堪惊。\n闲登小阁看新晴。\n古今多少事，渔唱起三更。","note":"选自《宋词三百首》"},{"id":"786","number":786,"title":"兰陵王·卷朱箔","author":"张元干","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"卷朱箔。\n朝雨轻阴乍阁。\n阑干外，烟柳弄晴，芳草侵阶映红药。\n东风妒花恶。\n吹落。\n梢头嫩萼。\n屏山掩，沈水倦熏，中酒心情怕杯勺。\n寻思旧京洛。\n正年少疏狂，歌笑迷著。\n障泥油壁催梳掠。\n曾驰道同载，上林携手，灯夜初过早共约。\n又争信漂泊。\n寂寞。\n念行乐。\n甚粉淡衣襟，音断弦索。\n琼枝璧月春如昨。\n怅别後华表，那回双鹤。\n相思除是，向醉里、暂忘却。","note":"选自《宋词三百首》"},{"id":"787","number":787,"title":"石州慢·寒水依痕","author":"张元干","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"寒水依痕，春意渐回，沙际烟阔。\n溪梅晴照生香，冷芯数枝争发。\n天涯旧恨，试看几许消魂，长亭门外山重叠。\n不尽眼中青，是愁来时节。\n情切。\n画楼深闭，想见东风，暗销肌雪。\n辜负枕前云雨，尊前花月。\n心期切处，更有多少凄凉，殷勤留与归时说。\n到得却相逢，恰经年离别。","note":"选自《宋词三百首》"},{"id":"788","number":788,"title":"薄幸·青楼春晚","author":"吕渭老","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"青楼春晚。\n昼寂寂、梳匀又懒。\n乍听得、鸦啼莺弄，惹起新愁无限。\n记年时、偷掷春心，花间隔雾遥相见。\n便角枕题诗，宝钗贳酒，共醉青苔深院。\n怎忘得、回廊下，携手处、花明月满。\n如今但暮雨，蜂愁蝶恨，小窗闲对芭蕉展。\n却谁拘管。\n尽无言、闲品秦筝，泪满参差雁。\n腰支渐小，心与杨花共远。","note":"选自《宋词三百首》"},{"id":"789","number":789,"title":"满江红·怒发冲冠","author":"岳飞","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"怒发冲冠，凭阑处、潇潇雨歇。\n抬望眼、仰天长啸，壮怀激烈。\n三十功名尘与土，八千里路云和月。\n莫等闲、白了少年头，空悲切。\n靖康耻，犹未雪。\n臣子恨，何时灭。\n驾长车踏破，贺兰山缺。\n壮志饥餐胡虏肉，笑谈渴饮匈奴血。\n待从头、收拾旧山河，朝天阙。","note":"选自《宋词三百首》"},{"id":"790","number":790,"title":"水龙吟·闹花深处层楼","author":"陈亮","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"闹花深处层楼，画帘半卷东风软。\n春归翠陌，平莎茸嫩，垂杨金浅。\n迟日催花，淡云阁雨，轻寒轻暖。\n恨芳菲世界，游人未赏，都付与、莺和燕。\n寂寞凭高念远。\n向南楼、一声归雁。\n金钗斗草，青丝勒马，风流云散。\n罗绶分香，翠绡封泪，几多幽怨。\n正销魂，又是疏烟淡月，子规声断。","note":"选自《宋词三百首》"},{"id":"791","number":791,"title":"宴山亭・燕山亭·幽梦初回","author":"张","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"幽梦初回，重阴未开，晓色吹成疏雨。\n竹槛气寒，蕙畹声摇，新绿暗通南浦。\n未有人行，才半启、回廊朱户。\n无绪。\n空望极霓旌，锦书难据。\n苔径追忆曾游，念谁伴、秋千采绳芳柱。\n犀奁黛卷，凤枕云孤，应也几番凝伫。\n怎得伊来，花雾绕、小堂深处。\n留住。\n直到老、不教归去。","note":"选自《宋词三百首》"},{"id":"792","number":792,"title":"唐多令·芦叶满汀洲","author":"刘过","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"芦叶满汀洲。\n塞沙带浅流。\n二十年、重过南楼。\n柳下系舟犹未稳，能几日、又中秋。\n黄鹤断矶头。\n故人今不在。\n旧江山，浑是新愁。\n欲买桂花同载酒，终不似、少年游。","note":"选自《宋词三百首》"},{"id":"793","number":793,"title":"点绛唇·燕雁无心","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"燕雁无心，太湖西畔随云去。\n数峰清苦。\n商略黄昏雨。\n第四桥边，拟共天随住。\n今何许。\n凭栏怀古。\n残柳参差舞。","note":"选自《宋词三百首》"},{"id":"794","number":794,"title":"鹧鸪天·肥水东流无尽期","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"肥水东流无尽期。\n当初不合种相思。\n梦中未比丹青见，暗里忽惊山鸟啼。\n春未绿，鬓先丝。\n人间别久不成悲。\n谁教岁岁红莲夜，两处沈吟各自知。","note":"选自《宋词三百首》"},{"id":"795","number":795,"title":"杏花天·绿丝低拂鸳鸯浦","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绿丝低拂鸳鸯浦。\n想桃叶、当时唤渡。\n又将愁眼与春风，待去。\n倚兰桡、更少驻。\n金陵路。\n莺吟燕舞。\n算潮水、知人最苦。\n满汀芳草不成归，日暮。\n更移舟、向甚处。","note":"选自《宋词三百首》"},{"id":"796","number":796,"title":"踏莎行·燕燕轻盈","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"燕燕轻盈，莺莺娇软。\n分明又向华胥见。\n夜长争得薄情知，春初早被相思染。\n别後书辞，别时针线。\n离魂暗逐郎行远。\n淮南皓月冷千山，冥冥归去无人管。","note":"选自《宋词三百首》"},{"id":"797","number":797,"title":"霓裳中序第一·亭皋正望极","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"亭皋正望极。\n乱落江莲归未得。\n多病却无气力。\n况纨扇渐疏，罗衣初萦。\n流光过隙。\n叹杏梁、双燕如客。\n人何在，一帘淡月，仿佛照颜色。\n幽寂。\n乱蛩吟壁。\n动庾信、清愁似织。\n沈思年少浪迹。\n笛里关山，柳下坊陌。\n坠红无信息。\n漫暗水，涓涓溜碧。\n漂零久，而今何意，醉卧酒垆侧。","note":"选自《宋词三百首》"},{"id":"798","number":798,"title":"庆宫春・高阳台·双桨莼波","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"双桨莼波，一蓑松雨，暮愁渐满空阔。\n呼我盟鸥，翩翩欲下，背人还过木末。\n那回归去，荡云雪、孤舟夜发。\n伤心重见，依约眉山，黛痕低压。\n采香径里春寒，老子婆娑，自歌谁答。\n垂虹西望，飘然引去，此兴平生难遏。\n酒醒波远，政凝想、明素袜。\n如今安在，唯有阑干，伴人一霎。","note":"选自《宋词三百首》"},{"id":"799","number":799,"title":"齐天乐·庾郎先自吟愁赋","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"庾郎先自吟愁赋。\n凄凄更闻私语。\n露湿铜铺，苔侵石井，都是曾听伊处。\n哀音似诉。\n正思妇无眠，起寻机杼。\n曲曲屏山，夜凉独自甚情绪。\n西窗又吹暗雨。\n为谁频断续，相和砧杵。\n候馆迎秋，离宫吊月，别有伤心无数。\n豳诗漫与。\n笑篱落呼灯，世间儿女。\n写入琴丝，一声声更苦。","note":"选自《宋词三百首》"},{"id":"800","number":800,"title":"一萼红·古城阴","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"古城阴。\n有官梅几许，红萼未宜簪。\n池面冰胶，墙腰雪老，云意还又沈沈。\n翠藤共、闲穿径竹，渐笑语、惊起卧沙禽。\n野老林泉，故王台榭，呼唤登临。\n南去北来何事，荡湘云楚水，目极伤心。\n朱户黏鸡，金盘簇燕，空叹时序侵寻。\n记曾共，西楼雅集，想垂杨、还袅万丝金。\n待得归鞍到时，只怕春深。","note":"选自《宋词三百首》"},{"id":"801","number":801,"title":"念奴娇·闹红一舸","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"闹红一舸，记来时、尝与鸳鸯为侣。\n三十六陂人未到，水佩风裳无数。\n翠叶吹凉，玉容销酒，更洒菰蒲雨。\n嫣然摇动，冷香飞上诗句。\n日暮。\n青盖亭亭，情人不见，争忍凌波去。\n只恐舞衣寒易落，愁入西风南浦。\n高柳垂阴，老鱼吹浪，留我花间住。\n田田多少，几回沙际归路。","note":"选自《宋词三百首》"},{"id":"802","number":802,"title":"琵琶仙・自度曲·双桨来时","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"双桨来时，有人似、旧曲桃根桃叶。\n歌扇轻约飞花，蛾眉正奇绝。\n春渐远、汀洲自绿，更添了、几声啼。\n十里扬州，三生杜牧，前事休说。\n又还是、宫烛分烟，奈愁里、匆匆换时节。\n都把一襟芳思，与空阶榆荚。\n千万缕、藏鸦细柳，为玉尊、起舞回雪。\n想见西出阳关，故人初别。","note":"选自《宋词三百首》"},{"id":"803","number":803,"title":"八归·芳莲坠粉","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"芳莲坠粉，蔬桐吹绿，庭院暗雨乍歇。\n无端抱影销魂处，还见筱墙萤暗，藓阶蛩切。\n送客重寻西去路，问水面、琵琶谁拨。\n最可惜、一片江山，总付与啼。\n长恨相从未款，而今何事，又对西风离别。\n渚寒烟淡，棹移人远，缥缈行舟如叶。\n想文君望久，倚竹愁生步罗袜。\n归来後、翠尊双饮，下了珠帘，玲珑闲看月。","note":"选自《宋词三百首》"},{"id":"804","number":804,"title":"扬州慢·淮左名都","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"淮左名都，竹西佳处，解鞍少驻初程。\n过春风十里，尽荠麦青青。\n自胡马窥江去後，废池乔木，犹厌言兵。\n渐黄昏，清角吹寒，都在空城。\n杜郎俊赏，算而今，重到须惊。\n纵豆蔻词工，青楼梦好，难赋深情。\n二十四桥仍在，波心荡、冷月无声。\n念桥边红药，年年知为谁生。","note":"选自《宋词三百首》"},{"id":"805","number":805,"title":"长亭怨慢·渐吹尽","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"渐吹尽、枝头香絮。\n是处人家，绿深门户。\n远浦萦回，暮帆零乱向何许。\n阅人多矣，谁得似、长亭树。\n树若有情时，不会得、青青如此。\n日暮。\n望高城不见，只见乱山无数。\n韦郎去也，怎忘得、玉环分付。\n第一是、早早归来，怕红萼、无人为主。\n算空有并刀，难翦离愁千缕。","note":"选自《宋词三百首》"},{"id":"806","number":806,"title":"淡黄柳·空城晓月","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"空城晓月。\n吹入垂杨陌。\n马上单衣寒恻恻。\n看尽鹅黄嫩绿，都是江南旧相识。\n正岑寂。\n明朝又寒食。\n强携酒、小桥宅，怕梨花落尽成秋色。\n燕燕飞来，问春何在，唯有池塘自碧。","note":"选自《宋词三百首》"},{"id":"807","number":807,"title":"暗香·旧时月色","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"旧时月色。\n算几番照我，梅边吹笛。\n唤起玉人，不管清寒与攀摘。\n何逊而今渐老，都忘却、春风词笔。\n但怪得、竹外疏花，香冷入瑶席。\n江国。\n正寂寂。\n叹寄与路遥，夜雪初积。\n翠尊易泣。\n红萼无言耿相忆。\n长记曾携手处，千树压、西湖寒碧。\n又片片、吹尽也，几时见得。","note":"选自《宋词三百首》"},{"id":"808","number":808,"title":"疏影·苔枝缀玉","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"苔枝缀玉。\n有翠禽小小，枝上同宿。\n客里相逢，篱角黄昏，无言自倚修竹。\n昭君不惯胡沙远，但暗忆、江南江北。\n想佩环、月夜归来，化作此花幽独。\n犹记深宫旧事，那人正睡里，飞近蛾绿。\n莫似春风，不管盈盈，早与安排金屋。\n还教一片随波去，又却怨、玉龙哀曲。\n等恁时、重觅幽香，已入小窗横幅。","note":"选自《宋词三百首》"},{"id":"809","number":809,"title":"翠楼吟·月冷龙沙","author":"姜夔","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"月冷龙沙，尘轻虎落，今年汉初赐。\n新翻胡部曲，听毡幕、元戎歌吹。\n层楼高峙。\n看栏曲萦红，檐牙飞翠。\n人姝丽。\n粉香吹下，夜寒风细。\n此地。\n宜有词仙，拥素云黄鹤，与君游戏。\n玉梯凝望久，叹芳草、萋萋千里。\n天涯情味。\n仗酒清愁，花销英气。\n西山外。\n晚来还卷，一帘秋霁。","note":"选自《宋词三百首》"},{"id":"810","number":810,"title":"木兰花・玉楼春·城上风光莺语乱","author":"钱惟演","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"城上风光莺语乱。\n城下烟波春拍岸。\n绿杨芳草几时休，泪眼愁肠先已断。\n情怀渐变成衰晚。\n鸾鉴朱颜惊暗换。\n昔年多病厌芳尊，今日芳尊惟恐浅。","note":"选自《宋词三百首》"},{"id":"811","number":811,"title":"苏幕遮·碧云天","author":"范仲淹","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"碧云天，黄叶地。\n秋色连波，波上寒烟翠。\n山映斜阳天接水。\n芳草无情，更在斜阳外。\n黯乡魂，追旅思。\n夜夜除非，好梦留人睡。\n明月楼高休独倚。\n酒入愁肠，化作相思泪。","note":"选自《宋词三百首》"},{"id":"812","number":812,"title":"御街行·纷纷堕叶飘香砌","author":"范仲淹","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"纷纷堕叶飘香砌。\n夜寂静、寒声碎。\n真珠帘卷玉楼空，天淡银河垂地。\n年年今夜，月华如练，长是人千里。\n愁肠已断无由醉。\n酒未到、先成泪。\n残灯明灭枕头欹。\n谙尽孤眠滋味。\n都来此事，眉间心上，无计相回避。","note":"选自《宋词三百首》"},{"id":"813","number":813,"title":"曲玉管·陇首云飞","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"陇首云飞，江边日晚，烟波满目凭阑久。\n立望关河萧索，千里清秋。\n忍凝眸。\n杳杳神京，盈盈仙子，别来锦字终难偶。\n断雁无凭，冉冉飞下汀洲。\n思悠悠。\n暗想当初，有多少、幽欢佳会，岂知聚散难期，翻成雨恨云愁。\n阻追游。\n每登山临水，惹起平生心事，一场消黯，永日无言，却下层楼。","note":"选自《宋词三百首》"},{"id":"814","number":814,"title":"雨霖铃·寒蝉凄切","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"寒蝉凄切。\n对长亭晚，骤雨初歇。\n都门帐饮无绪，留恋处、兰舟催发。\n执手相看泪眼，竟无语凝噎。\n念去去、千里烟波，暮霭沈沈楚天阔。\n多情自古伤离别。\n更那堪、冷落清秋节。\n今宵酒醒何处，杨柳岸、晓风残月。\n此去经年，应是良辰、好景虚设。\n便纵有、千种风情，更与何人说。","note":"选自《宋词三百首》"},{"id":"815","number":815,"title":"采莲令·月华收","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"月华收，云淡霜天曙。\n西征客、此时情苦。\n翠娥执手送临歧，轧轧开朱户。\n千娇面、盈盈伫立，无言有泪，断肠争忍回顾。\n一叶兰舟，便恁急桨凌波去。\n贪行色、岂知离绪。\n万般方寸，但饮恨，脉脉同谁语。\n更回首、重城不见，寒江天外，隐隐两三烟树。","note":"选自《宋词三百首》"},{"id":"816","number":816,"title":"凤栖梧・蝶恋花·伫倚危楼风细细","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"伫倚危楼风细细。\n望极春愁，黯黯生天际。\n草色烟光残照里。\n无言谁会凭阑意。\n拟把疏狂图一醉。\n对酒当歌，强乐还无味。\n衣带渐宽终不悔。\n为伊消得人憔悴。","note":"选自《宋词三百首》"},{"id":"817","number":817,"title":"浪淘沙·梦觉","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"梦觉、透窗风一线，寒灯吹息。\n那堪酒醒，又闻空阶，夜雨频滴。\n嗟因循、久作天涯客。\n负佳人、几许盟言，便忍把、从前欢会，陡顿翻成忧戚。\n愁极。\n再三追思，洞房深处，几度饮散歌阑，香暖鸳鸯被，岂暂时疏散，费伊心力。\n云尤雨，有万般千种，相怜相惜。\n恰到如今，天长漏永，无端自家疏隔。\n知何时、却拥秦云态，愿低帏昵枕，轻轻细说与，江乡夜夜，数寒更思忆。","note":"选自《宋词三百首》"},{"id":"818","number":818,"title":"定风波·自春来","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"自春来、惨绿愁红，芳心是事可可。\n日上花梢，莺穿柳带，犹压香衾卧。\n暖酥消，腻云。\n终日厌厌倦梳裹。\n无那。\n恨薄情一去，音书无个。\n早知恁麽。\n悔当初、不把雕鞍锁。\n向鸡窗、只与蛮笺象管，拘束教吟课。\n镇相随，莫抛躲。\n针线闲拈伴伊坐。\n和我。\n免使年少，光阴虚过。","note":"选自《宋词三百首》"},{"id":"819","number":819,"title":"少年游·长安古道马迟迟","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"长安古道马迟迟。\n高柳乱蝉栖。\n夕阳岛外，秋风原上，目断四天垂。\n归云一去无踪迹，何处是前期。\n狎兴生疏，酒徒萧索，不似去年时。","note":"选自《宋词三百首》"},{"id":"820","number":820,"title":"戚氏·晚秋天","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"晚秋天。\n一霎微雨洒庭轩。\n槛菊萧疏，井梧零乱惹残烟。\n凄然。\n望江关。\n飞云黯淡夕阳间。\n当时宋玉悲感，向此临水与登山。\n远道迢递，行人凄楚，倦听陇水潺。\n正蝉吟败叶，蛩响衰草，相应喧喧。\n孤馆度日如年。\n风露渐变，悄悄至更阑。\n长天净，绛河清浅，皓月婵娟。\n思绵绵。\n夜永对景，那堪屈指，暗想从前。\n未名未禄，绮陌红楼，往往经岁迁延。\n帝里风光好，当年少日，暮宴朝欢。\n况有狂朋怪侣，遇当歌、对酒竞留连。\n别来迅景如梭，旧游似梦，烟水程何限。\n念利名、憔悴长萦绊。\n追往事、空惨愁颜。\n漏箭移、稍觉轻寒。\n渐呜咽、画角数声残。\n对闲窗畔，停灯向晓，抱影无眠。","note":"选自《宋词三百首》"},{"id":"821","number":821,"title":"夜半乐·冻云黯淡天气","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"冻云黯淡天气，扁舟一叶，乘兴离江渚。\n渡万壑千岩，越溪深处。\n怒涛渐息，樵风乍起，更闻商旅相呼。\n片帆高举。\n泛画鹢、翩翩过南浦。\n望中酒旆闪闪，一簇烟村，数行霜树。\n残日下，渔人鸣榔归去。\n败荷零落，衰杨掩映，岸边两两三三，浣沙游女。\n避行客、含羞笑相语。\n到此因念，绣阁轻抛，浪萍难驻。\n叹後约丁宁竟何据。\n惨离怀，空恨岁晚归期阻。\n凝泪眼、杳杳神京路。\n断鸿声远长天暮。","note":"选自《宋词三百首》"},{"id":"822","number":822,"title":"玉蝴蝶·望处雨收云断","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"望处雨收云断，凭阑悄悄，目送秋光。\n晚景萧疏，堪动宋玉悲凉。\n水风轻、苹花渐老，月露冷、梧叶飘黄。\n遣情伤。\n故人何在，烟水茫茫。\n难忘。\n文期酒会，几孤风月，屡变星霜。\n海阔山遥，未知何处是潇湘。\n念双燕、难凭远信，指暮天、空识归航。\n黯相望。\n断鸿声里，立尽斜阳。","note":"选自《宋词三百首》"},{"id":"823","number":823,"title":"八声甘州·对潇潇","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"对潇潇、暮雨洒江天，一番洗清秋。\n渐霜风凄惨，关河冷落，残照当楼。\n是处红衰翠减，苒苒物华休。\n惟有长江水，无语东流。\n不忍登高临远，望故乡渺邈，归思难收。\n叹年来踪迹，何事苦淹留。\n想佳人、妆楼望，误几回、天际识归舟。\n争知我、倚阑干处，正恁凝愁。","note":"选自《宋词三百首》"},{"id":"824","number":824,"title":"竹马子・竹马儿·登孤垒荒凉","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"登孤垒荒凉，危亭旷望，静临烟渚。\n对雌霓挂雨，雄风拂槛，微收烦暑。\n渐觉一叶惊秋，残蝉噪晚，素商时序。\n览景想前欢，指神京，非雾非烟深处。\n向此成追感，新愁易积，故人难聚。\n凭高尽日凝伫。\n赢得消魂无语。\n极目霁霭霏微，暝鸦零乱，萧索江城暮。\n南楼画角，又送残阳去。","note":"选自《宋词三百首》"},{"id":"825","number":825,"title":"迷神引·一叶扁舟轻帆卷","author":"柳永","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一叶扁舟轻帆卷。\n暂泊楚江南岸。\n孤城暮角，引胡茄怨。\n水茫茫，平沙雁、旋惊散。\n烟敛寒林簇，画屏展。\n天际遥山小，黛眉浅。\n旧赏轻抛，到此成游宦。\n觉客程劳，年光晚。\n异乡风物，忍萧索、当愁眼。\n帝城赊，秦楼阻，旅魂乱。\n芳草连空阔，残照满。\n佳人无消息，断云远。","note":"选自《宋词三百首》"},{"id":"826","number":826,"title":"醉垂鞭·双蝶绣罗裙","author":"张先","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"双蝶绣罗裙。\n东池宴。\n初相见。\n朱粉不深匀。\n闲花淡淡春。\n细看诸处好。\n人人道。\n柳腰身。\n昨日乱山昏。\n来时衣上云。","note":"选自《宋词三百首》"},{"id":"827","number":827,"title":"一丛花令・一丛花·伤高怀远几时穷","author":"张先","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"伤高怀远几时穷。\n无物似情浓。\n离愁正引千丝乱，更东陌、飞絮。\n嘶骑渐遥，征尘不断，何处认郎踪。\n双鸳池沼水溶溶。\n南北小桡通。\n梯横画阁黄昏後，又还是、斜月帘栊。\n沈恨细思，不如桃杏，犹解嫁东风。","note":"选自《宋词三百首》"},{"id":"828","number":828,"title":"天仙子·水调数声持酒听","author":"张先","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"水调数声持酒听。\n午醉醒来愁未醒。\n送春春去几时回，临晚镜。\n伤流景。\n往事後期空记省。\n沙上并禽池上暝。\n云破月来花弄影。\n重重帘幕密遮灯，风不定。\n人初静。\n明日落红应满径。","note":"选自《宋词三百首》"},{"id":"829","number":829,"title":"千秋岁·数声鶗鴂","author":"张先","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"数声鶗鴂。\n又报芳菲歇。\n惜春更把残红折。\n雨轻风色暴，梅子青时节。\n永丰柳，无人尽日飞花雪。\n莫把幺弦拨。\n怨极弦能说。\n天不老，情难绝。\n心似双丝网，中有千千结。\n夜过也，东窗未白凝残月。","note":"选自《宋词三百首》"},{"id":"830","number":830,"title":"青门引・青门饮·乍暖还轻冷","author":"张先","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"乍暖还轻冷。\n风雨晚来方定。\n庭轩寂寞近清明，残花中酒，又是去年病。\n楼头画角风吹醒。\n入夜重门静。\n那堪更被明月，隔墙送过秋千影。","note":"选自《宋词三百首》"},{"id":"831","number":831,"title":"浣溪沙·一曲新词酒一杯","author":"晏殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一曲新词酒一杯。\n去年天气旧亭台。\n夕阳西下几时回。\n无可奈何花落去，似曾相识燕归来。\n小园香径独徘徊。","note":"选自《宋词三百首》"},{"id":"832","number":832,"title":"浣溪沙·一向年光有限身","author":"晏殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一向年光有限身。\n等闲离别易消魂。\n酒筵歌席莫辞频。\n满目山河空念远，落花风雨更伤春。\n不如怜取眼前人。","note":"选自《宋词三百首》"},{"id":"833","number":833,"title":"清平乐·金风细细","author":"晏殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"金风细细。\n叶叶梧桐坠。\n绿酒初尝人易醉。\n一枕小窗浓睡。\n紫微朱槿花残。\n斜阳却照阑干。\n双燕欲归时节，银屏昨夜微寒。","note":"选自《宋词三百首》"},{"id":"834","number":834,"title":"清平乐·红笺小字","author":"晏殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"红笺小字。\n说尽平生意。\n鸿雁在云鱼在水。\n惆怅此情难寄。\n斜阳独倚西楼。\n遥山恰对帘钩。\n人面不知何处，绿波依旧东流。","note":"选自《宋词三百首》"},{"id":"835","number":835,"title":"木兰花・玉楼春·燕鸿过後莺归去","author":"晏殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"燕鸿过後莺归去。\n细算浮生千万绪。\n长於春梦几多时，散似秋云无觅处。\n闻琴解佩神仙侣。\n挽断罗衣留不住。\n劝君莫作独醒人，烂醉花间应有数。","note":"选自《宋词三百首》"},{"id":"836","number":836,"title":"木兰花・玉楼春·池塘水绿风微暖","author":"晏殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"池塘水绿风微暖。\n记得玉真初见面。\n重头歌韵响铮琮，入破舞腰红乱旋。\n玉钩阑下香阶畔。\n醉後不知斜日晚。\n当时共我赏花人，点检如今无一半。","note":"选自《宋词三百首》"},{"id":"837","number":837,"title":"踏莎行·祖席离歌","author":"晏殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"祖席离歌，长亭别宴。\n香尘已隔犹回面。\n居人匹马映林嘶，行人去棹依波转。\n画阁魂消，高楼目断。\n斜阳只送平波远。\n无穷无尽是离愁，天涯地角寻思遍。","note":"选自《宋词三百首》"},{"id":"838","number":838,"title":"踏莎行·小径红稀","author":"晏殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"小径红稀，芳郊绿遍。\n高台树色阴阴见。\n春风不解禁杨花，乱扑行人面。\n翠叶藏莺，朱帘隔燕。\n炉香静逐游丝转。\n一场愁梦酒醒时，斜阳却照深深院。","note":"选自《宋词三百首》"},{"id":"839","number":839,"title":"玉楼春·绿杨芳草长亭路","author":"晏殊","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绿杨芳草长亭路。\n年少抛人容易去。\n楼头残梦五更钟，花底离情三月雨。\n无情不似多情苦。\n一寸还成千万缕。\n天涯地角有穷时，只有相思无尽处。","note":"选自《宋词三百首》"},{"id":"840","number":840,"title":"玉楼春·东城渐觉风光好","author":"宋祁","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东城渐觉风光好。\n皱波纹迎客棹。\n绿杨烟外晓寒轻，红杏枝头春意闹。\n浮生长恨欢娱少。\n肯爱千金轻一笑。\n为君持酒劝斜阳，且向花间留晚照。","note":"选自《宋词三百首》"},{"id":"841","number":841,"title":"采桑子·群芳过後西湖好","author":"欧阳修","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"群芳过後西湖好，狼籍残红。\n飞絮蒙蒙。\n垂柳阑干尽日风。\n笙歌散尽游人去，始觉春空。\n垂下帘栊。\n双燕归来细雨中。","note":"选自《宋词三百首》"},{"id":"842","number":842,"title":"诉衷情·清晨帘幕卷轻霜","author":"欧阳修","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"清晨帘幕卷轻霜。\n呵手试梅妆。\n都缘自有离恨，故画作远山长。\n思往事，惜流芳。\n易成伤。\n拟歌先敛，欲笑还颦，最断人肠。","note":"选自《宋词三百首》"},{"id":"843","number":843,"title":"踏莎行·候馆梅残","author":"欧阳修","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"候馆梅残，溪桥柳细。\n草熏风暖摇征辔。\n离愁渐远渐无穷，迢迢不断如春水。\n寸寸柔肠，盈盈粉泪。\n楼高莫近危阑倚。\n平芜尽处是春山，行人更在春山外。","note":"选自《宋词三百首》"},{"id":"844","number":844,"title":"蝶恋花·独倚危楼风细细","author":"欧阳修","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"独倚危楼风细细。\n望极离愁，黯黯生天际。\n草色山光残照里。\n无人会得凭阑意。\n也拟疏狂图一醉。\n对酒当歌，强饮还无味。\n衣带渐宽都不悔。\n况伊销得人憔悴。","note":"选自《宋词三百首》"},{"id":"845","number":845,"title":"玉楼春·池塘水绿春微暖","author":"欧阳修","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"池塘水绿春微暖。\n记得玉真初见面。\n从头歌韵响铮鏦，入破舞腰红乱旋。\n玉钩帘下香阶畔。\n醉後不知红日晚。\n当时共我赏花人，点检如今无一半。","note":"选自《宋词三百首》"},{"id":"846","number":846,"title":"玉楼春·燕鸿过後春归去","author":"欧阳修","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"燕鸿过後春归去。\n细算浮生千万绪。\n来如春梦几多时，去似朝云无觅处。\n闻琴解神仙侣。\n挽断罗衣留不住。\n劝君莫作独醒人，烂醉花间应有数。","note":"选自《宋词三百首》"},{"id":"847","number":847,"title":"玉楼春·别後不知君远近","author":"欧阳修","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"别後不知君远近。\n触目凄凉多少闷。\n渐行渐远渐无书，水阔鱼沈何处问。\n夜深风竹敲秋韵。\n万叶千声皆是恨。\n故欹单枕梦中寻，梦又不成灯又尽。","note":"选自《宋词三百首》"},{"id":"848","number":848,"title":"浪淘沙·把酒祝东风","author":"欧阳修","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"把酒祝东风。\n且共从容。\n垂杨紫陌洛城东。\n总是当时携手处，游遍芳丛。\n聚散苦匆匆。\n此恨无穷。\n今年花胜去年红。\n可惜明年花更好，知与谁同。","note":"选自《宋词三百首》"},{"id":"849","number":849,"title":"风入松·一春长费买花钱","author":"俞国宝","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一春长费买花钱。\n日日醉花边。\n玉骢惯识西湖路，骄嘶过、沽酒垆前。\n红杏香中箫鼓，绿杨影里秋千。\n暖风十里丽人天。\n花压髻云偏。\n画船载取春归去，馀情寄、湖水湖烟。\n明日重扶残醉，来寻陌上花钿。","note":"选自《宋词三百首》"},{"id":"850","number":850,"title":"绮罗香·做冷欺花","author":"史达祖","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"做冷欺花，将烟困柳，千里偷催春暮。\n尽日冥迷，愁里欲飞还住。\n惊粉重、蝶宿西园，喜泥润、燕归南浦。\n最妨它、佳约风流，钿车不到杜陵路。\n沈沈江上望极，还被春潮晚急，难寻官渡。\n隐约遥峰，和泪谢娘眉妩。\n临断岸、新绿生时，是落红、带愁流处。\n记当日、门掩梨花，翦灯深夜语。","note":"选自《宋词三百首》"},{"id":"851","number":851,"title":"双双燕·过春社了","author":"史达祖","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"过春社了，度帘幕中间，去年尘冷。\n差池欲住，试入旧巢相并。\n还相雕梁藻井。\n又软语、商量不定。\n飘然快拂花梢，翠尾分开红影。\n芳径。\n芹泥雨润。\n爱贴地争飞，竞夸轻俊。\n红楼归晚，看足柳昏花暝。\n应自栖香正稳。\n便忘了、天涯芳信。\n愁损翠黛双蛾，日日画阑独凭。","note":"选自《宋词三百首》"},{"id":"852","number":852,"title":"东风第一枝·巧沁兰心","author":"史达祖","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"巧沁兰心，偷黏草甲，东风欲障新暖。\n谩凝碧瓦难留，信知暮寒轻浅。\n行天入镜，做弄出、轻松纤软。\n料故园、不卷重帘，误了乍来双燕。\n青未了、柳回白眼。\n红欲断、杏开素面。\n旧游忆著山阴，厚盟遂妨上苑。\n寒炉重暖，便放慢春衫针线。\n恐凤靴、挑菜归来，万一灞桥相见。","note":"选自《宋词三百首》"},{"id":"853","number":853,"title":"喜迁莺·月波疑滴","author":"史达祖","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"月波疑滴。\n望玉壶天近，了无尘隔。\n翠眼圈花，冰丝织练，黄道宝光相直。\n自怜诗酒瘦，难应接、许多春色。\n最无赖，是随香趁烛，曾伴狂客。\n踪迹。\n谩记忆。\n老了杜郎，忍听东风笛。\n柳院灯疏，梅厅雪在，谁与细倾春碧。\n旧情拘未定，犹自学、当年游历。\n怕万一，误玉人、夜寒帘隙。","note":"选自《宋词三百首》"},{"id":"854","number":854,"title":"三姝媚·烟光摇缥瓦","author":"史达祖","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"烟光摇缥瓦。\n望晴檐多风，柳花如洒。\n锦瑟横床，想泪痕尘影，凤弦常下。\n倦出犀帷，频梦见、王孙骄马。\n讳道相思，偷理绡裙，自惊腰衩。\n惆怅南楼遥夜。\n记翠箔张灯，枕肩歌罢。\n又入铜驼，遍旧家门巷，首询声价。\n可惜东风，将恨与、闲花俱谢。\n记取崔徽模样，归来暗写。","note":"选自《宋词三百首》"},{"id":"855","number":855,"title":"夜合花·柳锁莺魂","author":"史达祖","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"柳锁莺魂，花翻蝶梦，自知愁染潘郎。\n轻衫未揽，犹将泪点偷藏。\n念前事，怯流光。\n早春窥、酥雨池塘。\n向销凝里，梅开半面，情满徐妆。\n风丝一寸柔肠。\n曾在歌边惹恨，烛底萦香。\n芳机瑞锦，如何未织鸳鸯。\n人扶醉，月依墙。\n是当初、谁敢疏狂。\n把闲言语，花房夜久，各自思量。","note":"选自《宋词三百首》"},{"id":"856","number":856,"title":"八归·秋江带雨","author":"史达祖","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"秋江带雨，寒沙萦水，人瞰画阁愁独。\n烟蓑散响惊诗思，还被乱鸥飞去，秀句难续。\n冷眼尽归图画上，认隔岸、微茫云屋。\n想半属、渔市樵村，欲暮竞然竹。\n须信风流未老，凭持酒、慰此凄凉心目。\n一鞭南陌，几篙官渡，赖有歌眉舒绿。\n只匆匆眺远，早觉闲愁挂乔木。\n应难奈，故人天际，望彻淮山，相思无雁足。","note":"选自《宋词三百首》"},{"id":"857","number":857,"title":"玉胡蝶・玉蝴蝶·晚雨未摧宫树","author":"史达祖","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"晚雨未摧宫树，可怜闲叶，犹抱凉蝉。\n短景归秋，吟思又接愁边。\n漏初长、梦魂难禁，人渐老、风月俱寒。\n想幽欢。\n土花庭，虫网阑干。\n无端。\n啼蛄搅夜，恨随团扇，苦近秋莲。\n一笛当楼，谢娘悬泪立风前。\n故园晚、强留诗酒，新雁远、不致寒暄。\n隔苍烟。\n楚香罗袖，谁伴婵娟。","note":"选自《宋词三百首》"},{"id":"858","number":858,"title":"秋霁·江水苍苍","author":"史达祖","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"江水苍苍，望倦柳愁荷，共感秋色。\n废阁先凉，古帘空暮，雁程最嫌风力。\n故园信息。\n爱渠入眼南山碧。\n念上国。\n谁是、脍鲈江汉未归客。\n还又岁晚，瘦骨临风，夜闻秋声，吹动岑寂。\n露蛩悲、清灯冷屋，翻书愁上鬓毛白。\n年少俊游浑断得。\n但可怜处，无奈苒苒魂惊，采香南浦，翦梅烟驿。","note":"选自《宋词三百首》"},{"id":"859","number":859,"title":"宴清都·春讯飞琼管","author":"卢祖皋","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"春讯飞琼管。\n风日薄、度墙啼鸟声乱。\n江城次第，笙歌翠合，绮罗香暖。\n溶溶涧渌冰泮。\n醉梦里、年华暗换。\n料黛眉重锁隋堤，芳心还动梁苑。\n新来雁阔云音，鸾分槛影，无计重见。\n啼春细雨，笼愁澹月，恁时庭院。\n离肠未语先断。\n算犹有、凭高望眼。\n更那堪、芳草连天，飞梅弄晚。","note":"选自《宋词三百首》"},{"id":"860","number":860,"title":"江城子·画楼帘幕卷新晴","author":"卢祖皋","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"画楼帘幕卷新晴。\n掩银屏。\n晓寒轻。\n坠粉飘香，日日唤愁生。\n暗数十年湖上路，能几度，著娉婷。\n年华空自感飘零。\n拥春酲。\n对谁醒。\n天阔云闲，无处觅箫声。\n载酒买花年少事，浑不似，旧心情。","note":"选自《宋词三百首》"},{"id":"861","number":861,"title":"小重山·柳暗花明春事深","author":"章良能","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"柳暗花明春事深。\n小阑红芍药，已抽簪。\n雨馀风软碎鸣禽。\n迟迟日，犹带一分阴。\n往事莫沈吟。\n身闲时序好，且登临。\n旧游无处不堪寻。\n无寻处，惟有少年心。","note":"选自《宋词三百首》"},{"id":"862","number":862,"title":"满庭芳·月洗高梧","author":"张","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"月洗高梧，露幽草，宝钗楼外秋深。\n土花沿翠，萤火坠墙阴。\n静听寒声断续，微韵转、凄咽悲沈。\n争求侣，殷勤劝织，促破晓机心。\n儿时，曾记得，呼灯灌穴，敛步随音。\n任满身花影，犹自追寻。\n携向花堂戏斗，亭台小、笼巧妆金。\n今休说，从渠床下，凉夜伴孤吟。","note":"选自《宋词三百首》"},{"id":"863","number":863,"title":"花犯·小娉婷","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"小娉婷，清铅素靥，蜂黄暗偷晕。\n翠翘敧鬓。\n昨夜冷中庭，月下相认。\n睡浓更苦凄风紧。\n惊回心未稳。\n送晓色、一壶葱茜，才知花梦准。\n湘娥化作此幽芳，凌波路，古岸云沙遗恨。\n临砌影，寒香乱、冻梅藏韵。\n熏炉畔、旋移傍枕，还又见、玉人垂绀鬒。\n料唤赏、清华池馆，台杯须满引。","note":"选自《宋词三百首》"},{"id":"864","number":864,"title":"浣溪沙·门隔花深梦旧游","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"门隔花深梦旧游。\n夕阳无语燕归愁。\n玉纤香动小帘钩。\n落絮无声春堕泪，行云有影月含羞。\n东风临夜冷於秋。","note":"选自《宋词三百首》"},{"id":"865","number":865,"title":"浣溪沙·波面铜花冷不收","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"波面铜花冷不收。\n玉人垂钓理纤钩。\n月明池阁夜来秋。\n江燕话归成晓别，水花红减似春休。\n西风梧井叶先愁。","note":"选自《宋词三百首》"},{"id":"866","number":866,"title":"点绛唇·卷尽愁云","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"卷尽愁云，素娥临夜新梳洗。\n暗尘不起。\n酥润凌波地。\n辇路重来，仿佛灯前事。\n情如水。\n小楼熏被。\n春梦笙歌里。","note":"选自《宋词三百首》"},{"id":"867","number":867,"title":"祝英台近·采幽香","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"采幽香，巡古苑，竹冷翠微路。\n斗草溪根，沙印小莲步。\n自怜两鬓清霜，一年寒食，又身在、云山深处。\n昼闲度。\n因甚天也悭春，轻阴便成雨。\n绿暗长亭，归梦趁风絮。\n有情花影阑干，莺声门径，解留我、霎时凝伫。","note":"选自《宋词三百首》"},{"id":"868","number":868,"title":"祝英台近·翦红情","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"翦红情，裁绿意，花信上钗股。\n残日东风，不放岁华去。\n有人添烛西窗，不眠侵晓，笑声转、新年莺语。\n旧尊俎。\n玉纤曾擘黄柑，柔香系幽素。\n归梦湖边，还迷镜中路。\n可怜千点吴霜，寒销不尽，又相对、落梅如雨。","note":"选自《宋词三百首》"},{"id":"869","number":869,"title":"澡兰香·盘丝系腕","author":"吴文英","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"盘丝系腕，巧篆垂簪，玉隐绀纱睡觉。\n银瓶露井，彩云窗，往事少年依约。\n为当时、曾写榴裙，伤心红绡褪萼。\n黍梦光阴渐老，汀洲烟箬。\n莫唱江南古调，怨抑难招，楚江沈魄。\n薰风燕乳，暗雨梅黄，午镜澡兰帘幕。\n念秦楼、也拟人归，应翦菖浦自酌。\n但怅望、一屡新蟾，随人天角。","note":"选自《宋词三百首》"},{"id":"870","number":870,"title":"燕山亭·裁翦冰绡","author":"赵佶","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"裁翦冰绡，打叠数重，冷淡燕脂匀注。\n新样靓妆，艳溢香融，羞杀蕊珠宫女。\n易得凋零，更多少、无情风雨。\n愁苦。\n闲院落凄凉，几番春暮。\n凭寄离恨重重，这双燕，何曾会人言语。\n天遥地远，万水千山，知他故宫何处。\n怎不思量，除梦里、有时会去。\n无据。\n和梦也、有时不做。","note":"选自《宋词三百首》"},{"id":"871","number":871,"title":"烛影摇红·霭霭春空","author":"廖世美","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"霭霭春空，画楼森耸凌云渚。\n紫薇登览最关情，绝妙夸能赋。\n惆怅相思迟暮。\n记当日、朱阑共语。\n塞鸿难问，岸柳何穷，别愁纷絮。\n催促年光，旧来流水知何处。\n断肠何必更残阳，极目伤平楚。\n晚霁波声带雨。\n悄无人、舟横野渡。\n数峰江上，芳草天涯，参差烟树。","note":"选自《宋词三百首》"},{"id":"872","number":872,"title":"凤凰台上忆吹箫·香冷金猊","author":"李清照","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"香冷金猊，被翻红浪，起来人未梳头。\n任宝奁闲掩，日上帘钩。\n生怕闲愁暗恨，多少事、欲说还休。\n今年瘦，非干病酒，不是悲秋。\n明朝，这回去也，千万遍阳关，也即难留。\n念武陵春晚，云锁重楼。\n记取楼前绿水，应念我、终日凝眸。\n凝眸处，从今更数，几段新愁。","note":"选自《宋词三百首》"},{"id":"873","number":873,"title":"醉花阴·薄雾浓云愁永昼","author":"李清照","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"薄雾浓云愁永昼。\n瑞脑消金兽。\n佳节又重阳，玉枕纱厨，半夜凉初透。\n东篱把洒黄昏後，有暗香盈袖。\n莫道不消魂，帘卷西风，人似黄花瘦。","note":"选自《宋词三百首》"},{"id":"874","number":874,"title":"念奴娇·萧条庭院","author":"李清照","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"萧条庭院，有斜风细雨，重门须闭。\n宠柳娇花寒食近，种种恼人天气。\n险韵诗成，扶头酒醒，别是闲滋味。\n征鸿过尽，万千心事难寄。\n楼上几日春寒，帘垂四面，玉阑干慵倚。\n被冷香消新梦觉，不许愁人不起。\n清露晨流，新桐初引，多少游春意。\n日高烟敛，更看今日晴未。","note":"选自《宋词三百首》"},{"id":"875","number":875,"title":"永遇乐·落日熔金","author":"李清照","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"落日熔金，暮云合璧，人在何处。\n染柳烟浓，吹梅笛怨，春意知几许。\n元宵佳节，融和天气，次第岂无风雨。\n来相召、香车宝马，谢他酒朋诗侣。\n中州盛日，闺门多暇，记得偏重三五。\n铺翠冠儿，拈金雪柳，簇带争济楚。\n如今憔悴，风鬟霜鬓，怕见夜间出去。\n不如向、帘儿底下，听人笑语。","note":"选自《宋词三百首》"},{"id":"876","number":876,"title":"声声慢·寻寻觅觅","author":"李清照","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n乍暖还寒时候，最难将息。\n三杯两盏淡酒，怎敌他、晚来风急。\n雁过也，正伤心，却是旧时相识。\n满地黄花堆积。\n憔悴损，如今有谁摘。\n守著窗儿，独自怎生得黑。\n梧桐更兼细雨，到黄昏、点点滴滴。\n这次第，怎一个、愁字了得。","note":"选自《宋词三百首》"},{"id":"877","number":877,"title":"苏武慢·雁落平沙","author":"蔡伸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"雁落平沙，烟笼寒水，古垒鸣笳声断。\n青山隐隐，败叶萧萧，天际暝鸦零乱。\n楼上黄昏，片帆千里归程，年华将晚。\n望碧云空暮，佳人何处，梦魂俱远。\n忆旧游、邃馆朱扉，小园香径，尚想桃花人面。\n书盈锦轴，恨满金徽，难写寸心幽怨。\n两地离愁，一尊芳酒，凄凉危阑倚遍。\n尽迟留、凭仗西风，吹乾泪眼。","note":"选自《宋词三百首》"},{"id":"878","number":878,"title":"柳梢青·数声鶗鴂","author":"蔡伸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"数声鶗鴂。\n可怜又是，春归时节。\n满院东风，海棠铺绣，梨花飘雪。\n丁香露泣残枝，算未比、愁肠寸结。\n自是休文，多情多感，不干风月。","note":"选自《宋词三百首》"},{"id":"879","number":879,"title":"摸鱼儿·更能消","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"更能消、几番风雨。\n匆匆春又归去。\n惜春长恨花开早，何况落红无数。\n春且住。\n见说道、天涯芳草迷归路。\n怨春不语。\n算只有殷勤，画檐珠网，尽日惹飞絮。\n长门事，准拟佳期又误。\n蛾眉曾有人妒。\n千金纵买相如赋，脉脉此情谁诉。\n君莫舞。\n君不见、玉环飞燕皆尘土。\n闲愁最苦。\n休去倚危楼，斜阳正在，烟柳断肠处。","note":"选自《宋词三百首》"},{"id":"880","number":880,"title":"水龙吟·楚天千里清秋","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"楚天千里清秋，水随天去秋无际。\n遥岑远目，献愁供恨，玉簪螺髻。\n落日楼头，断鸿声里，江南游子。\n把吴钩看了，栏干拍遍，无人会、登临意。\n休说鲈鱼堪。\n尽西风、季鹰归未。\n求田问舍，怕应羞见，刘郎才气。\n可惜流年，忧愁风雨，树犹如此。\n倩何人，唤取盈盈翠袖，英雄泪。","note":"选自《宋词三百首》"},{"id":"881","number":881,"title":"念奴娇·野棠花落","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"野棠花落，又匆匆、过了青明时节。\n地东风欺客梦，一夜云屏寒怯。\n曲岸持觞，垂杨系马，此地曾轻别。\n楼空人去，旧游飞燕能说。\n闻道绮陌东头，行人长见，帘底纤纤月。\n旧恨春江流未断，新恨云山千叠。\n料得明朝，尊前重见，镜里花难折。\n也应惊问，近来多少华发。","note":"选自《宋词三百首》"},{"id":"882","number":882,"title":"鹧鸪天·枕簟溪堂冷欲秋","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"枕簟溪堂冷欲秋。\n断云依水晚来收。\n红莲相倚浑如醉，白鸟无言定自愁。\n书咄咄，且休休。\n一丘一壑也风流。\n不知筋力衰多少，但觉新来懒上楼。","note":"选自《宋词三百首》"},{"id":"883","number":883,"title":"菩萨蛮·郁孤台下清江水","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"郁孤台下清江水。\n中间多少行人泪。\n西北是长安。\n可怜无数山。\n青山遮不住。\n毕竟江流去。\n江晚正愁予。\n山深闻鹧鸪。","note":"选自《宋词三百首》"},{"id":"884","number":884,"title":"木兰花慢·老来情味减","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"老来情味减，对别酒、怯流年。\n况屈指中秋，十分好月，不照人圆。\n无情水、都不管，共西风、只等送归船。\n秋晚莼鲈江上，夜深儿女灯前。\n征衫。\n便好去朝天。\n玉殿正思贤。\n想夜半承明，留教视草，却遣筹边。\n长安故人问我，道寻常、泥酒只依然。\n目断秋霄落雁，醉来时响空弦。","note":"选自《宋词三百首》"},{"id":"885","number":885,"title":"祝英台令·宝钗分","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"宝钗分，桃叶渡。\n烟柳暗南浦。\n怕上层楼，十日九风雨。\n断肠片片飞红，都无人管，倩谁唤、流莺声住。\n鬓边觑。\n试把花卜心期，才簪又重数。\n罗帐灯昏，呜咽梦中语。\n是他春带愁来，春归何处。\n却不解、将愁归去。","note":"选自《宋词三百首》"},{"id":"886","number":886,"title":"青玉案·东风夜放花千树","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"东风夜放花千树。\n更吹落、星如雨。\n宝马雕车香满路。\n凤箫声动，玉壶光转，一夜鱼龙舞。\n蛾儿雪柳黄金缕。\n笑语盈盈暗香去。\n众里寻他千百度。\n蓦然回首，那人却在，灯火阑珊处。","note":"选自《宋词三百首》"},{"id":"887","number":887,"title":"贺新郎·凤尾龙香拨","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"凤尾龙香拨。\n自开元、霓裳曲罢，几番风月。\n最苦浔阳江头客，画舸亭亭待发。\n记出塞、黄云堆雪。\n马上离愁三万里，望昭阳、宫殿孤鸿没。\n弦解语，恨难说。\n辽阳驿使音尘绝。\n琐窗寒、轻拢慢拈，泪珠盈睫。\n推手含情还却手，一抹梁州哀彻。\n千古事、云飞烟灭。\n贺老定场无消息，想沈香亭北繁华歇。\n弹到此，为呜咽。","note":"选自《宋词三百首》"},{"id":"888","number":888,"title":"贺新郎·绿树听鹈","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绿树听鹈。\n更那堪、鹧鸪声住，杜鹃声切。\n啼到春归无寻处，苦恨芳菲都歇。\n算未抵、人间离别。\n马上琵琶关塞黑，更长门、翠辇辞金阙。\n看燕燕，送归妾。\n将军百战身名裂。\n向河梁、回头万里，故人长绝。\n易水萧萧西风冷，满座衣冠似雪。\n正壮士、悲歌未彻。\n啼鸟还知如许恨，料不啼清泪长啼血。\n谁共我，醉明月。","note":"选自《宋词三百首》"},{"id":"889","number":889,"title":"汉宫春·春已归来","author":"辛弃疾","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"春已归来，看美人头上，袅袅春幡。\n无端风雨，未肯收尽馀寒。\n年时燕子，料今宵、梦到西园。\n浑未办、黄柑荐酒，更传青韭堆盘。\n却笑东风从此，便薰梅染柳，更没些闲。\n闲时又来镜里，转变朱颜。\n清愁不断，问何人、会解连环。\n生怕见、花开花落，朝来塞雁先还。","note":"选自《宋词三百首》"},{"id":"890","number":890,"title":"水龙吟·夜来风雨匆匆","author":"程垓","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"夜来风雨匆匆，故园定是花无几。\n愁多愁极，等闲孤负，一年芳意。\n柳困花慵，杏青梅小，对人容易。\n算好春长在，好花长见，元只是、人憔悴。\n回首池南旧事。\n恨星星、不堪重记。\n如今但有，看花老眼，伤时清泪。\n不怕逢花瘦，只愁怕、老来风味。\n待繁红乱处，留云借月，也须拼醉。","note":"选自《宋词三百首》"},{"id":"891","number":891,"title":"绿头鸭・多丽·玉人家","author":"贺铸","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"玉人家，画楼珠箔临津。\n托微风、彩箫流怨，断肠马上曾闻。\n燕堂开、艳妆丛里，调琴思、认歌颦。\n麝蜡烟浓，玉莲漏短，更衣不待酒初醺。\n绣屏掩、枕鸳相就，香气渐暾暾。\n回廊影，疏钟淡月，几许销魂。\n翠钗分、银笺封泪，舞鞋从此生尘。\n住兰舟、载将离恨，转南浦、背西曛。\n记取明年，蔷薇谢後，佳期应未误行云。\n凤城远，楚梅香嫩，先寄一枝春。\n青门外，祗凭芳草，寻访郎君。","note":"选自《宋词三百首》"},{"id":"892","number":892,"title":"水龙吟·问春何苦匆匆","author":"晁补之","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"问春何苦匆匆，带风伴雨如驰骤。\n幽葩细萼，小园低槛，壅培未就。\n吹尽繁红，占春长久，不如垂柳。\n算春常不老，人愁春老，愁只是、人间有。\n春恨十常八九。\n忍轻辜、芳醪经口。\n那知自是，桃花结子，不因春瘦。\n世上功名，老来风味，春归时候。\n纵樽前痛饮，狂歌似旧，情难依旧。","note":"选自《宋词三百首》"},{"id":"893","number":893,"title":"忆少年·无穷官柳","author":"晁补之","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"无穷官柳，无情画舸，无根行客。\n南山尚相送，只高城人隔。\n罨画园林溪绀碧。\n算重来、尽成陈迹。\n刘郎鬓如此，况桃花颜色。","note":"选自《宋词三百首》"},{"id":"894","number":894,"title":"洞仙歌·青烟幂处","author":"晁补之","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"青烟幂处，碧海飞金镜。\n永夜闲阶卧桂影。\n露凉时、零乱多少寒，神京远，惟有蓝桥路近。\n水晶帘不下，云母屏开，冷浸佳人淡脂粉。\n待都将许多明，付与金尊，投晓共、流霞倾尽。\n更携取、胡床上南楼，看玉做人间，素秋千倾。","note":"选自《宋词三百首》"},{"id":"895","number":895,"title":"瑞龙吟·章台路","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"章台路。\n还见褪粉梅梢，试花桃树。\n坊陌人家，定巢燕子，归来旧处。\n暗凝伫。\n因念个人痴小，乍窥门户。\n侵晨浅约宫黄，障风映袖，盈盈笑语。\n前度刘郎重到，访邻寻里，同时歌舞。\n唯有旧家秋娘，声价如故。\n吟笺赋笔，犹记燕台句。\n知谁伴，名园露饮，东城闲步。\n事与孤鸿去。\n探春尽是，伤离意绪。\n官柳低金缕。\n归骑晚，纤纤池塘飞雨。\n断肠院落，一帘风絮。","note":"选自《宋词三百首》"},{"id":"896","number":896,"title":"锁窗寒・琐寒窗·暗柳啼鸦","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"暗柳啼鸦，单衣伫立，小帘朱户。\n桐花半亩，静锁一庭愁雨。\n洒空阶，夜阑未休，故人剪烛西窗语。\n似楚江暝宿，风灯零乱，少年羁旅。\n迟暮。\n嬉游处。\n正店舍无烟，禁城百五。\n旗亭唤酒，付与高阳俦侣。\n想东园，桃李自春，小唇秀靥今在否。\n到归时，定有残英，待客携尊俎。","note":"选自《宋词三百首》"},{"id":"897","number":897,"title":"风流子·新绿小池塘","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"新绿小池塘。\n风帘动，碎影舞斜阳。\n羡金屋去来，旧时巢燕，土花缭绕，前度莓墙。\n绣阁凤帏深几许，曾听得理丝簧。\n欲说又休，虑乖芳信，未歌先咽，愁近清觞。\n遥知新妆了，开朱户，应自待月西厢。\n最苦梦魂，今宵不到伊行。\n问甚时说与，佳音密耗，寄将秦镜，偷换韩香。\n天便教人，霎时厮见何妨。","note":"选自《宋词三百首》"},{"id":"898","number":898,"title":"应天长·条风布暖","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"条风布暖，霏雾弄晴，池塘遍满春色。\n正是夜堂无月，沈沈暗寒食。\n梁间燕，前社客。\n似笑我、闭门愁寂。\n乱花过，隔院芸香，满地狼藉。\n长记那回时，邂逅相逢，郊外驻油壁。\n又见汉宫传烛，飞烟五候宅。\n青青草，迷路陌。\n强带酒，细寻前迹。\n市桥远，柳下人家，犹自相识。","note":"选自《宋词三百首》"},{"id":"899","number":899,"title":"解连环·怨怀无托","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"怨怀无托。\n嗟情人断绝，信音辽邈。\n信妙手、能解连环，似风散雨收，雾轻云薄。\n燕子楼空，暗尘锁、一床弦索。\n想移根换叶。\n尽是旧时，手种红药。\n汀洲渐生杜若。\n料舟依岸曲，人在天角。\n谩记得、当日音书，把闲语闲言，待总烧却。\n水驿春回，望寄我、江南梅萼。\n拚今生，对花对酒，为伊落泪。","note":"选自《宋词三百首》"},{"id":"900","number":900,"title":"瑞鹤仙·悄郊原带郭","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"悄郊原带郭。\n行路永，客去车尘漠漠。\n斜阳映山落。\n敛馀红、犹恋孤城栏角。\n凌波步弱。\n过短亭、何用素约。\n有流莺劝我，重解绣鞍，缓引春酌。\n不记归时早暮，上马谁扶，醒眠朱阁。\n惊飙动幕。\n扶残醉，绕红药。\n叹西园、已是花深无地，东风何事又恶。\n任流光过却。\n犹喜洞天自乐。","note":"选自《宋词三百首》"},{"id":"901","number":901,"title":"浪涛沙・浪淘沙·昼阴重","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昼阴重，霜凋岸草，雾隐城堞。\n南陌脂车待发。\n东门帐饮乍阕。\n正拂面垂杨堪缆结。\n掩红泪、玉手亲折。\n念汉浦离鸿去何许，经时信音绝。\n情切。\n望中地远天阔。\n向露冷风清，无人处、耿耿寒漏咽。\n嗟万事难忘，唯是轻别。\n翠尊未竭。\n凭断云留取，西楼残月。\n罗带光销纹衾叠。\n连环解、旧香顿歇。\n怨歌永、琼壶敲尽缺。\n恨春去、不与人期，弄夜色，空馀满地梨花雪。","note":"选自《宋词三百首》"},{"id":"902","number":902,"title":"满庭芳·风老莺雏","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"风老莺雏，雨肥梅子，午阴嘉树清圆。\n地卑山近，衣润费垆烟。\n人静乌鸢自乐，小桥外、新绿溅溅。\n凭栏久，黄芦苦竹，拟泛九江船。\n年年。\n如社燕，飘流瀚海，来寄修椽。\n且莫思身外，长近尊前。\n憔悴江南倦客，不堪听、急管繁弦。\n歌筵畔，先安簟枕，容我醉时眠。","note":"选自《宋词三百首》"},{"id":"903","number":903,"title":"过秦楼·水浴清蟾","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"水浴清蟾，叶喧凉吹，巷陌马声初断。\n闲依露井，笑扑流萤，惹破画罗轻扇。\n人静夜久凭阑，愁不归眠，立残更箭。\n叹年华一瞬，人今千里，梦沈书远。\n空见说、鬓怯琼梳，容销金镜，渐懒趁时匀染。\n梅风地溽，虹雨苔滋，一架舞红都变。\n谁信无，为伊才减江淹，情伤荀倩。\n但明河影下，还看稀星数点。","note":"选自《宋词三百首》"},{"id":"904","number":904,"title":"夜游宫·叶下斜阳照水","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"叶下斜阳照水。\n卷轻浪、沈沈千里。\n桥上酸风射眸子。\n立多时，看黄昏，灯火市。\n古屋寒窗底。\n听几片、井桐飞坠。\n不恋单衾再三起。\n有谁知，为萧娘，书一纸。","note":"选自《宋词三百首》"},{"id":"905","number":905,"title":"解语花·风销焰蜡","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"风销焰蜡，露烘炉。\n花市光相射。\n桂华流瓦。\n纤云散，耿耿素娥欲下。\n衣裳淡雅。\n看楚女、纤腰一把。\n箫鼓喧，人影参差，满路飘香麝。\n因念都城放夜。\n望千门如昼，嬉笑游冶。\n钿车罗帕。\n相逢处，自有暗尘随马。\n年光是也。\n唯只见、旧情衰谢。\n清漏移，飞盖归来，从舞休歌罢。","note":"选自《宋词三百首》"},{"id":"906","number":906,"title":"大·对宿烟收","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"对宿烟收，春禽静，飞雨时鸣高屋。\n墙头青玉旆，洗铅霜都尽，嫩梢相触。\n润逼琴丝，寒侵枕障，虫网吹沾帘竹。\n邮亭无人处，听檐声不断，困眠初熟。\n奈愁极顿惊，梦轻难记，自怜幽独。\n行人归意速。\n最先念、流潦妨车毂。\n怎奈向、兰成憔悴，卫清羸，等闲时、易伤心目。\n未怪平阳客，双泪落、笛中哀曲。\n况萧索、青芜国。\n红糁铺地，门外荆桃如菽。\n夜游共谁秉烛。","note":"选自《宋词三百首》"},{"id":"907","number":907,"title":"花犯·粉墙低","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"粉墙低，梅花照眼，依然旧风味。\n露痕轻缀。\n疑净洗铅华，无限佳丽。\n去年胜赏曾孤倚。\n冰盘同宴喜。\n更可惜，雪中高树，香篝熏素被。\n今年对花最匆匆，相逢似有恨，依依愁悴。\n吟望久，青苔上、旋看飞坠。\n相将见、脆丸荐酒，人正在、空江烟浪里。\n但梦想、一枝潇洒，黄昏斜照水。","note":"选自《宋词三百首》"},{"id":"908","number":908,"title":"六丑·正单衣试酒","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"正单衣试酒，恨客里、光阴虚掷。\n愿春暂留，春归如过翼。\n一去无迹。\n为问花何在，夜来风雨，葬楚宫倾国。\n钗钿堕处遗香泽。\n乱点桃蹊，轻翻柳陌。\n多情为谁追惜。\n但蜂媒蝶使，时叩窗隔。\n东园岑寂。\n渐蒙笼暗碧。\n静绕珍丛底，成叹息。\n长条故惹行客。\n似牵衣待话，别情无极。\n残英小、强簪巾帻。\n终不似一朵，钗头颤袅，向人侧。\n漂流处、莫趁潮汐。\n恐断红、尚有相思字，何由见得。","note":"选自《宋词三百首》"},{"id":"909","number":909,"title":"兰陵王·柳阴直","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"柳阴直。\n烟里丝丝弄碧。\n隋堤上、曾见几番，拂水飘绵送行色。\n登临望故国。\n谁识。\n京华倦客。\n长亭路，年去岁来，应折柔条过千尺。\n闲寻旧踪迹。\n又酒趁哀弦，灯照离席。\n梨花榆火催寒食。\n愁一箭风快，半篙波暖，回头迢递便数驿。\n望人在天北。\n凄恻。\n恨堆积。\n渐别浦萦回，津堠岑寂。\n斜阳冉冉春无极。\n念月榭携手，露桥闻笛。\n沈思前事，似梦里，泪暗滴。","note":"选自《宋词三百首》"},{"id":"910","number":910,"title":"西河·佳丽地","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"佳丽地。\n南朝盛事谁记。\n山围故国绕清江，髻鬟对起。\n怒涛寂寞打孤城，风樯遥度天际。\n断崖树，犹倒倚。\n莫愁艇子曾系。\n空馀旧迹郁苍苍，雾沈半垒。\n夜深月过女墙来，赏心东望淮水。\n酒旗戏鼓甚处市。\n想依稀、王谢邻里。\n燕子不知何世。\n入寻常、巷陌人家，相对如说兴亡，斜阳里。","note":"选自《宋词三百首》"},{"id":"911","number":911,"title":"绮寮怨·上马人扶残醉","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"上马人扶残醉，晓风吹未醒。\n映水曲、翠瓦朱檐，垂杨里、乍见津亭。\n当时曾题败壁，蛛丝罩、淡墨苔晕青。\n念去来、岁月如流，徘徊久、叹息愁思盈。\n去去倦寻路程。\n江陵旧事，何曾再问杨琼。\n旧曲凄清。\n敛愁黛、与谁听。\n尊前故人如在，想念我、最关情。\n何须渭城。\n歌声未尽处，先泪零。","note":"选自《宋词三百首》"},{"id":"912","number":912,"title":"拜星月・拜星月慢·夜色催更","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"夜色催更，清尘收露，小曲幽坊月暗。\n竹槛灯窗，识秋娘庭院。\n笑相遇，似觉琼枝玉树相倚，暖日明霞光烂。\n水眄兰情，总平生稀见。\n画图中、旧识春风面。\n谁知道、自到瑶台畔。\n眷恋雨润云温，苦惊风吹散。\n念荒寒、寄宿无人馆。\n重门闭、败壁秋虫叹。\n怎奈向、一缕相思，隔溪山不断。","note":"选自《宋词三百首》"},{"id":"913","number":913,"title":"尉迟杯·隋堤路","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"隋堤路。\n渐日晚、密霭生深树。\n阴阴淡月笼沙，还宿河桥深处。\n无情画舸，都不管、烟波隔南浦。\n等行人、醉拥重衾，载将离恨归去。\n因念旧客京华，长偎傍、疏林小槛欢聚。\n冶叶倡条俱相识，仍惯见、珠歌翠舞。\n如今向、渔村水驿，夜如岁、焚香独自语。\n有何人、念我无，梦魂凝想鸳侣。","note":"选自《宋词三百首》"},{"id":"914","number":914,"title":"蝶恋花·月皎惊乌栖不定","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"月皎惊乌栖不定。\n更漏将残，辘，牵金井。\n唤起两眸清炯炯。\n泪花落枕红棉泠。\n执手霜风吹鬓影。\n去意徊徨，别语愁难听。\n楼上阑干横斗柄。\n露寒人远鸡相应。","note":"选自《宋词三百首》"},{"id":"915","number":915,"title":"夜飞鹊・夜飞鹊慢·河桥送人处","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"河桥送人处，凉夜何其。\n斜月远堕馀辉。\n铜盘烛泪已流尽，霏霏凉露沾衣。\n相将散离会，探风前津鼓，树杪参旗。\n华骢会意，纵扬鞭、亦自行迟。\n迢递路回清野，人语渐无闻，空带愁归。\n何意重红满地，遗钿不见，斜径都迷。\n兔葵燕麦，向残阳、欲与人齐。\n但徘徊班草，欷酹酒，极望天西。","note":"选自《宋词三百首》"},{"id":"916","number":916,"title":"关河令・清商怨·秋阴时晴渐向暝","author":"周邦彦","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"秋阴时晴渐向暝，变一庭凄冷。\n伫听寒声，云深无雁影。\n更深人去寂静。\n但照壁、孤灯相映。\n酒已都醒，如何消夜永。","note":"选自《宋词三百首》"},{"id":"917","number":917,"title":"南浦·风悲画角","author":"孔夷","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"风悲画角，听单于、三弄落谯门。\n投宿征骑，飞雪满孤村。\n酒市渐闲灯火，正敲窗、乱叶舞纷纷。\n送数声惊雁，下离烟水，嘹唳度寒云。\n好在半胧溪月，到如今、无处不销魂。\n故国梅花归梦，愁损绿罗裙。\n为问暗香闲艳，也相思、万点付啼痕。\n算翠屏应是，两眉馀恨倚黄昏。","note":"选自《宋词三百首》"},{"id":"918","number":918,"title":"临江仙·忆昔西池池上饮","author":"晁冲之","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"忆昔西池池上饮，年年多少欢娱。\n别来不寄一行书。\n寻常相见了，犹道不如初。\n安稳锦屏今夜梦，月明好度江湖。\n相思休问定何如。\n情知春去後，管得落花无。","note":"选自《宋词三百首》"},{"id":"919","number":919,"title":"惜分飞·泪湿阑干花著露","author":"毛滂","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"泪湿阑干花著露。\n愁到眉峰碧聚。\n此恨平分取。\n更无言语。\n空相觑。\n短雨残云无意绪。\n寂寞朝朝暮暮。\n今夜山深处。\n断魂分付。\n潮回去。","note":"选自《宋词三百首》"},{"id":"920","number":920,"title":"天香·孤峤蟠烟","author":"王沂孙","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"孤峤蟠烟，层涛蜕月，骊宫夜采铅水。\n讯远槎风，梦深薇露，化作断魂心字。\n红瓷候火，还乍识、冰环玉指。\n一缕萦帘翠影，依稀海天云气。\n几回娇半醉。\n翦春灯、夜寒花碎。\n更好故溪飞雪，小窗深闭。\n荀令如今顿老，总忘却、樽前旧风味。\n谩惜馀熏，空篝素被。","note":"选自《宋词三百首》"},{"id":"921","number":921,"title":"眉妩·渐新痕悬柳","author":"王沂孙","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"渐新痕悬柳，澹彩穿花，依约破初暝。\n便有团圆意，深深拜，相逢谁在香径。\n画眉未稳，料素娥、犹带离恨。\n最堪爱、一曲银钩小，宝帘挂秋冷。\n千古盈亏休问。\n叹慢磨玉斧，难补金镜。\n太液池犹在，凄凉处、何人重赋清景。\n故山夜永。\n试待他、窥户端正。\n看云外山河，还老尽、桂花影。","note":"选自《宋词三百首》"},{"id":"922","number":922,"title":"齐天乐·一襟馀恨宫魂断","author":"王沂孙","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一襟馀恨宫魂断，年年翠阴庭树。\n乍咽凉柯，还移暗叶，重把离愁深诉。\n西窗过雨。\n怪瑶佩流空，玉筝调柱。\n镜暗妆残，为谁娇鬓尚如许。\n铜仙铅泪似洗，叹携盘去远，难贮零露。\n病翼惊秋，枯形阅世，消得斜阳几度。\n馀音更苦。\n甚独抱清高，顿成凄楚。\n谩想薰风，柳丝千万缕。","note":"选自《宋词三百首》"},{"id":"923","number":923,"title":"高阳台·残雪庭阴","author":"王沂孙","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"残雪庭阴，轻寒帘影，霏霏玉管春葭。\n小帖金泥，不知春在谁家。\n相思一夜窗前梦，奈个人、水隔天遮。\n但凄然，满树幽香，满地横斜。\n江南自是离愁苦，况游骢古道，归雁平沙。\n怎得银笺，殷勤与说年华。\n如今处处生芳草，纵凭高、不见天涯。\n更消他，几度东风，几度飞花。","note":"选自《宋词三百首》"},{"id":"924","number":924,"title":"法曲献仙音·层绿峨峨","author":"王沂孙","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"层绿峨峨，纤琼皎皎，倒压波痕清浅。\n过眼年华，动人幽意，相逢几番春换。\n记唤酒寻芳处，盈盈褪妆晚。\n已销黯。\n况凄凉、近来离思，应忘却、明月夜深归辇。\n荏苒一枝春，恨东风、人似天远。\n纵有残花，洒征衣、铅泪都满。\n但殷勤折取，自遣一襟幽怨。","note":"选自《宋词三百首》"},{"id":"925","number":925,"title":"长亭怨・长亭怨慢·泛孤艇","author":"王沂孙","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"泛孤艇、东皋过遍。\n尚记当日，绿阴门掩。\n屐齿莓阶，酒痕罗袖事何限。\n欲寻前迹，空惆怅、成秋苑。\n自约赏花人，别後总、风流云散。\n水远。\n怎知流水外，却是乱山尤远。\n天涯梦短。\n想忘了、绮疏雕槛。\n望不尽、苒苒斜阳，抚乔木、年华将晚。\n但数点红英，犹识西园凄婉。","note":"选自《宋词三百首》"},{"id":"926","number":926,"title":"紫萸香慢·近重阳","author":"姚云文","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"近重阳、偏多风雨，绝怜此日暄明。\n问秋香浓未，待携客、出西城。\n正自羁怀多感，怕荒台高处，更不胜情。\n向尊前、又忆洒酒插花人。\n只座上、已无老兵。\n凄情。\n浅醉还醒。\n愁不肯、与诗平。\n记长楸走马，雕弓笮柳，前事休评。\n紫萸一枝传赐，梦谁到、汉家陵。\n尽乌纱、便随风去，要天知道，华发如此星星。\n歌罢涕零。","note":"选自《宋词三百首》"},{"id":"927","number":927,"title":"贺新郎·梦冷黄金屋","author":"蒋捷","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"梦冷黄金屋。\n叹秦筝、斜鸿阵里，素弦尘扑。\n化作娇莺飞归去，犹认纱窗旧绿。\n正过雨、荆桃如菽。\n此恨难平君知否，似琼台、涌起弹棋局。\n消瘦影，嫌明烛。\n鸳楼碎泻东西玉。\n问芳、何时再展，翠钗难卜。\n待把宫眉横云样，描上生绡画幅。\n怕不是、新来妆束。\n彩扇红牙今都在，恨无人、解听开元曲。\n空掩袖，倚寒竹。","note":"选自《宋词三百首》"},{"id":"928","number":928,"title":"女冠子·蕙花香也","author":"蒋捷","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蕙花香也。\n雪晴池馆如画。\n春风飞到，宝钗楼上，一片笙箫，琉璃光射。\n而今灯漫挂。\n不是暗尘明月，那时元夜。\n况年来、心懒意怯，羞与蛾儿争要。\n江城人悄初更打。\n问繁华谁解，再向天公借。\n剔残红灺。\n但梦里隐隐，钿车罗帕。\n吴笺银粉砑。\n待把旧家风景，写成闲话。\n笑绿鬟邻女，倚窗犹唱，夕阳西下。","note":"选自《宋词三百首》"},{"id":"929","number":929,"title":"瑞鹤仙·绀烟迷雁迹","author":"蒋捷","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绀烟迷雁迹。\n渐断鼓零钟，街喧初息。\n风檠背寒壁。\n放冰蜍飞到，丝丝窗隙。\n琼瑰暗泣。\n念乡关、霜芜似织。\n漫将身、化鹤归来，忘却旧游端的。\n欢极。\n蓬壶蕖浸，花院梨溶，醉连春夕。\n柯云罢弈。\n樱桃在，梦难觅。\n劝清光，乍可幽窗相伴，休照红楼夜笛。\n怕人间、换谱伊凉，素娥未识。","note":"选自《宋词三百首》"},{"id":"930","number":930,"title":"甘州・八声甘州·记玉关","author":"张炎","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"记玉关、踏雪事清游。\n寒气脆貂裘。\n傍枯林古道，长河饮马，此意悠悠。\n短梦依然江表，老泪洒西州。\n一字无题处，落叶都愁。\n载取白云归去，问谁留楚佩，弄影中洲。\n折芦花赠远，零落一身秋。\n向寻常野桥流水，待招来、不是旧沙鸥。\n空怀感，有斜阳处，却怕登楼。","note":"选自《宋词三百首》"},{"id":"931","number":931,"title":"渡江云·山空天入海","author":"张炎","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山空天入海，倚楼望极，风急暮潮初。\n一帘鸠外雨，几处闲田，隔水动春锄。\n新烟禁柳，想如今、绿到西湖。\n犹记得、当年深隐，门掩两三株。\n愁余。\n荒洲古溆，断梗疏萍，更漂流何处。\n空自觉、围羞带减，影怯灯孤。\n常疑即见桃花面，甚近来、翻笑无书。\n书纵远，如何也都无。","note":"选自《宋词三百首》"},{"id":"932","number":932,"title":"解连环·楚江空晚","author":"张炎","tags":["宋词"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"楚江空晚。\n怅离群万里，恍然惊散。\n自顾影、欲下寒塘，正沙净草枯，水平天远。\n写不成书，只寄得、相思一点。\n料因循误了，
