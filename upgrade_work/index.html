定尔功。","note":"《诗经·周颂·臣工之什》"},{"id":"286","number":286,"title":"闵予小子","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"闵予小子，遭家不造，嬛嬛在疚。于乎皇考，永世克孝。\n念兹皇祖，陟降庭止。维予小子，夙夜敬止。于乎皇王，继序思不忘。","note":"《诗经·周颂·闵予小子之什》"},{"id":"287","number":287,"title":"访落","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"访予落止，率时昭考。于乎悠哉，朕未有艾。将予就之，继犹判涣。\n维予小子，未堪家多难。绍庭上下，陟降厥家。休矣皇考，以保明其身。","note":"《诗经·周颂·闵予小子之什》"},{"id":"288","number":288,"title":"敬之","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"敬之敬之，天维显思，命不易哉。无曰高高在上，陟降厥士，日监在兹。\n维予小子，不聪敬止。日就月将，学有缉熙于光明。佛时仔肩，示我显德行。","note":"《诗经·周颂·闵予小子之什》"},{"id":"289","number":289,"title":"小毖","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"予其惩，而毖后患。莫予荓蜂，自求辛螫。肇允彼桃虫，拚飞维鸟。未堪家多难，予又集于蓼。","note":"《诗经·周颂·闵予小子之什》"},{"id":"290","number":290,"title":"载芟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"载芟载柞，其耕泽泽。千耦其耘，徂隰徂畛。侯主侯伯，侯亚侯旅，侯彊侯以。\n有嗿其馌，思媚其妇，有依其士。有略其耜，俶载南亩，播厥百谷。实函斯活，驿驿其达。\n有厌其杰，厌厌其苗，绵绵其麃。载获济济，有实其积，万亿及秭。为酒为醴，烝畀祖妣，不洽百礼。\n有飶其香。邦家之光。有椒其馨，胡考之宁。匪且有且，匪今斯今，振古如兹。","note":"《诗经·周颂·闵予小子之什》"},{"id":"291","number":291,"title":"良耜","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"畟畟良耜，俶载南亩。播厥百谷，实函斯活。或来瞻女，载筐及莒，其饟伊黍。\n其笠伊纠，其镈斯赵，以薅荼蓼。荼蓼朽止，黍稷茂止。获之挃挃，积之栗栗。\n其崇如墉，其比如栉。以开百室，百室盈止，妇子宁止。杀时犉牡，有捄其角。以似以续，续古之人。","note":"《诗经·周颂·闵予小子之什》"},{"id":"292","number":292,"title":"丝衣","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"丝衣其紑，载弁俅俅。自堂徂基，自羊徂牛，鼐鼎及鼒，兕觥其觩。旨酒思柔。不吴不敖，胡考之休。","note":"《诗经·周颂·闵予小子之什》"},{"id":"293","number":293,"title":"酌","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"于铄王师，遵养时晦。时纯熙矣，是用大介。我龙受之，蹻蹻王之造。载用有嗣，实维尔公允师。","note":"《诗经·周颂·闵予小子之什》"},{"id":"294","number":294,"title":"桓","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绥万邦，屡丰年。天命匪解，桓桓武王。保有厥士，于以四方，克定厥家。于昭于天，皇以间之。","note":"《诗经·周颂·闵予小子之什》"},{"id":"295","number":295,"title":"赉","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"文王既勤止，我应受之。敷时绎思，我徂维求定。时周之命，于绎思。","note":"《诗经·周颂·闵予小子之什》"},{"id":"296","number":296,"title":"般","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"于皇时周！陟其高山，嶞山乔岳，允犹翕河。敷天之下，裒时之对。时周之命。","note":"《诗经·周颂·闵予小子之什》"},{"id":"297","number":297,"title":"駉","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"駉駉牡马，在坰之野。薄言駉者，有驈有皇，有骊有黄，以车彭彭。思无疆思，马斯臧。\n駉駉牡马，在坰之野。薄言駉者，有骓有駓，有骍有骐，以车伾伾。思无期思，马斯才。\n駉駉牡马，在坰之野。溥言駉者，有驒有骆，有骝有雒，以车绎绎。思无斁思，马斯作。\n駉駉牡马，在坰之野。薄言駉者，有骃有騢，有驔有鱼，以车祛祛。思无邪思，马斯徂。","note":"《诗经·鲁颂·駉之什》"},{"id":"298","number":298,"title":"有駜","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有駜有駜，駜彼乘黄。夙夜在公，在公明明。振振鹭，鹭于下。鼓咽咽，醉言舞。于胥乐兮！\n有駜有駜，駜彼乘牡。夙夜在公，在公饮酒。振振鹭，鹭于飞。鼓咽咽，醉言归。于胥乐兮！\n有駜有駜，駜彼乘駽。夙夜在公，在公载燕。自今以始，岁其有。君子有穀，诒孙子。于胥乐兮！","note":"《诗经·鲁颂·駉之什》"},{"id":"299","number":299,"title":"泮水","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"思乐泮水，薄采其芹。鲁侯戾止，言观其旂。其旂茷茷，鸾声哕哕。无小无大，从公于迈。\n思乐泮水，薄采其藻。鲁侯戾止，其马蹻蹻。其马蹻蹻，其音昭昭。载色载笑，匪怒伊教。\n思乐泮水，薄采其茆。鲁侯戾止，在泮饮酒。既饮旨酒，永锡难老。顺彼长道，屈此群丑。\n穆穆鲁侯，敬明其德。敬慎威仪，维民之则。允文允武，昭假烈祖。靡有不孝，自求伊祜。\n明明鲁侯，克明其德。既作泮宫，淮夷攸服。矫矫虎臣，在泮献馘。淑问如皋陶，在泮献囚。\n济济多士，克广德心。桓桓于征，狄彼东南。烝烝皇皇，不吴不扬。不告于訩，在泮献功。\n角弓其觩。束矢其搜。戎车孔博。徒御无斁。既克淮夷，孔淑不逆。式固尔犹，淮夷卒获。\n翩彼飞鸮，集于泮林。食我桑黮，怀我好音。憬彼淮夷，来献其琛。元龟象齿，大赂南金。","note":"《诗经·鲁颂·駉之什》"},{"id":"300","number":300,"title":"閟宫","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"閟宫有侐，实实枚枚。赫赫姜嫄，其德不回。上帝是依，无灾无害。\n弥月不迟，是生后稷。降之百福。黍稷重穋，稙稚菽麦。奄有下国，俾民稼穑。\n有稷有黍，有稻有秬。奄有下土，缵禹之绪。后稷之孙，实维大王。\n居岐之阳，实始剪商。至于文武，缵大王之绪，致天之届，于牧之野。\n无二无虞，上帝临女。敦商之旅，克咸厥功。王曰叔父，建尔元子，俾侯于鲁。\n大启尔宇，为周室辅。乃命鲁公，俾侯于东。锡之山川，土田附庸。\n周公之孙，庄公之子。龙旂承祀。六辔耳耳。春秋匪解，享祀不忒。\n皇皇后帝！皇祖后稷！享以骍牺，是飨是宜。降福既多，周公皇祖，亦其福女。\n秋而载尝，夏而楅衡，白牡骍刚。牺尊将将，毛炰胾羹。笾豆大房，万舞洋洋。\n孝孙有庆。俾尔炽而昌，俾尔寿而臧。保彼东方，鲁邦是尝。不亏不崩，不震不腾。\n三寿作朋，如冈如陵。公车千乘，朱英绿縢。二矛重弓。公徒三万，贝胄朱綅。\n烝徒增增，戎狄是膺，荆舒是惩，则莫我敢承！俾尔昌而炽，俾尔寿而富。\n黄发台背，寿胥与试。俾尔昌而大，俾尔耆而艾。万有千岁，眉寿无有害。\n泰山岩岩，鲁邦所詹。奄有龟蒙，遂荒大东。至于海邦，淮夷来同。\n莫不率从，鲁侯之功。保有凫绎，遂荒徐宅。至于海邦，淮夷蛮貊。\n及彼南夷，莫不率从。莫敢不诺，鲁侯是若。天锡公纯嘏，眉寿保鲁。\n居常与许，复周公之宇。鲁侯燕喜，令妻寿母。宜大夫庶士，邦国是有。\n既多受祉，黄发儿齿。徂徠之松，新甫之柏。是断是度，是寻是尺。\n松桷有舄，路寝孔硕，新庙奕奕。奚斯所作，孔曼且硕，万民是若。","note":"《诗经·鲁颂·駉之什》"},{"id":"301","number":301,"title":"那","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"猗与那与！置我鞉鼓。奏鼓简简，衎我烈祖。汤孙奏假，绥我思成。\n鞉鼓渊渊，嘒嘒管声。既和且平，依我磬声。于赫汤孙！穆穆厥声。\n庸鼓有斁，万舞有奕。我有嘉客，亦不夷怿。自古在昔，先民有作。\n温恭朝夕，执事有恪，顾予烝尝，汤孙之将。","note":"《诗经·商颂·那之什》"},{"id":"302","number":302,"title":"烈祖","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"嗟嗟烈祖！有秩斯祜。申锡无疆，及尔斯所。既载清酤，赉我思成。\n亦有和羹，既戒既平。鬷假无言，时靡有争。绥我眉寿，黄耇无疆。\n约軧错衡，八鸾鸧鸧。以假以享，我受命溥将。自天降康，丰年穰穰。\n来假来飨，降福无疆。顾予烝尝，汤孙之将。","note":"《诗经·商颂·那之什》"},{"id":"303","number":303,"title":"玄鸟","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"天命玄鸟，降而生商，宅殷土芒芒。古帝命武汤，正域彼四方。\n方命厥后，奄有九有。商之先后，受命不殆，在武丁孙子。武丁孙子，武王靡不胜。\n龙旂十乘，大糦是承。邦畿千里，维民所止，肇域彼四海。\n四海来假，来假祁祁。景员维河。殷受命咸宜，百禄是何。","note":"《诗经·商颂·那之什》"},{"id":"304","number":304,"title":"长发","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"浚哲维商，长发其祥。洪水芒芒，禹敷下土方。外大国是疆，幅陨既长。有娀方将，帝立子生商。\n玄王桓拨，受小国是达，受大国是达。率履不越，遂视既发。相士烈烈。海外有截。\n帝命不违，至于汤齐。汤降不迟，圣敬日跻。昭假迟迟，上帝是祗，帝命式于九围。\n受小球大球，为下国缀旒，何天之休。不竞不絿，不刚不柔。敷政优优。百禄是遒。\n受小共大共，为下国骏厖。何天之龙，敷奏其勇。不震不动，不戁不竦，百禄是总。\n武王载旆，有虔秉钺。如火烈烈，则莫我敢曷。苞有三蘖，莫遂莫达。九有有截，韦顾既伐，昆吾夏桀。\n昔在中叶，有震且业。允也天子，降予卿士。实维阿衡，实左右商王。","note":"《诗经·商颂·那之什》"},{"id":"305","number":305,"title":"殷武","author":"佚名","tags":["诗经"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"挞彼殷武，奋伐荆楚。深入其阻，裒荆之旅。有截其所，汤孙之绪。\n维女荆楚，居国南乡。昔有成汤，自彼氐羌，莫敢不来享，莫敢不来王。曰商是常。\n天命多辟，设都于禹之绩。岁事来辟，勿予祸适，稼穑匪解。\n天命降监，下民有严。不僭不滥，不敢怠遑。命于下国，封建厥福。\n商邑翼翼，四方之极。赫赫厥声，濯濯厥灵。寿考且宁，以保我后生。\n陟彼景山，松伯丸丸。是断是迁，方斫是虔。松桷有梴，旅楹有闲，寝成孔安。","note":"《诗经·商颂·那之什》"},{"id":"306","number":306,"title":"在岳咏蝉","author":"骆宾王","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"西陆蝉声唱，南冠客思侵。\n那堪玄鬓影，来对白头吟。\n露重飞难进，风多响易沈。\n无人信高洁，谁为表予心。","note":"选自《唐诗三百首》"},{"id":"307","number":307,"title":"登幽州台歌","author":"陈子昂","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"前不见古人，后不见来者。\n念天地之悠悠，独怆然而涕下。","note":"选自《唐诗三百首》"},{"id":"308","number":308,"title":"经邹鲁祭孔子而叹之","author":"明皇帝","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"夫子何为者？栖栖一代中。\n地犹鄹氏邑，宅即鲁王宫。\n叹凤嗟身否，伤麟怨道穷。\n今看两楹奠，当与梦时同。","note":"选自《唐诗三百首》"},{"id":"309","number":309,"title":"鼓吹曲辞 将进酒","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君不见黄河之水天上来，奔流到海不复回。\n君不见高堂明镜悲白发，朝如青丝暮成雪。\n人生得意须尽欢，莫使金尊空对月。\n天生我材必有用，千金散尽还复来。\n烹羊宰牛且为乐，会须一饮三百杯。\n岑夫子，丹丘生，将进酒，杯莫停。\n与君歌一曲，请君为我侧耳听。\n钟鼓馔玉不足贵，但愿长醉不复醒。\n古来圣贤皆寂寞，惟有饮者留其名。\n陈王昔时宴平乐，斗酒十千恣欢谑。\n主人何为言少钱，径须酤取对君酌。\n五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。","note":"选自《唐诗三百首》"},{"id":"310","number":310,"title":"横吹曲辞 出塞 一","author":"王昌龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"秦时明月汉时关，万里长征人未还。\n但使龙城飞将在，不教胡马度阴山。","note":"选自《唐诗三百首》"},{"id":"311","number":311,"title":"横吹曲辞 出塞","author":"王之涣","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"黄砂直上白云间，一片孤城万仞山。\n羌笛何须怨杨柳，春风不度玉门关。","note":"选自《唐诗三百首》"},{"id":"312","number":312,"title":"横吹曲辞 关山月","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"明月出天山，苍茫云海间。\n长风几万里，吹度玉门关。\n汉下白登道，胡窥青海湾。\n由来征战地，不见有人还。\n戍客望边色，思归多苦颜。\n高楼当此夜，叹息未应闲。","note":"选自《唐诗三百首》"},{"id":"313","number":313,"title":"新嫁娘词三首 三","author":"王建","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"三日入厨下，洗手作羹汤。\n未谙姑食性，先遣小姑尝。","note":"选自《唐诗三百首》"},{"id":"314","number":314,"title":"故行宫","author":"王建","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"寥落古行宫，宫花寂寞红。\n白头宫女在，闲坐说玄宗。","note":"选自《唐诗三百首》"},{"id":"315","number":315,"title":"锦瑟","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"锦瑟无端五十弦，一弦一柱思华年。\n庄生晓梦迷蝴蝶，望帝春心托杜鹃。\n沧海月明珠有泪，蓝田日暖玉生烟。\n此情可待成追忆，只是当时已惘然。","note":"选自《唐诗三百首》"},{"id":"316","number":316,"title":"蝉","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"本以高难饱，徒劳恨费声。\n五更疎欲断，一树碧无情。\n薄宦梗犹泛，故园芜已平。\n烦君最相警，我亦举家清。","note":"选自《唐诗三百首》"},{"id":"317","number":317,"title":"乐游原","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"向晚意不适，驱车登古原。\n夕阳无限好，只是近黄昏。","note":"选自《唐诗三百首》"},{"id":"318","number":318,"title":"夜雨寄北","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君问归期未有期，巴山夜雨涨秋池。\n何当共剪西窗烛，却话巴山夜雨时。","note":"选自《唐诗三百首》"},{"id":"319","number":319,"title":"韩碑","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"元和天子神武姿，彼何人哉轩与羲。\n誓将上雪列圣耻，坐法宫中朝四夷。\n淮西有贼五十载，封狼生䝙䝙生罴。\n不据山河据平地，长戈利矛日可麾。\n帝得圣相相曰度，贼斫不死神扶持。\n腰悬相印作都统，阴风惨澹天王旗。\n愬武古通作牙爪，仪曹外郎载笔随。\n行军司马智且勇，十四万众犹虎貔。\n入蔡缚贼献太庙，功无与让恩不訾。\n帝曰汝度功第一，汝从事愈宜为辞。\n愈拜稽首蹈且舞，金石刻画臣能为。\n古者世称大手笔，此事不系于职司。\n当仁自古有不让，言讫屡颔天子颐。\n公退斋戒坐小阁，濡染大笔何淋漓。\n点窜尧典舜典字，涂改清庙生民诗。\n文成破体书在纸，清晨再拜铺丹墀。\n表曰臣愈昧死上，咏神圣功书之碑。\n碑高三丈字如斗，负以灵鼇蟠以螭。\n句奇语重喻者少，谗之天子言其私。\n长绳百尺拽碑倒，麤砂大石相磨治。\n公之斯文若元气，先时已入人肝脾。\n汤盘孔鼎有述作，今无其器存其辞。\n呜呼圣皇及圣相，相与烜赫流淳熙。\n公之斯文不示后，曷与三五相攀追。\n愿书万本诵万过，口角流沫右手胝。\n传之七十有二代，以为封禅玉检明堂基。","note":"选自《唐诗三百首》"},{"id":"320","number":320,"title":"风雨","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"凄凉宝剑篇，羁泊欲穷年。\n黄叶仍风雨，青楼自管弦。\n新知遭薄俗，旧好隔良缘。\n心断新丰酒，销愁斗几千。","note":"选自《唐诗三百首》"},{"id":"321","number":321,"title":"寄令狐郎中","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"嵩云秦树久离居，双鲤迢迢一纸书。\n休问梁园旧宾客，茂陵秋雨病相如。","note":"选自《唐诗三百首》"},{"id":"322","number":322,"title":"隋宫","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"紫泉宫殿锁烟霞，欲取芜城作帝家。\n玉玺不缘归日角，锦帆应是到天涯。\n于今腐草无萤火，终古垂杨有暮鸦。\n地下若逢陈后主，岂宜重问后庭花。","note":"选自《唐诗三百首》"},{"id":"323","number":323,"title":"筹笔驿","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"猿鸟犹疑畏简书，风云常为护储胥。\n徒令上将挥神笔，终见降王走传车。\n管乐有才终不忝，关张无命欲何如。\n他年锦里经祠庙，梁父吟成恨有余。","note":"选自《唐诗三百首》"},{"id":"324","number":324,"title":"无题二首 一","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昨夜星辰昨夜风，画楼西畔桂堂东。\n身无彩凤双飞翼，心有灵犀一点通。\n隔座送钩春酒暖，分曹射复蜡灯红。\n嗟余听鼓应官去，走马兰台类断蓬。","note":"选自《唐诗三百首》"},{"id":"325","number":325,"title":"无题四首 一","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"来是空言去绝踪，月斜楼上五更钟。\n梦为远别啼难唤，书被催成墨未浓。\n蜡照半笼金翡翠，麝熏微度绣芙蓉。\n刘郎已恨蓬山远，更隔蓬山一万重。","note":"选自《唐诗三百首》"},{"id":"326","number":326,"title":"无题四首 二","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"飒飒东风细雨来，芙蓉塘外有轻雷。\n金蟾啮鏁烧香入，玉虎牵丝汲井回。\n贾氏窥帘韩掾少，宓妃留枕魏王才。\n春心莫共花争发，一寸相思一寸灰。","note":"选自《唐诗三百首》"},{"id":"327","number":327,"title":"隋宫","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"乘兴南游不戒严，九重谁省谏书函。\n春风举国裁宫锦，半作障泥半作帆。","note":"选自《唐诗三百首》"},{"id":"328","number":328,"title":"落花","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"高阁客竟去，小园花乱飞。\n参差连曲陌，迢遰送斜晖。\n肠断未忍扫，眼穿仍欲归。\n芳心向春尽，所得是沾衣。","note":"选自《唐诗三百首》"},{"id":"329","number":329,"title":"为有","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"为有云屏无限娇，凤城寒尽怕春宵。\n无端嫁得金龟壻，辜负香衾事早朝。","note":"选自《唐诗三百首》"},{"id":"330","number":330,"title":"无题","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"相见时难别亦难，东风无力百花残。\n春蚕到死丝方尽，蜡炬成灰泪始干。\n晓镜但愁云鬓改，夜吟应觉月光寒。\n蓬山此去无多路，青鸟殷勤为探看。","note":"选自《唐诗三百首》"},{"id":"331","number":331,"title":"瑶池","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"瑶池阿母绮窗开，黄竹歌声动地哀。\n八骏日行三万里，穆王何事不重来。","note":"选自《唐诗三百首》"},{"id":"332","number":332,"title":"春雨","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"怅卧新春白袷衣，白门寥落意多违。\n红楼隔雨相望冷，珠箔飘灯独自归。\n远路应悲春晼晚，残宵犹得梦依稀。\n玉珰缄札何由达，万里云罗一雁飞。","note":"选自《唐诗三百首》"},{"id":"333","number":333,"title":"常娥","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"云母屏风烛影深，长河渐落晓星沈。\n常娥应悔偷灵药，碧海青天夜夜心。","note":"选自《唐诗三百首》"},{"id":"334","number":334,"title":"无题二首 一","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"凤尾香罗薄几重，碧文圆顶夜深缝。\n扇裁月魄羞难掩，车走雷声语未通。\n曾是寂寥金烬暗，断无消息石榴红。","note":"选自《唐诗三百首》"},{"id":"335","number":335,"title":"无题二首 二","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"重帷深下莫愁堂，卧后清宵细细长。\n神女生涯原是梦，小姑居处本无郎。\n风波不信菱枝弱，月露谁教桂叶香。\n直道相思了无益，未妨惆怅是清狂。","note":"选自《唐诗三百首》"},{"id":"336","number":336,"title":"贾生","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"宣室求贤访逐臣，贾生才调更无伦。\n可怜夜半虚前席，不问苍生问鬼神。","note":"选自《唐诗三百首》"},{"id":"337","number":337,"title":"凉思","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"客去波平槛，蝉休露满枝。\n永怀当此节，倚立自移时。\n北斗兼春远，南陵寓使迟。\n天涯占梦数，疑误有新知。","note":"选自《唐诗三百首》"},{"id":"338","number":338,"title":"北青萝","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"残阳西入崦，茅屋访孤僧。\n落叶人何在，寒云路几层。\n独敲初夜磬，闲倚一枝藤。\n世界微尘里，吾宁爱与憎。","note":"选自《唐诗三百首》"},{"id":"339","number":339,"title":"赤壁","author":"李商隐","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"折戟沈沙铁未销，自将磨洗认前朝。\n东风不与周郎便，铜雀春深锁二乔。","note":"选自《唐诗三百首》"},{"id":"340","number":340,"title":"章台夜思","author":"韦庄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"清瑟怨遥夜，遶弦风雨哀。\n孤灯闻楚角，残月下章台。\n芳草已云暮，故人殊未来。\n乡书不可寄，秋雁又南回。","note":"选自《唐诗三百首》"},{"id":"341","number":341,"title":"金陵图","author":"韦庄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"谁谓伤心画不成，画人心逐世人情。\n君看六幅南朝事，老木寒云满故城。","note":"选自《唐诗三百首》"},{"id":"342","number":342,"title":"台城","author":"韦庄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"江雨霏霏江草齐，六朝如梦鸟空啼。\n无情最是台城柳，依旧烟笼十里堤。","note":"选自《唐诗三百首》"},{"id":"343","number":343,"title":"宫词","author":"薛逢","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"十二楼中尽晓妆，望仙楼上望君王。\n锁衔金兽连环冷，水滴铜龙昼漏长。\n云髻罢梳还对镜，罗衣欲换更添香。\n遥窥正殿帘开处，袍袴宫人扫御床。","note":"选自《唐诗三百首》"},{"id":"344","number":344,"title":"楚江怀古三首 一","author":"马戴","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"露气寒光集，微阳下楚丘。\n猨啼洞庭树，人在木兰舟。\n广泽生明月，苍山夹乱流。\n云中君不降，竟夕自悲秋。","note":"选自《唐诗三百首》"},{"id":"345","number":345,"title":"灞上秋居","author":"马戴","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"灞原风雨定，晚见鴈行频。\n落叶他乡树，寒灯独夜人。\n空园白露滴，孤壁野僧隣。\n寄卧郊扉久，何门致此身。","note":"选自《唐诗三百首》"},{"id":"346","number":346,"title":"马嵬坡","author":"郑畋","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"[玄]宗回马杨妃死，云雨虽亡日月新。\n终是圣明天子事，景阳宫井又何人。","note":"选自《唐诗三百首》"},{"id":"347","number":347,"title":"没蕃故人","author":"张籍","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"前年伐月支，城上没全师。\n蕃汉断消息，死生长别离。\n无人收废帐，归马识残旗。\n欲祭疑君在，天涯哭此时。","note":"选自《唐诗三百首》"},{"id":"348","number":348,"title":"春怨","author":"金昌绪","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"打起黄莺儿，莫教枝上啼。\n啼时惊妾梦，不得到辽西。","note":"选自《唐诗三百首》"},{"id":"349","number":349,"title":"遣悲怀三首 一","author":"元稹","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"谢公最小偏怜女，嫁与黔娄百事乖。\n顾我无衣搜画箧，泥他沽酒拔金钗。\n野蔬充膳甘长藿，落叶添薪仰古槐。\n今日俸钱过十万，与君营奠复营斋。","note":"选自《唐诗三百首》"},{"id":"350","number":350,"title":"遣悲怀三首 二","author":"元稹","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昔日戏言身后意，今朝皆到眼前来。\n衣裳已施行看尽，针线犹存未忍开。\n尚想旧情怜婢仆，也曾因梦送钱财。\n诚知此恨人人有，贫贱夫妻百事哀。","note":"选自《唐诗三百首》"},{"id":"351","number":351,"title":"遣悲怀三首 三","author":"元稹","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"闲坐悲君亦自悲，百年都是几多时。\n邓攸无子寻知命，潘岳悼亡犹费词。\n同穴窅冥何所望，他生缘会更难期。\n唯将终夜长开眼，报荅平生未展眉。","note":"选自《唐诗三百首》"},{"id":"352","number":352,"title":"行宫","author":"元稹","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"寥落古行宫，宫花寂寞红。\n白头宫女在，闲坐说玄宗。","note":"选自《唐诗三百首》"},{"id":"353","number":353,"title":"哥舒歌","author":"西鄙人","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"北斗七星高，哥舒夜带刀。\n至今窥牧马，不敢过临洮。","note":"选自《唐诗三百首》"},{"id":"354","number":354,"title":"杂诗 十三","author":"无名氏","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"近寒食雨草萋萋，著麦苗风柳映堤。\n早是有家归未得，杜鹃休向耳边啼。","note":"选自《唐诗三百首》"},{"id":"355","number":355,"title":"杂诗三首 三","author":"沈佺期","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"闻道黄龙戍，频年不解兵。\n可怜闺里月，长在汉家营。\n少妇今春意，良人昨夜情。\n谁能将旗鼓，一为取龙城。","note":"选自《唐诗三百首》"},{"id":"356","number":356,"title":"古意呈补阙乔知之","author":"沈佺期","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"卢家少妇郁金堂，海燕双栖玳瑁梁。\n九月寒砧催木叶，十年征戍忆辽阳。\n白狼河北音书断，丹凤城南秋夜长。\n谁谓含愁独不见，更教明月照流黄。","note":"选自《唐诗三百首》"},{"id":"357","number":357,"title":"次北固山下","author":"王湾","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"客路青山外，行舟绿水前。\n潮平两岸阔，风正一帆悬。\n海日生残夜，江春入旧年。\n乡书何处达，归雁洛阳边。","note":"选自《唐诗三百首》"},{"id":"358","number":358,"title":"桃花谿","author":"张旭","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"隐隐飞桥隔野烟，石矶西畔问渔船。\n桃花尽日随流水，洞在清谿何处边。","note":"选自《唐诗三百首》"},{"id":"359","number":359,"title":"送别","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"下马饮君酒，问君何所之。\n君言不得意，归卧南山陲。\n但去莫复问，白云无尽时。","note":"选自《唐诗三百首》"},{"id":"360","number":360,"title":"送綦毋潜落第还乡","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"圣代无隐者，英灵尽来归。\n遂令东山客，不得顾采薇。\n既至君门远，孰云吾道非。\n江淮度寒食，京洛缝春衣。\n置酒临长道，同心与我违。\n行当浮桂櫂，未几拂荆扉。\n远树带行客，孤村当落晖。\n吾谋适不用，勿谓知音稀。","note":"选自《唐诗三百首》"},{"id":"361","number":361,"title":"青谿","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"言入黄花川，每逐青谿水。\n随山将万转，趣途无百里。\n声喧乱石中，色静深松里。\n漾漾泛菱荇，澄澄映葭苇。\n我心素已闲，清川澹如此。\n请留盘石上，垂钓将已矣。","note":"选自《唐诗三百首》"},{"id":"362","number":362,"title":"渭川田家","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"斜阳照墟落，穷巷牛羊归。\n野老念牧童，倚杖候荆扉。\n雉雊麦苗秀，蚕眠桑叶稀。\n田夫荷锄至，相见语依依。\n即此羡闲逸，怅然吟式微。","note":"选自《唐诗三百首》"},{"id":"363","number":363,"title":"西施咏","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"艳色天下重，西施宁久微。\n朝仍越溪女，暮作吴宫妃。\n贱日岂殊众，贵来方悟稀。\n邀人傅香粉，不自著罗衣。\n君宠益娇态，君怜无是非。\n当时浣纱伴，莫得同车归。\n持谢邻家子，效颦安可希。","note":"选自《唐诗三百首》"},{"id":"364","number":364,"title":"老将行","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"少年十五二十时，步行夺得胡马射。\n射杀中山白额虎，肯数邺下黄须儿。\n一身转战三千里，一劒曾当百万师。\n汉兵奋迅如霹雳，虏骑崩腾畏蒺藜。\n衞青不败由天幸，李广无功缘数奇。\n自从弃置便衰朽，世事磋跎成白首。\n昔时飞箭无全目，今日垂杨生左肘。\n路傍时卖故侯瓜，门前学种先生柳。\n苍茫古木连穷巷，寥落寒山对虚牖。\n誓令疏勒出飞泉，不似颍川空使酒。\n贺兰山下阵如云，羽檄交驰日夕闻。\n节使三河募年少，诏书五道出将军。\n试拂铁衣如雪色，聊持宝劒动星文。\n愿得燕弓射天将，耻令越甲鸣吴军。\n莫嫌旧日云中守，犹堪一战取功勋。","note":"选自《唐诗三百首》"},{"id":"365","number":365,"title":"桃源行","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"渔舟逐水爱山春，两岸桃花夹去津。\n坐看红树不知远，行尽青溪不见人。\n山口潜行始隈隩，山开旷望旋平陆。\n遥看一处攒云树，近入千家散花竹。\n樵客初传汉姓名，居人未改秦衣服。\n居人共住武陵源，还从物外起田园。\n月明松下房栊静，日出云中鸡犬喧。\n惊闻俗客争来集，竞引还家问都邑。\n平明闾巷埽花开，薄暮渔樵乘水入。\n初因避地去人间，及至成仙遂不还。\n峡里谁知有人事，世中遥望空云山。\n不疑灵境难闻见，尘心未尽思乡县。\n出洞无论隔山水，辞家终拟长游衍。\n自谓经过旧不迷，安知峰壑今来变。\n当时只记入山深，青溪几曲到云林。\n春来遍是桃花水，不辨仙源何处寻。","note":"选自《唐诗三百首》"},{"id":"366","number":366,"title":"洛阳女儿行","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"洛阳女儿对门居，才可容颜十五余。\n良人玉勒乘骢马，侍女金盘鲙鲤鱼。\n画阁朱楼尽相望，红桃绿柳垂簷向。\n罗帏送上七香车，宝扇迎归九华帐。\n狂夫富贵在青春，意气骄奢剧季伦。\n自怜碧玉亲教舞，不惜珊瑚持与人。\n春窗曙灭九微火，九微片片飞花璅。\n戏罢曾无理曲时，妆成秪是薰香坐。\n城中相识尽繁华，日夜经过赵李家。\n谁怜越女颜如玉，贫贱江头自浣纱。","note":"选自《唐诗三百首》"},{"id":"367","number":367,"title":"辋川闲居赠裴秀才迪","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"寒山转苍翠，秋水日潺湲。\n倚杖柴门外，临风听暮蝉。\n渡头余落日，墟里上孤烟。\n复值接舆醉，狂歌五柳前。","note":"选自《唐诗三百首》"},{"id":"368","number":368,"title":"酬张少府","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"晚年唯好静，万事不关心。\n自顾无长策，空知返旧林。\n松风吹解带，山月照弹琴。\n君问穷通理，渔歌入浦深。","note":"选自《唐诗三百首》"},{"id":"369","number":369,"title":"送梓州李使君","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"万壑树参天，千山响杜鹃。\n山中一夜雨，树杪百重泉。\n汉女输橦布，巴人讼芋田。\n文翁翻教授，不敢倚先贤。","note":"选自《唐诗三百首》"},{"id":"370","number":370,"title":"玉台体十二首 十一","author":"权德舆","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昨夜裙带解，今朝蟢子飞。\n铅华不可弃，莫是藁砧归。","note":"选自《唐诗三百首》"},{"id":"371","number":371,"title":"山石","author":"韩愈","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山石荦确行径微，黄昏到寺蝙蝠飞。\n升堂坐阶新雨足，芭蕉叶大支子肥。\n僧言古壁佛画好，以火来照所见稀。\n铺床拂席置羹饭，疎粝亦足饱我饥。\n夜深静卧百虫绝，清月出岭光入扉。\n天明独去无道路，出入高下穷烟霏。\n山红涧碧纷烂漫，时见松枥皆十围。\n当流赤足蹋涧石，水声激激风吹衣。\n人生如此自可乐，岂必局束为人鞿。\n嗟哉吾党二三子，安得至老不更归。","note":"选自《唐诗三百首》"},{"id":"372","number":372,"title":"八月十五夜赠张功曹","author":"韩愈","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"纤云四卷天无河，清风吹空月舒波。\n沙平水息声影绝，一桮相属君当歌。\n君歌声酸辞且苦，不能听终泪如雨。\n洞庭连天九疑高，蛟龙出没猩鼯号。\n十生九死到官所，幽居默默如藏逃。\n下床畏蛇食畏药，海气湿蛰熏腥臊。\n昨者州前搥大鼓，嗣皇继圣登夔臯。\n赦书一日行万里，罪从大辟皆除死。\n迁者追廻流者还，涤瑕荡垢清朝班。\n州家申名使家抑，坎轲祗得移荆蛮。\n判司卑官不堪说，未免捶楚尘埃间。\n同时辈流多上道，天路幽险难追攀。\n君歌且休听我歌，我歌今与君殊科。","note":"选自《唐诗三百首》"},{"id":"373","number":373,"title":"谒衡岳庙遂宿岳寺题门楼","author":"韩愈","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"五岳祭秩皆三公，四方环镇嵩当中。\n火维地荒足妖怪，天假神柄专其雄。\n喷云泄雾藏半腹，虽有绝顶谁能穷。\n我来正逢秋雨节，阴气晦昧无清风。\n潜心默祷若有应，岂非正直能感通。\n须臾静扫众峰出，仰见突兀撑青空。\n紫盖连延接天柱，石廪腾掷堆祝融。\n森然魄动下马拜，松柏一迳趋灵宫。\n粉墙丹柱动光彩，鬼物图画填青红。\n升阶伛偻荐脯酒，欲以菲薄明其衷。\n庙令老人识神意，睢盱侦伺能鞠躬。\n手持桮珓导我掷，云此最吉余难同。\n窜逐蛮荒幸不死，衣食才足甘长终。\n侯王将相望久绝，神纵欲福难为功。\n夜投佛寺上高阁，星月掩暎云朣胧。\n猿鸣钟动不知曙，杲杲寒日生于东。","note":"选自《唐诗三百首》"},{"id":"374","number":374,"title":"已凉","author":"韩偓","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"碧阑干外绣帘垂，猩血屏风画折枝。\n八尺龙须方锦褥，已凉天气未寒时。","note":"选自《唐诗三百首》"},{"id":"375","number":375,"title":"春宫怨","author":"杜荀鹤","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"早被婵娟误，欲妆临镜慵。\n承恩不在貌，教妾若为容。\n风暖鸟声碎，日高花影重。\n年年越溪女，相忆采芙蓉。","note":"选自《唐诗三百首》"},{"id":"376","number":376,"title":"近试上张籍水部","author":"朱庆余","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"洞房昨夜停红烛，待晓堂前拜舅姑。\n[妆]罢低声问夫壻，画眉深浅入时无。","note":"选自《唐诗三百首》"},{"id":"377","number":377,"title":"将赴吴兴登乐游原一绝","author":"杜牧","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"清时有味是无能，闲爱孤云静爱僧。\n欲把一麾江海去，乐游原上望昭陵。","note":"选自《唐诗三百首》"},{"id":"378","number":378,"title":"赤壁","author":"杜牧","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"折戟沈沙铁未销，自将磨洗认前朝。\n东风不与周郎便，铜雀春深鏁二乔。","note":"选自《唐诗三百首》"},{"id":"379","number":379,"title":"泊秦淮","author":"杜牧","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"烟笼寒水月笼沙，夜泊秦淮近酒家。\n商女不知亡国恨，隔江犹唱后庭花。","note":"选自《唐诗三百首》"},{"id":"380","number":380,"title":"赠别二首 一","author":"杜牧","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"娉娉褭褭十三余，豆蔻梢头二月初。\n春风十里扬州路，卷上珠帘总不如。","note":"选自《唐诗三百首》"},{"id":"381","number":381,"title":"赠别二首 二","author":"杜牧","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"多情却似总无情，唯觉尊前笑不成。\n蜡烛有心还惜别，替人垂泪到天明。","note":"选自《唐诗三百首》"},{"id":"382","number":382,"title":"遣怀","author":"杜牧","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"落魄江南载酒行，楚腰肠断掌中轻。\n十年一觉扬州梦，赢得青楼薄幸名。","note":"选自《唐诗三百首》"},{"id":"383","number":383,"title":"秋夕","author":"杜牧","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"红烛秋光冷画屏，轻罗小扇扑流萤。\n天阶夜色凉如水，坐看牵牛织女星。","note":"选自《唐诗三百首》"},{"id":"384","number":384,"title":"金谷园","author":"杜牧","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"繁华事散逐香尘，流水无情草自春。\n日暮东风怨啼鸟，落花犹似堕楼人。","note":"选自《唐诗三百首》"},{"id":"385","number":385,"title":"旅宿","author":"杜牧","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"旅馆无良伴，凝情自悄然。\n寒灯思旧事，断鴈警愁眠。\n远梦归侵晓，家书到隔年。\n湘江好烟月，门系钓鱼船。","note":"选自《唐诗三百首》"},{"id":"386","number":386,"title":"早秋三首 一","author":"许浑","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"遥夜泛清瑟，西风生翠萝。\n残萤委玉露，早鴈拂银河。\n高树晓还密，远山晴更多。\n淮南一叶下，自觉老烟波。","note":"选自《唐诗三百首》"},{"id":"387","number":387,"title":"秋日赴阙题潼关驿楼","author":"许浑","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"红叶晚萧萧，长亭酒一瓢。\n残云归太华，疎雨过中条。\n树色随山迥，河声入海遥。\n帝乡明日到，犹自梦渔樵。","note":"选自《唐诗三百首》"},{"id":"388","number":388,"title":"寄人 一","author":"张泌","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"别梦依依到谢家，小廊回合曲阑斜。\n多情只有春庭月，犹为离人照落花。","note":"选自《唐诗三百首》"},{"id":"389","number":389,"title":"陇西行四首 二","author":"陈陶","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"誓扫匈奴不顾身，五千貂锦丧胡尘。\n可怜无定河边骨，犹是春闺梦里人。","note":"选自《唐诗三百首》"},{"id":"390","number":390,"title":"颂古三十二首  其二三","author":"释明辩","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"打起黄莺儿，莫教枝上啼。\n几回惊妾梦，不得到辽西。","note":"选自《唐诗三百首》"},{"id":"391","number":391,"title":"后宫词","author":"白居易","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"泪湿罗巾梦不成，夜深前殿按歌声。\n红颜未老恩先断，斜倚薰笼坐到明。","note":"选自《唐诗三百首》"},{"id":"392","number":392,"title":"喜见外弟又言别","author":"李益","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"十年离乱后，长大一相逢。\n问姓惊初见，称名忆旧容。\n别来沧海事，语罢暮天钟。\n明日巴陵道，秋山又几重。","note":"选自《唐诗三百首》"},{"id":"393","number":393,"title":"江南词","author":"李益","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"嫁得瞿塘贾，朝朝悮妾期。\n早知潮有信，嫁与弄潮儿。","note":"选自《唐诗三百首》"},{"id":"394","number":394,"title":"夜上受降城闻笛","author":"李益","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"回乐峰前沙似雪，受降城下月如霜。\n不知何处吹芦管，一夜征人尽望乡。","note":"选自《唐诗三百首》"},{"id":"395","number":395,"title":"听筝","author":"李端","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鸣筝金粟柱，素手玉房前。\n欲得周郎顾，时时误拂弦。","note":"选自《唐诗三百首》"},{"id":"396","number":396,"title":"贼平后送人北归","author":"司空曙","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"世乱同南去，时清独北还。\n他乡生白发，旧国见青山。\n晓月过残垒，繁星宿故关。\n寒禽与衰草，处处伴愁颜。","note":"选自《唐诗三百首》"},{"id":"397","number":397,"title":"云阳馆与韩绅宿别","author":"司空曙","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"故人江海别，几度隔山川。\n乍见翻疑梦，相悲各问年。\n孤灯寒照雨，湿竹暗浮烟。\n更有明朝恨，离杯惜共传。","note":"选自《唐诗三百首》"},{"id":"398","number":398,"title":"喜外弟卢纶见宿","author":"司空曙","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"静夜四无邻，荒居旧业贫。\n雨中黄叶树，灯下白头人。\n以我独沈久，愧君相见频。\n平生自有分，况是蔡家亲。","note":"选自《唐诗三百首》"},{"id":"399","number":399,"title":"听弹琴","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"泠泠七丝上，静听松风寒。\n古调虽自爱，今人多不弹。","note":"选自《唐诗三百首》"},{"id":"400","number":400,"title":"送方外上人","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"孤云将野鹤，岂向人间住。\n莫买沃洲山，时人已知处。","note":"选自《唐诗三百首》"},{"id":"401","number":401,"title":"送灵澈上人","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"苍苍竹林寺，杳杳钟声晚。\n荷笠带夕阳，青山独归远。","note":"选自《唐诗三百首》"},{"id":"402","number":402,"title":"新年作","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"乡心新岁切，天畔独潸然。\n老至居人下，春归在客先。\n岭猨同旦暮，江柳共风烟。\n已是长沙傅，从今又几年。","note":"选自《唐诗三百首》"},{"id":"403","number":403,"title":"秋日登吴公台上寺远眺寺即陈将吴明彻战场","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"古台摇落后，秋日望乡心。\n野寺人来少，云峰水隔深。\n夕阳依旧垒，寒磬满空林。\n惆怅南朝事，长江独至今。","note":"选自《唐诗三百首》"},{"id":"404","number":404,"title":"寻南溪常山道人隐居","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一路经行处，莓苔见履痕。\n白云依静渚，春草闭闲门。\n过雨看松色，随山到水源。\n溪花与禅意，相对亦忘言。","note":"选自《唐诗三百首》"},{"id":"405","number":405,"title":"饯别王十一南游","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"望君烟水阔，挥手泪沾巾。\n飞鸟没何处，青山空向人。\n长江一帆远，落日五湖春。\n谁见汀洲上，相思愁白苹。","note":"选自《唐诗三百首》"},{"id":"406","number":406,"title":"江州重别薛六柳八二员外","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"生涯岂料承优诏，世事空知学醉歌。\n江上月明胡鴈过，淮南木落楚山多。\n寄身且喜沧洲近，顾影无如白发何。\n今日龙钟人共弃，媿君犹遣慎风波。","note":"选自《唐诗三百首》"},{"id":"407","number":407,"title":"长沙过贾谊宅","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"三年谪宦此栖迟，万古惟留楚客悲。\n秋草独寻人去后，寒林空见日斜时。\n汉文有道恩犹薄，湘水无情吊岂知。\n寂寂江山摇落处，怜君何事到天涯。","note":"选自《唐诗三百首》"},{"id":"408","number":408,"title":"自夏口至鹦鹉洲夕望岳阳寄源中丞","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"[汀]洲无浪复无烟，楚客相思益渺然。\n汉口夕阳斜渡鸟，洞庭秋水远连天。\n孤城背岭寒吹角，独戍临江夜泊船。\n贾谊上书忧汉室，长沙谪去古今怜。","note":"选自《唐诗三百首》"},{"id":"409","number":409,"title":"赋得","author":"刘长卿","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"莺啼燕语报新年，马邑龙堆路几千。\n家住层城临汉苑，[心]随明月到胡天。\n机中锦字论长恨，楼上花枝笑独眠。\n为问元戎窦车骑，何时返斾勒燕然。","note":"选自《唐诗三百首》"},{"id":"410","number":410,"title":"九日登望仙台呈刘明府容","author":"崔曙","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"汉文皇帝有高台，此日登临曙色开。\n三晋云山皆北向，二陵风雨自东来。\n关门令尹谁能识，河上仙翁去不回。\n且欲近寻彭泽宰，陶然共醉菊花杯。","note":"选自《唐诗三百首》"},{"id":"411","number":411,"title":"凉州词二首 一","author":"王翰","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"葡萄美酒夜光杯，欲饮琵琶马上催。\n醉卧沙场君莫笑，古来征战几人回。","note":"选自《唐诗三百首》"},{"id":"412","number":412,"title":"秋登兰山寄张五","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"北山白云里，隐者自怡悦。\n相望试登高，心飞逐鸟灭。\n愁因薄暮起，兴是清秋发。\n时见归村人，沙行渡头歇。\n天边树若荠，江畔舟如月。\n何当载酒来，共醉重阳节。","note":"选自《唐诗三百首》"},{"id":"413","number":413,"title":"夏日南亭怀辛大","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山光忽西落，池月渐东上。\n散发乘夕凉，开轩卧闲敞。\n荷风送香气，竹露滴清响。\n欲取鸣琴弹，恨无知音赏。\n感此怀故人，中宵劳梦想。","note":"选自《唐诗三百首》"},{"id":"414","number":414,"title":"宿业师山房期丁大不至","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"夕阳度西岭，群壑倏已暝。\n松月生夜凉，风泉满清听。\n樵人归欲尽，烟鸟栖初定。\n之子期宿来，孤琴候萝迳。","note":"选自《唐诗三百首》"},{"id":"415","number":415,"title":"夜归鹿门山歌","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山寺钟鸣昼已昏，渔梁渡头争渡喧。\n人随沙路向江村，余亦乘舟归鹿门。\n鹿门月照开烟树，忽到庞公栖隐处。\n岩扉松径长寂寥，惟有幽人夜来去。","note":"选自《唐诗三百首》"},{"id":"416","number":416,"title":"望洞庭湖赠张丞相","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"八月湖水平，涵虚混太清。\n气蒸云梦泽，波撼岳阳城。\n欲济无舟楫，端居耻圣明。\n坐观垂钓者，空有羡鱼情。","note":"选自《唐诗三百首》"},{"id":"417","number":417,"title":"秦中感秋寄远上人","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一丘常欲卧，三径苦无资。\n北土非吾愿，东林怀我师。\n黄金然桂尽，壮志逐年衰。\n日夕凉风至，闻蝉但益悲。","note":"选自《唐诗三百首》"},{"id":"418","number":418,"title":"宿桐庐江寄广陵旧游","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山暝闻猿愁，沧江急夜流。\n风鸣两岸叶，月照一孤舟。\n建德非吾土，维扬忆旧游。\n还将两行泪，遥寄海西头。","note":"选自《唐诗三百首》"},{"id":"419","number":419,"title":"早寒江上有怀","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"木落雁南度，北风江上寒。\n我家襄水上，遥隔楚云端。\n乡泪客中尽，孤帆天际看。\n迷津欲有问，平海夕漫漫。","note":"选自《唐诗三百首》"},{"id":"420","number":420,"title":"留别王侍御维","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"寂寂竟何待，朝朝空自归。\n欲寻芳草去，惜与故人违。\n当路谁相假，知音世所稀。\n秪应守索寞，还掩故园扉。","note":"选自《唐诗三百首》"},{"id":"421","number":421,"title":"清明日宴梅道士房","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"林卧愁春尽，开轩览物华。\n忽逢青鸟使，邀入赤松家。\n丹灶初开火，仙桃正落花。\n童颜若可驻，何惜醉流霞。","note":"选自《唐诗三百首》"},{"id":"422","number":422,"title":"与诸子登岘山","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"人事有代谢，往来成古今。\n江山留胜迹，我辈复登临。\n水落鱼梁浅，天寒梦泽深。\n羊公碑字在，读罢泪沾襟。","note":"选自《唐诗三百首》"},{"id":"423","number":423,"title":"过故人庄","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"故人具鸡黍，邀我至田家。\n绿树村边合，青山郭外斜。\n开筵面场圃，把酒话桑麻。\n待到重阳日，还来就菊花。","note":"选自《唐诗三百首》"},{"id":"424","number":424,"title":"岁暮归南山","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"北阙休上书，南山归敝庐。\n不才明主弃，多病故人疎。\n白发催年老，青阳逼岁除。\n永怀愁不寐，松月夜窗虚。","note":"选自《唐诗三百首》"},{"id":"425","number":425,"title":"岁除夜有怀","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"迢递三巴路，羁危万里身。\n乱山残雪夜，孤灯异乡人。\n渐与骨肉远，转于奴仆亲。\n那堪正飘泊，来日岁华新。","note":"选自《唐诗三百首》"},{"id":"426","number":426,"title":"春晓","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"春眠不觉晓，处处闻啼鸟。\n夜来风雨声，花落知多少。","note":"选自《唐诗三百首》"},{"id":"427","number":427,"title":"宿建德江","author":"孟浩然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"移舟泊烟渚，日暮客愁新。\n野旷天低树，江清月近人。","note":"选自《唐诗三百首》"},{"id":"428","number":428,"title":"蜀道难","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"噫吁戏！危乎高哉！蜀道之难难于上青天！蚕丛及鱼凫，开国何茫然。\n尔来四万八千岁，不与秦塞通人烟。\n西当太白有鸟道，可以横绝峨眉巅。\n地崩山摧壮士死，然后天梯石栈相钩连。\n上有六龙回日之高标，下有冲波逆折之回川。\n黄鹤之飞尚不得过，猨猱欲度愁攀援。\n青泥何盘盘，百步九折萦岩峦。\n扪参历井仰胁息，以手抚膺坐长叹。\n问君西游何时还？畏途巉岩不可攀。\n但见悲鸟号古木，雄飞雌从绕林间。\n又闻子规啼夜月，愁空山，蜀道之难难于上青天，使人听此凋朱颜。\n连峰去天不盈尺，枯松倒挂倚绝壁。\n飞湍瀑流争喧豗，砅厓转石万壑雷。\n其险也如此，嗟尔远道之人胡为乎来哉！劒阁峥嵘而崔嵬，一夫当关，万夫莫开。\n所守或匪亲，化为狼与豺。\n朝避猛虎，夕避长蛇。\n磨牙吮血，杀人如麻。\n锦城虽云乐，不如早还家。\n蜀道之难难于上青天，侧身西望长咨嗟。","note":"选自《唐诗三百首》"},{"id":"429","number":429,"title":"将进酒","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君不见黄河之水天上来，奔流到海不复回。\n君不见高堂明镜悲白发，朝如青丝暮成雪。\n人生得意须尽欢，莫使金樽空对月。\n天生我材必有用，千金散尽还复来。\n烹羊宰牛且为乐，会须一饮三百杯。\n岑夫子，丹丘生，将进酒，君莫停。\n与君歌一曲，请君为我侧耳听。\n钟鼓馔玉不足贵，但愿长醉不愿醒。\n古来圣贤皆寂寞，惟有饮者留其名。\n陈王昔时宴平乐，斗酒十千恣讙谑。\n主人何为言少钱，径须沽取对君酌。\n五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。","note":"选自《唐诗三百首》"},{"id":"430","number":430,"title":"春宫怨","author":"杜荀鹤","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"早被婵娟误，欲妆临镜慵。\n承恩不在貌，教妾若为容。\n风暖鸟声碎，日高花影重。\n年年越溪女，相忆采芙蓉。","note":"选自《唐诗三百首》"},{"id":"431","number":431,"title":"客夜与故人偶集","author":"戴叔伦","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"天秋月又满，城阙夜千重。\n还作江南会，翻疑梦里逢。\n风枝惊暗鹊，露草覆寒蛩。\n羁旅长堪醉，相留畏晓钟。","note":"选自《唐诗三百首》"},{"id":"432","number":432,"title":"和张仆射塞下曲 一","author":"卢纶","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鹫翎金仆姑，燕尾绣蝥弧。\n独立扬新令，千营共一呼。","note":"选自《唐诗三百首》"},{"id":"433","number":433,"title":"和张仆射塞下曲 二","author":"卢纶","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"林暗草惊风，将军夜引弓。\n平明寻白羽，没在石棱中。","note":"选自《唐诗三百首》"},{"id":"434","number":434,"title":"和张仆射塞下曲 三","author":"卢纶","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"月黑鴈飞高，单于夜遁逃。\n欲将轻骑逐，大雪满弓刀。","note":"选自《唐诗三百首》"},{"id":"435","number":435,"title":"和张仆射塞下曲 四","author":"卢纶","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"野幕敞琼筵，羌戎贺劳旋。\n醉和金甲舞，雷鼓动山川。","note":"选自《唐诗三百首》"},{"id":"436","number":436,"title":"晚次鄂州","author":"卢纶","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"云开远见汉阳城，犹是孤帆一日程。\n估客昼眠知浪静，舟人夜语觉潮生。\n三湘衰鬓逢秋色，万里归心对月明。\n旧业已随征战尽，更堪江上鼓鼙声。","note":"选自《唐诗三百首》"},{"id":"437","number":437,"title":"李端公","author":"卢纶","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"故关衰草遍，离别自堪悲。\n路出寒云外，人归暮雪时。\n少孤为客早，多难识君迟。\n掩泪空相向，风尘何处期。","note":"选自《唐诗三百首》"},{"id":"438","number":438,"title":"过香积寺","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"不知香积寺，数里入云峰。\n古木无人迳，深山何处钟。\n泉声咽危石，日色冷青松。\n薄暮空潭曲，安禅制毒龙。","note":"选自《唐诗三百首》"},{"id":"439","number":439,"title":"山居秋暝","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"空山新雨后，天气晚来秋。\n明月松间照，清泉石上流。\n竹喧归浣女，莲动下渔舟。\n随意春芳歇，王孙自可留。","note":"选自《唐诗三百首》"},{"id":"440","number":440,"title":"终南别业","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"中岁颇好道，晚家南山陲。\n兴来每独往，胜事空自知。\n行到水穷处，坐看云起时。\n偶然值林叟，谈笑无还期。","note":"选自《唐诗三百首》"},{"id":"441","number":441,"title":"归嵩山作","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"清川带长薄，车马去闲闲。\n流水如有意，暮禽相与还。\n荒城临古渡，落日满秋山。\n迢递嵩高下，归来且闭关。","note":"选自《唐诗三百首》"},{"id":"442","number":442,"title":"终南山","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"太乙近天都，连山接海隅。\n白云回望合，青霭入看无。\n分野中峰变，阴晴众壑殊。\n欲投人处宿，隔水问樵夫。","note":"选自《唐诗三百首》"},{"id":"443","number":443,"title":"汉江临泛","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"楚塞三湘接，荆门九派通。\n江流天地外，山色有无中。\n郡邑浮前浦，波澜动远空。\n襄阳好风日，留醉与山翁。","note":"选自《唐诗三百首》"},{"id":"444","number":444,"title":"奉和圣制从蓬莱向兴庆阁道中留春雨中春望之作应制","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"渭水自萦秦塞曲，黄山旧遶汉宫斜。\n銮舆迥出千门柳，阁道廻看上苑花。\n云里帝城双凤阙，雨中春树万人家。\n为乘阳气行时令，不是宸游玩物华。","note":"选自《唐诗三百首》"},{"id":"445","number":445,"title":"和贾舍人早朝大明宫之作","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绛帻鸡人送晓筹，尚衣方进翠云裘。\n九天阊阖开宫殿，万国衣冠拜冕旒。\n日色才临仙掌动，香烟欲傍衮龙浮。\n朝罢须裁五色诏，佩声归向凤池头。","note":"选自《唐诗三百首》"},{"id":"446","number":446,"title":"酬郭给事","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"洞门高阁霭余辉，桃李阴阴柳絮飞。\n禁里疎钟官舍晚，省中啼鸟吏人稀。\n晨摇玉佩趋金殿，夕奉天书拜琐闱。\n强欲从君无那老，将因卧病解朝衣。","note":"选自《唐诗三百首》"},{"id":"447","number":447,"title":"积雨辋川庄作","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"积雨空林烟火迟，蒸藜炊黍饷东菑。\n漠漠水田飞白鹭，阴阴夏木啭黄鹂。\n山中习静观朝槿，松下清斋折露葵。\n野老与人争席罢，海鸥何事更相疑。","note":"选自《唐诗三百首》"},{"id":"448","number":448,"title":"辋川集 鹿柴","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"空山不见人，但闻人语响。\n返景入深林，复照青苔上。","note":"选自《唐诗三百首》"},{"id":"449","number":449,"title":"辋川集 竹里馆","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"独坐幽篁里，弹琴复长啸。\n深林人不知，明月来相照。","note":"选自《唐诗三百首》"},{"id":"450","number":450,"title":"送别","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"山中相送罢，日暮掩柴扉。\n春草明年绿，王孙归不归。","note":"选自《唐诗三百首》"},{"id":"451","number":451,"title":"杂诗三首 二","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君自故乡来，应知故乡事。\n来日绮窗前，寒梅着花未。","note":"选自《唐诗三百首》"},{"id":"452","number":452,"title":"相思","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"红豆生南国，秋来发故枝。\n愿君多采撷，此物最相思。","note":"选自《唐诗三百首》"},{"id":"453","number":453,"title":"九月九日忆山东兄弟","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"独在异乡为异客，每逢佳节倍思亲。\n遥知兄弟登高处，遍插茱萸少一人。","note":"选自《唐诗三百首》"},{"id":"454","number":454,"title":"渭城曲","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"渭城朝雨浥轻尘，客舍青青杨柳春。\n劝君更尽一杯酒，西出阳关无故人。","note":"选自《唐诗三百首》"},{"id":"455","number":455,"title":"崔九欲往南山马上口号与别","author":"裴迪","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"归山深浅去，须尽丘壑美。\n莫学武陵人，暂游桃源里。","note":"选自《唐诗三百首》"},{"id":"456","number":456,"title":"寻西山隐者不遇","author":"丘为","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绝顶一茅茨，直[上]三十里。\n扣关无僮仆，窥室唯案几。\n若非巾柴车，应是钓秋水。\n差池不相见，黾勉空仰止。\n草色新雨中，松声晚牕里。\n及兹契幽绝，自足荡心耳。\n虽无宾主意，颇得清净理。\n兴尽方下山，何必待之子。","note":"选自《唐诗三百首》"},{"id":"457","number":457,"title":"黄鹤楼","author":"崔颢","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昔人已乘白云去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，春草萋萋鹦鹉洲。\n日暮乡关何处是，烟波江上使人愁。","note":"选自《唐诗三百首》"},{"id":"458","number":458,"title":"行经华阴","author":"崔颢","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"岧嶤太华俯咸京，天外三峰削不成。\n武帝祠前云欲散，仙人掌上雨初晴。\n河山北枕秦关险，驿树西连汉畤平。\n借问路傍名利客，无如此处学长生。","note":"选自《唐诗三百首》"},{"id":"459","number":459,"title":"长干曲四首 一","author":"崔颢","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君家何处住？妾住在横塘。\n停船暂借问，或恐是同乡。","note":"选自《唐诗三百首》"},{"id":"460","number":460,"title":"长干曲四首 二","author":"崔颢","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"家临九江水，来去九江侧。\n同是长干人，自小不相识。","note":"选自《唐诗三百首》"},{"id":"461","number":461,"title":"望蓟门","author":"祖咏","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"燕台一望客心惊，箫鼓喧喧汉将营。\n万里寒光生积雪，三边曙色动危旌。\n沙场烽火连胡月，海畔云山拥蓟城。\n少小虽非投笔吏，论功还欲请长缨。","note":"选自《唐诗三百首》"},{"id":"462","number":462,"title":"终南望余雪","author":"祖咏","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"终南阴岭秀，积雪浮云端。\n林表明霁色，城中增暮寒。","note":"选自《唐诗三百首》"},{"id":"463","number":463,"title":"古从军行","author":"李颀","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"白日登山望烽火，黄昏饮马傍交河。\n行人刁斗风沙暗，公主琵琶幽怨多。\n野云万里无城郭，雨雪纷纷连大漠。\n胡鴈哀鸣夜夜飞，胡儿眼泪双双落。\n闻道玉门犹被遮，应将性命逐轻车。\n年年战骨埋荒外，空见蒲桃入汉家。","note":"选自《唐诗三百首》"},{"id":"464","number":464,"title":"琴歌","author":"李颀","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"主人有酒欢今夕，请奏鸣琴广陵客。\n月照城头乌半飞，霜凄万树风入衣。\n铜𬬻华烛烛增辉，初弹渌水后楚妃。\n一声已动物皆静，四座无言星欲稀。\n清淮奉使千余里，敢告云山从此始。","note":"选自《唐诗三百首》"},{"id":"465","number":465,"title":"送陈章甫","author":"李颀","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"四月南风大麦黄，枣花未落桐阴长。\n青山朝别暮还见，嘶马出门思旧乡。\n陈侯立身何坦荡，虬须虎眉仍大颡。\n腹中贮书一万卷，不肯低头在草莽。\n东门酤酒饮我曹，心轻万事皆鸿毛。\n醉卧不知白日暮，有时空望孤云高。\n长河浪头连天黑，津口停舟渡不得。\n郑国游人未及家，洛阳行子空叹息。\n闻道故林相识多，罢官昨日今如何。","note":"选自《唐诗三百首》"},{"id":"466","number":466,"title":"听安万善吹觱篥歌","author":"李颀","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"南山截竹为觱篥，此乐本自龟兹出。\n流传汉地曲转奇，凉州胡人为我吹。\n傍邻闻者多叹息，远客思乡皆泪垂。\n世人解听不解赏，长飙风中自来往。\n枯桑老柏寒飕飗，九雏鸣凤乱啾啾。\n龙吟虎啸一时发，万籁百泉相与秋。\n忽然更作渔阳掺，黄云萧条白日暗。\n变调如闻杨柳春，上林繁花照眼新。\n岁夜高堂列明烛，美酒一杯声一曲。","note":"选自《唐诗三百首》"},{"id":"467","number":467,"title":"古意","author":"李颀","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"男儿事长征，少小幽燕客。\n赌胜马蹄下，由来轻七尺。\n杀人莫敢前，须如猬毛磔。\n黄云陇底白雪飞，未得报恩不能归。\n辽东小妇年十五，惯弹琵琶解歌舞。\n今为羗笛出塞声，使我三军泪如雨。","note":"选自《唐诗三百首》"},{"id":"468","number":468,"title":"听董大弹胡笳声兼寄语弄房给事","author":"李颀","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蔡女昔造胡笳声，一弹一十有八拍。\n胡人落泪沾边草，汉使断肠对归客。\n古戍苍苍烽火寒，大荒沈沈飞雪白。\n先拂商弦后角羽，四郊秋叶惊摵摵。\n董夫子，通神明，深山窃听来妖精。\n言迟更速皆应手，将往复旋如有情。\n空山百鸟散还合，万里浮云阴且晴。\n嘶酸雏鴈失群夜，断绝胡儿恋母声。\n川为净其波，鸟亦罢其鸣。\n乌孙部落家乡远，逻娑沙尘哀怨生。\n幽音变调忽飘洒，长风吹林雨堕瓦。\n迸泉飒飒飞木末，野鹿呦呦走堂下。\n长安城连东掖垣，凤凰池对青琐门。\n高才脱略名与利，日夕望君抱琴至。","note":"选自《唐诗三百首》"},{"id":"469","number":469,"title":"送魏万之京","author":"李颀","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"朝闻游子唱离歌，昨夜微霜初渡河。\n鸿鴈不堪愁里听，云山况是客中过。\n关城树色催寒近，御苑砧声向晚多。\n莫见长安行乐处，空令岁月易蹉跎。","note":"选自《唐诗三百首》"},{"id":"470","number":470,"title":"春泛若耶溪","author":"綦毋潜","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"幽意无断绝，此去随所偶。\n晚风吹行舟，花路入溪口。\n际夜转西壑，隔山望南斗。\n潭烟飞溶溶，林月低向后。\n生事且弥漫，愿为持竿叟。","note":"选自《唐诗三百首》"},{"id":"471","number":471,"title":"塞下曲四首 一","author":"王昌龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蝉鸣空桑林，八月萧关道。\n出塞入塞寒，处处黄芦草。\n从来幽幷客，皆共尘沙老。\n莫学游侠儿，矜夸紫骝好。","note":"选自《唐诗三百首》"},{"id":"472","number":472,"title":"塞下曲四首 二","author":"王昌龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"饮马渡秋水，水寒风似刀。\n平沙日未没，黯黯见临洮。\n昔日长城战，咸言意气高。\n黄尘足今古，白骨乱蓬蒿。","note":"选自《唐诗三百首》"},{"id":"473","number":473,"title":"同从弟销南斋玩月忆山阴崔少府","author":"王昌龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"高卧南斋时，开帷月初吐。\n清辉淡水木，演漾在窗户。\n苒苒几盈虚，澄澄变今古。\n美人清江畔，是夜越吟苦。\n千里其如何，微风吹兰杜。","note":"选自《唐诗三百首》"},{"id":"474","number":474,"title":"出塞二首 一","author":"王昌龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"秦时明月汉时关，万里长征人未还。\n但使龙城飞将在，不教胡马度阴山。","note":"选自《唐诗三百首》"},{"id":"475","number":475,"title":"春宫曲","author":"王昌龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昨夜风开露井桃，未央前殿月轮高。\n平阳歌舞新承宠，帘外春寒赐锦袍。","note":"选自《唐诗三百首》"},{"id":"476","number":476,"title":"闺怨","author":"王昌龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"闺中少妇不曾愁，春日凝妆上翠楼。\n忽见陌头杨柳色，悔教夫壻觅封侯。","note":"选自《唐诗三百首》"},{"id":"477","number":477,"title":"芙蓉楼送辛渐二首 一","author":"王昌龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"寒雨连天夜入湖，平明送客楚山孤。\n洛阳亲友如相问，一片冰心在玉壶。","note":"选自《唐诗三百首》"},{"id":"478","number":478,"title":"宿王昌龄隐居","author":"常建","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"清溪深不测，隐处唯孤云。\n松际露微月，清光犹为君。\n茅亭宿花影，药院滋苔纹。\n余亦谢时去，西山鸾鹤群。","note":"选自《唐诗三百首》"},{"id":"479","number":479,"title":"清平调 一","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"云想衣裳花想容，春风拂槛露华浓。\n若非群玉山头见，会向瑶台月下逢。","note":"选自《唐诗三百首》"},{"id":"480","number":480,"title":"清平调 二","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一枝红艳露凝香，云雨巫山枉断肠。\n借问汉宫谁得似，可怜飞燕倚新妆。","note":"选自《唐诗三百首》"},{"id":"481","number":481,"title":"清平调 三","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"名花倾国两相欢，常得君王带笑看。\n解得春风无限恨，沈香亭北倚阑干。","note":"选自《唐诗三百首》"},{"id":"482","number":482,"title":"还乡偶书  其二","author":"黄拱","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"少小离家老大回，乡音难改鬓毛衰。\n儿童相见不相识，借问客从何处来。","note":"选自《唐诗三百首》"},{"id":"483","number":483,"title":"长恨歌","author":"白居易","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"汉皇重色思倾国，御宇多年求不得。\n杨家有女初长成，养在深闺人未识。\n天生丽质难自弃，一朝选在君王侧。\n回眸一笑百媚生，六宫粉黛无颜色。\n春寒赐浴华清池，温泉水滑洗凝脂。\n侍儿扶起娇无力，始是新承恩泽时。\n云鬓花颜金步摇，芙蓉帐暖度春宵。\n春宵苦短日高起，从此君王不早朝。\n承欢侍宴无闲暇，春从春游夜专夜。\n后宫佳丽三千人，三千宠爱在一身。\n金屋妆成娇侍夜，玉楼宴罢醉和春。\n姊妹弟兄皆列土，可怜光彩生门户。\n遂令天下父母心，不重生男重生女。\n骊宫高处入青云，仙乐风飘处处闻。\n缓歌慢舞凝丝竹，尽日君王看不足。\n渔阳鞞鼓动地来，惊破霓裳羽衣曲。\n九重城阙烟尘生，千乘万骑西南行。\n翠华摇摇行复止，西出都门百余里。\n六军不发无奈何，宛转蛾眉马前死。\n花钿委地无人收，翠翘金雀玉搔头。\n君王掩面救不得，回看血泪相和流。\n黄埃散漫风萧索，云栈萦纡登劒阁。\n峨嵋山下少人行，旌旗无光日色薄。\n蜀江水碧蜀山青，圣主朝朝暮暮情。\n行宫见月伤心色，夜雨闻铃肠断声。\n天旋日转回龙驭，到此踌躇不能去。\n马嵬坡下泥土中，不见玉颜空死处。\n君臣相顾尽沾衣，东望都门信马归。\n归来池苑皆依旧，太液芙蓉未央柳。\n芙蓉如面柳如眉，对此如何不泪垂？\n春风桃李花开夜，秋雨梧桐叶落时。\n西宫南苑多秋草，宫叶满阶红不埽。\n棃园弟子白发新，椒房阿监青娥老。\n夕殿萤飞思悄然，孤灯挑尽未成眠。\n迟迟钟鼓初长夜，耿耿星河欲曙天。\n鸳鸯瓦冷霜华重，翡翠衾寒谁与共。\n悠悠生死别经年，魂魄不曾来入梦。\n临邛道士鸿都客，能以精诚致魂魄。\n为感君王展转思，遂教方士殷勤觅。\n排空驭气奔如电，升天入地求之徧。\n上穷碧落下黄泉，两处茫茫皆不见。\n忽闻海上有仙山，山在虚无缥缈间。\n楼阁玲珑五云起，其中绰约多仙子。\n中有一人字太真，雪肤花貌参差是。\n金阙西厢叩玉扃，转教小玉报双成。\n闻道汉家天子使，九华帐里梦魂惊。\n揽衣推枕起裴回，珠箔银屏逦迤开。\n云鬓半偏新睡觉，花冠不整下堂来。\n风吹仙袂飘飖举，犹似霓裳羽衣舞。\n玉容寂莫泪阑干，棃花一枝春带雨。\n含情凝睇谢君王，一别音容两渺茫。\n昭阳殿里恩爱绝，蓬莱宫中日月长。\n回头下望人寰处，不见长安见尘雾。\n唯将旧物表深情，钿合金钗寄将去。\n钗留一股合一扇，钗擘黄金合分钿。\n但教心似金钿坚，天上人间会相见。\n临别殷勤重寄词，词中有誓两心知。\n七月七日长生殿，夜半无人私语时。\n在天愿作比翼鸟，在地愿为连理枝。\n天长地久有时尽，此恨緜緜无绝期。","note":"选自《唐诗三百首》"},{"id":"484","number":484,"title":"琵琶引","author":"白居易","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"浔阳江头夜送客，枫叶荻花秋索索。\n主人下马客在船，举酒欲饮无管弦。\n醉不成欢惨将别，别时茫茫江浸月。\n忽闻水上琵琶声，主人忘归客不发。\n寻声暗问弹者谁，琵琶声停欲语迟。\n移船相近邀相见，添酒回灯重开宴。\n千呼万唤始出来，犹抱琵琶半遮面。\n转轴拨弦三两声，未成曲调先有情。\n弦弦掩抑声声思，似诉平生不得意。\n低眉信手续续弹，说尽心中无限事。\n轻拢慢撚抹复挑，初为霓裳后六幺。\n大弦嘈嘈如急雨，小弦切切如私语。\n嘈嘈切切错杂弹，大珠小珠落玉盘。\n间关莺语花底滑，幽咽泉流水下滩。\n水泉冷涩弦疑绝，疑绝不通声暂歇。\n别有幽愁暗恨生，此时无声胜有声。\n银缾乍破水浆迸，铁骑突出刀枪鸣。\n曲终收拨当心画，四弦一声如裂帛。\n东舟西舫悄无言，唯见江心秋月白。\n沈吟放拨插弦中，整顿衣裳起敛容。\n自言本是京城女，家在虾蟇陵下住。\n十三学得琵琶成，名蜀教坊第一部。\n曲罢曾教善才伏，妆成每被秋娘妬。\n五陵年少争缠头，一曲红绡不知数。\n钿头云箆击节碎，血色罗帬飜酒污。\n今年欢笑复明年，秋月春风等闲度。\n弟走从军阿姨死，暮去朝来颜色故。\n门前冷落鞍马稀，老大嫁作商人妇。\n商人重利轻别离，前月浮梁买茶去。\n去来江口守空船，绕船月明江水寒。\n夜深忽梦少年事，梦啼妆泪红阑干。\n我闻琵琶已叹息，又闻此语重唧唧。\n同是天涯沦落人，相逢何必曾相识。\n我从去年辞帝京，谪居卧病浔阳城。\n浔阳小处无音乐，终岁不闻丝竹声。\n住近湓江地低湿，黄芦苦竹绕宅生。\n其间旦暮闻何物，杜鹃啼血猨哀鸣。\n春江花朝秋月夜，往往取酒还独倾。\n岂无山歌与村笛，呕哑嘲哳难为听。\n今夜闻君琵琶语，如听仙乐耳暂明。\n莫辞更坐弹一曲，为君飜作琵琶行。\n感我此言良久立，却坐促弦弦转急。\n凄凄不似向前声，满座重闻皆掩泣。\n座中泣下谁最多，江州司马青衫湿。","note":"选自《唐诗三百首》"},{"id":"485","number":485,"title":"赋得古原草送别","author":"白居易","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"离离原上草，一岁一枯荣。\n野火烧不尽，春风吹又生。\n远芳侵古道，晴翠接荒城。\n又送王孙去，萋萋满别情。","note":"选自《唐诗三百首》"},{"id":"486","number":486,"title":"自河南经乱关内阻饥兄弟离散各在一处因望月有感聊书所怀寄上浮梁大兄於潜七兄乌江十五兄兼示符离及下邽弟妹","author":"白居易","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"时难年饥世业空，弟兄羇旅各西东。\n田园寥落干戈后，骨肉流离道路中。\n吊影分为千里鴈，辞根散作九秋蓬。\n共看明月应垂泪，一夜乡心五处同。","note":"选自《唐诗三百首》"},{"id":"487","number":487,"title":"问刘十九","author":"白居易","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绿螘新醅酒，红泥小火垆。\n晚来天欲雪，能饮一杯无。","note":"选自《唐诗三百首》"},{"id":"488","number":488,"title":"寻隐者不遇","author":"贾岛","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"松下问童子，言师采药去。\n只在此山中，云深不知处。","note":"选自《唐诗三百首》"},{"id":"489","number":489,"title":"利州南渡","author":"温庭筠","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"澹然空水对斜晖，曲岛苍茫接翠微。\n波上马嘶看櫂去，柳边人歇待船归。\n数丛沙草群鸥散，万顷江田一鹭飞。\n谁解乘舟寻范蠡，五湖烟水独忘机。","note":"选自《唐诗三百首》"},{"id":"490","number":490,"title":"瑶瑟怨","author":"温庭筠","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"冰簟银床梦不成，碧天如水夜云轻。\n雁声远过潇湘去，十二楼中月自明。","note":"选自《唐诗三百首》"},{"id":"491","number":491,"title":"送人东游","author":"温庭筠","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"荒戍落黄叶，浩然离故关。\n高风汉阳渡，初日郢门山。\n江上几人在，天涯孤櫂还。\n何当重相见，尊酒慰离颜。","note":"选自《唐诗三百首》"},{"id":"492","number":492,"title":"苏武庙","author":"温庭筠","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"苏武魂销汉使前，古祠高树两茫然。\n云边雁断胡天月，陇上羊归塞草烟。\n廻日楼台非甲帐，去时冠劒是丁年。\n茂陵不见封侯印，空向秋波哭逝川。","note":"选自《唐诗三百首》"},{"id":"493","number":493,"title":"渡汉江","author":"李频","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"岭外音书绝，经年复历春。\n近乡情更怯，不敢问来人。","note":"选自《唐诗三百首》"},{"id":"494","number":494,"title":"贫女","author":"秦韬玉","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蓬门未识绮罗香，拟托良媒益自伤。\n谁爱风流高格调，共怜时世俭梳妆。\n敢将十指夸偏巧，不把双眉鬬画长。\n苦恨年年压金线，为他人作嫁衣裳。","note":"选自《唐诗三百首》"},{"id":"495","number":495,"title":"春宫怨","author":"周朴","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"早被婵娟误，欲妆临镜慵。\n承恩不在貌，教妾若为容。\n风暖鸟声碎，日高花影重。\n年年越溪女，相忆采芙蓉。","note":"选自《唐诗三百首》"},{"id":"496","number":496,"title":"孤鴈 二","author":"崔涂","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"几行归去尽，片影独何之。\n暮雨相呼失，寒塘独下迟。\n渚云低暗度，关月冷遥随。\n未必逢矰缴，孤飞自可疑。","note":"选自《唐诗三百首》"},{"id":"497","number":497,"title":"巴山道中除夜书怀","author":"崔涂","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"迢遰三巴路，羇危万里身。\n乱山残雪夜，孤烛异乡春。\n渐与骨肉远，转于僮仆亲。\n那堪正漂泊，明日岁华新。","note":"选自《唐诗三百首》"},{"id":"498","number":498,"title":"宫词二首 一","author":"张祜","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"故国三千里，深宫二十年。\n一声河满子，双泪落君前。","note":"选自《唐诗三百首》"},{"id":"499","number":499,"title":"赠内人","author":"张祜","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"禁门宫树月痕过，媚眼唯看宿燕窠。\n斜拔玉钗灯影畔，剔开红焰救飞蛾。","note":"选自《唐诗三百首》"},{"id":"500","number":500,"title":"集灵台二首 一","author":"张祜","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"日光斜照集灵台，红树花迎晓露开。\n昨夜上皇新授箓，太真含笑入帘来。","note":"选自《唐诗三百首》"},{"id":"501","number":501,"title":"集灵台二首 二","author":"张祜","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"虢国夫人承主恩，平明骑马入宫门。\n却嫌脂粉汚颜色，淡扫蛾眉朝至尊。","note":"选自《唐诗三百首》"},{"id":"502","number":502,"title":"题金陵渡","author":"张祜","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"金陵津渡小山楼，一宿行人自可愁。\n潮落夜江斜月里，两三星火是瓜州。","note":"选自《唐诗三百首》"},{"id":"503","number":503,"title":"宫词","author":"朱庆余","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"寂寂花时闭院门，美人相并立琼轩。\n含情欲说宫中事，鹦鹉前头不敢言。","note":"选自《唐诗三百首》"},{"id":"504","number":504,"title":"石鼓歌","author":"韩愈","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"张生手持石鼓文，劝我试作石鼓歌。\n少陵无人谪仙死，才薄将奈石鼓何。\n周纲陵迟四海沸，宣王愤起挥天戈。\n大开明堂受朝贺，诸侯劒佩鸣相磨。\n搜于岐阳骋雄俊，万里禽兽皆遮罗。\n镌功勒成告万世，凿石作鼓隳嵯峨。\n从臣才艺咸第一，拣选撰刻留山阿。\n雨淋日炙野火燎，鬼物守护烦㧑呵。\n公从何处得纸本，毫发尽备无差讹。\n辞严义密读难晓，字体不类隶与科。\n年深岂免有缺画，快劒斫断生蛟鼍。\n鸾翔凤翥众僊下，珊瑚碧树交枝柯。\n金绳铁索锁纽壮，古鼎跃水龙腾梭。\n陋儒编诗不收入，二雅褊迫无委蛇。\n孔子西行不到秦，掎摭星宿遗羲娥。\n嗟予好古生苦晚，对此涕泪双滂沱。\n忆昔初蒙博士徴，其年始改称元和。\n故人从军在右辅，为我度量掘臼科。\n濯冠沐浴告祭酒，如此至宝存岂多。\n氊包席裹可立致，十鼓祗载数骆驼。\n荐诸太庙比郜鼎，光价岂止百倍过。\n圣恩若许留太学，诸生讲解得切磋。\n观经鸿都尚填咽，坐见举国来奔波。\n剜苔剔藓露节角，安置妥帖平不颇。\n大厦深簷与盖覆，经历久远期无佗。\n中朝大官老于事，讵肯感激徒媕婀。\n牧童敲火牛砺角，谁复著手为摩挲。\n日销月铄就埋没，六年西顾空吟哦。\n羲之俗书趁姿媚，数纸尚可博白鹅。\n继周八代争战罢，无人收拾理则那。\n方今太平日无事，柄任儒术崇丘轲。\n安能以此上论列，愿借辨口如悬河。\n石鼓之歌止于此，呜呼吾意其蹉跎。","note":"选自《唐诗三百首》"},{"id":"505","number":505,"title":"秋夜曲","author":"王涯","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"桂魄初生秋露微，轻罗已薄未更衣。\n银筝夜久殷勤弄，心怯空房不忍归。","note":"选自《唐诗三百首》"},{"id":"506","number":506,"title":"晨诣超师院读禅经","author":"柳宗元","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"汲井漱寒齿，清心拂尘服。\n闲持贝叶书，步出东斋读。\n真源了无取，妄迹世所逐。\n遗言冀可冥，缮性何由熟。\n道人庭宇静，苔色连深竹。\n日出雾露余，青松如膏沐。\n澹然离言说，悟悦心自足。","note":"选自《唐诗三百首》"},{"id":"507","number":507,"title":"登柳州城楼寄漳汀封连四州","author":"柳宗元","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"城上高楼接大荒，海天愁思正茫茫。\n惊风乱飐芙蓉水，密雨斜侵薜荔墙。\n岭树重遮千里目，江流曲似九廻肠。\n共来百越文身地，犹自音书滞一乡。","note":"选自《唐诗三百首》"},{"id":"508","number":508,"title":"溪居","author":"柳宗元","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"久为簪组累，幸此南夷谪。\n闲依农圃邻，偶似山林客。\n晓耕翻露草，夜榜响溪石。\n来往不逢人，长歌楚天碧。","note":"选自《唐诗三百首》"},{"id":"509","number":509,"title":"江雪","author":"柳宗元","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"千山鸟飞绝，万迳人踪灭。\n孤舟蓑笠翁，独钓寒江雪。","note":"选自《唐诗三百首》"},{"id":"510","number":510,"title":"渔翁","author":"柳宗元","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"渔翁夜傍西岩宿，晓汲清湘燃楚竹。\n烟销日出不见人，[欸]乃一声山水绿。\n回看天际下中流，岩上无心云相逐。","note":"选自《唐诗三百首》"},{"id":"511","number":511,"title":"蜀先主庙","author":"刘禹锡","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"天地英雄气，千秋尚凛然。\n势分三足鼎，业复五铢钱。\n得相能开国，生儿不象贤。\n凄凉蜀故妓，来舞魏宫前。","note":"选自《唐诗三百首》"},{"id":"512","number":512,"title":"月夜","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"今夜鄜州月，闺中只独看。\n遥怜小儿女，未解忆长安。\n香雾云鬟湿，清辉玉臂寒。\n何时倚虚幌，双照泪痕干。","note":"选自《唐诗三百首》"},{"id":"513","number":513,"title":"春望","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。","note":"选自《唐诗三百首》"},{"id":"514","number":514,"title":"春宿左省","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"花隐掖垣暮，啾啾栖鸟过。\n星临万户动，月傍九霄多。\n不寝听金钥，因风想玉珂。\n明朝有封事，数问夜如何。","note":"选自《唐诗三百首》"},{"id":"515","number":515,"title":"至德二载甫自京金光门出问道归凤翔乾元初从左拾遗移华州掾与亲故别因出此门有悲往事","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"此道昔归顺，西郊胡正繁。\n至今残破胆，应有未招魂。\n近得归京邑，移官岂至尊。\n无才日衰老，驻马望千门。","note":"选自《唐诗三百首》"},{"id":"516","number":516,"title":"月夜忆舍弟","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"戍鼓断人行，秋边一雁声。\n露从今夜白，月是故乡明。\n有弟皆分散，无家问死生。\n寄书长不避，况乃未休兵。","note":"选自《唐诗三百首》"},{"id":"517","number":517,"title":"天末忆李白","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"凉风起天末，君子意如何。\n鸿雁几时到，江湖秋水多。\n文章憎命达，魑魅喜人过。\n应共冤魂语，投诗赠汩罗。","note":"选自《唐诗三百首》"},{"id":"518","number":518,"title":"蜀相","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"丞相祠堂何处寻，锦官城外柏森森。\n映堦碧草自春色，隔叶黄鹂空好音。\n三顾频烦天下计，两朝开济老臣心。\n出师未捷身先死，长使英雄泪满襟。","note":"选自《唐诗三百首》"},{"id":"519","number":519,"title":"客至","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"舍南舍北皆春水，但见群鸥日日来。\n花径不曾缘客扫，蓬门今始为君开。\n盘餐市远无兼味，樽酒家贫只旧醅。\n肯与邻翁相对饮，隔篱呼取尽余桮。","note":"选自《唐诗三百首》"},{"id":"520","number":520,"title":"野望","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"西山白雪三奇戍，南浦清江万里桥。\n海内风尘诸弟隔，天涯涕泪一身遥。\n唯将迟暮供多病，未有涓埃荅圣朝。\n跨马出郊时极目，不堪人事日萧条。","note":"选自《唐诗三百首》"},{"id":"521","number":521,"title":"奉济驿重送严公四韵","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"远送从此别，青山空复情。\n几时桮重把，昨夜月同行。\n列郡讴歌惜，三朝出入荣。\n江村独归处，寂寞养残生。","note":"选自《唐诗三百首》"},{"id":"522","number":522,"title":"闻官军收河南河北","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"劒外忽传收蓟北，初闻涕泪满衣裳。\n却看妻子愁何在，漫卷诗书喜欲狂。\n白日放歌须纵酒，青春作伴好还乡。\n即从巴峡穿巫峡，便下襄阳向洛阳。","note":"选自《唐诗三百首》"},{"id":"523","number":523,"title":"登高","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"风急天高猨啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江衮衮来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒桮。","note":"选自《唐诗三百首》"},{"id":"524","number":524,"title":"别房太尉墓","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"他乡复行役，驻马别孤坟。\n近泪无干土，低空有断云。\n对碁陪谢傅，把劒觅徐君。\n唯见林花落，鸎啼送客闻。","note":"选自《唐诗三百首》"},{"id":"525","number":525,"title":"登楼","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"花近高楼伤客心，万方多难此登临。\n锦江春色来天地，玉垒浮云变古今。\n北极朝廷终不改，西山寇盗莫相侵。\n可怜后主还祠庙，日暮聊为梁甫吟。","note":"选自《唐诗三百首》"},{"id":"526","number":526,"title":"宿府","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"清秋幕府井梧寒，独宿江城蜡炬残。\n永夜角声悲自语，中天月色好谁看。\n风尘荏苒音书绝，关塞萧条行路难。\n已忍伶俜十年事，强移栖息一枝安。","note":"选自《唐诗三百首》"},{"id":"527","number":527,"title":"旅夜书怀","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"细草微风岸，危樯独夜舟。\n星垂平野阔，月涌大江流。\n名岂文章著，官因老病休。\n飘飘何所似，天地一沙鸥。","note":"选自《唐诗三百首》"},{"id":"528","number":528,"title":"阁夜","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"岁暮阴阳催短景，天涯霜雪霁寒宵。\n五更鼓角声悲壮，三峡星河影动摇。\n野哭几家闻战伐，夷歌数处起渔樵。\n卧龙跃马终黄土，人事依依漫寂寥。","note":"选自《唐诗三百首》"},{"id":"529","number":529,"title":"八阵图","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"功盖三分国，名高八阵图。\n江流石不转，遗恨失吞吴。","note":"选自《唐诗三百首》"},{"id":"530","number":530,"title":"咏怀古迹五首 一","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"支离东北风尘际，漂泊西南天地间。\n三峡楼台淹日月，五溪衣服共云山。\n羯胡事主终无赖，词客衰时且未还。\n庾信平生最萧瑟，暮年诗赋动江关。","note":"选自《唐诗三百首》"},{"id":"531","number":531,"title":"咏怀古迹五首 二","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"摇落深知宋玉悲，风流儒雅亦吾师。\n怅望千秋一洒泪，萧条异代不同时。\n江山故宅空文藻，云雨荒台岂梦思。\n最是楚宫俱泯灭，舟人指点到今疑。","note":"选自《唐诗三百首》"},{"id":"532","number":532,"title":"咏怀古迹五首 三","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"群山万壑赴荆门，生长明妃尚有村。\n一去紫台连朔漠，独留青冢向黄昏。\n画图省识春风面，环佩空归月夜魂。\n千载琵琶作胡语，分明怨恨曲中论。","note":"选自《唐诗三百首》"},{"id":"533","number":533,"title":"咏怀古迹五首 四","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"蜀主窥吴幸三峡，崩年亦在永安宫。\n翠华想像空山里，玉殿虚无野寺中。\n古庙杉松巢水鹤，岁时伏腊走村翁。\n武侯祠屋常邻近，一体君臣祭祀同。","note":"选自《唐诗三百首》"},{"id":"534","number":534,"title":"咏怀古迹五首 五","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"诸葛大名垂宇宙，宗臣遗像肃清高。\n三分割据纡筹策，万古云霄一羽毛。\n伯仲之间见伊吕，指挥若定失萧曹。\n福移汉祚难恢复，志决身歼军务劳。","note":"选自《唐诗三百首》"},{"id":"535","number":535,"title":"江南逢李龟年","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"歧王宅里寻常见，崔九堂前几度闻。\n正是江南好风景，落花时节又逢君。","note":"选自《唐诗三百首》"},{"id":"536","number":536,"title":"登岳阳楼","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昔闻洞庭水，今上岳阳楼。\n吴楚东南坼，乾坤日夜浮。\n亲朋无一字，老病有孤舟。\n戎马关山北，凭轩涕泗流。","note":"选自《唐诗三百首》"},{"id":"537","number":537,"title":"虢国夫人","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"虢国夫人承主恩，平明上马入宫门。\n却嫌脂粉涴颜色，澹埽蛾眉朝至尊。","note":"选自《唐诗三百首》"},{"id":"538","number":538,"title":"望月怀远","author":"张九龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"海上生明月，天涯共此时。\n情人怨遥夜，竟夕起相思。\n灭烛怜光满，披衣觉露滋。\n不堪盈手赠，还寝梦佳期。","note":"选自《唐诗三百首》"},{"id":"539","number":539,"title":"题大庾岭北驿","author":"宋之问","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"阳月南飞雁，传闻至此回。\n我行殊未已，何日复归来？江静潮初落，林昏瘴不开。\n明朝望乡处，应见陇头梅。","note":"选自《唐诗三百首》"},{"id":"540","number":540,"title":"渡汉江","author":"宋之问","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"岭外音书断，经冬复历春。\n近乡情更怯，不敢问来人。","note":"选自《唐诗三百首》"},{"id":"541","number":541,"title":"新年作","author":"宋之问","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"乡心新岁切，天畔独澘然。\n老至居人下，春归在客先。\n岭猨同旦暮，江柳共风烟。\n已似长沙傅，从今又几年。","note":"选自《唐诗三百首》"},{"id":"542","number":542,"title":"杜少府之任蜀州","author":"王勃","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"城阙辅三秦，风烟望五津。\n与君离别意，同是宦游人。\n海内存知己，天涯若比隣。\n无为在岐路，儿女共沾巾。","note":"选自《唐诗三百首》"},{"id":"543","number":543,"title":"和晋陵陆丞早春游望","author":"杜审言","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"独有宦游人，偏惊物候新。\n云霞出海曙，梅柳渡江春。\n淑气催黄鸟，晴光转绿苹。\n忽闻歌古调，归思欲沾巾。","note":"选自《唐诗三百首》"},{"id":"544","number":544,"title":"登楼","author":"朱斌","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"白日依山尽，黄河入海流。\n欲穷千里目，更上一层楼。","note":"选自《唐诗三百首》"},{"id":"545","number":545,"title":"送李少府贬峡中王少府贬长沙","author":"高适","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"嗟君此别意何如，驻马衔桮问谪居。\n巫峡啼猿数行泪，衡阳归雁几封书。\n青枫江上秋天远，白帝城边古木疎。\n圣代即今多雨露，暂时分手莫踌躇。","note":"选自《唐诗三百首》"},{"id":"546","number":546,"title":"望岳","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"岱宗夫如何，齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胷生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。","note":"选自《唐诗三百首》"},{"id":"547","number":547,"title":"兵车行","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"车辚辚，马萧萧，行人弓箭各在腰。\n耶娘妻子走相送，尘埃不见咸阳桥。\n牵衣顿足阑道哭，哭声直上干云霄。\n道傍过者问行人，行人但云点行频。\n或从十五北防河，便至四十西营田。\n去时里正与裹头，归来头白还戍边。\n边亭流血成海水，武皇开边意未已。\n君不闻汉家山东二百州，千村万落生荆杞。\n纵有健妇把锄犂，禾生陇亩无东西。\n况复秦兵耐苦战，被驱不异犬与鸡。\n长者虽有问，役夫敢申恨。\n且如今年冬，未休关西卒。\n县官急索租，租税从何出？信知生男恶，反是生女好。\n生女犹是嫁比邻，生男埋没随百草。\n君不见青海头，古来白骨无人收。\n新鬼烦冤旧鬼哭，天阴雨湿声啾啾。","note":"选自《唐诗三百首》"},{"id":"548","number":548,"title":"赠卫八处士","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"人生不相见，动如参与商。\n今夕复何夕，共此灯烛光。\n少壮能几时，鬓发各已苍。\n访旧半为鬼，惊呼热中肠。\n焉知二十载，重上君子堂。\n昔别君未婚，儿女忽成行。\n怡然敬父执，问我来何方。\n问荅乃未已，儿女罗酒浆。\n夜雨剪春韭，新炊间黄粱。\n主称会面难，一举累十觞。\n十觞亦不醉，感子故意长。\n明日隔山岳，世事两茫茫。","note":"选自《唐诗三百首》"},{"id":"549","number":549,"title":"丽人行","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"三月三日天气新，长安水边多丽人。\n态浓意远淑且真，肌理细腻骨肉匀。\n绣罗衣裳照暮春，蹙金孔雀银麒麟。\n头上何所有，翠微㔩叶垂鬓唇。\n背后何所见，珠压腰衱稳称身。\n就中云幕椒房亲，赐名大国虢与秦。\n紫驼之峰出翠釜，水精之盘行素鳞。\n犀箸厌饫久未下，銮刀缕切空纷纶。\n黄门飞鞚不动尘，御厨络绎送八珍。\n箫鼓哀吟感鬼神，宾从杂遝实要津。\n后来鞍马何逡巡，当轩下马入锦茵。\n杨花雪落覆白苹，青鸟飞去衔红巾。\n炙手可热势绝伦，慎莫近前丞相嗔。","note":"选自《唐诗三百首》"},{"id":"550","number":550,"title":"哀江头","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"少陵野老吞声哭，春日潜行曲江曲。\n江头宫殿锁千门，细柳新蒲为谁绿。\n忆昔霓旌下南苑，苑中万物生颜色。\n昭阳殿里第一人，同辇随君侍君侧。\n辇前才人带弓箭，白马嚼啮黄金勒。\n翻身向天仰射云，一箭正坠双飞翼。\n明眸皓齿今何在，血污游魂归不得。\n清渭东流劒阁深，去住彼此无消息。\n人生有情泪沾臆，江水江花岂终极。\n黄昏胡骑尘满城，欲往城南忘南北。","note":"选自《唐诗三百首》"},{"id":"551","number":551,"title":"哀王孙","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"长安城头头白乌，夜飞延秋门上呼。\n又向人家啄大屋，屋底达官走避胡。\n金鞭断折九马死，骨肉不待同驰驱。\n腰下实玦青珊瑚，可怜王孙泣路隅。\n问之不肯道姓名，但道困苦乞为奴。\n已经百日窜荆棘，身上无有完肌肤。\n高帝子孙尽隆准，龙种自与常人殊。\n豺狼在邑龙在野，王孙善保千金躯。\n不敢长语临交衢，且为王孙立斯须。\n昨夜东风吹血腥，东来橐驼满旧都。\n朔方健儿好身手，昔何勇锐今何愚。\n窃闻天子已传位，贤德北服南单于。\n花门剺面请雪耻，慎勿出口他人狙。\n哀哉王孙慎勿疎，五陵佳气无时无。","note":"选自《唐诗三百首》"},{"id":"552","number":552,"title":"佳人","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"绝代有佳人，幽居在空谷。\n自云良家子，零落依草木。\n关中昔丧败，兄弟遭杀戮。\n官高何足论，不得收骨肉。\n世情恶衰歇，万事随转烛。\n夫壻轻薄儿，新人已如玉。\n合昏尚知时，鸳鸯不独宿。\n但见新人笑，那闻旧人哭。\n在山泉水清，出山泉水浊。\n侍婢卖珠回，牵萝补茅屋。\n摘花不插发，采柏动盈匊。\n天寒翠袖薄，日暮倚修竹。","note":"选自《唐诗三百首》"},{"id":"553","number":553,"title":"梦李白二首 一","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"死别已吞声，生别常恻恻。\n江南瘴疠地，逐客无消息。\n故人入我梦，明我长相忆。\n恐非平生魂，路远不可测。\n魂来枫叶青，魂返关塞黑。\n君今在罗网，何以有羽翼。\n落月满屋梁，犹疑照颜色。\n水深波浪阔，无使蛟龙得。","note":"选自《唐诗三百首》"},{"id":"554","number":554,"title":"梦李白二首 二","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"浮云终日行，游子久不至。\n三夜频梦君，情亲见君意。\n告归常局促，苦道来不易。\n江湖多风波，舟楫恐失坠。\n出门搔白首，若负平生志。\n冠盖满京华，斯人独顦顇。\n孰云网恢恢，将老身反累。\n千秋万岁名，寂莫身后事。","note":"选自《唐诗三百首》"},{"id":"555","number":555,"title":"韦讽录事宅观曹将军画马图","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"国初已来画鞍马，神妙独数江都王。\n将军得名三十载，人间又见真乘黄。\n曾貌先帝照夜白，龙池十日飞霹雳。\n内府殷红马脑盌，倢伃传诏才人索。\n盌赐将军拜舞归，轻纨细绮相追飞。\n贵戚权门得笔迹，始觉屏障生光辉。\n昔日太宗拳毛䯄，近时郭家师子花。\n今之新图有二马，复令识者久叹嗟。\n此皆骑战一敌万，缟素漠漠开风沙。\n其余七匹亦殊绝，迥若寒空动烟雪。\n霜蹄蹴踏长楸间，马官厮养森成列。\n可怜九马争神骏，顾视清高气深稳。\n借问苦心爱者谁，后有韦讽前支遁。\n忆昔巡幸新丰宫，翠华拂天来向东。\n腾骧磊落三万匹，皆与此图筋骨同。\n自从献宝朝河宗，无复射蛟江水中。\n君不见金粟堆前松柏里，龙媒去尽鸟呼风。","note":"选自《唐诗三百首》"},{"id":"556","number":556,"title":"丹青引赠曹将军霸","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"将军魏武之子孙，于今为庶为清门。\n英雄割据虽已矣，文彩风流犹尚存。\n学书初学卫夫人，但恨无过王右军。\n丹青不知老将至，富贵于我如浮云。\n开元之中常引见，承恩数上南熏殿。\n凌烟功臣少颜色，将军下笔开生面。\n良相头上进贤冠，猛将腰间大羽箭。\n褒公鄂公毛发动英姿飒爽来酣战。\n先帝天马玉花骢，画工如山貌不同。\n是日牵来赤墀下，迥立阊阖生长风。\n诏谓将军拂绢素，意匠惨澹经营中。\n斯须九重真龙出，一洗万古凡马空。\n玉花却在御榻上，榻上庭前屹相向。\n至尊含笑催赐金，圉人太仆皆惆怅。\n弟子韩干早入室，亦能画马穷殊相。\n干惟画肉不画骨，忍使骅骝气凋丧。\n将军画善盖有神，必逢佳士亦写真。\n即今飘泊干戈际，屡貌寻常行路人。\n途穷反遭俗眼白，世上未有如公贫。\n但看古来盛名下，终日坎𡒄缠其身。","note":"选自《唐诗三百首》"},{"id":"557","number":557,"title":"寄韩谏议","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"今我不乐思岳阳，身欲奋飞病在床。\n美人娟娟隔秋水，濯足洞庭望八荒。\n鸿飞冥冥日月白，青枫叶赤天雨霜。\n玉京群帝集北斗，或骑骐𬴊翳凤皇。\n芙蓉旌旗烟雾乐，影动倒景摇潇湘。\n星宫之君醉琼浆，羽人稀少不在旁。\n似闻昨者赤松子，恐是汉代韩张良。\n昔随刘氏定长安，帷幄未改神惨伤。\n国家成败吾岂敢，色难腥腐餐风香。\n周南留滞古所惜，南极老人应寿昌。\n美人胡为隔秋水，焉得置之贡玉堂。","note":"选自《唐诗三百首》"},{"id":"558","number":558,"title":"古柏行","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"孔明庙前有老柏，柯如青铜根如石。\n霜皮溜雨四十围，黛色参天二千尺。\n君臣已与时际会，树木犹为人爱惜。\n云来气接巫峡长，月出寒通雪山白。\n忆昨路绕锦亭东，先主武侯同閟宫。\n崔嵬枝干郊原古，窈窕丹青户牖空。\n落落盘踞虽得地，冥冥孤高多烈风。\n扶持自是神明力，正直原因造化功。\n大厦如倾要梁栋，万牛回首丘山重。\n不露文章世已惊，未辞剪伐谁能送。\n苦心岂免容蝼蚁，香叶终经宿鸾凤。\n志士幽人莫怨嗟，古来材大难为用。","note":"选自《唐诗三百首》"},{"id":"559","number":559,"title":"观公孙大娘弟子舞劒器行","author":"杜甫","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昔有佳人公孙氏，一舞劒气动四方。\n观者如山色沮丧，天地为之久低昂。\n㸌如羿射九日落，矫如群帝骖龙翔。\n来如雷霆收震怒，罢如江海凝清光。\n绛唇珠袖两寂莫，况有弟子传芬芳。\n临颍美人在白帝，妙舞此曲神扬扬。\n与余问答既有以，感时抚事增惋伤。\n先帝侍女八千人，公孙劒器初第一。\n五十年间似反掌，风尘倾动昏王室。\n棃园子弟散如烟，女乐余姿映寒日。\n金粟堆南木已拱，瞿唐石城草萧瑟。\n玳筵急管曲复终，乐极哀来月东出。\n老夫不知其所往，足茧荒山转愁疾。","note":"选自《唐诗三百首》"},{"id":"560","number":560,"title":"寄人二首  其一","author":"张佖","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"别梦依依到谢家，小廊回合曲阑斜。\n多情只有春庭月，犹为离人照落花。","note":"选自《唐诗三百首》"},{"id":"561","number":561,"title":"杂曲歌辞 盖罗缝 一","author":"不详","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"秦时明月汉时关，万里征人尚未还。\n但愿龙庭神将在，不教胡马渡阴山。","note":"选自《唐诗三百首》"},{"id":"562","number":562,"title":"杂曲歌辞 婆罗门","author":"杨敬述进","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"回乐峰前沙似雪，受降城外月如霜。\n不知何处吹芦管？一夜征人尽望乡。","note":"选自《唐诗三百首》"},{"id":"563","number":563,"title":"杂曲歌辞 清平调 一","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"云想衣裳花想容，春风拂槛露华浓。\n若非群玉山头见，会向瑶台月下逢。","note":"选自《唐诗三百首》"},{"id":"564","number":564,"title":"杂曲歌辞 清平调 二","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一枝红艳露凝香，云雨巫山枉断肠。\n借问汉宫谁得似，可怜飞燕倚新妆。","note":"选自《唐诗三百首》"},{"id":"565","number":565,"title":"杂曲歌辞 清平调 三","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"名花倾国两相欢，长得君王带笑看。\n解释春风无限恨，沈香亭北倚阑干。","note":"选自《唐诗三百首》"},{"id":"566","number":566,"title":"杂曲歌辞 渭城曲","author":"王维","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"谓城朝雨浥轻尘，客舍青青柳色春。\n劝君更尽一杯酒，西出阳关无故人。","note":"选自《唐诗三百首》"},{"id":"567","number":567,"title":"杂曲歌辞 金缕衣","author":"不详","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"劝君莫惜金缕衣，劝君惜取少年时。\n花开堪折直须折，莫待无花空折枝。","note":"选自《唐诗三百首》"},{"id":"568","number":568,"title":"感遇十二首 一","author":"张九龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"兰叶春葳蕤，桂华秋皎洁。\n欣欣此生意，自尔为佳节。\n谁知林栖者，闻风坐相悦。\n草木有本心，何求美人折。","note":"选自《唐诗三百首》"},{"id":"569","number":569,"title":"感遇十二首 二","author":"张九龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"幽林归独卧，滞虑洗孤清。\n持此谢高鸟，因之传远情。\n日夕怀空意，人谁感至精。\n飞沈理自隔，何所慰吾诚。","note":"选自《唐诗三百首》"},{"id":"570","number":570,"title":"感遇十二首 四","author":"张九龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"孤鸿海上来，池潢不敢顾。\n侧见双翠鸟，巢在三珠树。\n矫矫珍木巅，得无金丸惧。\n美服患人指，高明逼神恶。\n今我游冥冥，弋者何所慕。","note":"选自《唐诗三百首》"},{"id":"571","number":571,"title":"感遇十二首 七","author":"张九龄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"江南有丹橘，经冬犹绿林。\n岂伊地气暖，自有岁寒心。\n可以荐嘉客，奈何阻重深。\n运命唯所遇，循环不可寻。\n徒言树桃李，此木岂无阴。","note":"选自《唐诗三百首》"},{"id":"572","number":572,"title":"寻陆鸿渐不遇","author":"皎然","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"移家虽带郭，野径入桑麻。\n近种篱边菊，秋来未著花。\n扣门无犬吠，欲去问西家。\n报道山中去，归时每日斜。","note":"选自《唐诗三百首》"},{"id":"573","number":573,"title":"西塞山怀古","author":"刘禹锡","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"西晋楼船下益州，金陵王气黯然收。\n千寻铁锁沈江底，一片降旛出石头。\n人世几回伤往事，山形依旧枕江流。\n今逢四海为家日，故垒萧萧芦荻秋。","note":"选自《唐诗三百首》"},{"id":"574","number":574,"title":"金陵五题 乌衣巷","author":"刘禹锡","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"朱雀桥边野草花，乌衣巷口夕阳斜。\n旧时王谢堂前燕，飞入寻常百姓家。","note":"选自《唐诗三百首》"},{"id":"575","number":575,"title":"和乐天春词","author":"刘禹锡","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"新妆面面下朱楼，深锁春光一院愁。\n行到中庭数花朵，蜻蜓飞上玉搔头。","note":"选自《唐诗三百首》"},{"id":"576","number":576,"title":"列女操","author":"孟郊","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"梧桐相待老，鸳鸯会双死。\n贞女贵狥夫，舍生亦如此。\n波澜誓不起，妾心井中水。","note":"选自《唐诗三百首》"},{"id":"577","number":577,"title":"游子吟","author":"孟郊","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"慈母手中线，游子身上衣。\n临行密密缝，意恐迟迟归。\n谁言寸草心，报得三春晖。","note":"选自《唐诗三百首》"},{"id":"578","number":578,"title":"度南涧","author":"蔡襄","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"隠隠飞桥隔野烟，石矶西畔问渔船。\n桃花尽日随流水，洞在清溪何处边。","note":"选自《唐诗三百首》"},{"id":"579","number":579,"title":"谷口书斋寄杨补阙","author":"钱起","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"泉壑带茅茨，云霞生薜帷。\n竹怜新雨后，山爱夕阳时。\n闲鹭栖常早，秋花落更迟。\n家童扫萝迳，昨与故人期。","note":"选自《唐诗三百首》"},{"id":"580","number":580,"title":"送僧归日本","author":"钱起","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"上国随缘住，来途若梦行。\n浮天沧海远，去世法舟轻。\n水月通禅观，鱼龙听梵声。\n惟怜一灯影，万里眼中明。","note":"选自《唐诗三百首》"},{"id":"581","number":581,"title":"赠阙下裴舍人","author":"钱起","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"二月黄莺飞上林，春城紫禁晓阴阴。\n长乐钟声花外尽，龙池柳色雨中深。\n阳和不散穷途恨，霄汉长怀捧日新。\n献赋十年犹未遇，羞将白发对华簪。","note":"选自《唐诗三百首》"},{"id":"582","number":582,"title":"和张仆射塞下曲","author":"钱起","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"月黑雁飞高，单于夜遁逃。\n欲将轻骑逐，大雪满弓刀。","note":"选自《唐诗三百首》"},{"id":"583","number":583,"title":"贼退示官吏","author":"元结","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"昔岁逢太平，山林二十年。\n泉源在庭户，洞壑当门前。\n井税有常期，日[晏]犹得眠。\n忽然遭世变，数岁亲戎旃。\n今来典斯郡，山夷又纷然。\n城小贼不屠，人贫伤可怜。\n是以陷隣境，此州独见全。\n使臣将王命，岂不如贼焉。\n今彼徴敛者，迫之如火煎。\n谁能绝人命，以作时世贤。\n思欲委符节，引竿自刺船。\n将家就鱼麦，归老江湖边。","note":"选自《唐诗三百首》"},{"id":"584","number":584,"title":"石鱼湖上醉歌","author":"元结","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"石鱼湖，似洞庭，夏水欲满君山青。\n山为樽，水为沼，酒徒历历坐洲岛。\n长风连日作大浪，不能废人运酒舫。\n我持长瓢坐巴丘，酌饮四坐以散愁。","note":"选自《唐诗三百首》"},{"id":"585","number":585,"title":"枫桥夜泊","author":"张继","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"月落乌啼霜满天，江枫渔父对愁眠。\n姑苏城外寒山寺，夜半钟声到客船。","note":"选自《唐诗三百首》"},{"id":"586","number":586,"title":"酬程延秋夜即事见赠","author":"韩翃","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"长簟迎风早，空城澹月华。\n星河秋一雁，砧杵夜千家。\n节候看应晚，心期卧亦赊。\n向来吟秀句，不觉已鸣鸦。","note":"选自《唐诗三百首》"},{"id":"587","number":587,"title":"同题仙游观","author":"韩翃","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"仙台下见五城楼，风物凄凄宿雨收。\n山色遥连秦树晚，砧声近报汉宫秋。\n疎松影落空坛静，细草香闲小洞幽。\n何用别寻方外去，人间亦自有丹丘。","note":"选自《唐诗三百首》"},{"id":"588","number":588,"title":"寒食","author":"韩翃","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"春城无处不飞花，寒食东风御柳斜。\n日暮汉宫传蜡烛，轻烟散入五侯家。","note":"选自《唐诗三百首》"},{"id":"589","number":589,"title":"寄李儋元锡","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"去年花里逢君别，今日花开已一年。\n世事茫茫难自料，春愁黯黯独成眠。\n身多疾病思田里，邑有流亡愧俸钱。\n闻道欲来相问讯，西楼望月几廻圆。","note":"选自《唐诗三百首》"},{"id":"590","number":590,"title":"寄全椒山中道士","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"今朝郡斋冷，忽念山中客。\n涧底束荆薪，归来煮白石。\n欲持一瓢酒，远慰风雨夕。\n落叶满空山，何处寻行迹。","note":"选自《唐诗三百首》"},{"id":"591","number":591,"title":"秋夜寄丘二十二员外","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"怀君属秋夜，散步咏凉天。\n山空松子落，幽人应未眠。","note":"选自《唐诗三百首》"},{"id":"592","number":592,"title":"赋得暮雨送李胄","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"楚江微雨里，建业暮钟时。\n漠漠帆来重，冥冥鸟去迟。\n海门深不见，浦树远含滋。\n相送情无限，沾襟比散丝。","note":"选自《唐诗三百首》"},{"id":"593","number":593,"title":"送杨氏女","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"永日方戚戚，出门复悠悠。\n女子今有行，大江溯轻舟。\n尔辈况无恃，抚念益慈柔。\n幼为长所育，两别泣不休。\n对此结中肠，义往难复留。\n自小阙内训，事姑贻我忧。\n赖兹托令门，仁恤庶无尤。\n贫俭诚所尚，资从岂待周。\n孝恭遵妇道，容止顺其猷。\n别离在今晨，见尔当何秋。\n居闲始自遣，临感忽难收。\n归来视幼女，零泪缘缨流。","note":"选自《唐诗三百首》"},{"id":"594","number":594,"title":"长安遇冯著","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"客从东方来，衣上灞陵雨。\n问客何为来，采山因买斧。\n冥冥花正开，飏飏燕新乳。\n昨别今已春，鬓丝生几缕。","note":"选自《唐诗三百首》"},{"id":"595","number":595,"title":"夕次盱眙县","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"落帆逗淮镇，停舫临孤驿。\n浩浩风起波，冥冥日沈夕。\n人归山郭暗，雁下芦洲白。\n独夜忆秦关，听钟未眠客。","note":"选自《唐诗三百首》"},{"id":"596","number":596,"title":"东郊","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"吏舍跼终年，出郊旷清曙。\n杨柳散和风，青山澹吾虑。\n依丛适自憩，缘涧还复去。\n微雨霭芳原，春鸠鸣何处？乐幽心屡止，遵事迹犹遽。\n终罢斯结庐，慕陶真可庶。","note":"选自《唐诗三百首》"},{"id":"597","number":597,"title":"滁州西涧","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"独怜幽草涧边生，上有黄鹂深树鸣。\n春潮带雨晚来急，野渡无人舟自横。","note":"选自《唐诗三百首》"},{"id":"598","number":598,"title":"和晋陵陆丞早春游望","author":"韦应物","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"独有宦游人，偏惊物候新。\n云霞出海曙，梅柳渡江春。\n淑气催黄鸟，晴光照绿苹。\n忽闻歌苦调，归思欲沾巾。","note":"选自《唐诗三百首》"},{"id":"599","number":599,"title":"与高适薛据慈恩寺浮图","author":"岑参","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"塔势如涌出，孤高耸天宫。\n登临出世界，磴道盘虚空。\n突兀压神州，峥嵘如鬼工。\n四角碍白日，七层摩苍穹。\n下窥指高鸟，俯听闻惊风。\n连山若波涛，奔凑似朝东。\n青槐夹驰道，宫馆何玲珑。\n秋色从西来，苍然满关中。\n五陵北原上，万古青蒙蒙。\n净理了可悟，胜因夙所宗。\n誓将挂冠去，觉道资无穷。","note":"选自《唐诗三百首》"},{"id":"600","number":600,"title":"白雪歌送武判官归京","author":"岑参","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"北风卷地白草折，胡天八月即飞雪。\n忽然一夜春风来，千树万树梨花开。\n散入珠帘湿罗幕，狐裘不煖锦衾薄。\n将军角弓不得控，都护铁衣冷难着。\n瀚海阑干百丈冰，愁云黪淡万里凝。\n中军置酒饮归客，胡琴琵琶与羌笛。\n纷纷暮雪下辕门，风掣红旗冻不翻。\n轮台东门送君去，去时雪满天山路。\n山回路转不见君，雪上空留马行处。","note":"选自《唐诗三百首》"},{"id":"601","number":601,"title":"轮台歌奉送封大夫出师西征","author":"岑参","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"轮台城头夜吹角，轮台城北旄头落。\n羽书昨夜过渠黎，单于已在金山西。\n戍楼西望烟尘黑，汉兵屯在轮台北。\n上将拥旄西出征，平明吹笛大军行。\n四边伐鼓雪海涌，三军大呼阴山动。\n虏塞兵气连云屯，战场白骨缠草根。\n劒河风急雪片阔，沙口石冻马蹄脱。\n亚相勤王甘苦辛，誓将报主静边尘。\n古来青史谁不见，今见功名胜古人。","note":"选自《唐诗三百首》"},{"id":"602","number":602,"title":"走马川行奉送出师西征","author":"岑参","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"君不见走马川行雪海边，平沙莽莽黄入天。\n轮台九月风夜吼，一川碎石大如斗，随风满地石乱走。\n匈奴草黄马正肥，金山西见烟尘飞。\n汉家大将西出师，将军金甲夜不脱。\n半夜军行戈相拨，风头如刀面如割。\n马毛带雪汗气蒸，五花连钱旋作冰。\n幕中草檄砚水凝，虏骑闻之应胆慑。\n料知短兵不敢接，车师西门伫献捷。","note":"选自《唐诗三百首》"},{"id":"603","number":603,"title":"寄左省杜拾遗","author":"岑参","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"联步趋丹陛，分曹限紫微。\n晓随天仗入，暮惹御香归。\n白发悲花落，青云羡鸟飞。\n圣朝无阙事，自觉谏书稀。","note":"选自《唐诗三百首》"},{"id":"604","number":604,"title":"奉和中书舍人贾至早朝大明宫","author":"岑参","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"鸡鸣紫陌曙光寒，莺啭皇州春色阑。\n金阙晓钟开万户，玉阶仙仗拥千官。\n花迎劒珮星初落，柳拂旌旗露未干。\n独有凤皇池上客，阳春一曲和皆难。","note":"选自《唐诗三百首》"},{"id":"605","number":605,"title":"逢入京使","author":"岑参","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"故园东望路漫漫，双袖龙钟泪不干。\n马上相逢无纸笔，凭君传语报平安。","note":"选自《唐诗三百首》"},{"id":"606","number":606,"title":"访羊尊师","author":"孙革","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"松下问童子，言师采药去。\n只在此山中，云深不知处。","note":"选自《唐诗三百首》"},{"id":"607","number":607,"title":"书边事","author":"张乔","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"调角断清秋，征人倚戍楼。\n春风对青冢，白日落梁州。\n大汉无兵阻，穷边有客游。\n蕃情似此水，长愿向南流。","note":"选自《唐诗三百首》"},{"id":"608","number":608,"title":"行路难三首 一","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"金樽清酒斗十千，玉盘珍羞直万钱。\n停杯投筯不能食，拔劒四顾心茫然。\n欲渡黄河冰塞川，将登太行雪满山。\n闲来垂钓碧溪上，忽复乘舟梦日边。\n行路难，行路难，多岐路，今安在。\n长风破浪会有时，直挂云帆济沧海。","note":"选自《唐诗三百首》"},{"id":"609","number":609,"title":"行路难三首 二","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"大道如青天，我独不得出。\n羞逐长安社中儿，赤鸡白狗赌梨栗。\n弹劒作歌奏苦声，曳裾王门不称情。\n淮阴市井笑韩信，汉朝公卿忌贾生。\n君不见昔时燕家重郭隗，拥篲折节无嫌猜。\n剧辛乐毅感恩分，输肝剖胆效英才。\n昭王白骨萦烂草，谁人更扫黄金台。\n行路难，归去来。","note":"选自《唐诗三百首》"},{"id":"610","number":610,"title":"行路难三首 三","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"有耳莫洗颍川水，有口莫食首阳蕨。\n含光混世贵无名，何用孤高比云月。\n吾观自古贤达人，功成不退皆殒身。\n子胥既弃吴江上，屈原终投湘水滨。\n陆机雄才岂自保，李斯税驾苦不早。\n华亭鹤唳讵可闻，上蔡苍鹰何足道。\n君不见吴中张翰称达生，秋风忽忆江东行。\n且乐生前一杯酒，何须身后千载名。","note":"选自《唐诗三百首》"},{"id":"611","number":611,"title":"长相思","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"长相思，在长安，络纬秋啼金井阑。\n微霜凄凄簟色寒，孤灯不明思欲绝。\n卷帷望月空长叹，美人如花隔云端。\n上有青冥之长天，下有渌水之波澜。\n天长路远魂飞苦，梦魂不到关山难。\n长相思，摧心肝。","note":"选自《唐诗三百首》"},{"id":"612","number":612,"title":"关山月","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"明月出天山，苍茫云海间。\n长风几万里，吹度玉门关。\n汉下白登道，胡窥青海湾。\n由来征战地，不见有人还。\n[戍]客望边色，思归多苦颜。\n高楼当此夜，叹息未应闲。","note":"选自《唐诗三百首》"},{"id":"613","number":613,"title":"玉阶怨","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"玉阶生白露，夜久侵罗袜。\n却下水晶帘，玲珑望秋月。","note":"选自《唐诗三百首》"},{"id":"614","number":614,"title":"清平调词三首 一","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"云想衣裳花想容，春风拂槛露华浓。\n若非群玉山头见，会向瑶台月下逢。","note":"选自《唐诗三百首》"},{"id":"615","number":615,"title":"清平调词三首 二","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"一枝秾艳露凝香，云雨巫山枉断肠。\n借问汉宫谁得似，可怜飞燕倚新妆。","note":"选自《唐诗三百首》"},{"id":"616","number":616,"title":"静夜思","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"床前看月光，疑是地上霜。\n举头望山月，低头思故乡。","note":"选自《唐诗三百首》"},{"id":"617","number":617,"title":"春思","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"燕草如碧丝，秦桑低绿枝。\n当君怀归日，是妾断肠时。\n春风不相识，何事入罗帏。","note":"选自《唐诗三百首》"},{"id":"618","number":618,"title":"子夜吴歌 春歌","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"秦地罗敷女，采桑绿水边。\n素手青条上，红妆白日鲜。\n蚕饥妾欲去，五马莫留连。","note":"选自《唐诗三百首》"},{"id":"619","number":619,"title":"子夜吴歌 夏歌","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"镜湖三百里，菡萏发荷花。\n五月西施采，人看隘若耶。\n回舟不待月，归去越王家。","note":"选自《唐诗三百首》"},{"id":"620","number":620,"title":"子夜吴歌 秋歌","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"长安一片月，万户捣衣声。\n秋风吹不尽，总是玉关情。\n何日平胡虏，良人罢远征。","note":"选自《唐诗三百首》"},{"id":"621","number":621,"title":"子夜吴歌 冬歌","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"明朝驿使发，一夜絮征袍。\n素手抽针冷，那堪把剪刀。\n裁缝寄远道，几日到临洮。","note":"选自《唐诗三百首》"},{"id":"622","number":622,"title":"赠孟浩然","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"吾爱孟夫子，风流天下闻。\n红颜弃轩冕，白首卧松云。\n醉月频中圣，迷花不事君。\n高山安可仰，徒此揖清芬。","note":"选自《唐诗三百首》"},{"id":"623","number":623,"title":"庐山谣寄卢侍御虚舟","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"我本楚狂人，凤歌笑孔丘。\n手持绿玉杖，朝别黄鹤楼。\n五岳寻仙不辞远，一生好入名山游。\n庐山秀出南斗傍，屏风九叠云锦张，影落明湖青黛光。\n金阙前开二峰长，银河倒挂三石梁。\n香炉瀑布遥相望，回厓沓嶂凌苍苍。\n翠影红霞映朝日，鸟飞不到吴天长。\n登高壮观天地间，大江茫茫去不还。\n黄云万里动风色，白波九道流雪山。\n好为庐山谣，兴因庐山发。\n闲窥石镜清我心，谢公行处苍苔没。\n早服还丹无世情，琴心三叠道初成。\n遥见仙人彩云里，手把芙蓉朝玉京。\n先期汗漫九垓上，愿接卢敖游太清。","note":"选自《唐诗三百首》"},{"id":"624","number":624,"title":"梦游天姥吟留别","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"海客谈瀛洲，烟涛微茫信难求。\n越人语天姥，云霓明灭或可覩。\n天姥连天向天横，势拔五岳掩赤城。\n天台四万八千丈，对此欲倒东南倾。\n我欲因之梦吴越，一夜飞度镜湖月。\n湖月照我影，送我至剡溪。\n谢公宿处今尚在，渌水荡漾清猨啼。\n脚著谢公屐，身登青云梯。\n半壁见海日，空中闻天鸡。\n千岩万转路不定，迷花倚石忽已暝。\n熊咆龙吟殷岩泉，栗深林兮惊层巅。\n云青青兮欲雨，水澹澹兮生烟。\n列缺霹雳，丘峦崩摧。\n洞天石扇，訇然中开。\n青冥浩荡不见底，日月照耀金银台。\n霓为衣兮风为马，云之君兮纷纷而来下。\n虎鼓瑟兮鸾回车，仙之人兮列如麻。\n忽魂悸以魄动，怳惊起而长嗟。\n惟觉时之枕席，失向来之烟霞。\n世间行乐亦如此，古来万事东流水。\n别君去时何时还，且放白鹿青崖间，须行即骑访名山。\n安能摧眉折腰事权贵？使我不得开心颜。","note":"选自《唐诗三百首》"},{"id":"625","number":625,"title":"金陵酒肆留别","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"风吹柳花满店香，吴姬压酒唤客尝。\n金陵子弟来相送，欲行不行各尽觞。\n请君试问东流水，别意与之谁短长。","note":"选自《唐诗三百首》"},{"id":"626","number":626,"title":"黄鹤楼送孟浩然之广陵","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"故人西辞黄鹤楼，烟花三月下扬州。\n孤帆远影碧山尽，唯见长江天际流。","note":"选自《唐诗三百首》"},{"id":"627","number":627,"title":"渡荆门送别","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"渡远荆门外，来从楚国游。\n山随平野尽，江入大荒流。\n月下飞天镜，云生结海楼。\n仍连故乡水，万里送行舟。","note":"选自《唐诗三百首》"},{"id":"628","number":628,"title":"送友人","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"青山横北郭，白水遶东城。\n此地一为别，孤蓬万里征。\n浮云游子意，落日故人情。\n挥手自兹去，萧萧班马鸣。","note":"选自《唐诗三百首》"},{"id":"629","number":629,"title":"宣州谢朓楼饯别校书叔云","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"弃我去者昨日之日不可留，乱我心者今日之日多烦忧。\n长风万里送秋雁，对此可以酣高楼。\n蓬莱文章建安骨，中间小谢又清发。\n俱怀逸兴壮思飞，欲上青天览日月。\n抽刀断水水更流，举杯销愁愁更愁。\n人生在世不称意，明朝散发弄扁舟。","note":"选自《唐诗三百首》"},{"id":"630","number":630,"title":"下终南山过斛斯山人宿置酒","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"暮从碧山下，山月随人归。\n却顾所来径，苍苍横翠微。\n相携及田家，童稚开荆扉。\n绿竹入幽径，青萝拂行衣。\n欢言得所憩，美酒聊共挥。\n长歌吟松风，曲尽河星稀。\n我醉君复乐，陶然共忘机。","note":"选自《唐诗三百首》"},{"id":"631","number":631,"title":"登金陵凤凰台","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"凤凰台上凤凰游，凤去台空江自流。\n吴宫花草埋幽径，晋代衣冠成古丘。\n三山半落青天外，二水中分白鹭洲。\n总为浮云能蔽日，长安不见使人愁。","note":"选自《唐诗三百首》"},{"id":"632","number":632,"title":"早发白帝城","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"朝辞白帝彩云间，千里江陵一日还。\n两岸猨声啼不尽，轻舟已过万重山。","note":"选自《唐诗三百首》"},{"id":"633","number":633,"title":"夜泊牛渚怀古","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"牛渚西江夜，青天无片云。\n登舟望秋月，空忆谢将军。\n余亦能高咏，斯人不可闻。\n明朝挂帆席，枫叶落纷纷。","note":"选自《唐诗三百首》"},{"id":"634","number":634,"title":"月下独酌四首 一","author":"李白","tags":["唐诗"],"source":"seed","copyrightStatus":"公有领域（古籍原文）","lyrics":"花间一壶酒，独酌无相亲。\n举杯邀明月，对影成三人。\n月既不解饮，影徒随我身。\n暂伴月将影，行乐须及春。\n我歌月裴回，我舞影零乱。\n醒时同交欢，醉后各分散。\n永结无情游，相期邈云汉。","note":"选自《唐诗三百首》"},{"id":"635","number":63
